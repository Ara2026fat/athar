<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1E6F5C">
<title>أثر — الوادي</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<style id="vxFonts">
/* خطوط محلية (لا شبكة): عند الدمج انقل next/assets/fonts إلى fonts/ وعدّل المسار */
@font-face{font-family:"Rubik";font-style:normal;font-weight:400 700;font-display:swap;src:url("../next/assets/fonts/rubik-ar-lat-var.woff2") format("woff2")}
@font-face{font-family:"Athar Salawat";font-style:normal;font-weight:400 700;font-display:swap;src:url("../next/assets/fonts/salawat-noto.woff2") format("woff2");unicode-range:U+FDFA-FDFB,U+FDFD,U+06D6-06ED}
</style>
<style>
:root{--em:#1E6F5C;--cream:#F0E6D2;--gold:#F0A93B;--ink:#20342E;--soft:#5E5140;
  --line:#3A2E24;--wood:#7A5334}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:#07110D}
body{font-family:Rubik,"Athar Salawat",system-ui,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center}
#app{position:relative;width:100%;height:100%;max-width:520px;overflow:hidden;background:#8FCDEA}
#stage{position:absolute;inset:0}
#stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ── حياة ── */
@keyframes drift{to{transform:translateX(70px)}}
@keyframes sway{50%{transform:rotate(-2.3deg)}}
@keyframes swayT{50%{transform:rotate(-4.5deg)}}
@keyframes breathe{50%{transform:translateY(-2px)}}
@keyframes blinkA{0%,38%,100%{transform:scaleY(1)}40%{transform:scaleY(.08)}42%{transform:scaleY(1)}
  44.5%{transform:scaleY(.08)}46.5%{transform:scaleY(1)}88%{transform:scaleY(1)}90%{transform:scaleY(.08)}92%{transform:scaleY(1)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes sprout{from{transform:scale(0);opacity:0}}
@keyframes pulse{0%,100%{opacity:.18;r:var(--r)}50%{opacity:.5}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.9)}}
@keyframes nudge{25%{transform:translateX(9px)}50%{transform:translateX(-8px)}75%{transform:translateX(4px)}}
@keyframes beckon{0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-6px) scale(1.04)}}
@keyframes beckGlow{0%,100%{box-shadow:0 5px 0 rgba(58,46,36,.25)}
  50%{box-shadow:0 5px 0 rgba(58,46,36,.25),0 0 0 8px rgba(240,169,59,.28)}}
.beckon{animation:beckon 1.5s ease-in-out infinite,beckGlow 1.5s ease-in-out infinite!important}
.plabel.beckon{animation:beckon 1.4s ease-in-out infinite!important}
@keyframes beck{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}
.cloud{animation:drift 50s linear infinite alternate}
.cloud.b{animation-duration:70s}
.palm{transform-origin:bottom center;animation:sway 6.8s ease-in-out infinite}
.palm.b{animation-duration:8.4s;animation-delay:-2s}
/* الشجرة ليست نخلة: حفيفٌ خفيف لا تمايل */
@keyframes rustle{50%{transform:rotate(-.9deg)}}
.tree-sway{transform-origin:bottom center;animation:rustle 7.5s ease-in-out infinite}
.tuft{transform-origin:bottom center;animation:swayT 4.6s ease-in-out infinite}
.tuft.d2{animation-duration:5.8s;animation-delay:-1.5s}
.star{animation:twinkle 3.4s ease-in-out infinite}
.stream{stroke-dasharray:14 9;animation:flow 1.4s linear infinite}
#eyes{transform-origin:30px 45px;animation:blinkA 7.6s ease-in-out infinite}
#abody{transform-origin:30px 151px;animation:breathe 3.7s ease-in-out infinite}
#sky1,#skyD,#sky2,#sky3,#night,#stars,#moon,#hglow,#tint{transition:opacity .9s ease}
#sun{transition:transform .9s ease,opacity .9s ease}
#scene stop{transition:stop-color .9s ease,stop-opacity .9s ease}
#sunCore,#clouds .cl-l,#clouds .cl-s,#cirrus{transition:fill .9s ease}
#tint{transition:fill .9s ease,opacity .9s ease}
#clouds .cloud{animation-timing-function:steps(35,end)}
#clouds .cloud.b{animation-timing-function:steps(35,end)}
@media(prefers-reduced-motion:reduce){#sky1,#skyD,#sky2,#sky3,#night,#stars,#moon,#hglow,#tint,#sun,#scene stop,#sunCore,#clouds .cl-l,#clouds .cl-s,#cirrus{transition:none}}

/* ── الأماكن ── */
.place{cursor:pointer;transition:filter .8s ease,opacity .8s ease}
.place.sleep{filter:saturate(.12) brightness(1.05);opacity:.62}
.place.visited{filter:none}
.halo{--r:0;stroke:#FFF3D0;stroke-width:0;fill:#FFF3D0;opacity:0}
.place.ready .halo{opacity:.2;animation:pulse 2.6s ease-in-out infinite}
#labels{position:absolute;inset:0;pointer-events:none;z-index:4}
.plabel{position:absolute;transform:translate(-50%,0);pointer-events:auto;cursor:pointer;
  background:linear-gradient(#FFFDF6,#F4E7CC);border:3px solid var(--line);border-radius:18px;
  padding:6px 14px;min-height:64px;display:flex;align-items:center;font-size:16px;font-weight:500;white-space:nowrap;
  box-shadow:0 4px 0 rgba(58,46,36,.25)}
.plabel.ready{animation:beck 2.2s ease-in-out infinite}
.plabel.done{background:linear-gradient(#DFF0D4,#C3E3AF);border-color:#4E9E63;box-shadow:0 4px 0 #3E7A4E}
.plabel.sleep{display:none}
.plabel:active{transform:translate(-50%,4px);box-shadow:none}

/* ── فقاعة أثر ── */
#say{position:absolute;inset-inline:0;z-index:6;opacity:0;transform:translateY(8px);
  transition:opacity .34s,transform .34s;display:flex;flex-direction:column;align-items:center;
  padding-inline:14px;pointer-events:none}
#say.on{opacity:1;transform:none}
#say .b{background:#fff;border:3px solid var(--line);border-radius:22px;padding:10px 18px;
  font-size:18px;font-weight:500;max-width:88%;text-align:center;box-shadow:0 5px 0 rgba(58,46,36,.2)}
#say .t{width:15px;height:15px;background:#fff;border:3px solid var(--line);border-top:0;
  border-inline-end:0;transform:rotate(-45deg);margin:-10px auto 0}

/* ── لوح التجربة ── */
#panel{position:absolute;inset-inline:0;bottom:0;z-index:10;padding:0 8px 8px;
  transform:translateY(104%);transition:transform .58s cubic-bezier(.3,1.05,.4,1)}
#panel.up{transform:none}
.sheet{position:relative;
  background:repeating-linear-gradient(90deg,rgba(140,100,60,.04) 0 3px,transparent 3px 10px),
    linear-gradient(#FDF7E8,#F2E3C6);
  border:4px solid var(--wood);border-bottom-width:6px;border-radius:30px 30px 22px 22px;
  padding:16px 15px 13px;box-shadow:0 -5px 0 rgba(58,46,36,.2),inset 0 2px 0 rgba(255,255,255,.8)}
.sheet::before{content:"";position:absolute;top:-4px;inset-inline:37%;height:18px;
  border:4px solid var(--wood);border-bottom:0;border-radius:18px 18px 0 0;background:#FDF7E8}
.stage{max-height:58vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.beat{animation:rise .45s cubic-bezier(.3,1.3,.5,1)}
.ask{font-size:17px;font-weight:500;line-height:1.6;text-align:center;margin-bottom:12px}
.line{font-size:18px;line-height:1.8;text-align:center;padding:6px 0 4px}
.hint{font-size:14.5px;color:var(--soft);text-align:center;margin-top:8px;min-height:20px}

/* كل نصّ مسموع */
.readable{position:relative;padding-inline-start:68px!important;min-height:64px}
/* [v2·٦] السماعة: مساحة مسّ ٦٤px، والدائرة الذهبية المرئية ٤٠px في وسطها */
.ear{position:absolute;top:50%;inset-inline-start:2px;transform:translateY(-50%);width:64px;height:64px;
  display:grid;place-items:center;font-size:19px;font-style:normal;cursor:pointer}
.ear::before{content:"";position:absolute;width:42px;height:42px;border-radius:50%;background:var(--gold);
  box-shadow:0 3px 0 #B87A19;z-index:-1}
.ear{z-index:1}

.touchers{display:flex;gap:9px;justify-content:center}
.toucher{flex:1;min-height:64px;border:3.5px solid var(--wood);border-radius:22px;
  background:radial-gradient(120% 90% at 30% 16%,#fff 0 20%,#E2F3FA 58%,#BFE5F3 100%);
  padding:11px 4px 9px;cursor:pointer;box-shadow:0 5px 0 #5E3E26;font:inherit}
.toucher .ico{font-size:22px;display:block}
.toucher b{display:block;font-size:14.5px;font-weight:500;margin-top:2px}
.toucher:active{transform:translateY(5px);box-shadow:none}
.toucher.seen{filter:saturate(.3);opacity:.7}
.reveal{background:linear-gradient(#fff,#FBF3E2);border:3.5px solid var(--wood);border-radius:20px;
  padding:13px 15px;margin-top:11px;font-size:16px;line-height:1.8;animation:rise .4s}

.slots{display:flex;flex-direction:column;gap:6px;margin-bottom:9px}
.slot{display:flex;align-items:center;gap:10px;background:linear-gradient(#E9F6DC,#D2EBBC);
  border:3px solid #57933F;border-radius:17px;padding:8px 12px;font-size:15px;animation:rise .4s}
.slot b{flex:0 0 22px;height:22px;border-radius:50%;background:#4E9E63;color:#fff;
  display:grid;place-items:center;font-size:12.5px;font-weight:700}
.pool{display:flex;flex-direction:column;gap:7px}
.chip{min-height:64px;border:3.5px solid #8A7048;border-radius:19px;background:linear-gradient(#F6EEDA,#E2D3B2);
  padding:11px 14px;font:inherit;font-size:15px;color:var(--ink);text-align:start;cursor:pointer;
  box-shadow:0 5px 0 #6B573A}
.chip:active{transform:translateY(5px);box-shadow:none}
.chip.nudge{animation:nudge .45s}

.situation{background:#fff;border-radius:18px;padding:13px 15px;font-size:16px;
  border-inline-start:5px solid var(--gold);margin-bottom:11px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{min-height:64px;border:3.5px solid var(--line);border-radius:20px;background:#fff;padding:13px 15px;
  font:inherit;font-size:16.5px;color:var(--ink);text-align:start;cursor:pointer;
  box-shadow:0 5px 0 rgba(58,46,36,.25)}
.opt:active{transform:translateY(5px);box-shadow:none}
.opt.picked{border-color:#2C90C4;background:#E6F5FC}
.outcome{border-radius:18px;padding:13px 15px;margin-top:11px;font-size:16px;line-height:1.8;animation:rise .4s}
.outcome.good{background:#DFF0D4;border-inline-start:5px solid #4E9E63}
.outcome.rethink{background:#FBEBD4;border-inline-start:5px solid var(--gold)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cell{min-height:64px;border:3.5px solid var(--wood);border-radius:18px;background:linear-gradient(#F8F1E0,#EADCC0);
  padding:11px 8px;font:inherit;font-size:14.5px;cursor:pointer;box-shadow:0 5px 0 #5E3E26;color:var(--ink)}
.cell.seen{background:#E7E0D2;color:#9A8E78;box-shadow:0 5px 0 #A99880}

.srccard{background:linear-gradient(#FFFDF4,#F6EEDC);border:3.5px solid var(--wood);
  border-radius:20px;padding:14px 15px;font-size:16.5px;line-height:1.9;text-align:center}
.srccard .ref{display:block;font-size:13.5px;color:#6B5C42;margin-top:7px}
.mission{background:linear-gradient(#FBEBD4,#F4DCB4);border:3.5px solid var(--wood);
  border-radius:22px;padding:16px;text-align:center;font-size:17.5px;line-height:1.8}
.mission .who{font-size:13.5px;color:var(--soft);margin-top:9px}

.btn{width:100%;min-height:64px;margin-top:11px;padding:14px;border:3.5px solid var(--line);border-radius:20px;
  background:linear-gradient(#2A8067,#186352);color:#fff;font:inherit;font-size:18px;font-weight:500;
  cursor:pointer;box-shadow:0 5px 0 var(--line)}
.btn:active{transform:translateY(5px);box-shadow:none}
.btn.gold{background:linear-gradient(#F7BC5C,#E8992B);color:#3A2E24}
.btn.off,.btn:disabled{background:linear-gradient(#E9E0CB,#E0D5BD);box-shadow:0 5px 0 #A99880;
  border-color:#8A7C62;color:#4F4433;cursor:default}
.ghost{width:100%;min-height:64px;margin-top:6px;padding:10px;border:0;background:none;font:inherit;
  font-size:15px;color:var(--soft);cursor:pointer;text-decoration:underline}


.story{cursor:pointer}
.panel-art{height:32vh;max-height:230px;display:grid;place-items:center;
  background:linear-gradient(#EAF4FB,#F8EEDA);border:3.5px solid var(--wood);
  border-radius:22px;overflow:hidden;animation:rise .5s}
.panel-art svg{width:100%;height:100%;display:block}
.panel-cap{font-size:17px;line-height:1.8;text-align:center;margin-top:11px;padding:6px 0}
.panel-dots{display:flex;gap:6px;justify-content:center;margin-top:9px}
.pdot{width:8px;height:8px;border-radius:50%;background:#DCCDAE;transition:all .3s}
.pdot.on{background:var(--em);transform:scale(1.3)}

.bism{text-align:center;font-size:17px;color:#5E5140;margin:4px 0 12px}
.ayat{display:flex;flex-direction:column;gap:8px}
.ayah{display:flex;gap:10px;align-items:flex-start;cursor:pointer;
  background:linear-gradient(#FFFDF4,#F7EEDA);border:3.5px solid #C9A24A;border-radius:20px;
  padding:13px 14px;box-shadow:0 4px 0 #A9832F;transition:transform .12s,box-shadow .12s}
.ayah:active{transform:translateY(4px);box-shadow:none}
.ayah .num{flex:0 0 24px;height:24px;border-radius:50%;background:#C9A24A;color:#fff;
  display:grid;place-items:center;font-size:12.5px;font-weight:700}
.ayah .txt{flex:1;font-size:19px;line-height:2;font-weight:500}
.ayah.now{border-color:#2A8067;box-shadow:0 4px 0 #186352,0 0 0 5px rgba(42,128,103,.18)}
.ayah.seen .num{background:#4E9E63}
.ayah.await::after{content:"🎧";font-size:13px;opacity:.8;align-self:center}

.lcard{border-radius:24px;padding:18px 16px;text-align:center;animation:rise .5s}
.lcard.start{background:linear-gradient(#EAF6EF,#D6EBDD);border:3.5px solid #2A8067}
.lcard.end{background:linear-gradient(#FFF8E8,#F6E8C8);border:3.5px solid var(--wood)}
.ltag{display:inline-block;background:#2A8067;color:#fff;font-size:12.5px;font-weight:700;
  padding:4px 14px;border-radius:12px;margin-bottom:9px}
.ltag.done{background:var(--gold);color:#3A2E24}
.lcard h2{font-size:22px;font-weight:700;margin-bottom:7px}
.lgoal{font-size:17.5px;line-height:1.75}
.lsrc{font-size:13px;color:#5E5140;margin-top:10px}
.lsum{background:#fff;border-radius:16px;padding:12px 14px;margin-top:6px;text-align:start}
.lsum b{display:block;font-size:14px;color:var(--em);margin-bottom:6px}
.lsum ul{padding-inline-start:20px;font-size:15.5px;line-height:1.9}
.lmission{background:#FBEBD4;border-radius:16px;padding:11px 14px;margin-top:9px;text-align:start}
.lmission b{display:block;font-size:14px;color:#B87A19;margin-bottom:4px}
.lmission p{font-size:15.5px;line-height:1.7}
.lmark{margin-top:9px;font-size:14px;color:var(--soft)}
.lmark.on{color:#2F6B3E;font-weight:500}
.lparent{background:#EEF1F5;border-radius:16px;padding:10px 13px;margin-top:9px;text-align:start}
.ltags{display:flex;gap:6px;margin-bottom:5px}
.ltags span{font-size:11.5px;background:#DCE3EA;color:#4A5A68;padding:2px 9px;border-radius:9px}
.lparent b{display:block;font-size:12.5px;color:#5E6E80;margin-bottom:3px}
.lparent p{font-size:14px;color:#54626F;line-height:1.7}

.tadabbur{padding:26px 8px;opacity:0;transition:opacity 1.4s ease}
.tadabbur.in{opacity:1}
.tline{font-size:21px;line-height:2.1;text-align:center;color:#1E4A3C;font-weight:500;
  padding:18px 14px;background:radial-gradient(120% 100% at 50% 0,#F2F8F4,#E6F0E9);
  border-radius:24px;border:3px solid #BBD8C8}
.btn.quiet{opacity:0;transition:opacity 1s ease;background:linear-gradient(#5E8C7B,#3D6B5A);
  box-shadow:0 5px 0 #2A4E41;border-color:#2A4E41;animation:none}
.btn.quiet.in{opacity:1}
.lheart{background:#EAF3EE;border-radius:16px;padding:10px 13px;margin-top:9px;text-align:start}
.lheart b{display:block;font-size:12.5px;color:#2A8067;margin-bottom:3px}
.lheart p{font-size:14.5px;color:#39584B;line-height:1.75}

#daily{position:absolute;inset:0;z-index:16;display:none;align-items:flex-end;
  justify-content:center;padding:0 12px calc(26px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent 55%,rgba(13,26,20,.45))}
#daily.on{display:flex;animation:rise .55s ease-out}
.dcard{width:100%;max-width:440px;background:linear-gradient(#FFF8E8,#F6E8C8);
  border:4px solid var(--wood);border-radius:24px;padding:15px 16px 13px;text-align:center;
  box-shadow:0 6px 0 rgba(58,46,36,.3)}
.dcard.done{background:linear-gradient(#EAF6EF,#D6EBDD);border-color:#2A8067}
.dtag{display:inline-block;background:var(--gold);color:#3A2E24;font-size:12.5px;font-weight:700;
  padding:3px 13px;border-radius:11px;margin-bottom:8px}
.dcard.done .dtag{background:#2A8067;color:#fff}
.dcard p{font-size:17.5px;line-height:1.8}
.dnote{font-size:14px;color:#2F6B3E;margin-top:8px;font-weight:500}
.dbtn{width:100%;min-height:64px;margin-top:11px;padding:13px;border:3.5px solid var(--line);border-radius:18px;
  background:linear-gradient(#F7BC5C,#E8992B);color:#3A2E24;font:inherit;font-size:18px;
  font-weight:500;cursor:pointer;box-shadow:0 5px 0 #B87A19}
.dbtn:active{transform:translateY(5px);box-shadow:none}
/* [v3] مراجعة اليوم + لوحة الوالد: لمس ≥64px، تباين ≥4.5 */
.dnote2{font-size:14px;color:#4A3F31;margin-bottom:4px}
.dbtn.soft{background:#FFF8E8;color:var(--ink);box-shadow:0 4px 0 #BFAE88;border-color:#BFAE88;margin-top:9px}
.dcard.done .dbtn.soft{background:#F4FBF6}
.pwh{display:block;color:var(--em);font-size:13.5px;margin-top:8px}
.pwl{padding-inline-start:20px;font-size:14px;line-height:1.9;color:var(--ink)}
.mrow{padding:10px 0;border-bottom:1px solid #F0E4C8}
.mrow:last-child{border-bottom:none}
.mt{font-size:14.5px;color:var(--ink);margin-bottom:7px;display:flex;flex-direction:column;gap:2px}
.mwhen{font-style:normal;font-size:12.5px;color:var(--soft)}
.mset{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.mbtn{min-height:64px;min-width:64px;padding:6px 3px;border:2.5px solid #8C7B58;border-radius:12px;background:#fff;color:var(--ink);
  font:inherit;font-size:12.5px;line-height:1.35;cursor:pointer}
.mbtn[aria-pressed="true"]{background:#1E6F5C;border-color:#14513F;color:#fff;font-weight:700}
.mbtn:active{transform:translateY(2px)}
.pdet.mdet summary{min-height:64px;display:flex;align-items:center}

#myv{position:absolute;top:calc(10px + env(safe-area-inset-top));inset-inline-end:86px;z-index:9;
  width:64px;height:64px;border-radius:50%;border:3px solid var(--line);background:rgba(255,255,255,.9);
  cursor:pointer;font-size:17px;display:grid;place-items:center;box-shadow:0 3px 0 rgba(58,46,36,.3)}
#sett{position:absolute;top:calc(10px + env(safe-area-inset-top));inset-inline-end:162px;z-index:9;
  width:64px;height:64px;border-radius:50%;border:3px solid var(--line);background:rgba(255,255,255,.9);
  cursor:pointer;color:var(--line);display:grid;place-items:center;box-shadow:0 3px 0 rgba(58,46,36,.3)}
#valley{position:absolute;inset:0;z-index:18;display:none;align-items:center;justify-content:center;
  padding:20px 12px;background:radial-gradient(120% 90% at 50% 40%,rgba(13,26,20,.5),rgba(13,26,20,.82));
  backdrop-filter:blur(3px)}
#valley.on{display:flex;animation:rise .5s ease-out}
.vcard{width:100%;max-width:430px;background:linear-gradient(#FDF7E8,#F2E3C6);border:4px solid var(--wood);
  border-radius:26px;padding:17px 16px 14px;box-shadow:0 8px 0 rgba(0,0,0,.3);
  max-height:82vh;display:flex;flex-direction:column}
.vtag{align-self:center;background:#2A8067;color:#fff;font-size:13px;font-weight:700;
  padding:4px 16px;border-radius:12px}
.vlead{text-align:center;font-size:18px;font-weight:500;margin:9px 0 11px}
.vlist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.vrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;

<script>
/* ── core/i18n.js ── */
/* ═══ أثر · اللغة ═══════════════════════════════════════════
   العربية هي اللغة الوحيدة المنفَّذة. البنية جاهزة لغيرها:
   لا نصّ ظاهر في الكود — كل نصّ إمّا مفتاح واجهة أو معرّف محتوى.
   ═════════════════════════════════════════════════════════ */
(function (root) {
"use strict";

const LOCALES = {
  ar: {
    dir: "rtl", name: "العربية",
    ui: {
      "app.name": "أثر",
      "app.tagline": "تعلّم واترك أثرًا طيبًا",
      "app.vision": "بيئةٌ يحبّها الطفل، وتترك أثرًا في أعماقه",
      "app.enter": "ادخل عالمك",
      "app.resume": "أكمل",
      "world.back": "عدتُ إلى الوادي",
      "world.sleeping": "ينام الآن",
      "act.did": "فعلتُها!",
      "act.later": "لم أفعلها بعد",
      "act.byChild": "تؤكّدها بنفسك بعد أن تفعلها",
      "act.byParent": "يؤكّدها والدك بعد أن يراك",
      "next": "تابع",
      "listen": "استمع"
    }
  }
};

const I18n = {
  cur: "ar",
  get locale() { return LOCALES[this.cur]; },
  t(key) { return (LOCALES[this.cur].ui[key]) || key; },
  /* نصّ المحتوى: { ar: "…" } — يسقط إلى العربية دائمًا */
  txt(node) {
    if (node == null) return "";
    if (typeof node === "string") return node;
    return node[this.cur] || node.ar || "";
  },
  apply() {
    document.documentElement.lang = this.cur;
    document.documentElement.dir = LOCALES[this.cur].dir;
  }
};

root.I18n = I18n;
})(window);

/* ── core/state.js ── */
/* ═══ أثر · الحالة ══════════════════════════════════════════
   ليست نقاطًا ولا مستويات. هي سجلّ ما فعله الطفل
   وما تركه من أثر في عالمه.
   ═════════════════════════════════════════════════════════ */
(function (root) {
"use strict";

const KEY = "athar.world.v2";

const State = {
  data: {
    name: null,
    visited: {},     // expId → عدد المرّات
    learned: [],     // تجارب أُتمّت
    acts: [],        // مهام واقعية أُكِّدت — هذه وحدها تصنع الأثر
    marks: [],       // آثار ظاهرة في العالم
    depth: {},       // كم مرّة كُرّرت مهمّة كل درس — الأثر يعمق بالتكرار
    daily: null,     // { date, exp, done }
    phase: 0,        // وقت اليوم
    learnedAt: {},   // expId → أوّل تاريخ إتمام (للوحة الوالد)
    actAt: {},       // expId → آخر تاريخ تطبيق واقعي (للوحة الوالد)
    streak: 0,       // أيّام الاستمرارية المتتالية
    lastActive: null, // آخر يومٍ حدث فيه نشاط (تعلّم أو تطبيق)
    /* [v2] حقول جديدة اختيارية — غيابها في الحالة القديمة لا يكسر شيئًا */
    later: [],       // دروس ضُغط فيها «لاحقًا»: لم تُتعلَّم ولم يُسجَّل أثرها
    sess: null,      // حصة اليوم: { d: تاريخ الجهاز, day: رقم اليوم في المسار, ids: [...] }
    quotaOff: false, // الوالد يتجاوز حصة اليوم
    /* [v3·١] المراجعة المتباعدة — مفاتيح جديدة؛ غيابها في الحالة القديمة يُرمَّم عند load/migrate */
    mastery: {},     // expId → 0 لم نصل بعد | 1 بمساعدتي | 2 وحده | 3 صارت عادته (يضبطه الوالد)
    reviews: {},     // expId → { at: آخر تأكيد (ms), n: عدد مرّات التأكيد على السلّم }
    revDay: null     // { d: تاريخ الجهاز, done:[ids], skipped:[ids] } — حدّ المراجعات اليومي
  },

  load() {
    try { Object.assign(this.data, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch {}
    /* [v3·١] ترحيل آمن: حالة قديمة بلا المفاتيح الجديدة (أو بقيم تالفة) تُرمَّم دون مسّ ما سواها */
    const D = this.data, isObj = o => o && typeof o === "object" && !Array.isArray(o);
    if (!isObj(D.mastery)) D.mastery = {};
    if (!isObj(D.reviews)) D.reviews = {};
    if (!isObj(D.revDay)) D.revDay = null;
    return this;
  },
  save() { try { localStorage.setItem(KEY, JSON.stringify(this.data)); } catch {} },
  reset() { try { localStorage.removeItem(KEY); } catch {} },

  /* تاريخ الجهاز المحلي (لا UTC): الحصة تتبع يوم الطفل لا يوم الخادم */
  localDay() {
    const d = new Date(); const z = n => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate());
  },
  /* دروس الحصة اليوم، وإلا فارغة */
  sessToday() {
    const s = this.data.sess;
    return (s && s.d === this.localDay()) ? s : null;
  },
  /* يُسجَّل بعد كل درس (أُتمّ أو أُجّل) ليُحتسب في حصة اليوم */
  noteSession(id, dayNo) {
    let s = this.sessToday();
    if (!s) s = this.data.sess = { d: this.localDay(), day: dayNo || 0, ids: [] };
    if (!s.ids.includes(id)) s.ids.push(id);
    this.save();
  },
  /* «لاحقًا»: لا تعلُّم ولا أثر ولا سلسلة؛ يبقى الدرس غير مُتعلَّم */
  defer(id) {
    if (!this.data.later) this.data.later = [];
    if (!this.data.later.includes(id)) this.data.later.push(id);
    this.save();
  },
  visit(id) { this.data.visited[id] = (this.data.visited[id] || 0) + 1; this.save(); },
  isLearned(id) { return this.data.learned.includes(id); },
  learn(id) {
    if (this.data.later) this.data.later = this.data.later.filter(x => x !== id);
    if (!this.isLearned(id)) {
      this.data.learned.push(id);
      this.data.learnedAt[id] = Date.now();
    }
    if (!this.data.reviews[id]) this.data.reviews[id] = { at: this.data.learnedAt[id] || Date.now(), n: 0 };   /* [v3·١] بدء السلّم من التعلّم */
    this.bumpStreak();
    this.save();
  },

  /* المهمة الواقعية هي وحدها التي تترك أثرًا */
  act(id, mark) {
    if (!this.data.acts.includes(id)) this.data.acts.push(id);
    this.data.actAt[id] = Date.now();
    if (mark && !this.data.marks.includes(mark)) this.data.marks.push(mark);
    this.bumpStreak();
    this.save();
  },
  hasMark(m) { return this.data.marks.includes(m); },

  /* ─── استمرارية الوالد ───
     يوم واحد فيه تعلّمٌ أو تطبيق يكفي لبقاء السلسلة. */
  bumpStreak() {
    const y = this.today();
    if (this.data.lastActive === y) return;
    const prev = this.data.lastActive;
    const yestr = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    this.data.streak = (prev === yestr) ? (this.data.streak || 0) + 1 : 1;
    this.data.lastActive = y;
  },

  /* ─── مهمّة اليوم ───
     الأثر لا يُصنع مرّة. يوم يُعاد فيه الفعل أصدق من يومٍ يُتعلَّم فيه. */
  today() { return new Date().toISOString().slice(0, 10); },
  dailyFor(list) {
    const d = this.data.daily;
    if (d && d.date === this.today()) return d;
    if (!list.length) return null;
    /* يُختار الأقلّ تكرارًا، ثم يُثبَّت ليومه */
    const pick = list.slice().sort((a, b) =>
      (this.data.depth[a.id] || 0) - (this.data.depth[b.id] || 0))[0];
    this.data.daily = { date: this.today(), exp: pick.id, done: false };
    this.save();
    return this.data.daily;
  },
  dailyDone() {
    const d = this.data.daily;
    if (!d || d.done) return 0;
    d.done = true;
    this.data.depth[d.exp] = (this.data.depth[d.exp] || 0) + 1;
    this.save();
    return this.data.depth[d.exp];
  },
  depthOf(id) { return this.data.depth[id] || 0; },
  /* [v3·٢] تأكيد مراجعة: أثرٌ أعمق (depth) + آخر تطبيق + نشاط اليوم. لا درجات. */
  reviewDone(id) {
    this.data.depth[id] = (this.data.depth[id] || 0) + 1;
    this.data.actAt[id] = Date.now();
    this.bumpStreak();
    this.save();
    return this.data.depth[id];
  },

  /* هل فُتح هذا المكان؟ يعتمد على متطلّباته لا على رقم */
  unlocked(reqs) {
    if (!reqs || !reqs.length) return true;
    return reqs.every(r => this.isLearned(r));
  },

  setPhase(p) { this.data.phase = p; this.save(); },

  /* المرحلة لا يختارها أحد — تُفتح حين يُتمّ الطفل مرحلته.
     التقدّم نموّ، لا اختيارًا من قائمة. */
  stage(all) {
    let s = 1;
    for (let n = 1; n <= 4; n++) {
      const ofStage = all.filter(e => e.stage === n);
      if (ofStage.length && ofStage.every(e => this.isLearned(e.id))) s = n + 1;
      else break;
    }
    return Math.min(s, 4);
  },
  /* هل بلغ الطفل مرحلةً جديدة للتوّ؟ */
  noteStage(s) {
    const was = this.data.seenStage || 1;
    if (s > was) { this.data.seenStage = s; this.save(); return true; }
    return false;
  }
};

root.State = State;
})(window);

/* ── core/audio.js ── */
/* ═══════════════════════════════════════════════════════════════════
   أثر — محرّك الصوت
   Content → Audio ID → Provider Chain → Playback

   المحتوى لا يعرف كيف يُنطق. يطلب معرّفًا، والمحرّك يقرّر المصدر.
   استبدال المزوّد أو إضافة تسجيلات لا يمسّ سطرًا واحدًا من الدروس.
   ═══════════════════════════════════════════════════════════════════ */
(function (root) {
"use strict";

/* ───────── ملامح الصوت: لكل دور نبرة وإيقاع ───────── */
const VOICES = {
  athar:    { rate:1.02, pitch:1.50, gap:130, label:"أثر — رفيق الطفل" },
  narrator: { rate:0.86, pitch:1.12, gap:240, label:"الراوي — التعليمات والسرد" },
  sacred:   { rate:0.68, pitch:1.00, gap:460, label:"النصّ الشرعي — متمهّل" },
  friend:   { rate:0.95, pitch:1.35, gap:160, label:"شخصية أخرى" },
  /* القرآن: لا يُنطق آليًا أبدًا — تلاوة بشرية أو صمت */
  quran:    { rate:0.60, pitch:1.00, gap:700, label:"القرآن — تلاوة بشرية فقط" }
};

/* ───────── ترتيب أفضلية الأصوات العربية ─────────
   اختيار «أول صوت عربي» خطأ: بعض الأجهزة تعطي صوتًا رديئًا أولًا.
   نرتّب بالأسماء المعروفة جودتها، ثم نتدرّج. */
const AR_RANK = [
  "Maged","Tarik","Laila","Majed","Mariam",          // Apple
  "Microsoft Hamed","Microsoft Naayf","Microsoft Salma","Microsoft Hoda",
  "Google العربية","Arabic Male","Arabic Female"
];

/* ───────── تنظيف النصّ قبل النطق ─────────
   المحرّكات الآلية تتعثّر في التطويل وعلامات التنصيص العربية. */
function normalize(text, opts = {}) {
  let t = String(text)
    .replace(/[\u0640]/g, "")                 // تطويل
    .replace(/[«»]/g, "")                     // تنصيص عربي
    .replace(/\u200f|\u200e/g, "")
    .replace(/\s+/g, " ").trim();
  if (opts.stripHarakat) t = t.replace(/[\u064B-\u0652\u0670]/g, "");
  return t;
}

/* ───────── تقطيع الجمل ─────────
   المحرّكات تتجاهل الفواصل العربية فتندفع بلا وقفة.
   نقطّع بأنفسنا ونضع صمتًا حقيقيًا بين المقاطع. */
function segment(text) {
  return normalize(text)
    .split(/(?<=[،؛,\.\!\?؟:])\s*/)
    .map(s => s.trim())
    .filter(Boolean);
}

/* ═══════════════ المزوّدون ═══════════════
   كل مزوّد: name · available() · canPlay(entry) · play(entry, onEnd) · stop()
   تُجرَّب بالترتيب، وأول من يستطيع يتولّى. */

/* ١ · تسجيل بشري — الأفضل، وهو المقصد النهائي */
function FileProvider(cfg) {
  let el = null;
  return {
    name: "file",
    quality: "بشري مسجَّل",
    available: () => true,
    canPlay: e => !!e.file,
    play(e, onEnd) {
      this.stop();
      const src = /^https?:\/\//.test(e.file) ? e.file : (cfg.basePath || "audio/") + e.file;
      el = new Audio(src);
      el.onended = onEnd;
      el.onerror = () => onEnd && onEnd({ failed: true });
      el.play().catch(() => onEnd && onEnd({ failed: true }));
    },
    stop() { if (el) { try { el.pause(); } catch {} el = null; } }
  };
}

/* ٢ · مزوّد خارجي قابل للتوصيل (Google · Azure · ElevenLabs · أي خدمة)
   لا يرتبط المشروع بمزوّد واحد: تُمرَّر دالة fetchUrl فقط.
   النتائج تُخزَّن في Cache API فتعمل بلا إنترنت بعد أول مرة. */
function RemoteProvider(cfg) {
  let el = null;
  const CACHE = "athar-valley-audio-v1";
  return {
    name: "remote",
    quality: "خدمة سحابية",
    available: () => cfg.remoteEnabled === true && typeof cfg.fetchUrl === "function",
    canPlay: e => e.voice !== "sfx" && !isProtected(e),
    async play(e, onEnd) {
      this.stop();
      if (isProtected(e)) { onEnd && onEnd({ failed: true }); return; }   /* [v2·١] حاجز أخير */
      const key = "athar://" + e.id + "#" + packKey(e);   /* يتغيّر بتغيّر الحروف/الصوت */
      try {
        let res = null;
        if ("caches" in window) {
          const c = await caches.open(CACHE);
          res = await c.match(key);
          if (!res) {
            const url = await cfg.fetchUrl(normalize(e.text), e.voice, VOICES[e.voice]);
            const net = await fetch(url);
            if (!net.ok) throw 0;
            await c.put(key, net.clone());
            res = net;
          }
        } else {
          res = await fetch(await cfg.fetchUrl(normalize(e.text), e.voice, VOICES[e.voice]));
        }
        el = new Audio(URL.createObjectURL(await res.blob()));
        el.onended = onEnd;
        el.play().catch(() => onEnd && onEnd({ failed: true }));
      } catch { onEnd && onEnd({ failed: true }); }
    },
    stop() { if (el) { try { el.pause(); } catch {} el = null; } }
  };
}

/* ─── موصّل Gemini (AI Studio): مفتاحٌ مجّاني بلا بطاقة ───
   يُخرج PCM خامًا، فنلفّه بترويسة WAV لنشغّله في المتصفّح. */
const AR_GEMINI = {
  athar:    { v: "Leda",  s: "بصوت طفلٍ مرح ودود، متحمّس قليلًا" },
  narrator: { v: "Kore",  s: "بصوتٍ دافئ متمهّل، كمن يحكي لطفل" },
  sacred:   { v: "Charon", s: "بصوتٍ وقور متمهّل، مع وقفاتٍ واضحة" },
  friend:   { v: "Puck",  s: "بصوت طفلٍ ودود" }
};
function pcmToWav(b64, rate) {
  const bin = atob(b64), n = bin.length;
  const buf = new ArrayBuffer(44 + n), dv = new DataView(buf);
  const put = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  put(0, "RIFF"); dv.setUint32(4, 36 + n, true); put(8, "WAVEfmt ");
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, rate, true); dv.setUint32(28, rate * 2, true);
  dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
  put(36, "data"); dv.setUint32(40, n, true);
  const u8 = new Uint8Array(buf);
  for (let i = 0; i < n; i++) u8[44 + i] = bin.charCodeAt(i);
  let s = ""; const CH = 0x8000;
  for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
  return "data:audio/wav;base64," + btoa(s);
}
function geminiTTS(key) {
  return async function (text, voice) {
    const g = AR_GEMINI[voice] || AR_GEMINI.narrator;
    const H = { "Content-Type": "application/json", "x-goog-api-key": key };
    const RATE = 24000;

    /* الواجهة الحديثة */
    try {
      const r = await fetch("https://generativelanguage.googleapis.com/v1beta/interactions", {
        method: "POST", headers: H, body: JSON.stringify({
          model: "gemini-3.8-flash-tts",
          input: [{ type: "user_input", content: [{ type: "text", text,
            annotations: [{ type: "speech_metadata", style: g.s }] }] }],
          response_format: { type: "audio", mime_type: "audio/l16", sample_rate: RATE },
          generation_config: { speech_config: [{ voice: g.v }] }
        })
      });
      if (r.ok) {
        const j = await r.json();

    /* الواجهة السابقة — احتياطًا */
    const r2 = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent",
      { method: "POST", headers: H, body: JSON.stringify({
        contents: [{ parts: [{ text: g.s + ": " + text }] }],
        generationConfig: { responseModalities: ["AUDIO"],
          speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: g.v } } } }
      }) });
    if (!r2.ok) throw new Error("gemini " + r2.status);
    const j2 = await r2.json();

}
/* الصوت قد يأتي في أشكالٍ مختلفة — نبحث عنه بأمان */

  if (typeof o.data === "string" && o.data.length > 200) return o.data;
  if (o.inlineData && typeof o.inlineData.data === "string") return o.inlineData.data;
  for (const k in o) { const h = findAudio(o[k], d + 1); if (h) return h; }

/* ─── موصّل Google Cloud TTS: يحتاج بطاقة، لكنّه أرخص للكمّيات ───
   لا يرتبط المشروع بجوجل: هذه دالةٌ واحدة تُستبدل بأي خدمة. */
const AR_GOOGLE = {
  athar:    "ar-XA-Wavenet-D",   // أنثوي خفيف — أقرب ما يكون لطفل برفع الطبقة
  narrator: "ar-XA-Wavenet-C",
  sacred:   "ar-XA-Wavenet-B",
  friend:   "ar-XA-Wavenet-A"

function googleTTS(key) {
  return async function (text, voice, profile) {
    const body = {
      input: { text },
      voice: { languageCode: "ar-XA", name: AR_GOOGLE[voice] || AR_GOOGLE.narrator },
      audioConfig: {
        audioEncoding: "MP3",
        speakingRate: Math.max(.25, Math.min(4, (profile && profile.rate) || 1)),
        pitch: Math.round((((profile && profile.pitch) || 1) - 1) * 12)  // نصف نغمة لكل درجة
      }

      "https://texttospeech.googleapis.com/v1/text:synthesize?key=" + encodeURIComponent(key),

/* ٣ · صوت الجهاز — احتياطي فقط، لا حلّ نهائي.
   لكنه محسَّن: ترتيب أصوات، تقطيع، وقفات حقيقية، ونبرة لكل دور. */
function DeviceProvider() {
  let cancelled = false, picked = null, misses = 0, dead = false;
  function chooseVoice() {
    if (!("speechSynthesis" in window) || !window.speechSynthesis) return null;
    const ar = speechSynthesis.getVoices().filter(v => /^ar/i.test(v.lang));
    for (const want of AR_RANK) {
      const hit = ar.find(v => v.name.includes(want));
      if (hit) return hit;
    }
    return ar.find(v => /ar[-_]SA/i.test(v.lang)) || ar[0] || null;
  }
  return {
    name: "device",
    quality: "صوت الجهاز",
    get voiceName() { picked = picked || chooseVoice(); return picked ? picked.name : "—"; },
    /* لا نشترط صوتًا عربيًّا: بعض الأجهزة تنطق العربية بلا صوتٍ مُعلَن.
       الصمت التامّ أسوأ من نطقٍ ناقص. */
    /* لا نشترط صوتًا عربيًّا معلنًا: بعض الأجهزة تنطق بلا إعلان.
       لكن إن ثبت أنّه لا ينطق فعلًا، نتوقّف عن محاولته. */
    available: () => "speechSynthesis" in window && !!window.speechSynthesis && !dead,
    canPlay: e => !isProtected(e),
    play(e, onEnd) {
      this.stop(); cancelled = false;
      if (isProtected(e)) { onEnd && onEnd({ failed: true }); return; }   /* [v2·١] حاجز أخير */
      picked = chooseVoice() || picked;        // يُعاد الاختيار كلّما توفّرت أصوات
      const p = VOICES[e.voice] || VOICES.narrator;
      const parts = segment(e.text);
      let i = 0;
      const step = () => {
        if (cancelled) return;
        if (i >= parts.length) { onEnd && onEnd(); return; }
        const txt = parts[i++];
        const u = new SpeechSynthesisUtterance(txt);
        if (picked) u.voice = picked;
        u.lang = (picked && picked.lang) || "ar-SA";
        u.rate = p.rate; u.pitch = p.pitch; u.volume = 1;
        let moved = false;
        const next = () => { if (!moved) { moved = true; setTimeout(step, p.gap); } };
        u.onend = next;
        u.onerror = next;
        /* حارس: إن لم يبدأ النطق خلال مهلةٍ معقولة، لا نعلق صامتين */
        const guard = setTimeout(() => {
          if (++misses >= 3) dead = true;      // لا ينطق — لا نضيّع الوقت بعد اليوم
          next();
        }, 900 + txt.length * 95);
        u.onstart = () => { misses = 0; clearTimeout(guard); };
        try { speechSynthesis.speak(u); } catch { clearTimeout(guard); next(); }
      };
      step();
    },
    stop() { cancelled = true; try { speechSynthesis.cancel(); } catch {} }
  };
}

/* ٤ · الصامت — لا يوقف التجربة أبدًا حين لا يتوفر صوت */
function SilentProvider() {
  return {
    name: "silent", quality: "بلا صوت",
    available: () => true, canPlay: () => true,
    /* بلا صوت، الإيقاع هو كل شيء: وقتٌ يكفي لقراءة السطر بتمهّل */
    play(e, onEnd) { const ms = Math.min(7500, 900 + normalize(e.text).length * 78);
      this._t = setTimeout(() => onEnd && onEnd(), ms); },
    stop() { clearTimeout(this._t); }
  };
}

/* ═══ [v2·١] حارس الآيات ═══
   سطرٌ voice=quran أو فيه ﴿ ﴾ لا يصل أبدًا إلى مزوّد آلي (سحابي أو جهاز):
   إمّا تسجيل بشري/حزمة، وإمّا يُعرض النصّ صامتًا. الفحص يتكرّر في أربعة مواضع
   (resolve، مسار السقوط، play في كل مزوّد آلي، وغلاف fetchUrl) فلا يكسره إعداد. */

/* ═══ [v2·٢] مزوّد الحزم الصوتية ═══
   audio/index.json = {v:1, packs:["sp_a.bin",…], e:{hash:[packIdx, off, len]}}
   المفتاح hash لنصّ مطبَّع (voice|text) — لا يرتبط بالمعرّف. بدون الفهرس أو الحزم يتجاوزه المحرّك. */
function vNorm(t) {
  return String(t).replace(/[\u064B-\u065F\u0670\u0640]/g, "").replace(/[أإآ]/g, "ا").replace(/ى/g, "ي")
    .replace(/[!؟?.,،:؛]+/g, " ").replace(/\s+/g, " ").replace(/^ | $/g, "");

    if (loading) return loading;
    loading = (async () => {
      try {
        if (!cfg.packs || typeof fetch !== "function") return;
        const r = await fetch(base() + "index.json");
        if (!r.ok) return;

        if (j && j.v === 1 && Array.isArray(j.packs) && j.e && typeof j.e === "object") IDX = j;

      const u = base() + name;
      try {

          const hit = await c.match(u);

          const r = await fetch(u); if (!r.ok) throw 0;
          try { await c.put(u, r.clone()); } catch {}

      return await r.arrayBuffer();

    load, get loaded() { return !!IDX; },
    available: () => !!IDX,
    canPlay: e => { const r = ref(e); return !!(r && IDX.packs[r[0]]); },
    async play(e, onEnd) {
      this.stop();
      const my = el = {};            /* رمز الاستدعاء: يبطل إن جاء stop() قبل اكتمال التنزيل */
      try {
        const r = ref(e);

        const a = new Audio(url); el = a;
        a.onended = () => { this.stop(); onEnd && onEnd(); };
        a.onerror = () => onEnd && onEnd({ failed: true });
        a.play().catch(() => onEnd && onEnd({ failed: true }));
      } catch { if (el === my) onEnd && onEnd({ failed: true }); }
    },
    stop() {
      if (el && el.pause) { try { el.pause(); } catch {} }
      el = null;
      if (url) { try { URL.revokeObjectURL(url); } catch {} url = null; }
    }
  };
}

/* ═══════════════ المحرّك ═══════════════ */
const Engine = {
  cfg: {
    basePath: "audio/",
    /* سياسة النصّ الشرعي:
       "file-only"      → لا يُنطق آليًا أبدًا. بلا تسجيل = نغمة + النصّ مرئي. (للإصدار)
       "device-fallback"→ يُسمح بصوت الجهاز عند غياب التسجيل. (للتجريب)  */

    /* [v2·١] مزوّد Gemini/السحابة البعيد: file-only افتراضيًا (= معطَّل).
       يفعّله الوالد صراحةً (athar.remote=1)؛ وحتى حينئذٍ لا يرى سطرًا قرآنيًا ولا نصًّا شرعيًا بلا تسجيل. */
    remoteEnabled: false,
    /* [v2·٢] قراءة حزم audio/index.json. تُطفأ بـ packs:false */
    packs: true,
    onStateChange: null

  manifest: {},
  providers: [],
  _active: null,
  _muted: false,

  configure(o = {}) {
    Object.assign(this.cfg, o);
    if (o.manifest) this.manifest = o.manifest;
    if (!this.providers.length) {
      this.providers = [
        PackProvider(this.cfg),
        FileProvider(this.cfg),
        RemoteProvider(this.cfg),
        DeviceProvider(),
        SilentProvider()

    }
    /* مفتاحٌ محفوظ من جلسةٍ سابقة؟ يُوصَّل فورًا. */
    if (!("remoteEnabled" in o)) { try { this.cfg.remoteEnabled = localStorage.getItem("athar.remote") === "1"; } catch {} }
    const saved = this.getKey();
    if (saved && !this.cfg.fetchUrl) this.cfg.fetchUrl = this.guardFetch(geminiTTS(saved));
    const pk = this.providers.find(p => p.name === "pack");
    this.ready = pk && this.cfg.packs ? pk.load() : Promise.resolve();
    if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {};
    return this;
  },

  /* يُستدعى من أول لمسة — متطلّب iOS */
  /* أندرويد يُعلّق النطق بعد ~١٥ ثانية. نبّهه دوريًّا. */
  keepAlive() {
    if (!("speechSynthesis" in window)) return;
    clearInterval(this._ka);
    this._ka = setInterval(() => {
      if (speechSynthesis.speaking && !speechSynthesis.paused) {
        try { speechSynthesis.pause(); speechSynthesis.resume(); } catch {}
      }
    }, 9000);
  },

  /* أيوجد نطقٌ فعلًا؟ — للتطبيق ليُخبر الوالد مرّةً واحدة */
  hasVoice() {
    if (!("speechSynthesis" in window) || !window.speechSynthesis) return false;
    try { return speechSynthesis.getVoices().length > 0; } catch { return false; }
  },

  /* مفتاح الخدمة: يُحفظ في الجهاز، ويُوصَّل عند الإقلاع */
  setKey(k) {
    try { k ? localStorage.setItem("athar.tts", k) : localStorage.removeItem("athar.tts"); } catch {}
    this.cfg.fetchUrl = k ? this.guardFetch(geminiTTS(k)) : null;
    this._key = k || "";
  },
  /* تفعيل/تعطيل الصوت السحابي (خيار الوالد، يُحفظ) */
  setRemote(on) {
    this.cfg.remoteEnabled = !!on;
    try { on ? localStorage.setItem("athar.remote", "1") : localStorage.removeItem("athar.remote"); } catch {}
  },
  /* الطبقة الأخيرة: أي دالة جلب سحابية تُغلَّف فترفض ﴿﴾ مهما كان المستدعي */
  guardFetch(fn) {
    return function (text, voice, prof) {
      if (AYAH_RE.test(String(text)) || voice === "quran") return Promise.reject(new Error("ayah-guard"));
      return fn(text, voice, prof);
    };
  },
  isProtected, packKey, vNorm, vHash,
  getKey() { try { return localStorage.getItem("athar.tts") || ""; } catch { return ""; } },

  /* اختبارٌ سريع قبل الحفظ */
  async testKey(k) {

    for (const [name, mk] of [["gemini", geminiTTS], ["cloud", googleTTS]]) {
      try {
        const url = await mk(k)("مرحبًا، أنا أثر، ورفيقك هنا", "athar", VOICES.athar);
        await new Promise((ok, no) => {
          const el = new Audio(url);
          el.onended = ok; el.onerror = () => no(new Error("لم يُشغّل"));

  },

  async _unused(k) {

      await new Promise((ok, no) => {

        el.onended = ok; el.onerror = no;
        el.play().then(() => {}).catch(no);

      const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u);

        const L = this.order(entry), i = L.indexOf(provider);
        const nx = L.slice(i + 1).find(p => this.eligible(p, entry));
        if (nx) { this._active = nx; this.cfg.onStateChange && this.cfg.onStateChange({ id, provider: nx.name, entry });
          return nx.play(entry, opts.onEnd); }

      opts.onEnd && opts.onEnd();
    });

  },

  /* للتجريب فقط — المحتوى الحقيقي يمرّ بمعرّف دائمًا */
  sayText(text, voice = "narrator", opts = {}) {
    const id = "__adhoc";

  },

    const dev = this.providers.find(p => p.name === "device");

/* ── core/guide.js ── */
/* ═══ أثر · الإرشاد ═════════════════════════════════════════
   لا يُترك الطفل حائرًا. إن سكن، تدرّج العالم في تنبيهه:
     ٥ ثوانٍ  → ما يُلمس يتنفّس        (بصري صامت)
     ٩ ثوانٍ  → نغمة لطيفة              (سمعي بلا كلام)
    ١٤ ثانية → أثر يقول ماذا يفعل      (كلام قصير)
    ثم يعيدها كل ١٤ ثانية.
   أي لمسة تُعيد العدّ من الصفر.
   ═════════════════════════════════════════════════════════ */
(function (root) {
"use strict";

const STEPS = [5000, 9000, 14000];

const Guide = {
  timers: [], scope: null, sel: null, hint: null, loop: null, _bound: null,

  /* ماذا يفعل الطفل الآن؟ */
  watch(scope, sel, hint) {
    this.clear();
    if (!scope) return;
    this.scope = scope; this.sel = sel; this.hint = hint;
    this.bind();
    this.arm();
  },

  arm() {
    this.timers = [
      setTimeout(() => this.level(1), STEPS[0]),
      setTimeout(() => this.level(2), STEPS[1]),
      setTimeout(() => this.level(3), STEPS[2])
    ];
  },

  bind() {
    if (this._bound) return;
    this._bound = () => this.reset();
    this.scope.addEventListener("pointerdown", this._bound, true);
  },

  reset() {
    this.timers.forEach(clearTimeout);
    clearInterval(this.loop); this.loop = null;
    this.dim();
    if (this.scope) this.arm();
  },

  targets() {
    if (!this.scope || !this.sel) return [];
    return [...this.scope.querySelectorAll(this.sel)]
      .filter(e => !e.disabled && !e.classList.contains("seen") && !e.classList.contains("done"));
  },

  level(n) {
    const t = this.targets();
    if (!t.length) return;
    if (n === 1) t.forEach(e => e.classList.add("beckon"));
    if (n === 2) root.AtharAudio.sfx("soft");
    if (n === 3) {
      this.speak();
      clearInterval(this.loop);
      this.loop = setInterval(() => this.targets().length ? this.speak() : this.clear(), STEPS[2]);
    }
  },

  speak() {
    if (!this.hint) return;
    root.World && root.World.athar(this.hint, "ask", 3000);
  },

  dim() { this.scope && this.scope.querySelectorAll(".beckon").forEach(e => e.classList.remove("beckon")); },

  clear() {
    this.timers.forEach(clearTimeout); this.timers = [];
    clearInterval(this.loop); this.loop = null;
    this.dim();
    if (this.scope && this._bound) this.scope.removeEventListener("pointerdown", this._bound, true);
    this._bound = null; this.scope = null; this.sel = null; this.hint = null;
  }
};

/* لكل وحدة تلميحها العام — يصلح لكل موضوع، فلا يُكتب في كل درس */
Guide.HINT = {
  touch:   "hint.touch",
  order:   "hint.order",
  pick:    "hint.pick",
  collect: "hint.collect",
  source:  "hint.next",
  narrate: "hint.next",
  act:     "hint.act",
  story:   "hint.story",
  recite:  "hint.recite",
  next:    "hint.next"
};

root.Guide = Guide;
})(window);

/* ── core/director.js ── */
/* ═══ أثر · المخرج ══════════════════════════════════════════
   يقرأ تجربة (بيانات) ويشغّلها مشهدًا مشهدًا.
   لا يعرف شيئًا عن الوضوء ولا السلام ولا العقيدة —
   يعرف الوحدات الستّ فقط. لذلك تُضاف الموضوعات بلا مسّه.
   ═════════════════════════════════════════════════════════ */
(function (root) {
"use strict";
const el = root.blockEl;

/* أسماء الفصول — تظهر للوالد فقط. الطفل يرى الأماكن لا الأقسام. */
root.DOMAINS = {
  aqeedah:"العقيدة", ibadah:"الفقه والعبادات", seerah:"السيرة النبوية",
  quran:"القرآن وتفسيره", hadith:"الحديث", adab:"الآداب",
  akhlaq:"الأخلاق", adhkar:"الأذكار والأدعية", misc:"موضوعات متنوّعة"
};

const Director = {
  stage: null, panel: null, world: null,
  exp: null, i: 0, onFinish: null,

  init(o) { this.panel = o.panel; this.world = o.world; return this; },

  /* كل درس يُغلَّف ببداية ونهاية — لا يُترك للمؤلّف أن ينساهما */
  frame(exp) {
    const act = exp.beats.find(x => x.type === "act") || {};
    return Object.assign({}, exp, { beats: [
      { type: "open", title: exp.title, goal: exp.goal,
        source: exp.source, audio: "goal." + exp.id,
        spot: exp.scene && exp.scene.spot },
      ...exp.beats,
      { type: "close", title: exp.title, goal: exp.goal, learned: exp.learned,
        task: act.task, aim: exp.aim, heart: exp.heart, mark: exp.leaves,
        spot: exp.scene && exp.scene.spot,
        domainName: (root.DOMAINS || {})[exp.domain] || "", stage: exp.stage,
        audio: "end." + exp.id }
    ] });
  },

  acted: null, actIdx: -1,   /* [v2] نتيجة المهمّة: "done" | "later" | null */

  run(rawExp, onFinish) {
    const exp = this.frame(rawExp);
    this.exp = exp; this.i = 0; this.onFinish = onFinish;
    this.acted = null; this.actIdx = -1;
    State.visit(rawExp.id);
    this.panel.innerHTML = '<div class="sheet"><div class="stage"></div></div>';
    this.stage = this.panel.querySelector(".stage");
    this.panel.classList.add("up");
    this.step();
  },

  close(done) {
    Guide.clear();
    this.panel.classList.remove("up");
    AtharAudio.stop();
    setTimeout(() => { this.panel.innerHTML = ""; this.onFinish && this.onFinish(done); }, 550);
  },

  step() {
    if (this.i >= this.exp.beats.length) {
      /* «لاحقًا»: الدرس غير مُتعلَّم ولا أثر؛ يُحتسب فقط في حصة اليوم */
      if (this.acted === "later") State.defer(this.exp.id);
      else State.learn(this.exp.id);
      this.onEnded && this.onEnded(this.exp.id, this.acted);
      return this.close(true);
    }
    Guide.clear();
    const beat = this.exp.beats[this.i++];
    if (beat.type === "act") this.actIdx = this.i - 1;
    /* [v2] سطر الأثر بعد المهمّة متغيّران: when=done (الافتراضي) أو when=later.
       سطرٌ قديم بلا when يُعامل كأنه done فلا يُسمَع عند «لاحقًا». */
    if (beat.type === "say" && this.actIdx >= 0 && this.i - 1 > this.actIdx
        && (beat.when || "done") !== this.acted) return this.step();
    const fn = Blocks[beat.type];
    if (!fn) { console.warn("[director] وحدة غير معروفة:", beat.type); return this.step(); }
    fn(beat, this.stage, this.api());
  },

  api() {
    const D = this;
    return {
      done: () => D.step(),
      /* زرّ التابع: يظهر معطّلًا إن كانت الوحدة تحتاج إتمامًا */
      nextBtn(box, locked) {
        const b = el("button", "btn next" + (locked ? " off" : ""), I18n.t("next"));
        if (locked) b.disabled = true;

        if (b && b.disabled) {

      later: () => {

        if (!rest.some(x => x.type === "say" && x.when === "later"))

      acted: () => D.acted,
      meter: v => D.world.meter(v),
      /* ماذا ينتظر الطفل أن يفعل الآن */
      guide: (sel, kind) => Guide.watch(D.stage, sel, Guide.HINT[kind] || kind)
    };
  },

  scroll() { requestAnimationFrame(() => { this.stage.scrollTop = this.stage.scrollHeight; }); }
};

/* ═══ [v3·١] المراجعة المتباعدة ═══════════════════════════════════
   يقرأ method من الدرس إن وُجد، ويعمل بدونه:
     ladder  : method.ladder  ← وإلا حسب domain (DOM_LADDER) ← وإلا "U"
     الفواصل : method.review_days (أيام متصاعدة، تُقاس من آخر تأكيد) ← وإلا من السلّم
     seasonal: method.seasonal=true لا يدخل السلّم؛ يظهر في موسمه فقط
               (method.season = {hijri:[أشهر]} أو {greg:[أشهر]})، وبلا season يُترك.
   لا درجات ولا إخفاقات: التأخّر لا يُعاقَب، والتأكيد وحده يُقدّم الدرس على السلّم. */
const DAYMS = 86400000;
const Review = {
  LADDER: { H: [1, 3, 7, 21, 60], U: [3, 7, 21, 60], C: [7, 21, 60] },
  DOM_LADDER: { adab: "H", akhlaq: "H", adhkar: "H", ibadah: "H" },   /* ما سواها: U */
  MULT: { 1: 0.5, 2: 1, 3: 2 },    /* بمساعدتي ½ · وحده ×1 · صارت عادته ×2؛ «لم نصل بعد» = غدًا */
  MAX_DAILY: 2,
  SEASON_FIRST: 3, SEASON_GAP: 180,
  WORDS: ["لم نصل بعد", "بمساعدتي", "وحده", "صارت عادته"],

  dayNum(ts) { const d = new Date(ts); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAYMS); },
  exp(id) { return App.exps && App.exps[id]; },
  method(e) { return (e && e.method && typeof e.method === "object") ? e.method : {}; },
  ladder(e) { const m = this.method(e); return /^[HUC]$/.test(m.ladder) ? m.ladder : (this.DOM_LADDER[e && e.domain] || "U"); },
  days(e) {
    const rd = this.method(e).review_days;
    if (Array.isArray(rd) && rd.length && rd.every(x => Number.isFinite(+x) && +x > 0)) return rd.map(Number);
    return this.LADDER[this.ladder(e)];
  },
  seasonal(e) { return this.method(e).seasonal === true; },
  inSeason(e, ts) {
    const s = this.method(e).season; if (!s || typeof s !== "object") return false;
    const d = new Date(ts);
    if (Array.isArray(s.greg) && s.greg.includes(d.getMonth() + 1)) return true;
    if (Array.isArray(s.hijri)) {
      try { const hm = parseInt(new Intl.DateTimeFormat("en-u-ca-islamic-umalqura", { month: "numeric" }).format(d), 10);
        if (s.hijri.includes(hm)) return true; } catch {}
    }
    return false;
  },
  mastery(id) { const v = State.data.mastery[id]; return (v === 0 || v === 1 || v === 2 || v === 3) ? v : null; },
  rec(id) { return State.data.reviews[id] || null; },

  /* الحالة الآن: { kind: none|off|offseason|settled|wait|due, dueDay, inDays, gap, n } */
  state(id, now = Date.now()) {
    const e = this.exp(id), r = this.rec(id);
    if (!e || !State.isLearned(id) || !r) return { kind: "none" };
    const today = this.dayNum(now), base = this.dayNum(r.at), n = r.n || 0, m = this.mastery(id);
    let gap;
    if (this.seasonal(e)) {
      if (!this.method(e).season) return { kind: "off" };
      gap = n ? this.SEASON_GAP : this.SEASON_FIRST;
      const dueDay = base + gap;
      if (!this.inSeason(e, now)) return { kind: "offseason", dueDay, gap, n };
      return { kind: today >= dueDay ? "due" : "wait", dueDay, inDays: dueDay - today, gap, n };
    }
    const days = this.days(e);
    if (n >= days.length && m !== 0) return { kind: "settled", n };
    gap = (m === 0) ? 1 : Math.max(1, Math.ceil(days[Math.min(n, days.length - 1)] * (this.MULT[m] || 1)));
    const dueDay = base + gap;
    return { kind: today >= dueDay ? "due" : "wait", dueDay, inDays: dueDay - today, gap, n };
  },

  /* ترحيل: درسٌ مُتعلَّم بلا سجل مراجعة يُعطى سجلًّا من وقت تعلّمه (أو الآن) — لا يُمسّ شيء قديم */
  migrate() {
    const D = State.data; let ch = false;
    D.learned.forEach(id => {
      if (D.reviews[id]) return;
      const e = this.exp(id), len = e ? this.days(e).length : 1;
      D.reviews[id] = { at: D.learnedAt[id] || Date.now(), n: Math.min(D.depth[id] || 0, Math.max(0, len - 1)), mig: 1 };
      ch = true;
    });
    if (ch) State.save();
  },

  todayRec() {
    const d = State.localDay(), r = State.data.revDay;
    if (!r || r.d !== d) State.data.revDay = { d, done: [], skipped: [] };
    return State.data.revDay;
  },
  left() { return Math.max(0, this.MAX_DAILY - this.todayRec().done.length); },
  /* المستحقّ الآن، الأقدم استحقاقًا أولًا (ثم بترتيب المعرّف) — يستثني ما أُنجز أو أُرجئ اليوم */
  dueList(now = Date.now()) {
    const t = this.todayRec();
    return State.data.learned
      .map(id => ({ id, st: this.state(id, now) }))
      .filter(x => x.st.kind === "due" && this.actOf(x.id) && !t.done.includes(x.id) && !t.skipped.includes(x.id))
      .sort((a, b) => (a.st.dueDay - b.st.dueDay) || (a.id < b.id ? -1 : 1))
      .map(x => x.id);
  },
  actOf(id) { const e = this.exp(id); return e && (e.beats || []).find(b => b.type === "act"); },
  next(now = Date.now()) { return this.left() > 0 ? (this.dueList(now)[0] || null) : null; },
  skip(id) { const t = this.todayRec(); if (!t.skipped.includes(id)) t.skipped.push(id); State.save(); },
  confirm(id, now = Date.now()) {
    const r = this.rec(id) || (State.data.reviews[id] = { at: now, n: 0 });
    r.at = now; r.n = (this.mastery(id) === 0) ? 0 : (r.n || 0) + 1;
    const t = this.todayRec(); if (!t.done.includes(id)) t.done.push(id);
    return State.reviewDone(id);
  },
  /* الوالد: v ∈ 0..3. «لم نصل بعد» تعيد الدرس إلى بداية السلّم وتستحقّه غدًا؛
     «بمساعدتي» تقصّر الفاصل إلى النصف (وتُحيي ما استقرّ)؛ «صارت عادته» تضاعفه. */
  setMastery(id, v, now = Date.now()) {
    if (![0, 1, 2, 3].includes(v)) return;
    State.data.mastery[id] = v;
    const r = this.rec(id), e = this.exp(id);
    if (r && e) {
      const len = this.days(e).length;
      if (v === 0) { r.n = 0; r.at = now; }
      else if (v === 1 && (r.n || 0) >= len) { r.n = len - 1; r.at = now; }
    }
    State.save();
  },
  /* نصّ لطيف للوالد (لا أرقام درجات) */
  whenText(id, now = Date.now()) {
    const s = this.state(id, now);
    if (s.kind === "due") return "حان وقت العودة إليه";
    if (s.kind === "wait") return s.inDays === 1 ? "نعود إليه غدًا" : s.inDays === 2 ? "نعود إليه بعد يومين" : s.inDays <= 10 ? `نعود إليه بعد ${s.inDays} أيام` : `نعود إليه بعد ${s.inDays} يومًا`;
    if (s.kind === "settled") return "استقرّ — لا نحتاج أن نعيده";
    if (s.kind === "off" || s.kind === "offseason") return "يعود في موسمه فقط";
    return "";
  },
  /* ملخّص الأسبوع للوالد: ما تعلّمه، ما نعيده، سؤال حواري واحد — بلا مقارنات ولا ترتيب ولا درجات */
  weekly(now = Date.now()) {
    const D = State.data, all = Object.values(App.exps), wk = now - 7 * DAYMS;
    const learnedWeek = all.filter(e => State.isLearned(e.id) && (D.learnedAt[e.id] || 0) >= wk);
    const again = all.filter(e => State.isLearned(e.id) && !this.seasonal(e) && (this.mastery(e.id) === 0 || this.mastery(e.id) === 1 || this.state(e.id, now).kind === "due"))
      .sort((a, b) => (this.mastery(a.id) === 0 ? 0 : 1) - (this.mastery(b.id) === 0 ? 0 : 1));
    const pivot = again[0] || learnedWeek[learnedWeek.length - 1] || all.filter(e => State.isLearned(e.id)).pop() || null;
    const q = pivot ? `اسأله بهدوء: «كيف كان «${I18n.txt(pivot.title)}» معك هذا الأسبوع؟ وما أجمل ما حدث؟»` : "";
    return { learnedWeek, again, question: q };
  }
};
root.Review = Review;

const App = {
  world: null, places: [], exps: {},

  /* ═══ [v2·٥] المسار واليوم والحصة ═══
     التراجع: localStorage athar.seq=0 أو ?legacy=1 يعيدان ترتيب الخريطة القديم. */
  seq: null,
  initSeq(data) {
    this.seq = null;
    let off = false;
    try { off = localStorage.getItem("athar.seq") === "0" || /[?&]legacy=1/.test(location.search); } catch {}
    const raw = data.sequence || root.ATHAR_SEQ;
    if (off || !raw || !Array.isArray(raw.days)) return;
    const dayOf = {};
    raw.days.forEach((d, i) => (d.lessons || []).forEach(l => { if (this.exps[l]) dayOf[l] = i; }));
    if (!Object.keys(dayOf).length) return;
    this.seq = { days: raw.days, dayOf };
  },
  /* ماذا الآن؟  next | tomorrow | end | null (بلا مسار) */
  plan() {
    const q = this.seq; if (!q) return null;
    const ok = id => !!this.exps[id];
    const learned = id => State.isLearned(id);
    const cur = q.days.findIndex(d => d.lessons.some(l => ok(l) && !learned(l)));
    if (cur < 0) return { kind: "end" };
    const sess = State.sessToday();
    const quotaOff = !!State.data.quotaOff;
    const free = di => q.days[di].lessons.find(l => ok(l) && !learned(l) && !(sess && sess.ids.includes(l)));
    const mk = (id, di) => {
      const d = q.days[di], exp = this.exps[id];
      const newDay = !sess || sess.day !== d.day;
      return { kind: "next", exp, day: d, dayIdx: di, newDay, second: !newDay && sess.ids.length > 0,
        place: this.places.find(x => x.place === d.place) || this.places.find(x => (x.exps || []).includes(id)) };
    };
    let di = cur;
    if (sess && !quotaOff) { const si = q.days.findIndex(d => d.day === sess.day); if (si >= 0) di = si; }
    if (quotaOff) { for (let k = cur; k < q.days.length; k++) { const f = free(k); if (f) return mk(f, k); } }
    else { const f = free(di); if (f) return mk(f, di); }
    /* الحصة اكتملت: غدًا */
    const done = q.days[di], tmr = q.days[cur];

  boot(data) {

    Object.entries(ENGINE_AUDIO).forEach(([k, v]) => { if (!data.audio[k]) data.audio[k] = v; });

    const snd = document.getElementById("snd");
    if (snd) {
      let t = null, x0 = 0, y0 = 0, fired = false;
      const start = e => {
        fired = false;
        const p = (e.touches && e.touches[0]) || e;
        x0 = p.clientX || 0; y0 = p.clientY || 0;
        t = setTimeout(() => { fired = true; snd.style.transform = ""; this.voiceSetup(); }, 700);
        snd.style.transform = "scale(.9)";
      };
      const stop = () => { clearTimeout(t); snd.style.transform = ""; };
      const move = e => {                       // تُلغى فقط عند حركةٍ حقيقية
        const p = (e.touches && e.touches[0]) || e;
        if (Math.abs((p.clientX || 0) - x0) > 18 || Math.abs((p.clientY || 0) - y0) > 18) stop();
      };
      snd.addEventListener("touchstart", start, { passive: true });
      snd.addEventListener("mousedown", start);
      snd.addEventListener("touchmove", move, { passive: true });
      ["touchend","touchcancel","mouseup","mouseleave"].forEach(ev =>
        snd.addEventListener(ev, stop, { passive: true }));
      /* لا يُبدَّل كتم الصوت إن كانت الضغطة مطوّلة */
      snd.addEventListener("click", e => { if (fired) { e.stopPropagation(); e.preventDefault(); } }, true);
    }

    /* ═══ ٢ · رابط مباشر: …/athar.html#voice ═══ */
    const openByHash = () => {
      if (location.hash === "#voice") { location.hash = ""; setTimeout(() => this.voiceSetup(), 400); }
    };
    addEventListener("hashchange", openByHash);
    setTimeout(openByHash, 1500);
    Director.init({ panel: document.getElementById("panel"), world: World });
    { const ph0 = State.data.phase || 0; const fresh = ph0 === 0 && !(State.data.learned && State.data.learned.length);
      World.phase(fresh ? 3 : ph0, fresh); }   /* فجر الرحلة في عالم لم يبدأ بعد */

  },

      host.classList.add("on");

      host.querySelector("#vopen").onclick = () => { host.classList.remove("on"); setTimeout(() => this.voiceSetup(), 300); };

  /* ═══ التمهيد ═══
     ثلاث بطاقات تُقال مرّةً واحدة. تشرح المنهجية قبل أن يبدأ:
     أين أنت · كيف تتعلّم · وماذا يبقى منك. */
  intro(i) {
    const P = [
      { t: "هذا واديك", p: "أنا أثر، ورفيقك هنا. والوادي ينتظرك." },
      { t: "في كل مكانٍ درس", p: "بيتك، وطريقك، ونبعك، ومسجدك. تدخل المكان فتتعلّم فيه." },

    ];
    const host = document.getElementById("intro");
    if (i >= P.length) {
      host.classList.remove("on");

      World.athar("app.welcome", "hi", 3400);
      this.paint();
      setTimeout(() => this.offerDaily(), 3600);
