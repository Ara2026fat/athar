    }
    const c = P[i];
    host.innerHTML = `<div class="icard">
      <div class="idots">${P.map((_, k) => `<i class="${k === i ? "on" : ""}"></i>`).join("")}</div>
      <h3>${c.t}</h3><p>${c.p}</p>
      <button class="ibtn">${i === P.length - 1 ? "هيّا نبدأ" : "التالي"}</button></div>`;
    host.classList.add("on");
    AtharAudio.bindReadable(host);
    AtharAudio.say("intro." + (i + 1));
    host.querySelector(".ibtn").onclick = () => { AtharAudio.sfx("tap"); this.intro(i + 1); };
  },

  /* ═══ إعداد الصوت السحابي ═══
     للوالد: يُلصق مفتاحًا مرّة، فيعمل الصوت على كل جهاز بلا محرّك نطق. */
  voiceSetup() {
    const host = document.getElementById("nextup");
    const cur = AtharAudio.getKey();
    host.innerHTML = `<div class="ncard">
      <div class="ntag">إعداد الصوت — للوالد</div>
      <p class="ngoal" style="font-size:15px">جهازك بلا محرّك نطق. الصق مفتاح Google TTS ليعمل الصوت على كل جهاز.</p>
      <input id="kbox" type="text" placeholder="AIza..." value="${cur}"
        style="width:100%;margin-top:11px;padding:13px;border:3px solid #DCCDAE;border-radius:14px;
        font:inherit;font-size:15px;direction:ltr;text-align:left">
      <label style="display:flex;gap:10px;align-items:center;margin-top:12px;font-size:15px;min-height:64px">
        <input type="checkbox" id="kremote" style="width:28px;height:28px" ${AtharAudio.cfg.remoteEnabled ? "checked" : ""}>
        <span>السماح بالصوت السحابي للأسطر غير الشرعية (الآيات لا تُرسَل أبدًا)</span></label>
      <div id="kmsg" style="font-size:14px;margin-top:8px;min-height:20px"></div>
      <button class="nbtn" id="ktest">جرّب واحفظ</button>
      <button class="nghost" id="kclose">إغلاق</button></div>`;
    host.classList.add("on");
    const msg = host.querySelector("#kmsg");
    host.querySelector("#kclose").onclick = () => host.classList.remove("on");
    host.querySelector("#kremote").onchange = ev => AtharAudio.setRemote(ev.target.checked);
    host.querySelector("#ktest").onclick = async () => {
      const k = host.querySelector("#kbox").value.trim();
      if (!k) { AtharAudio.setKey(""); msg.textContent = "أُزيل المفتاح."; return; }
      msg.textContent = "يُجرَّب الآن…"; msg.style.color = "#7A6B55";
      const r = await AtharAudio.testKey(k);
      if (r.ok) {
        AtharAudio.setKey(k);
        AtharAudio.setRemote(true); host.querySelector("#kremote").checked = true;   /* مفتاحٌ لصقه الوالد عمدًا */
        msg.textContent = "✓ يعمل — سمعتَ أثر الآن. حُفظ المفتاح.";
        msg.style.color = "#2F6B3E";
        setTimeout(() => host.classList.remove("on"), 2200);
      } else {
        msg.textContent = "✗ لم ينجح: " + r.err;
        msg.style.color = "#B85C78";
      }
    };
  },

  /* ═══ واديي ═══
     ما صنعتَه في وادينا. كل علامةٍ عملٌ فعلتَه، لا نقطةٌ جمعتَها. */
  showValley() {
    const host = document.getElementById("valley");
    const all = Object.values(this.exps);
    const mine = all.filter(e => State.hasMark(e.leaves));
    const rest = all.filter(e => !State.hasMark(e.leaves) && e.stage <= this.stage());
    const M = root.MARKS || {};
    const kept = Object.values(State.data.depth || {}).reduce((s, n) => s + n, 0);
    host.innerHTML = `<div class="vcard">
      <div class="vtag">واديي</div>
      <p class="vlead">${mine.length ? "هذا ما صنعتَه" : "وادينا ينتظرك"}</p>
      <div class="vlist">${mine.map(e =>
        `<div class="vrow"><b>${M[e.leaves] || ""}</b><i>${I18n.txt(e.title)}</i></div>`).join("")
        || `<div class="vempty">أتمِم درسًا ومهمّته، ليظهر أوّل أثرٍ لك</div>`}</div>
      ${kept ? `<div class="vkept">وأعدتَ مهامّك ${kept === 1 ? "مرّة" : kept + " مرّة"}</div>` : ""}
      ${rest.length ? `<div class="vrest">وفي واديك ${rest.length === 1 ? "موضعٌ ينتظر" : rest.length + " مواضعَ تنتظر"}</div>` : ""}
      <button class="vbtn">عُد إلى الوادي</button></div>`;
    host.classList.add("on");
    host.querySelector(".vbtn").onclick = () => { AtharAudio.sfx("tap"); host.classList.remove("on"); };
    host.onclick = e => { if (e.target === host) host.classList.remove("on"); };
    AtharAudio.say(mine.length ? "valley.mine" : "valley.empty");
  },

  /* ═══ الإعدادات ═══ */
  openSettings() {
    const host = document.getElementById("settings");
    host.innerHTML = `<div class="pcard">
      <div class="ptag">الإعدادات</div>
      <button class="srow" id="sParent"><span class="sic">⚙</span> لوحة الوالد</button>
      <button class="pbtn ghost" id="sClose">إغلاق</button></div>`;
    host.classList.add("on");
    host.querySelector("#sParent").onclick = () => { host.classList.remove("on"); this.openParentGate(); };
    host.querySelector("#sClose").onclick = () => host.classList.remove("on");
    host.onclick = e => { if (e.target === host) host.classList.remove("on"); };
  },

  /* ═══ لوحة الوالد ═══
     بوابة حسابية بسيطة، ثم أرقامٌ حقيقية من State فقط — لا شرحٌ تربويّ،
     لوحة تفاعلية بين الوالد والتطبيق. */
  _parentAnswer: 0,
  openParentGate() {
    const host = document.getElementById("parent");
    const a = 2 + Math.floor(Math.random() * 8), b = 2 + Math.floor(Math.random() * 8);
    this._parentAnswer = a + b;
    host.innerHTML = `<div class="pcard pgate">
      <div class="ptag">للوالد فقط</div>
      <h3>${a} + ${b} = ؟</h3>
      <input class="pinput" id="pgin" aria-label="أدخل الجواب" type="number" inputmode="numeric" placeholder="؟">
      <button class="pbtn" id="pgbtn">دخول لوحة الوالد</button>
      <button class="pbtn ghost" id="pgclose">إغلاق</button></div>`;
    host.classList.add("on");
    host.querySelector("#pgbtn").onclick = () => {
      const v = parseInt(host.querySelector("#pgin").value, 10);
      if (v === this._parentAnswer) { AtharAudio.sfx("up"); this.renderParentDashboard(); }
      else { AtharAudio.sfx("no"); this.openParentGate(); }
    };
    host.querySelector("#pgclose").onclick = () => host.classList.remove("on");
    host.onclick = e => { if (e.target === host) host.classList.remove("on"); };
  },

  parentReportText() {
    const w = Review.weekly(), T = e => "«" + I18n.txt(e.title) + "»";
    const list = (a, n = 4) => a.slice(0, n).map(T).join("، ") + (a.length > n ? " وغيرها" : "");
    return `🌿 أثر — ملخّص الأسبوع\n\n` +
      `🌱 ما تعلّمه: ${w.learnedWeek.length ? list(w.learnedWeek) : "لم نبدأ درسًا جديدًا هذا الأسبوع، وهذا لا بأس به"}\n` +
      `🔁 نعيده بلطف: ${w.again.length ? list(w.again, 3) : "لا شيء يحتاج إعادة الآن"}\n` +
      (w.question ? `💬 سؤال للبيت: ${w.question}\n` : "") +
      `\nأُرسل من تطبيق أثر`;
  },
  shareParentReport() {
    const url = "https://wa.me/?text=" + encodeURIComponent(this.parentReportText());
    window.open(url, "_blank");
  },

  /* [v2] كل ما كان على وجه الطفل وهو للوالد: ملاحظة الصوت، حصة اليوم، تفاصيل الدروس، المؤجَّل */
  parentExtraHtml() {
    const all = Object.values(this.exps), M = root.MARKS || {};
    const noVoice = !AtharAudio.hasVoice() && !AtharAudio.getKey();
    const learned = all.filter(e => State.isLearned(e.id));
    const later = (State.data.later || []).map(id => this.exps[id]).filter(e => e && !State.isLearned(e.id));
    const sess = State.sessToday();
    const det = e => `<details class="pdet"><summary>${I18n.txt(e.title)}</summary>
        <div class="pd"><b>تعلّم</b><ul>${(e.learned || []).map(x => `<li>${I18n.txt(x)}</li>`).join("")}</ul>
        <b>المهمّة</b><p>${I18n.txt(this.actOf(e) && this.actOf(e).task)}</p>
        <b>أثر القلب</b><p>${I18n.txt(e.heart)}</p>
        <b>المقصد</b><p>${I18n.txt(e.aim)}</p>
        <b>${(root.DOMAINS || {})[e.domain] || ""} · المرحلة ${e.stage || 1}</b>
        <p class="pref">${e.source || ""}</p></div></details>`;
    return `
      ${noVoice ? `<div class="psec"><h4>🔈 الصوت</h4>
        <p class="pnote">جهازك بلا محرّك نطق، فيعمل التطبيق <b>بلا صوت</b> والدروس كلّها تُقرأ.</p>
        <button class="pbtn" id="pvoice">إعداد الصوت</button></div>` : ""}
      <div class="psec"><h4>🗓 حصة اليوم</h4>
        <p class="pnote">${this.seq ? `دروس اليوم حتى الآن: ${sess ? sess.ids.length : 0}` : "المسار الأساسي غير مفعّل"}</p>
        <label class="pchk"><input type="checkbox" id="pquota" ${State.data.quotaOff ? "checked" : ""}>
          <span>تجاوز حصة اليوم (السماح بدروس أكثر)</span></label></div>
      ${later.length ? `<div class="psec"><h4>⏳ مهامّ أُجِّلت</h4>${later.map(e => `<div class="prow"><span>${I18n.txt(e.title)}</span><i>لم يُتعلَّم بعد</i></div>`).join("")}</div>` : ""}
      ${learned.length ? `<div class="psec"><h4>📖 تفاصيل الدروس المُتمّة</h4>${learned.map(det).join("")}</div>` : ""}`;
  },

  /* [v3·٣] ملخّص الأسبوع بلغة لطيفة: بلا أرقام درجات ولا مقارنات ولا ترتيب */
  parentWeekHtml() {
    const w = Review.weekly(), T = e => I18n.txt(e.title);
    const list = (a, n) => a.slice(0, n).map(e => `<li>${T(e)}</li>`).join("") + (a.length > n ? `<li>وغيرها</li>` : "");
    return `<div class="psec" id="pweek"><h4>🌿 ملخّص الأسبوع</h4>
      <b class="pwh">ما تعلّمه</b>
      ${w.learnedWeek.length ? `<ul class="pwl">${list(w.learnedWeek, 5)}</ul>` : `<p class="pnote">لم نبدأ درسًا جديدًا هذا الأسبوع، وهذا لا بأس به.</p>`}
      <b class="pwh">نعيده بلطف</b>
      ${w.again.length ? `<ul class="pwl">${list(w.again, 3)}</ul>` : `<p class="pnote">لا شيء يحتاج إعادة الآن.</p>`}
      ${w.question ? `<b class="pwh">سؤال للبيت</b><p class="pnote">${w.question}</p>` : ""}
    </div>`;
  },

  /* [v3·٣] حال كل درس مُتعلَّم بأربع كلمات يضبطها الوالد بضغطة؛ تؤثّر في المجدول */
  parentMasteryHtml() {
    const learned = Object.values(this.exps).filter(e => State.isLearned(e.id));
    if (!learned.length) return "";
    const row = e => {
      const m = Review.mastery(e.id);
      return `<div class="mrow" data-id="${e.id}"><div class="mt">${I18n.txt(e.title)}<i class="mwhen">${Review.whenText(e.id)}</i></div>
        <div class="mset" role="group" aria-label="حال الدرس">${Review.WORDS.map((w, v) =>
          `<button type="button" class="mbtn" data-v="${v}" aria-pressed="${m === v}">${w}</button>`).join("")}</div></div>`;
    };
    return `<div class="psec" id="pmastery"><h4>🌱 كيف صارت دروسه؟</h4>
      <p class="pnote">اختر الكلمة التي تصف حاله اليوم؛ بها نعرف متى نعود إلى الدرس.</p>
      <details class="pdet mdet" ${learned.length <= 6 ? "open" : ""}><summary>الدروس (${learned.length})</summary>${learned.map(row).join("")}</details></div>`;
  },
  bindMastery(host) {
    host.querySelectorAll(".mrow").forEach(rw => {
      rw.querySelectorAll(".mbtn").forEach(b => b.onclick = () => {
        const id = rw.dataset.id; Review.setMastery(id, +b.dataset.v);
        rw.querySelectorAll(".mbtn").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
        rw.querySelector(".mwhen").textContent = Review.whenText(id);
        const wk = host.querySelector("#pweek"); if (wk) wk.outerHTML = this.parentWeekHtml();
        const rp = host.querySelector(".preport"); if (rp) rp.textContent = this.parentReportText();
        AtharAudio.sfx("soft");
      });
    });
  },

  renderParentDashboard() {
    const host = document.getElementById("parent");
    const all = Object.values(this.exps);
    const learnedN = State.data.learned.length;
    const actsN = State.data.acts.length;
    const streak = State.data.streak || 0;
    const DAY = 86400000;
    const needsFollowUp = all
      .filter(e => State.isLearned(e.id) && this.actOf(e) && !State.data.acts.includes(e.id))
      .filter(e => (Date.now() - (State.data.learnedAt[e.id] || 0)) > 3 * DAY)
      .sort((a, b) => (State.data.learnedAt[a.id] || 0) - (State.data.learnedAt[b.id] || 0))
      .slice(0, 6);
    const recentActs = Object.entries(State.data.actAt || {})
      .sort((a, b) => b[1] - a[1]).slice(0, 6)
      .map(([id]) => this.exps[id]).filter(Boolean);

    host.innerHTML = `<div class="pcard">
      <div class="ptag">لوحة الوالد</div>
      ${this.parentWeekHtml()}
      ${this.parentMasteryHtml()}
      ${this.parentExtraHtml()}
      <div class="psec">
        <h4>📋 تقرير جاهز للمشاركة</h4>
        <div class="preport">${this.parentReportText()}</div>
        <button class="pbtn" id="pshare">💬 مشاركة عبر واتساب</button>
      </div>

      <div class="psec">
        <h4>🎯 يحتاج متابعة</h4>
        ${needsFollowUp.length
          ? needsFollowUp.map(e => `<div class="prow"><span>${I18n.txt(e.title)}</span><i>لم يُطبَّق بعد</i></div>`).join("")
          : `<div class="pempty">لا يوجد — كل درسٍ فُهم طُبّق أيضًا</div>`}
      </div>

      <div class="psec">
        <h4>✅ آخر ما طُبّق فعليًا</h4>
        ${recentActs.length
          ? recentActs.map(e => `<div class="prow"><span>${I18n.txt(e.title)}</span></div>`).join("")
          : `<div class="pempty">لا يوجد بعد</div>`}
      </div>

      <button class="pbtn danger" id="presetGo">إعادة تعيين كل التقدّم</button>
      <div id="presetConfirm" style="display:none;margin-top:8px">
        <div class="pempty" style="color:#A82A20">سيُحذف كل التقدّم نهائيًا. هل أنت متأكد؟</div>
        <button class="pbtn danger" id="presetYes">نعم، احذف</button>
        <button class="pbtn ghost" id="presetNo">إلغاء</button>
      </div>
      <button class="pbtn ghost" id="pclose">إغلاق</button>
    </div>`;

    this.bindMastery(host);
    host.querySelector("#pshare").onclick = () => this.shareParentReport();
    const qo = host.querySelector("#pquota");
    if (qo) qo.onchange = () => { State.data.quotaOff = qo.checked; State.save(); this.paint(); };
    const vo = host.querySelector("#pvoice");
    if (vo) vo.onclick = () => { host.classList.remove("on"); setTimeout(() => this.voiceSetup(), 300); };
    host.querySelector("#presetGo").onclick = () => {
      host.querySelector("#presetConfirm").style.display = "block";
      host.querySelector("#presetGo").style.display = "none";
    };
    host.querySelector("#presetNo").onclick = () => {
      host.querySelector("#presetConfirm").style.display = "none";
      host.querySelector("#presetGo").style.display = "block";
    };
    host.querySelector("#presetYes").onclick = () => { State.reset(); location.reload(); };
    host.querySelector("#pclose").onclick = () => host.classList.remove("on");
  },

  /* ═══ أثر اليوم ═══
     مهمّةٌ واحدة من درسٍ أتمّه الطفل. يختارها العالم لا الطفل.
     التكرار هو الذي يصنع الأثر، لا الدرس الأوّل. */
  actOf(exp) { return (exp.beats || []).find(b => b.type === "act") || null; },

  dailyPool() {
    return Object.values(this.exps)
      .filter(e => State.isLearned(e.id) && this.actOf(e));
  },

  /* [v3·٢] أثر اليوم يستعمل المجدول: درس واحد مستحقّ (حتى ٢ في اليوم) أو «لا شيء اليوم». */
  offerDaily(o = {}) {
    const id = Review.next();
    if (!id) { if (!o.auto) this.renderDailyNone(); return; }
    this.renderDaily(this.exps[id], false);
  },

  renderDailyNone() {
    const host = document.getElementById("daily");
    host.innerHTML = `<div class="dcard done rvnone"><div class="dtag">أثر اليوم</div>
        <p>لا شيء اليوم… استمتع بالوادي</p>
        <button class="dbtn soft" id="rvgo">إلى الوادي</button></div>`;
    host.classList.add("on");
    World.athar("rev.none", "calm", 3400);
    host.querySelector("#rvgo").onclick = () => host.classList.remove("on");
    host.onclick = e => { if (e.target === host) host.classList.remove("on"); };
  },

  /* مراجعة قصيرة: المهمّة نفسها + «أثر أعمق». لا امتحان ولا درجات ولا «أخطأت». */
  renderDaily(exp, done) {
    const host = document.getElementById("daily");
    const act = this.actOf(exp) || {};
    const n = State.depthOf(exp.id);
    const more = done ? Review.next() : null;
    host.innerHTML = `<div class="dcard${done ? " done" : ""}" data-id="${exp.id}">
        <div class="dtag">${done ? "تمّت مهمّة اليوم" : "أثر اليوم"}</div>
        ${done ? "" : `<div class="dnote2">نعود إلى: ${I18n.txt(exp.title)}</div>`}
        <p>${I18n.txt(act.task)}</p>
        ${done ? `<div class="dnote">${n > 1 ? "وازداد أثرُك عمقًا" : "وتركتَ أثرًا"}</div>
                  ${more ? `<button class="dbtn" id="rvmore">أثرٌ آخر نعود إليه</button>` : ""}
                  <button class="dbtn soft" id="rvgo">إلى الوادي</button>`
               : `<button class="dbtn" id="rvdo">فعلتُها</button>
                  <button class="dbtn soft" id="rvskip">ليس اليوم</button>`}
      </div>`;
    host.classList.add("on");
    AtharAudio.bindReadable(host);
    host.onclick = e => { if (e.target === host) host.classList.remove("on"); };
    if (done) {
      host.querySelector("#rvgo").onclick = () => host.classList.remove("on");
      const mo = host.querySelector("#rvmore");
      if (mo) mo.onclick = () => { AtharAudio.sfx("tap"); this.offerDaily(); };
      return;
    }
    World.athar("daily.offer", "hi", 3400);
    AtharAudio.say(act.audio);
    host.querySelector("#rvdo").onclick = () => {
      AtharAudio.sfx("up");
      const lvl = Review.confirm(exp.id);
      World.deepen(exp.leaves, lvl);
      World.athar(lvl > 1 ? "daily.again" : "daily.done", "joy", 3600);
      this.renderDaily(exp, true);
    };
    host.querySelector("#rvskip").onclick = () => {
      AtharAudio.sfx("soft"); Review.skip(exp.id); host.classList.remove("on");
    };
  },

  /* العالم يعرض نفسه — لا قوائم ولا أسماء أقسام */
  paint() {
    World.render(this.places, p => this.open(p), p => this.status(p));
    const nxt = this.places.find(p => this.nextAt(p));
    if (nxt) World.moveTo(nxt.place);
    this.labels();
    if (State.noteStage(this.stage())) {
      const s = this.stage();
      setTimeout(() => this.stageUp(s), 800);
      setTimeout(() => this.labels(), 2600);
    }
    this.guideWorld(nxt);
  },

  /* في القرية أيضًا: إن سكن الطفل، دلّه العالم ثم أثر */
  guideWorld(nxt) {
    Guide.clear();
    if (!nxt) {                       /* تمّ اليوم كلّه */
      World.phase(2);
      setTimeout(() => World.athar("athar.dayDone", "joy", 4200), 1400);
      return;
    }
    setTimeout(() => {
      if (document.getElementById("panel").classList.contains("up")) return;
      Guide.watch(document.getElementById("app"), ".plabel.ready", "hint.where");
    }, 1200);
  },

  labels() {
    const lay = document.getElementById("labels");
    lay.innerHTML = "";
    const svg = document.querySelector("#scene");
    const box = svg.getBoundingClientRect();
    this.places.forEach(p => {
      const g = svg.querySelector(`.place[data-place="${p.place}"] .halo`);
      if (!g || !this.visible(p)) return;
      const nx = this.nextAt(p);
      const open = !!nx || this.anyDone(p);
      const done = !nx && this.anyDone(p);
      const pt = svg.createSVGPoint();
      pt.x = +g.getAttribute("cx"); pt.y = +g.getAttribute("cy") + (+g.getAttribute("r"));
      const s = pt.matrixTransform(svg.getScreenCTM());
      const d = document.createElement("div");
      d.className = "plabel" + (open ? (done ? " done" : " ready") : " sleep");
      d.style.left = (s.x - box.left) + "px";
      d.style.top = (s.y - box.top) + "px";
      d.textContent = open ? I18n.txt(p.label) : "";
      if (open) d.onclick = () => this.open(p);
      lay.append(d);
    });
  },

  /* أول تجربة متاحة في هذا المكان — هكذا ينمو المكان بلا مبانٍ جديدة */
  nextAt(p) {
    if (this.seq) { const pl = this.plan(); return (pl && pl.kind === "next" && pl.place && pl.place.place === p.place) ? pl.exp : null; }
    const s = this.stage();
    for (const id of (p.exps || [])) {
      const e = this.exps[id];
      if (e && !State.isLearned(id) && e.stage <= s) return e;
    }
    return null;
  },
  stage() { return State.stage(Object.values(this.exps)); },
  /* المكان يظهر في الوادي فقط إن كان فيه درسٌ لمرحلة الطفل.
     فالوادي يتّسع كلّما كبر — بلا تصميمٍ جديد لكل مرحلة. */
  visible(p) {
    const s = this.stage();
    return (p.exps || []).some(id => (this.exps[id] || {}).stage <= s);
  },
  anyDone(p) { return (p.exps || []).some(id => State.isLearned(id)); },

  /* حالة المكان: أظاهرٌ في مرحلته؟ أمفتوحٌ الآن؟ أأُتمّ؟ */
  status(p) {
    const nx = this.nextAt(p), done = this.anyDone(p);
    return { here: this.visible(p), open: !!nx || done, done: !nx && done };
  },

  /* إعادة ما تعلّمه — التكرار مبدأ، لا نقص */
  lastAt(p) {
    const done = (p.exps || []).filter(id => State.isLearned(id));
    return done.length ? this.exps[done[done.length - 1]] : null;
  },

  /* أين الدرس التالي؟ — أوّل مكانٍ فيه درسٌ متاح */
  nextLesson() {
    if (this.seq) { const pl = this.plan(); return (pl && pl.kind === "next" && pl.place) ? { exp: pl.exp, place: pl.place } : null; }
    for (const p of this.places) {
      const e = this.nextAt(p);
      if (e) return { exp: e, place: p };
    }
    return null;
  },

  /* ═══ بطاقة «غدًا» ═══
     بعد استيفاء الحصة: اسم مكان الغد، وتجوّل و«أثر اليوم» فقط — لا درس جديد. */
  showTomorrow(pl) {
    const host = document.getElementById("nextup");
    const hasDaily = this.dailyPool().length > 0;
    host.innerHTML = `<div class="ncard done tomorrow">
      ${giTile(pl.place)}
      <div class="ntag">غدًا</div>
      <h3>${PLACE_AR[pl.place] || ""}</h3>
      <p class="ngoal">نلتقي غدًا في ${PLACE_AR[pl.place] || "الوادي"}</p>
      <button class="nbtn" id="troam">أتجوّل في الوادي</button>
      ${hasDaily ? '<button class="nbtn gold" id="tdaily">أثر اليوم</button>' : ""}</div>`;
    host.classList.add("on");
    World.moveTo(pl.place);
    World.athar(pl.exitAudio, "calm", 3400);
    host.querySelector("#troam").onclick = () => { AtharAudio.sfx("soft"); host.classList.remove("on"); };
    const dl = host.querySelector("#tdaily");
    if (dl) dl.onclick = () => { AtharAudio.sfx("tap"); host.classList.remove("on"); this.offerDaily(); };
  },

  /* أسطر بداية الدرس: سطر اليوم/الوصول (أول درس في الحصة فقط) ثم سطر دخول الدرس */
  openingLines(exp) {
    const pl = this.plan(), out = [];
    if (pl && pl.kind === "next" && pl.exp.id === exp.id && pl.newDay && pl.day.entry) out.push(pl.day.entry);
    const ent = exp.scene && exp.scene.entry && exp.scene.entry.audio;
    if (ent) out.push(ent);
    return out.filter(id => AtharAudio.entry(id));
  },

  /* بلوغ مرحلة: يُقال له ماذا انفتح له */
  stageUp(s) {
    const NAMES = { 2:"الثانية", 3:"الثالثة", 4:"الرابعة" };
    const PL = { home:"بيتي", road:"الطريق", spring:"النبع", hill:"التلّة", masjid:"مسجدي" };
    const opened = this.places.filter(p => this.visible(p) &&
      (p.exps || []).some(id => (this.exps[id] || {}).stage === s));
    const host = document.getElementById("nextup");
    host.innerHTML = `<div class="ncard done">
      <div class="ntag">كبرتَ</div>
      <h3>بلغتَ المرحلة ${NAMES[s] || ""}</h3>
      <p class="ngoal">أتممتَ مرحلتك كلّها، فاتّسع وادينا.</p>
      ${opened.length ? `<div class="nleft">وانفتح لك:</div><div class="girow">${opened.map(p => `<div>${giTile(p.place,1)}${PL[p.place]}</div>`).join("")}</div>` : ""}
      <button class="nbtn">انظر</button></div>`;
    host.classList.add("on");
    AtharAudio.bindReadable(host);
    World.athar("stage." + s, "wow", 4200);
    host.querySelector(".nbtn").onclick = () => {
      AtharAudio.sfx("up"); host.classList.remove("on");
      setTimeout(() => this.showNext(), 700);
    };
  },

  /* ═══ ماذا بعد ═══
     لا يُترك الطفل واقفًا بعد إنجاز درس. يُقال له: التالي هنا. */
  showNext() {
    const host = document.getElementById("nextup");
    const pl = this.plan();
    if (pl && pl.kind === "tomorrow") return this.showTomorrow(pl);
    const n = this.nextLesson();

    if (!n) {
      host.innerHTML = `<div class="ncard done">
        <div class="ntag">تمّ الوادي كلّه</div>
        <p>أتممتَ كل الدروس. وواديك صار كما تراه.</p>
        <button class="nbtn">انظر إلى واديك</button></div>`;
      host.classList.add("on");
      host.querySelector(".nbtn").onclick = () => {
        host.classList.remove("on"); this.showValley();
      };
      return;
    }
    const PL = { home:"بيتي", road:"الطريق", spring:"النبع", hill:"التلّة", masjid:"مسجدي" };
    host.innerHTML = `<div class="ncard">
      ${giTile(n.place.place)}
      <div class="ntag">التالي</div>
      <h3>${I18n.txt(n.exp.title)}</h3>
      <p class="nwhere">في ${PL[n.place.place] || ""}</p>
      <p class="ngoal">${I18n.txt(n.exp.goal)}</p>
      <button class="nbtn">اذهب</button>
      <button class="nghost">أتجوّل في وادي</button></div>`;
    host.classList.add("on");
    AtharAudio.bindReadable(host);
    World.moveTo(n.place.place);
    /* بين درسَي اليوم: «ما زلنا هنا… وعندنا درسٌ آخر» */
    World.athar(pl && pl.second && pl.day.between && AtharAudio.entry(pl.day.between) ? pl.day.between : "next.here", "hi", 3000);
    host.querySelector(".nbtn").onclick = () => {
      AtharAudio.sfx("tap"); host.classList.remove("on"); this.open(n.place);
    };
    host.querySelector(".nghost").onclick = () => {
      AtharAudio.sfx("soft"); host.classList.remove("on");
    };
  },

  open(p) {
    const exp = this.nextAt(p) || this.lastAt(p);
    if (!exp) return;
    const again = !this.nextAt(p);
    const lines = again ? [] : this.openingLines(exp);
    const lead = lines.reduce((t, id) => t + Math.min(3400, 900 + I18n.txt({ ar: (AtharAudio.entry(id) || {}).text }).length * 70), 0);
    Guide.clear();
    World.hush();
    World.moveTo(p.place);
    if (exp.phase != null) World.phase(exp.phase);
    if (again) World.athar("athar.again", "hi", 2200);
    else {   /* سطر اليوم ثم سطر الدخول، متتابعين، قبل بطاقة الافتتاح */
      let at = 1700;
      lines.forEach(id => {
        const ms = Math.min(3400, 900 + I18n.txt({ ar: (AtharAudio.entry(id) || {}).text }).length * 70);
        window.__R3op = (window.__R3op || 0) + 1; setTimeout(() => { window.__R3op--; World.athar(id, "hi", ms); }, at); at += ms;
      });
    }
    const dayNo = this.seq && this.seq.dayOf[exp.id] != null ? this.seq.days[this.seq.dayOf[exp.id]].day : 0;
    Director.onEnded = again ? null : id => State.noteSession(id, dayNo);
    setTimeout(() => Director.run(exp, done => {
      this.paint();
      if (done) setTimeout(() => this.showNext(), 900);
    }), again ? 1600 : (lines.length ? 1700 + lead : 700));
  }
};

root.App = App;
addEventListener("resize", () => App.places.length && App.labels());
})(window);

</script>

oice":"narrator","text":"أحسِن اليوم إلى طفلٍ فقد أباه أو أمّه، أو ادعُ له في نفسك."},"goal.seerah.yateem":{"voice":"narrator","text":"سنعرف كيف نشأ نبيّنا صلى الله عليه وسلم، ومن كفله بعد أبيه وأمّه."},"end.seerah.yateem":{"voice":"narrator","text":"تعلّمتَ اليوم: وُلد في مكّة في عام الفيل، وتوفّي أبوه وهو حمل، وأمّه وهو ابن ست، فكفله جدّه عبد المطلب، ثم عمّه أبو طالب."},"src.ark.hadith":{"voice":"sacred","text":"والدليل حديث جبريل المشهور عند مسلم، قَالَ جبريل للنبي ﷺ: «فأخبرني عن الإيمان»، قَالَ: «أن تؤمن بالله، وملائكته، وكتبه، ورسله، واليوم الآخر، وتؤمن بالقدر خيره وشرّه».","ref":"رواه مسلم — ص ٦"},"src.qad.ayah":{"voice":"sacred","text":"قال تَعَالَى: ﴿إِنَّا كُلَّ شَيْءٍ خَلَقْنَاهُ بِقَدَرٍ﴾ وهو على أربع مراتب: العلم، والكتابة في اللوح المحفوظ، والمشيئة، والخلق.","ref":"القمر: ٤٩ — ص ٧"},"src.yat.full":{"voice":"sacred","text":"وُلد ﷺ في عام الفيل، في يوم الإثنين من شهر ربيع الأوّل، في مكّة. تُوفّي أبوه في المدينة وهو حملٌ في بطن أمّه. ومن مرضعاته حليمة السعديّة. توفّيت أمّه وهو ابن ست سنين، وكفله جدّه عبد المطلب. ثم توفّي جدّه وهو ابن ثمان سنين، وكفله عمّه أبو طالب.","ref":"السيرة النبوية — ص ٢٨"},"athar.feel.open":{"voice":"athar","text":"جيشٌ أراد هدم الكعبة… فماذا حدث؟"},"athar.feel.flock":{"voice":"athar","text":"حلّق سربٌ فوق وادينا"},"q.feel.tap":{"voice":"narrator","text":"خمس آياتٍ قصيرة. المس كل آية لتسمع معناها."},"taf.feel.1":{"voice":"narrator","text":"ألم تعلم كيف فعل ربّك بأصحاب الفيل حين أرادوا هدم الكعبة؟"},"taf.feel.2":{"voice":"narrator","text":"لقد جعل الله تدبيرهم السيّئ لهدمها في ضياع، فما نالوا ما تمنّوه."},"taf.feel.3":{"voice":"narrator","text":"وبعث عليهم طيرًا أتتهم جماعاتٍ جماعات."},"taf.feel.4":{"voice":"narrator","text":"ترميهم بحجارةٍ من طينٍ متحجّر."},"taf.feel.5":{"voice":"narrator","text":"فجعلهم الله كورق زرعٍ أكلته الدوابّ وداسته."},"tad.quran.feel":{"voice":"narrator","text":"جيشٌ كامل ومعه الفيَلة، ردّه الله بطيرٍ صغير. فما أصغرَ القوّة إذا أرادها الله."},"act.feel":{"voice":"narrator","text":"إذا خفتَ اليوم من شيء، تذكّر أصحاب الفيل وقل: حسبي الله."},"goal.quran.feel":{"voice":"narrator","text":"سنقرأ سورة الفيل ونعرف كيف حمى الله بيته."},"end.quran.feel":{"voice":"narrator","text":"تعلّمتَ اليوم: أراد أصحاب الفيل هدم الكعبة، فجعل الله تدبيرهم في ضياع، وبعث عليهم طيرًا ترميهم بحجارةٍ من طين، فجعلهم كورق زرعٍ أكلته الدوابّ."},"athar.bid.open":{"voice":"athar","text":"سؤالٌ يحتاج تفكيرًا…"},"athar.bid.compass":{"voice":"athar","text":"ظهرت بوصلةٌ في وادينا"},"q.bid.extra":{"voice":"narrator","text":"ما رأيك؟"},"sit.bid":{"voice":"narrator","text":"ولدٌ يحبّ الله كثيرًا، فقال: سأُصلّي الفجر خمس ركعات بدل ركعتين، فهذا أكثر أجرًا."},"out.bid.more":{"voice":"narrator","text":"نيّته طيّبة، لكنّ العبادة تُؤخذ كما عُلِّمناها، لا كما نحبّ."},"out.bid.same":{"voice":"narrator","text":"أحسنت، فالعمل المحدَث مردود ولو حسُنت النيّة."},"q.bid.benefits":{"voice":"narrator","text":"فائدتان من الحديث. اكتشفهما."},"rev.bid.1":{"voice":"narrator","text":"النهي عن الابتداع في الدين."},"rev.bid.2":{"voice":"narrator","text":"وأنّ الأعمال المحدَثة مردودة غير مقبولة."},"tad.hadith.bidah":{"voice":"narrator","text":"الله لم يتركك تخترع طريقك إليه، بل رسمه لك ودلّك عليه. فأيّ رحمةٍ أعظم؟"},"act.bid":{"voice":"narrator","text":"إذا أردتَ عبادةً اليوم، اسأل أباك أو أمّك: هل فعلها النبي صلى الله عليه وسلم هكذا؟"},"goal.hadith.bidah":{"voice":"narrator","text":"سنعرف لماذا نعبد الله كما علّمنا نبيّه، لا كما نحبّ نحن."},"end.hadith.bidah":{"voice":"narrator","text":"تعلّمتَ اليوم: من أحدث في أمرنا هذا ما ليس منه فهو ردّ، وفيه النهي عن الابتداع، وأنّ الأعمال المحدَثة مردودة."},"athar.ark2.open":{"voice":"athar","text":"ماذا نفعل داخل الصلاة بالترتيب؟"},"athar.ark2.mat":{"voice":"athar","text":"فُرش سجّادٌ في مسجدنا"},"q.ark2.order":{"voice":"narrator","text":"رتّب ما تفعله في الركعة، من أوّلها."},"say.ark2.1":{"voice":"narrator","text":"القيام"},"say.ark2.2":{"voice":"narrator","text":"تكبيرة الإحرام: الله أكبر"},"say.ark2.3":{"voice":"narrator","text":"قراءة الفاتحة"},"say.ark2.4":{"voice":"narrator","text":"ال :"قل دعاء الركوب اليوم حين تركب السيّارة، ولو همسًا."},"goal.adab.rukub":{"voice":"narrator","text":"سنتعلّم ماذا نقول حين نركب السيّارة أو الدابّة."},"end.adab.rukub":{"voice":"narrator","text":"تعلّمتَ اليوم: تقول بسم الله، الحمد لله، ثم سبحان الذي سخّر لنا هذا، وإذا مررتَ بمسلمٍ ألقيتَ عليه السلام."},"rec.feel.1":{"voice":"quran","text":"أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَابِ الْفِيلِ","ref":"الفيل: 1","file":"https://everyayah.com/data/Husary_Muallim_128kbps/105001.mp3"},"rec.feel.2":{"voice":"quran","text":"أَلَمْ يَجْعَلْ كَيْدَهُمْ فِي تَضْلِيلٍ","ref":"الفيل: 2","file":"https://everyayah.com/data/Husary_Muallim_128kbps/105002.mp3"},"rec.feel.3":{"voice":"quran","text":"وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ","ref":"الفيل: 3","file":"https://everyayah.com/data/Husary_Muallim_128kbps/105003.mp3"},"rec.feel.4":{"voice":"quran","text":"تَرْمِيهِم بِحِجَارَةٍ مِّن سِجِّيلٍ","ref":"الفيل: 4","file":"https://everyayah.com/data/Husary_Muallim_128kbps/105004.mp3"},"rec.feel.5":{"voice":"quran","text":"فَجَعَلَهُمْ كَعَصْفٍ مَّأْكُولٍ","ref":"الفيل: 5","file":"https://everyayah.com/data/Husary_Muallim_128kbps/105005.mp3"},"src.feel.full":{"voice":"sacred","text":"سورة الفيل: أراد أصحاب الفيل هدم الكعبة، فجعل الله تدبيرهم في ضياع، وأرسل عليهم طيرًا جماعاتٍ ترميهم بحجارةٍ من طينٍ متحجّر، فجعلهم كورق زرعٍ أكلته الدوابّ وداسته.","ref":"التفسير — ص ٣٧"},"src.bid.hadith":{"voice":"sacred","text":"عن أمّ المؤمنين عائشة رضي الله عنها قالت: قال رسول الله ﷺ: «من أحدثَ في أمرِنا هذا ما ليس منه، فهو ردٌّ».","ref":"رواه البخاري ومسلم — ص ٤٢"},"src.ark2.tama":{"voice":"sacred","text":"والطمأنينة: وهي السكون في كل ركنٍ فعلي. لقوله ﷺ: «ثم اسجد حتى تطمئنّ ساجدًا، ثم ارفع حتى تطمئنّ جالسًا».","ref":"متفق عليه — ص ١٩"},"src.ruk.ayah":{"voice":"sacred","text":"أقول: «بسم الله، الحمد لله»، ﴿سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَٰذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ ١٣ وَإِنَّا إِلَىٰ رَبِّنَا لَمُنقَلِبُونَ ١٤﴾","ref":"الزخرف: ١٣–١٤ — ص ٥٥"},"athar.msj.open":{"voice":"athar","text":"وأن حجّ قصد البيت الحرام لأعمالٍ مخصوصة، وأركانه أربعة: الإحرام، والوقوف بعرفة، وطواف الإفاضة، والسعي بين الصفا والمروة."},"src.sawm.sunan":{"voice":"sacred","text":"من سنن الصيام: تعجيل الفطر، والسحور وتأخيره، والزيادة في أعمال الخير والعبادة، وقول الصائم إذا شُتم: «إنّي صائم»، والدعاء عند الفطر، والفطر على رطبٍ أو تمر فإن لم يجد فعلى ماء.","ref":"ص ٢٥"},"src.sawm.fadl":{"voice":"sacred","text":"عن أبي سعيد الخدري رضي الله عنه قال: قال رسول الله ﷺ: «ما من عبدٍ يصوم يومًا في سبيل الله، إلا باعد الله بذلك اليوم وجهه عن النار سبعين خريفًا». ومعنى «سبعين خريفًا» أي: سبعين سنة.","ref":"متفق عليه — ص ٢٥"},"src.hajj.def":{"voice":"sacred","text":"الحجّ: هو التعبّد لله تَعَالَى بقصد بيته الحرام لأعمالٍ مخصوصة في وقتٍ مخصوص. وأركانه: الإحرام، والوقوف بعرفة، وطواف الإفاضة، والسعي بين الصفا والمروة.","ref":"ص ٢٥"},"src.hajj.hadith":{"voice":"sacred","text":"عن أبي هريرة رضي الله عنه قال: سمعت رسول الله ﷺ يقول: «من حجّ للهِ فلم يرفُثْ ولم يفسُقْ، رجع كيوم ولدته أمّه». أي: بغير ذنب.","ref":"رواه البخاري — ص ٢٥"},"athar.hubb.open":{"voice":"athar","text":"ميزانٌ واحد… يكفيك مع كل الناس"},"athar.hubb.trees":{"voice":"athar","text":"نبتت شجرتان متجاورتان"},"q.hubb.prize":{"voice":"narrator","text":"ماذا يقول قلبك؟"},"sit.hubb":{"voice":"narrator","text":"فاز صاحبك بجائزةٍ كنتَ تتمنّاها أنت."},"out.hubb.envy":{"voice":"narrator","text":"وهل تحبّ أن يقول أحدٌ هذا عنك إذا فزتَ أنت؟"},"out.hubb.joy":{"voice":"narrator","text":"وهذا من كمال الإيمان."},"q.hubb.benefits":{"voice":"narrator","text":"فائدتان من الحديث."},"rev.hubb.1":{"voice":"narrator","text":"على المؤمن أن يحبّ للمؤمنين من الخير كما يحبّ لنفسه."},"rev.hubb.2":{"voice":"narrator","text":"وذلك من كمال الإيمان."},"tad.hadith.hubb":{"voice":"narrator","text":"ميزانٌ واحد يكفيك عمرك كلّه: ما أحببتَه لنفسك، أحبّه لأخيك."},"act.hubb":{"voice":"narrator","text":"افرح اليوم لأحدٍ نال خيرًا، وادعُ له في نفسك."},"goal.hadith.hubb":{"voice":"narrator","text":"سنعرف ميزانًا واحدًا نقيس به معاملتنا لكل الناس."},"end.hadith.hubb":{"voice":"narrator","text":"تعلّمتَ اليوم: لا يؤمن أحدكم حتى يحبّ لأخيه ما يحبّ لنفسه، وذلك من كمال الإيمان."},"athar.kanz.open":{"voice":"athar","text":"كلمةٌ قصيرة… سمّاها النبي كنزًا"},"athar.kanz.gem":{"voice":"athar","text":"لمعت جوهرةٌ في وادينا"},"q.kanz.hard":{"voice":"narrator","text":"ماذا تقول؟"},"sit.kanz":{"voice":"narrator","text":"أمامك واجبٌ صعب، جلستَ إليه مرّتين ولم تفهمه، وتعبتَ."},"out.kanz.give":{"voice":"narrator","text":"اعتمدتَ على قوّتك وحدها، فانتهت. وهناك من لا تنتهي قوّته."},"out.kanz.say":{"voice":"narrator","text":"تبرّأتَ من حولك وقوّتك، واعتمدتَ على الله وحده."},"q.kanz.benefits":{"voice":"narrator","text":"فائدتان من الحديث."},"rev.kanz.1":{"voice":"narrator","text":"فضل هذه الكلمة، وأنها كنزٌ من كنوز الجنّة."},"rev.kanz.2":{"voice":"narrator","text":"تبرّؤ العبد من حوله وقوّته، واعتماده على الله تعالى وحده."},"tad.hadith.kanz":{"voice":"narrator","text":"سبع كلماتٍ تقولها في ثانية، وهي كنزٌ مدّخرٌ لك في الجنّة."},"act.kanz":{"voice":"narrator","text":"قلها اليوم حين يصعب عليك شيء، ثم حاول مرّة أخرى."},"goal.hadith.kanz":{"voice":"narrator","text":"سنعرف كلمةً قصيرة سمّاها النبي صلى الله عليه وسلم كنزًا من كنوز الجنّة."},"end.hadith.kanz":{"voice":"narrator","text":"تعلّمتَ اليوم: لا حول ولا قوّة إلا بالله كنزٌ من كنوز الجنّة، وفيها تبرّؤ العبد من حوله وقوّته، واعتماده على الله وحده."},"src.hubb.hadith":{"voice":"sacred","text":"عن أنس رضي الله عنه قال: قال رسول الله ﷺ: «لا يؤمنُ أحدُكم حتى يحبَّ لأخيه ما يحبُّ لنفسه».","ref":"رواه البخاري ومسلم — ص ٤٤"},"src.kanz.hadith":{"voice":"sacred","text":"عن أبي موسى رضي الله عنه قال: قال رسول الله ﷺ: «لا حولَ ولا قوّةَ إلا بالله كنزٌ من كنوز الجنّة».","ref":"رواه البخاري ومسلم — ص ٤٤"},"athar.was.open":{"voice":"athar","text":"ذهب عنّا… لكنّه لم يتركنا"},"athar.was.torch":{"voice":"athar","text":"أُضيء مشعلٌ في وادينا"},"n.was.death":{"voice":"narrator","text":"تُوفّي نبيّنا صلى الله عليه وسلم في شهر ربيع الأوّل، من السنة الحادية عشرة من الهجرة، وله من العمر ثلاثٌ وستّون سنة."},"q.was.left":{"voice":"narrator","text":"لكنّه لم يتركنا في ظلام. المس لتعرف ماذا ترك."},"rev.was.1":{"voice":"narrator","text":"ترك أمّته على المحجّة البيضاء، أي الطريق الواضح."},"rev.was.2":{"voice":"narrator","text":"ليلها كنهارها، لا يزيغ عنها إلا هالك."},"rev.was.3":{"voice":"narrator","text":"ما ترك خيرًا إلا دلّ الأمّة عليه."},"rev.was.4":{"voice":"narrator","text":"ولا شرًّا إلا حذّرها منه."},"q.was.lost":{"voice":"narrator","text":"ماذا تصنع؟"},"sit.was":{"voice":"narrator","text":"سألك صاحبك عن أمرٍ في دينك، ولم تعرف جوابه."},"out.was.guess":{"voice":"narrator","text":"والطريق واضح، فلا تُظلِمه بظنّك. اسأل من يعلم."},"out.was.ask":{"voice":"narrator","text":"أحسنت، فالمحجّة بيضاء ومن سألها وجدها."},"tad.seerah.wasiyyah":{"voice":"narrator","text":"ما تركك حائرًا يومًا، ما من خيرٍ إلا دلّك عليه، ولا شرٍّ إلا حذّرك منه."},"act.was":{"voice":"narrator","text":"اسأل اليوم عن أمرٍ في دينك لا تعرفه، ولا تسكت عن جهلك."},"goal.seerah.wasiyyah":{"voice":"narrator","text":"سنعرف متى تُوفّي نبيّنا صلى الله عليه وسلم، وعلى ماذا ترك أمّته."},"end.seerah.wasiyyah":{"voice":"narrator","text":"تعلّمتَ اليوم: تُوفّي في ربيع الأوّل من السنة الحادية عشرة وله ثلاث وستّون سنة، وترك أمّته على المحجّة البيضاء ليلها كنهارها."},"athar.sab.open":{"voice":"athar","text":"أوّل ما تفتح عينيك…"},"athar.sab.sun":{"voice":"athar","text":"أشرقت شمسٌ على وادينا"},"q.sab.order":{"voice":"narrator","text":"صباحك يبدأ. رتّب ما تفعل."},"say.sab.1":{"voice":"narrator","text":"بسم الله، قبل الوضوء"},"say.sab.2":{"voice":"narrator","text":"أشهد أن لا إله إلا الله، بعد الوضوء"},"say.sab.3":{"voice":"narrator","text":"بسم الله، توكّلت على الله، عند الخروج"},"tad.adhkar.sabah":{"voice":"narrator","text":"نمتَ ولا تدري أتستيقظ، فأوّل ما تفتح عينيك، هي نعمةٌ لم تكن لك."},"act.sab":{"voice":"narrator","text":"قل بسم الله غدًا قبل وضوئك، والذكر بعده، قبل أن تفعل شيئًا آخر."},"goal.adhkar.sabah":{"voice":"narrator","text":"سنتعلّم ما نقوله حين نستيقظ، وقبل الوضوء وبعده."},"end.adhkar.sabah":{"voice":"narrator","text":"تعلّمتَ اليوم: قبل الوضوء بسم الله، وبعده أشهد أن لا إله إلا الله وحده لا شريك له وأشهد أن محمدًا عبده ورسوله، وعند الخروج بسم الله توكّلت على الله."},"athar.haya.open":{"voice":"athar","text":"ما الذي يمنعك حين لا يراك أحد؟"},"athar.haya.veil":{"voice":"athar","text":"ارتفع سترٌ على وادينا"},"q.haya.why":{"voice":"narrator","text":"ماذا يمنعك؟"},"sit.haya":{"voice":"narrator","text":"أردتَ أن تفعل شيئًا تعرف أنه لا يصحّ، ثم توقّفت."},"out.haya.people":{"voice":"narrator","text":"فماذا تفعل إذا غاب الناس كلّهم؟ رقيبُك يجب أن يكون أقوى من عيونهم."},"out.haya.allah":{"voice":"narrator","text":"وهذا رقيبٌ لا يغيب، ولا ينام، ولا يُخدع."},"q.haya.three":{"voice":"narrator","text":"ثلاثة يراها الله وحده. المسها."},"rev.haya.1":{"voice":"narrator","text":"نيّتك التي لم تُخبر بها أحدًا، يعلمها الله."},"rev.haya.2":{"voice":"narrator","text":"عملك في الخلوة حيث لا عين تراك، يراه الله."},"rev.haya.3":{"voice":"narrator","text":"وما تكسب غدًا، لا يعلمه إلا الله، فهو وحده عالم الغيب."},"tad.akhlaq.haya":{"voice":"narrator","text":"أن تستحيي من الناس أدبٌ، وأن تستحيي من الله إيمان."},"act.haya":{"voice":"narrator","text":"اترك اليوم شيئًا كنتَ ستفعله سرًّا، واتركه لله وحده."},"goal.akhlaq.haya":{"voice":"narrator","text":"سنعرف ما الذي يمنع المسلم من القبيح حتى لو لم يره أحد."},"end.akhlaq.haya":{"voice":"narrator","text":"تعلّمتَ اليوم: الأمانة في حفظ حقوق الله وحقوق الخلق، ولا يعلم الغيب إلا الله وحده، فهو يراك حيث لا يراك أحد."},"athar.mal.open":{"voice":"athar","text":"حولك خلقٌ لا تراه"},"athar.mal.glow":{"voice":"athar","text":"سطع نورٌ فوق التلّة"},"q.mal.touch":{"voice":"narrator","text":"خلقٌ لا تراه بعينك. المس لتعرف."},"rev.mal.1":{"voice":"narrator","text":"خلقهم الله من نور. قال النبي صلى الله عليه وسلم: خُلقت الملائكة من نور."},"rev.mal.2":{"voice":"narrator","text":"لعبادته وللانقياد التامّ لأمره."},"rev.mal.3":{"voice":"narrator","text":"منهم جبريل، الذي ينزل بالوحي على الأنبياء."},"tad.aqeedah.malaikah":{"voice":"narrator","text":"خلقٌ لا يعصون الله ما أمرهم، وأنت ترا  قال تَعَالَى: ﴿فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ﴾","ref":"البقرة: ١٥٢ — ص ٧٩"},"src.dua.ayah":{"voice":"sacred","text":"الدعاء هو من أعظم الطاعات وأجلّ القربات. قال تَعَالَى: ﴿وَقَالَ رَبُّكُمُ ادْعُونِي أَسْتَجِبْ لَكُمْ﴾. وقال النبي ﷺ: «الدعاءُ هو العبادة».","ref":"غافر: ٦٠ · رواه أبو داود والترمذي وابن ماجه — ص ٨١"},"src.ghi.hadith":{"voice":"sacred","text":"عن أبي هريرة رضي الله عنه، أنّ رسول الله ﷺ مرّ على صُبرة طعام، فأدخل يده فيها، فنالت أصابعه بللًا، فقال: «ما هذا يا صاحب الطعام؟» قال: أصابته السماء يا رسول الله. قال: «أفلا جعلتَه فوق الطعام كي يراه الناس؟ من غشّ فليس منّي».","ref":"رواه مسلم — ص ٧٩"},"athar.mub.open":{"voice":"athar","text":"حين ترى من ابتُلي بشيء…"},"athar.mub.shelter":{"voice":"athar","text":"ارتفع ظلٌّ يستر وادينا"},"q.mub.see":{"voice":"narrator","text":"ماذا تفعل؟"},"sit.mub":{"voice":"narrator","text":"رأيتَ ولدًا لا يستطيع المشي كما تمشي أنت، ونظر إليك."},"out.mub.stare":{"voice":"narrator","text":"وأنت لا تدري: لعلّه أقرب إلى الله منك، وابتلاؤه رفعةٌ له."},"out.mub.kind":{"voice":"narrator","text":"أحسنت، وتقولها في نفسك لا تُسمعه إيّاها فتؤذيه."},"q.mub.more":{"voice":"narrator","text":"وأذكارٌ أخرى لمواقف تمرّ بك."},"rev.mub.1":{"voice":"narrator","text":"تقول: سبحان الذي يُسبّح الرعد بحمده، والملائكة من خيفته."},"rev.mub.2":{"voice":"narrator","text":"إذا رأى أحدكم من أخيه أو من نفسه أو من ماله ما يعجبه، فليدعُ له بالبركة."},"tad.adhkar.mubtala":{"voice":"narrator","text":"عافيتُك ليست لأنّك أفضل، بل لأنّ الله تفضّل. فاحمده، ولا تفخر."},"act.mub":{"voice":"narrator","text":"إن رأيتَ اليوم مبتلًى، فأحسِن إليه ولا تُشعره بشيء، واحمد الله في نفسك."},"goal.adhkar.mubtala":{"voice":"narrator","text":"سنتعلّم ماذا نقول وماذا لا نفعل حين نرى من ابتُلي بشيء."},"end.adhkar.mubtala":{"voice":"narrator","text":"تعلّمتَ اليوم: إذا رأيتَ مبتلًى قلتَ الحمد لله الذي عافاني ممّا ابتلاك به وفضّلني على كثيرٍ ممّن خلق تفضيلًا، وتقولها في نفسك."},"athar.sal.open":{"voice":"athar","text":"كيف نُهدي سلامنا لنبيّنا؟"},"athar h.com/data/Husary_Muallim_128kbps/101008.mp3"},"src.mub.dua":{"voice":"sacred","text":"الدعاء إذا رأيت مبتلًى: «الحمد لله الذي عافاني ممّا ابتلاك به، وفضّلني على كثيرٍ ممّن خلق تفضيلًا».","ref":"رواه الترمذي — ص ٧٦"},"src.sal.sigha":{"voice":"sacred","text":"«اللهُمَّ صَلِّ عَلَىٰ مُحَمَّدٍ وَعَلَىٰ آلِ مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلَىٰ إِبْرَاهِيمَ وَعَلَىٰ آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ، اللهُمَّ بَارِكْ عَلَىٰ مُحَمَّدٍ وَعَلَىٰ آلِ مُحَمَّدٍ، كَمَا بَارَكْتَ عَلَىٰ إِبْرَاهِيمَ وَعَلَىٰ آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ».","ref":"متفق عليه — ص ٧٦"},"src.qar.full":{"voice":"sacred","text":"سورة القارعة: يوم يكون الناس كالفراش المبثوث، وتكون الجبال كالعهن المنفوش، فأمّا من ثقلت موازينه فهو في عيشةٍ راضية، وأمّا من خفّت موازينه فأمّه هاوية، وما أدراك ما هيه، نارٌ حامية.","ref":"القارعة: ١–١١ — ص ٣٤"},"src.has.hadith":{"voice":"sacred","text":"في الحديث: «إذا رأى أحدُكم من أخيه، أو من نفسه، أو من ماله ما يعجبه، فليدعُ له بالبركة، فإنّ العينَ حقّ».","ref":"رواه أحمد وابن ماجه — ص ٧٦"},"src.ras.ayah":{"voice":"sacred","text":"الأدب مع الرسول ﷺ: طاعته فيما أمر، وتصديقه فيما أخبر، وعدم معصيته، ولا يُعبد الله إلا بما شرع وهو الاقتداء بالسنّة وترك البدعة. قال تَعَالَى: ﴿مَّن يُطِعِ الرَّسُولَ فَقَدْ أَطَاعَ اللَّهَ﴾. وقال سبحانه: ﴿وَمَا يَنطِقُ عَنِ الْهَوَىٰ ٣ إِنْ هُوَ إِلَّا وَحْيٌ يُوحَىٰ ٤﴾","ref":"النساء: ٨٠ · النجم: ٣–٤ — ص ٤٨"},"athar.ahk.open":{"voice":"athar","text":"كلّ فعلٍ تفعله… له لونٌ من خمسة"},"athar.ahk.prism":{"voice":"athar","text":"انكسر الضوء ألوانًا"},"q.ahk.five":{"voice":"narrator","text":"خمسة أحكام. المس كلًّا لتعرف أثره."},"rev.ahk.1":{"voice":"narrator","text":"ما هو على وجه اللزوم، مثل الصلوات الخمس وصيام رمضان وبرّ الوالدين. يُثاب فاعله ويُعاقب تاركه."},"rev.ahk.2":{"voice":"narrator","text":"ما ليس على وجه اللزوم، مثل السنن الرواتب وقيام الليل وإطعام الطعام والسلام. يُثاب فاعله ولا يُعاقب تاركه."},"rev.ahk.3":{"voice":"narrator","text":"ما تركه لازم، مثل ترك الصلاة وشرب الخمر وعقوق الوالدين وقطع الأرحام. يُثاب تاركه ويُعاقب فاعله."},"rev.ahk.4":{"voice":"narrator","text":"تركه غير لازم، مثل الأخذ والإعطاء باليد الشمال، وكفّ الثوب في الصلاة. يُثاب تاركه ولا يُعاقب فاعله."},"rev.ahk.5":{"voice":"narrator","text":"وهو على التخيير بين تركه وفعله، مثل أكل التفاحة وشرب الشاي. لا يُثاب تاركه ولا يُعاقب فاعله."},"q.ahk.which":{"voice":"narrator","text":"ما حكم هذا؟"},"sit.ahk":{"voice":"narrator","text":"صاحبك يتركُ صلاةَ الفجر أحيانًا ويقول: هي مستحبّة كقيام الليل."},"out.ahk.wrong":{"voice":"narrator","text":"الصلوات الخمس واجبة يُعاقب تاركها. وقيام الليل مستحبّ لا يُعاقب تاركه. فرقٌ كبير."},"out.ahk.right":{"voice":"narrator","text":"أحسنت، الواجب يُعاقب تاركه، والمستحبّ لا."},"n.ahk.badir":{"voice":"narrator","text":"وينبغي للمسلم إذا سمع أنّ هذا الأمر سنّةٌ أو مستحبّ أن يبادر إلى فعله، والاقتداء بالنبي صلى الله عليه وسلم."},"tad.misc.ahkam":{"voice":"narrator","text":"خمسة ألوانٍ تفرز بها كلّ فعلٍ في عمرك، فلا تقف حائرًا بعد اليوم."},"act.ahk":{"voice":"narrator","text":"اختر ثلاثة أفعالٍ من يومك، واسأل أباك: ما حكم كلٍّ منها؟"},"goal.misc.ahkam":{"voice":"narrator","text":"سنعرف الأحكام الخمسة التي يُصنَّف بها كل فعل."},"end.misc.ahkam":{"voice":"narrator","text":"تعلّمتَ اليوم: الواجب يُثاب فاعله ويُعاقب تاركه، والمستحبّ يُثاب فاعله ولا يُعاقب تاركه، والمحرّم يُثاب تاركه ويُعاقب فاعله، والمكروه يُثاب تاركه ولا يُعاقب فاعله، والمباح لا هذا ولا ذاك."},"athar.fiq.open":{"voice":"athar","text":"لماذا نتعلّم ديننا؟"},"athar.fiq.lamp":{"voice":"athar","text":"أُضيء مصباحٌ فوق كتاب"},"q.fiq.touch":{"voice":"narrator","text":"ماذا يُصلح فيك التفقّه؟ المس لتعرف."},"rev.fiq.1":{"voice":"narrator","text":"صحّة الأقوال: فتعرف ما تقوله، ولا تتكلّم في دين الله بجهل."},"rev.fiq.2":{"voice":"narrator","text":"صحّة الأعمال: فتعبد الله كما أمر، لا كما تظنّ."},"rev.fiq.3":{"voice":"narrator","text":"صحّة الاعتقادات: فتعرف ربّك بأسمائه وصفاته كما يليق به."},"q.fiq.ask":{"voice":"narrator","text":"ماذا تفعل؟"},"sit.fiq":{"voice":"narrator","text":"مرّ بك سؤالٌ في دينك لم تعرف جوابه، وأنت مشغولٌ بلعبةٍ تحبّها."},"out.fiq.later":{"voice":"narrator","text":"ومن يُرد الله به خيرًا يُفقّهه في الدين. فلا تؤجّل خيرًا أُريد بك."},"out.fiq.now":{"voice":"narrator","text":"أحسنت، وهذه علامةُ خيرٍ أراده الله بك."},"tad.misc.fiqh":{"voice":"narrator","text":"جلوسُك الآن لتفهم دينك، هو خيرٌ أراده الله بك قبل أن تريده أنت."},"act.fiq":{"voice":"narrator","text":"اسأل اليوم سؤالًا واحدًا في دينك، واعرف جوابه قبل أن تنام."},"goal.misc.fiqh":{"voice":"narrator","text":"سنعرف ثمرة التفقّه في الدين، وفضله."},"end.misc.fiqh":{"voice":"narrator","text":"تعلّمتَ اليوم: ثمرة التفقّه صحّة الأقوال والأعمال والاعتقادات، بما يُثمر السعادة في الدنيا والآخرة، ومن يُرد الله به خيرًا يُفقّهه في الدين."},"athar.ayy.open":{"voice":"athar","text":"في سنتك أوقاتٌ أفضل من غيرها"},"athar.ayy.cal":{"voice":"athar","text":"ظهر تقويمٌ في وادينا"},"q.ayy.four":{"voice":"narrator","text":"أوقاتٌ فضّلها الله. المسها."},"rev.ayy.1":{"voice":"narrator","text":"عيد الفطر وعيد الأضحى. قال النبي صلى الله عليه وسلم: إنّ الله قد أبدلكم بهما خيرًا منهما: يوم الأضحى ويوم الفطر."},"rev.ayy.2":{"voice":"narrator","text":"شهر رمضان."},"rev.ayy.3":{"voice":"narrator","text":"يوم الجمعة."},"rev.ayy.4":{"voice":"narrator","text":"وما سوى العيدين من الأعياد فمن البدع."},"q.ayy.friday":{"voice":"narrator","text":"ماذا تصنع؟"},"sit.ayy":{"voice":"narrator","text":"اليوم جمعة، وأمامك يومٌ كامل فارغ."},"out.ayy.same":{"voice":"narrator","text":"وهو أفضل الأيّام. فمن عرف قدر يومه أحسن فيه."},"out.ayy.ready":{"voice":"narrator","text":"أحسنت، فأفضل الأيّام يوم الجمعة."},"tad.misc.ayyam":{"voice":"narrator","text":"جمعةٌ تمرّ عليك كل أسبوع، وهي أفضل أيّام عمرك. فكم جمعةً ضاعت؟"},"act.ayy":{"voice":"narrator","text":"اجعل لجمعتك القادمة عملًا صالحًا تخصّها به."},"goal.misc.ayyam":{"voice":"narrator","text":"سنعرف أعياد المسلمين، وأفضل الشهور والأيّام."},"end.misc.ayyam":{"voice":"narrator","text":"تعلّمتَ اليوم: أعياد المسلمين عيد الفطر وعيد الأضحى، وما سواهما فمن البدع، وأفضل الشهور رمضان، وأفضل الأيّام يوم الجمعة."},"athar.bay.open":{"voice":"athar","text":"حين تبيع أو تشتري… ما الذي يجوز؟"},"athar.bay.coin":{"voice":"athar","text":"لمع دينارٌ في وادينا"},"q.bay.three":{"voice":"narrator","text":"ثلاثةٌ حُرّمت من المعاملات. اكتشفها."},"rev.bay.1":{"voice":"narrator","text":"الغشّ، ومنه: إخفاء عيب السلعة. قال النبي صلى الله عليه وسلم: من غشّ فليس منّي."},"rev.bay.2":{"voice":"narrator","text":"الربا، ومنه أن تأخذ ألفًا من إنسانٍ دينًا على أن تردّها إليه ألفين. والزيادة هي الربا المحرّم."},"rev.bay.3":{"voice":"narrator","text":"الغرر والجهالة: كأن يبيعك الحليب في ضرع الشاة، أو السمكة في الماء ولم تُصطد بعد."},"q.bay.deal":{"voice":"narrator","text":"ماذا تقول له؟"},"sit.bay":{"voice":"narrator","text":"قال لك صاحبك: أُعيرك عشرة ريالات، تردّها لي خمسة عشر بعد شهر."},"out.bay.riba":{"voice":"narrator","text":"وهذه الزيادة هي الربا المحرّم. وأحلّ الله البيع وحرّم الربا."},"out.bay.clean":{"voice":"narrator","text":"أحسنت، الدَّين يُردّ بمثله بلا زيادة."},"tad.misc.bay":{"voice":"narrator","text":"كلّ شيءٍ حلالٌ لك إلا القليل، فلماذا تذهب إلى القليل وتترك الكثير؟"},"act.bay":{"voice":"narrator","text":"إن بعتَ أو اشتريتَ اليوم، فبيّن العيب ولا تأخذ زيادةً على دَين."},"goal.misc.bay":{"voice":"narrator","text":"سنعرف أنّ الأصل في البيع الحِلّ، وما الذي حُرّم منه."},"end.misc.bay":{"voice":"narrator","text":"تعلّمتَ اليوم: الأصل في البيوع والمعاملات الحِلّ إلا ما حرّم الله، ومنه الغشّ والربا والغرر والجهالة."},"src.ahk.five":{"voice":"sacred","text":"الأحكام التكليفية خمسة: الواجب — يُثاب فاعله ويُعاقب تاركه. المستحبّ — يُثاب فاعله ولا يُعاقب تاركه، ويسمّى السنّة والمندوب. المحرّم — يُثاب تاركه ويُعاقب فاعله. المكروه — يُثاب تاركه ولا يُعاقب فاعله. المباح — لا يُثاب تاركه ولا يُعاقب فاعله، ويسمّى الجائز والحلال.","ref":"ص ٧٨"},"src.fiq.hadith":{"voice":"sacred","text":"ثمرة التفقّه في الدين: صحّة الأقوال والأعمال والاعتقادات، بما يُثمر السعادة في الدنيا والآخرة. وفي الحديث عن معاوية بن أبي سفيان رضي الله عنهما قال: قال رسول الله ﷺ: «من يُرد الله به خيرًا يُفقّهه في الدين». يُفقّهه: أي يجعله عالمًا بالأحكام الشرعية.","ref":"رواه البخاري ومسلم — ص ٧٨"},"src.ayy.eid":{"voice":"sacred","text":"أعياد المسلمين: عيد الفطر وعيد الأضحى. قَالَ رسول الله ﷺ لمّا قدم المدينة ولهم يومان يلعبون فيهما: «ما هذان اليومان؟» قالوا: كنّا نلعب فيهما في الجاهليّة. فقال ﷺ: «إنّ الله قد أبدلكم بهما خيرًا منهما: يوم الأضحى ويوم الفطر». وما سواهما من الأعياد فمن البدع. وأفضل الشهور: شهر رمضان. وأفضل الأيّام: يوم الجمعة.","ref":"رواه أبو داود — ص ٧٩"},"src.bay.asl":{"voice":"sacred","text":"الأصل في كل البيوع والمعاملات أنها حلال، إلا بعض الأنواع ممّا حرّم الله تَعَالَى. قال تَعَالَى: ﴿وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا﴾","ref":"البقرة: ٢٧٥ — ص ٧٨"},"daily.offer":{"voice":"athar","text":"عندي لك مهمّةٌ اليوم"},"daily.done":{"voice":"athar","text":"تركتَ أثرًا جديدًا"},"daily.again":{"voice":"athar","text":"أثرُك يزداد عمقًا"},"athar.suj.open":{"voice":"athar","text":"حين تسجد… ماذا يلمس الأرض منك؟"},"athar.suj.seven":{"voice":"athar","text":"ظهرت سبع علاماتٍ في وادينا"},"q.suj.seven":{"voice":"narrator","text":"سبعة أعضاء تلمس الأرض. اجمعها."},"rev.suj.1":{"voice":"narrator","text":"الجبهة والأنف معًا، وهما عضوٌ واحد في العدّ."},"rev.suj.2":{"voice":"narrator","text":"الكفّان، اثنان."},"rev.suj.3":{"voice":"narrator","text":"والركبتان، اثنان."},"rev.suj.4":{"voice":"narrator","text":"وأطراف القدمين، اثنان. فذلك سبعة."},"q.suj.arms":{"voice":"narrator","text":"ما الصواب؟"},"sit.suj":{"voice":"narrator","text":"رأيتَ ولدًا يسجد وقد بسط ذراعيه كاملتين على الأرض."},"out.suj.ok":{"voice":"narrator","text":"وللسجود هيئة: يجافي عضديه عن جنبيه، ولا يبسط ذراعيه على الأرض."},"out.suj.right":{"voice":"narrator","text":"أحسنت، وهذه هي هيئة السجود."},"q.suj.order":{"voice":"narrator","text":"رتّب ما تقوله في سجودك وبين السجدتين."},"say.suj.1":{"voice":"narrator","text":"سبحان ربّي الأعلى"},"say.suj.2":{"voice":"narrator","text":"الله أكبر، أرفع رأسي"},"say.suj.3":{"voice":"narrator","text":"ربّ اغفر لي وارحمني واهدني"},"tad.ibadah.sujud":{"voice":"narrator","text":"أعلى ما فيك، جبهتُك، تضعها على التراب لله. فأيّ عزٍّ بعد هذا الذلّ؟"},"act.suj":{"voice":"narrator","text":"اسجد اليوم سجدةً على سبعة أعضاء، وقل فيها: سبحان ربّي الأعلى."},"goal.ibadah.sujud":{"voice":"narrator","text":"سنعرف على كم عضوٍ نسجد، وماذا نقول في السجود."},"end.ibadah.sujud":{"voice":"narrator","text":"تعلّمتَ اليوم: السجود على سبعة أعضاء: الجبهة والأنف والكفّان والركبتان وأطراف القدمين، وتقول سبحان ربّي الأعلى."},"athar.tash.open":{"voice":"athar","text":"وفي آخر صلاتك… جلسةٌ لها كلام"},"athar.tash.seat":{"voice":"athar","text":"اتّسع مجلسٌ في مسجدنا"},"q.tash.order":{"voice":"narrator","text":"رتّب أوّل التشهّد."},"say.tash.1":{"voice":"narrator","text":"التحيّات لله والصلوات والطيّبات"},"say.tash.2":{"voice":"narrator","text":"السلام عليك أيّها النبيّ ورحمة الله وبركاته"},"say.tash.3":{"voice":"narrator","text":"السلام علينا وعلى عباد الله الصالحين"},"say.tash.4":{"voice":"narrator","text":"أشهد أن لا إله إلا الله، وأشهد أنّ محمدًا عبده ورسوله"},"q.tash.four":{"voice":"narrator","text":"وأربعٌ تستعيذ منها قبل السلام. اكتشفها."},"rev.tash.1":{"voice":"narrator","text":"أعوذ بالله من عذاب جهنّم."},"rev.tash.2":{"voice":"narrator","text":"ومن عذاب القبر."},"rev.tash.3":{"voice":"narrator","text":"ومن فتنة المحيا والممات."},"rev.tash.4":{"voice":"narrator","text":"ومن فتنة المسيح الدجّال."},"tad.ibadah.tashahhud":{"voice":"narrator","text":"في كلّ صلاةٍ تُسلّم على نبيّك، وعلى كلّ عبدٍ صالحٍ في الأرض والسماء."},"act.tash":{"voice":"narrator","text":"استعذ اليوم بالأربع قبل سلامك، وأنت تفهم ما تستعيذ منه."},"goal.ibadah.tashahhud":{"voice":"narrator","text":"سنعرف ماذا نقول في التشهّد، وبمَ نستعيذ قبل السلام."},"end.ibadah.tashahhud":{"voice":"narrator","text":"تعلّمتَ اليوم: التحيّات لله والصلوات والطيّبات، ثم السلام على النبي وعلى عباد الله الصالحين، ثم الشهادتان، ثم تستعيذ من أربع."},"src.suj.seven":{"voice":"sacred","text":"ثم يسجد ويسجد على أعضائه السبعة: الجبهة والأنف، والكفّان، والركبتان، وأطراف القدمين. ويجافي عضديه عن جنبيه، ولا يبسط ذراعيه على الأرض، ويستقبل برؤوس أصا badah.tayammum":{"voice":"narrator","text":"تعلّمتَ اليوم: التيمّم استعمال التراب عند فقد الماء، وصفته ضربةٌ واحدة تمسح بها وجهك وظاهر كفّيك، ونواقضه: نواقض الوضوء، وإذا وُجد الماء.","fix":"واو مكرّرة (تصحيح حرفي)"},"athar.raw.open":{"voice":"athar","text":"ركعتان… وبيتٌ في الجنّة"},"athar.raw.house":{"voice":"athar","text":"ارتفع بيتٌ في وادينا"},"q.raw.touch":{"voice":"narrator","text":"المس لتعرف ما الرواتب وما فضلها."},"rev.raw.1":{"voice":"narrator","text":"السنن الرواتب: هي ثنتا عشرة ركعة في اليوم والليلة، تُصلّى قبل الفرائض وبعدها."},"rev.raw.2":{"voice":"narrator","text":"من صلّاها بُني له بيتٌ في الجنّة."},"q.raw.umrah":{"voice":"narrator","text":"وأركان العمرة ثلاثة. رتّبها."},"say.raw.1":{"voice":"narrator","text":"الإحرام"},"say.raw.2":{"voice":"narrator","text":"الطواف بالبيت"},"say.raw.3":{"voice":"narrator","text":"السعي بين الصفا والمروة"},"tad.ibadah.rawatib":{"voice":"narrator","text":"ركعتان زائدتان كل يوم، وبيتٌ يُبنى لك حيث تبقى للأبد."},"act.raw":{"voice":"narrator","text":"صلِّ اليوم ركعتين قبل الظهر أو بعده، زيادةً على فرضك."},"goal.ibadah.rawatib":{"voice":"narrator","text":"سنعرف السنن الرواتب وفضلها، وأركان العمرة."},"end.ibadah.rawatib":{"voice":"narrator","text":"تعلّمتَ اليوم: السنن الرواتب ثنتا عشرة ركعة في اليوم والليلة، من صلّاها بُني له بيتٌ في الجنّة، وأركان العمرة الإحرام والطواف والسعي."},"src.tw3.ayah":{"voice":"sacred","text":"خلقنا الله لعبادته وحده لا شريك له، ولم يخلقنا عبثًا أو للهو واللعب، أو يتركنا سدًى وهملًا. قال تَعَالَى: ﴿وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ﴾. وأعظم واجبٍ علينا: توحيد الله تَعَالَى. قال تعالى: ﴿وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ حُنَفَاءَ﴾","ref":"الذاريات ٥٦ · البيّنة ٥ — ص ٥"},"src.shk.ayah":{"voice":"sacred","text":"أعظم ذنب: الشرك بالله تَعَالَى. قال تَعَالَى: ﴿إِنَّ اللَّهَ لَا يَغْفِرُ أَن يُشْرَكَ بِهِ وَيَغْفِرُ مَا دُونَ ذَٰلِكَ لِمَن يَشَاءُ ۚ وَمَن يُشْرِكْ بِاللَّهِ فَقَدِ افْتَرَىٰ إِثْمًا عَظِيمًا﴾. والشرك: هو أن يجعل الإنسان لله نِدًّا في عبادته أو ربوبيّته أو أسمائه وصفاته.","ref":"النساء: ٤٨ — ص ٥"},"src.tym.how":{"voice":"sacred","text":"التيمّم: هو استعمال التراب وغيره من صعيد الأرض، عند فقد الماء أو تعذّر استعماله. قال تعالى: ﴿فَلَمْ تَجِدُوا مَاءً فَتَيَمَّمُوا صَعِيدًا طَيِّبًا فَامْسَحُوا بِوُجُوهِكُمْ وَأَيْدِيكُمْ﴾. وصفته: بضرب التراب ضربةً واحدة بباطن الكفّين، ومسح الوجه وظاهر الكفّين مرّةً واحدة.","ref":"النساء: ٤٣ — ص ١٦"},"src.raw.fadl":{"voice":"sacred","text":"السنن الرواتب: هي ثنتا عشرة ركعة في اليوم والليلة، من صلّاها بُني له بيتٌ في الجنّة. والعمرة: التعبّد لله تَعَالَى بالطواف بالبيت والسعي بين الصفا والمروة، وأركانها: الإحرام، والطواف، والسعي.","ref":"ص ٢٢ و ٢٦"},"athar.sah.open":{"voice":"athar","text":"من حملوا إليك هذا الدين"},"athar.sah.stars":{"voice":"athar","text":"أضاءت أربعة نجوم"},"q.sah.who":{"voice":"narrator","text":"من هو الصحابيّ؟ المس لتعرف."},"rev.sah.1":{"voice":"narrator","text":"هو من لقي النبيَّ صلى الله عليه وسلم مؤمنًا به، ومات على الإسلام."},"rev.sah.2":{"voice":"narrator","text":"يجب أن نحبّهم ونقتديَ بهم، وهم خير الناس وأفضلهم بعد الأنبياء."},"q.sah.four":{"voice":"narrator","text":"وأفضلهم الخلفاء الأربعة. رتّبهم."},"say.sah.1":{"voice":"narrator","text":"أبو بكر الصدّيق"},"say.sah.2":{"voice":"narrator","text":"عمر بن الخطّاب"},"say.sah.3":{"voice":"narrator","text":"عثمان بن عفّان"},"say.sah.4":{"voice":"narrator","text":"عليّ بن أبي طالب"},"q.sah.bad":{"voice":"narrator","text":"ماذا تقول؟"},"sit.sah":{"voice":"narrator","text":"سمعتَ من يتكلّم في أحد أصحاب النبي صلى الله عليه وسلم بكلامٍ سيّئ."},"out.sah.silent":{"voice":"narrator","text":"وقد رضي الله عنهم ورضوا عنه. ويجب أن نحبّهم ونقتديَ بهم."},"out.sah.defend":{"voice":"narrator","text":"أحسنت، فهم خير الناس بعد الأنبياء."},"tad.seerah.sahabah":{"voice":"narrator","text":"لولا أنّهم حفظوه لك، ما وصلك من دينك حرفٌ واحد."},"act.sah":{"voice":"narrator","text":"اعرف اليوم قصّةً واحدة عن صحابيّ، وأخبر بها أخاك."},"goal.seerah.sahabah":{"voice":"narrator","text":"سنعرف من هم الصحابة، ومن أفضلهم، ":"athar","text":"النجوم الأربعة تنتظر"},"ent.seerah.sahabah":{"voice":"athar","text":"صباحٌ هادئ على التلّة"},"sit.sif.v2":{"voice":"narrator","text":"قال صاحبك: أنا أحبّ لاعبًا مشهورًا أكثر من أيّ أحد."},"athar.seerah.sifat.wait":{"voice":"athar","text":"العطر ينتظر… ونعود"},"ent.seerah.sifat":{"voice":"athar","text":"نسيمٌ هادئ في ساحة المسجد"},"athar.seerah.wahy.hook":{"voice":"athar","text":"أيّ ليلةٍ تغيّرت فيها الدنيا؟"},"sit.wahy.v2":{"voice":"narrator","text":"أوّل كلمةٍ نزلت على نبيّنا كانت: اقرأ."},"athar.seerah.wahy.wait":{"voice":"athar","text":"الغار ينتظر… ونعود"},"ent.seerah.wahy":{"voice":"athar","text":"الليل ساكنٌ فوق جبلنا"},"athar.seerah.wasiyyah.hook":{"voice":"athar","text":"ماذا ترك لنا نبيّنا ﷺ؟"},"q2.seerah.wasiyyah.left":{"voice":"narrator","text":"المس لتعرف ماذا ترك لنا، ومتى تُوفّي ﷺ."},"rev.was.2.v2":{"voice":"narrator","text":"ليلها كنهارها، طريقٌ واضحةٌ لمن سار فيها."},"rev2.seerah.wasiyyah.5":{"voice":"narrator","text":"تُوفّي ﷺ في شهر ربيع الأوّل، من السنة الحادية عشرة من الهجرة، وله من العمر ثلاثٌ وستّون سنة."},"out.was.guess.v2":{"voice":"narrator","text":"والطريق واضح، فاسأل من يعلم بدل الظنّ."},"tad2.seerah.wasiyyah":{"voice":"narrator","text":"ما تركك حائرًا، ما من خيرٍ إلا دلّك عليه، ولا شرٍّ إلا حذّرك منه."},"athar.seerah.wasiyyah.wait":{"voice":"athar","text":"المشعل ينتظر… ونعود"},"ent.seerah.wasiyyah":{"voice":"athar","text":"المسجد هادئ في المساء"},"athar.seerah.yateem.hook":{"voice":"athar","text":"أتحبّ أن تسمع قصّة طفلٍ رعاه الله؟"},"src.yat.full.s1":{"voice":"sacred","text":"وُلد ﷺ في عام الفيل، في يوم الإثنين من شهر ربيع الأوّل، في مكّة. تُوفّي أبوه في المدينة وهو حملٌ في بطن أمّه. ومن مرضعاته حليمة السعديّة.","ref":"السيرة النبوية — ص ٢٨"},"src.yat.full.s2":{"voice":"sacred","text":"توفّيت أمّه وهو ابن ست سنين، وكفله جدّه عبد المطلب. ثم توفّي جدّه وهو ابن ثمان سنين، وكفله عمّه أبو طالب.","ref":"السيرة النبوية — ص ٢٨"},"q2.seerah.yateem.kind":{"voice":"narrator","text":"ماذا تفعل؟"},"sit2.seerah.yateem.kind":{"voice":"narrator","text":"في صفّك طفلٌ فقد أباه، وهو حزينٌ اليوم."},"out2.seerah.yateem.kind.0":{"voice":"narrator","text":"أحسنت، فقلب المؤمن يرقّ لمن فقد."},"out2.seerah.yateem.kind.1":{"voice":"narrator","text":"قلبك يرقّ لمن فقد، فاقترب منه بكلمةٍ طيّبة."},"tad2.seerah.yateem":{"voice":"narrator","text":"فقد أباه وأمّه وجدّه، ورعاه ربّه. فلا تحزن، فربّك يرعى من فقد."},"athar.seerah.yateem.wait":{"voice":"athar","text":"العشّ ينتظر عصافيره"},"ent.seerah.yateem":{"voice":"athar","text":"الصباح هادئ في المسجد"},"rev.ark2.l1":{"voice":"narrator","text":"أبدأ قائمًا، ثم أُكبّر تكبيرة الإحرام"},"rev.ark2.l2":{"voice":"narrator","text":"ثم أقرأ الفاتحة، ثم أركع، ثم أرفع وأعتدل قائمًا"},"rev.ark2.l3":{"voice":"narrator","text":"ثم أسجد، وأجلس بين السجدتين"},"q.ark2.seq":{"voice":"narrator","text":"المس لتسمع كيف تسير الركعة."},"athar.ark2.wait":{"voice":"athar","text":"ننتظر ركعتك المتمهّلة"},"ent.ibadah.arkanSalat":{"voice":"athar","text":"وقفنا في صفّ الصلاة"},"athar.dua.wait":{"voice":"athar","text":"ننتظر دعوتك متى شئت"},"ent.ibadah.dua":{"voice":"athar","text":"جلسنا في ركنٍ هادئ"},"athar.hajj.hook":{"voice":"athar","text":"بيتٌ يقصده الناس من كل مكان… أتعرفه؟"},"athar.hajj.wait":{"voice":"athar","text":"الأفق ينتظر حتى تدعو"},"ent.ibadah.hajj":{"voice":"athar","text":"التفتنا إلى جهة القبلة"},"sit.jum2":{"voice":"narrator","text":"استيقظتَ يوم الجمعة متأخّرًا، والوقت يكفي للصلاة فقط."},"out.jum.rush2":{"voice":"narrator","text":"وللجمعة سنن: غُسلٌ وطيبٌ وأحسنُ ثياب وتبكير."},"athar.jum.wait":{"voice":"athar","text":"سنرفع المنبر حين تستعدّ"},"ent.ibadah.jumuah":{"voice":"athar","text":"باكرًا… والمسجد ينتظرنا"},"athar.khu.wait":{"voice":"athar","text":"السكون ينتظر قلبك الحاضر"},"ent.ibadah.khushu":{"voice":"athar","text":"وقفنا ساكنين قرب المحراب"},"athar.raw.wait":{"voice":"athar","text":"مكان البيت ينتظر ركعتيك"},"ent.ibadah.rawatib":{"voice":"athar","text":"فرغنا من الفريضة ولم نخرج بعد"},"athar.salat.hook":{"voice":"athar","text":"يومُك مقسومٌ على خمس… فما هي؟"}," <script>
/* ═══════════════ شريط أسفل الشاشة (تثبيت / تحديث) ═══════════════ */
function ubarShow(msg, btnText, onBtn, laterText, title) {
  const el = document.getElementById("ubar"); if (!el) return;
  el.innerHTML = "<span>" + (title ? "<b>" + title + "</b>" : "") + msg + "</span>" +
    (laterText ? '<button type="button" class="ghost" id="ubtn2">' + laterText + "</button>" : "") +
    (btnText ? '<button type="button" id="ubtn1">' + btnText + "</button>" : "");
  el.hidden = false;
  const b1 = document.getElementById("ubtn1"), b2 = document.getElementById("ubtn2");
  if (b1) b1.onclick = () => { el.hidden = true; onBtn && onBtn(); };
  if (b2) b2.onclick = () => { el.hidden = true; try { localStorage.setItem("athar.installOff", "1"); } catch {} };
}

/* ═══════════════ تثبيت التطبيق ═══════════════
   أندرويد/كروم يطلقان beforeinstallprompt فنعرض شريطًا بعد ٦ ثوانٍ.
   آيفون وماك-سفاري لا يدعمانه إطلاقًا، فالبديل إرشادٌ مكتوب. */
let deferredInstall = null;
let INSTALLED = false;

function isStandalone() {
  return matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
}
function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}
function isMacSafari() {
  const u = navigator.userAgent;
  return /Macintosh/.test(u) && /Safari/.test(u) && !/Chrome|Chromium|Edg|OPR/.test(u);
}
function installDismissed() {
  try { return localStorage.getItem("athar.installOff") === "1"; } catch { return false; }
}

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredInstall = e;
  setTimeout(() => offerInstall(), 6000);
});
window.addEventListener("appinstalled", () => {
  deferredInstall = null; INSTALLED = true;
  document.getElementById("ubar").hidden = true;
});
matchMedia("(display-mode: standalone)").addEventListener("change", e => { if (e.matches) INSTALLED = true; });

function offerInstall() {
  if (INSTALLED || isStandalone() || installDismissed()) return;
  if (deferredInstall) {
    ubarShow("ثبّت أثر على شاشتك ليفتح مباشرة ويعمل أسرع", "تثبيت", runInstall, "لاحقًا");
    return;
  }
  if (isIOS()) {
    ubarShow('اضغط زر المشاركة أسفل الشاشة، ثم اختر «إضافة إلى الشاشة الرئيسية»', null, null, "تم", "ثبّت أثر على آيفون");
    return;
  }
  if (isMacSafari()) {
    ubarShow('من شريط سفاري اضغط زر المشاركة، ثم اختر «إضافة إلى Dock»', null, null, "تم", "ثبّت أثر على ماك");
  }
}
async function runInstall() {
  if (!deferredInstall) return;
  const p = deferredInstall; deferredInstall = null;
  try {
    p.prompt();
    const res = await p.userChoice;
    if (res && res.outcome === "dismissed") { try { localStorage.setItem("athar.installOff", "1"); } catch {} }
  } catch {}
}

/* ═══════════════ تحديث التطبيق ═══════════════
   لا نفرض إعادة التحميل، بل نعرض شريطًا يختار منه الوالد. */
function registerSW() {
  if (!("serviceWorker" in navigator) || location.protocol === "file:") return;
  navigator.serviceWorker.register("./sw.js").then(reg => {
    if (reg.waiting) offerUpdate(reg.waiting);
    reg.addEventListener("updatefound", () => {
      const w = reg.installing; if (!w) return;
      w.addEventListener("statechange", () => {
        if (w.state === "installed" && navigator.serviceWorker.controller) offerUpdate(w);
      });
    });
    setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
  }).catch(() => {});
  let reloading = false;
  const ownCtl = (() => { const c = navigator.serviceWorker.controller; return !!c && c.scriptURL.indexOf(new URL("./", location.href).href) === 0; })();
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!ownCtl || reloading) return; reloading = true; location.reload();
  });
  function offerUpdate(worker) {
    ubarShow("تتوفّر نسخة جديدة من أثر", "حدّث", () => worker.postMessage({ type: "SKIP_WAITING" }), "لاحقًا");
  }
}

INSTALLED = isStandalone();
window.addEventListener("load", () => {
  registerSW();
  setTimeout(() => { if (!deferredInstall) offerInstall(); }, 8000);
});
</script>

/* ═══ الوادي · الرئيسية والأثر المشترك ═══ (يُحقن بـ patch_valley_home.py — لا تعدّله يدويًا في index.html)
   - زر «الرئيسية» (#vhome) رابط عادي إلى ../index.html؛ هنا نكتب فقط «آخر نشاط» في الملف المشترك عند الضغط.
   - ملف الطفل المشترك athar.profile.v1: نقرأ إنجازات أثر القرآن ونُضيء فانوسًا جديدًا مرة واحدة لكل إنجاز.
   - الوادي يكتب athar.profile.v1.valley.today = {d,done,end} لتعرف رئيسية أثر القرآن إن كانت حصة اليوم بانتظار الطفل.

(function () {
  "use strict";
  var PK = "athar.profile.v1", MAXL = 7;
  var home = document.getElementById("vhome");

  function rd() { try { var o = JSON.parse(localStorage.getItem(PK)); return (o && typeof o === "object" && !Array.isArray(o)) ? o : {}; } catch (e) { return {}; } }

  function addLine(id, text) { try { AtharAudio.manifest[id] = { voice: "athar", text: text }; } catch (e) {} return id; }
