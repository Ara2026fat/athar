<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>sky-test</title><link rel="stylesheet" href="sky.css">
<style>html,body{margin:0;background:#F3F7EF;font-family:Tajawal,system-ui,sans-serif}
body{width:390px;margin:0 auto;min-height:844px;background:linear-gradient(#cfe9f5,#f6e9cf)}
body[data-t=night]{background:linear-gradient(#0f1a44,#1c2a60)}body[data-t=dusk]{background:linear-gradient(#5E4E9C,#e9a478)}
#A{width:390px;height:110px;margin-top:20px}#B{width:390px;height:180px;margin-top:30px}
p{font-size:12px;padding:0 10px;color:#555}</style></head><body>
<script>
// عدّاد rAF قبل تحميل الوحدة
(function(){var n=0,ids={},ra=window.requestAnimationFrame,ca=window.cancelAnimationFrame;
window.__raf={pending:function(){return Object.keys(ids).length},total:function(){return n}};
window.requestAnimationFrame=function(f){var id=ra(function(t){delete ids[id];f(t)});ids[id]=1;n++;return id};
window.cancelAnimationFrame=function(id){delete ids[id];ca(id)}})();
var q=new URLSearchParams(location.search);
if(q.has('d')){var t=new Date(),a=[];q.get('d').split(',').filter(Boolean).forEach(function(o){var d=new Date(t.getFullYear(),t.getMonth(),t.getDate()-(+o));a.push(d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2))});
localStorage.setItem('athar_days_v1_p1',JSON.stringify(a))}
if(q.has('stars'))localStorage.setItem('athar_mis_v1_p1',JSON.stringify({total:+q.get('stars')}));
document.body.dataset.t=q.get('t')||'day';
window.__taps=[];
</script>
<div id="A"></div><div id="B"></div><p>sky-test: قنديل 390×110 / سماء 390×180</p>
<script src="sky.js"></script>
<script>
window.AtharSky.onTap=function(k,i){window.__taps.push([k,i])};
window.__m=AtharSky.mount({lanterns:document.getElementById('A'),sky:document.getElementById('B'),time:q.get('t')||undefined});
</script></body></html>
