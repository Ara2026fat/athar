<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>أثر — شاشة «هيا نكمل» (تصوّر ٢)</title>
<style>
:root{--gd:#1d4f37;--gold:#f2b632}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0d1a14;font-family:"Tajawal","Baloo Bhaijan 2",system-ui,sans-serif}
#fit{position:fixed;left:50%;top:0;width:390px;height:780px;margin-left:-195px;transform-origin:top center}
#w{position:absolute;inset:0;background:#8cc4ee url(next/home/img/map/day1.webp) -10px 47px/410px 725px no-repeat;overflow:hidden}
.top{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.brand{display:flex;align-items:center;gap:6px;background:#fff9;backdrop-filter:blur(6px);border-radius:99px;padding:3px 14px 3px 6px;font:700 32px "Baloo Bhaijan 2","Tajawal";color:var(--gd)}
.brand img{width:64px;height:64px;border-radius:50%}
.star{background:#fffbe6;border-radius:16px;padding:6px 14px;font-weight:800;font-size:20px;box-shadow:0 3px 8px #0003}
.d{position:absolute;width:0;height:0;z-index:3;cursor:pointer}
.d .pl{position:absolute;left:-39px;top:-39px;width:78px;height:78px;border-radius:50%;background:radial-gradient(#fffdf0,#f4ead0);border:4px solid var(--rg);box-shadow:0 4px 10px #0004;display:flex;align-items:center;justify-content:center;transition:.3s}
.d img{width:68%}.d .lb{position:absolute;top:44px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#1f3a2cdd;color:#fff;font-weight:800;font-size:13px;border-radius:99px;padding:2px 10px}
.d.dim .pl{filter:saturate(.8);opacity:.93}
.d.next{z-index:6}.d.next .pl{left:-56px;top:-56px;width:112px;height:112px;border-color:var(--gold);border-width:6px;animation:pu 2.2s ease-in-out infinite}
.d.next .lb{top:62px;background:var(--gold);color:#3a2c00;font-size:15px}
@keyframes pu{50%{box-shadow:0 0 0 14px #f2b63255,0 4px 10px #0004}}
.bub{position:absolute;z-index:7;background:#fffdf3;border-radius:20px;padding:6px 16px;font:800 18px/1.3 inherit;font-family:inherit;color:var(--gd);box-shadow:0 4px 12px #0004;white-space:nowrap;transform:translate(-50%,0)}
.bub::after{content:"";position:absolute;bottom:-9px;left:50%;margin-left:-9px;border:9px solid transparent;border-top-color:#fffdf3;border-bottom:0}
.bar{position:absolute;inset:0;z-index:5;pointer-events:none}.bar>*{pointer-events:auto}.go{position:absolute;top:84px;left:50%;transform:translateX(-50%);width:auto!important;padding:9px 26px!important;white-space:nowrap;font-size:20px!important}.trail{position:absolute;top:134px;left:50%;transform:translateX(-50%);background:#0b2a1c99;padding:5px 12px;border-radius:99px}.cap{display:none}
.go{width:100%;border:0;border-radius:99px;background:var(--gold);color:#3a2c00;font:800 22px inherit;font-family:inherit;padding:12px;box-shadow:0 5px 14px #0006;cursor:pointer}
.trail{display:flex;align-items:center;gap:6px}.dot{width:14px;height:14px;border-radius:50%;background:#ffffff66;border:2px solid #fff}.dot.f{background:var(--gold);border-color:var(--gold)}.dot.c{width:22px;height:22px;background:#fff;border-color:var(--gold);box-shadow:0 0 0 4px #f2b63266}.ln{width:14px;height:3px;background:#fff8;border-radius:2px}
.cap{color:#fff;font-weight:700;font-size:14px;text-shadow:0 1px 4px #000a}
.ath{position:absolute;z-index:4;width:76px;filter:drop-shadow(0 6px 6px #0006);pointer-events:none}
.end{position:absolute;inset:0;z-index:9;background:linear-gradient(#10281c,#1f4d36);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;text-align:center;padding:30px}
.end.on{display:flex}.end img{width:46%}.end h2{margin:0;font-size:30px}.end p{margin:0;font-size:19px;opacity:.9}.end button{margin-top:8px;background:var(--gold);border:0;border-radius:99px;padding:10px 26px;font:800 18px inherit;font-family:inherit;color:#3a2c00}
</style></head><body>
<div id="fit"><div id="w">
 <div class="top"><div class="star">⭐ ١٢</div><div class="brand"><img src="icons-athar/brand-96.png" alt=""><span>أثر</span></div></div>
 <div class="bar"><button class="go" id="go">هيا نكمل ◀ سورة الناس</button><div class="trail" id="tr"></div><div class="cap">خطوتك الرابعة في الرحلة</div></div>
 <div class="end" id="end"><img src="next/home/img/joy.webp" alt=""><h2>أحسنت!</h2><p>انتهينا اليوم، وأثر سعيد بك.<br>نلتقي غدًا بإذن الله</p><button id="bk">رجوع</button></div>
</div></div>
<script>
var W=document.getElementById("w"),S=390*1.05/800;
var D=[["valley","الوادي",400,387,"#e4b04a","valley_win"],["hifz","أحفظ القرآن",664,790,"#2f9e6b","hifz"],["noor","القاعدة النورانية",166,573,"#f0a53a","noor"],["lib","مكتبتي",263,1026,"#8a63d2","lib"],["adhkar","أذكاري",478,934,"#2fb5a8","adhkar"],["quiz","المسابقات",648,1130,"#e0509a","quiz"],["math","عالم الأرقام",140,1267,"#f0b43a","math"]];
var NEXT="hifz";
D.forEach(function(d){var x=d[2]*S-9.75,y=704-(1417-d[3])*S+68+(d[0]==NEXT?22:0),el=document.createElement("div");el.className="d "+(d[0]==NEXT?"next":"dim");el.style.cssText="left:"+x+"px;top:"+y+"px;--rg:"+d[4];
el.innerHTML='<div class="pl"><img src="next/home/img/doors/'+d[5]+'.webp"></div><div class="lb">'+d[1]+'</div>';W.insertBefore(el,W.querySelector(".bar"));
if(d[0]==NEXT){var b=document.createElement("div");b.className="bub";b.textContent="هيا نكمل!";b.style.cssText="left:"+Math.min(Math.max(x,60),330)+"px;top:"+(y-112)+"px";W.insertBefore(b,W.querySelector(".bar"));
var a=document.createElement("img");a.className="ath";a.src="next/home/img/idle.webp";a.style.cssText="left:150px;top:540px";W.insertBefore(a,W.querySelector(".bar"))}
el.onclick=function(){if(d[0]==NEXT)go()}});
var T=document.getElementById("tr");for(var i=0;i<7;i++){var e=document.createElement("div");e.className="dot"+(i<3?" f":i==3?" c":"");T.appendChild(e);if(i<6){var l=document.createElement("div");l.className="ln";T.appendChild(l)}}
function go(){document.getElementById("end").classList.add("on")}
document.getElementById("go").onclick=go;document.getElementById("bk").onclick=function(){document.getElementById("end").classList.remove("on")};
function fit(){var s=Math.min(innerWidth/390,innerHeight/780);document.getElementById("fit").style.transform="scale("+s+")"}fit();onresize=fit;
</script></body></html>
