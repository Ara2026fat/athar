<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2A8067">
<title>تسجيل أثر — القارئ — المرحلة 2 من 3</title>
<style>
:root{
  --bg:#FDF7E8; --card:#FFFFFF; --ink:#1F2A24; --mute:#6B766F; --line:#E4DCC6;
  --brand:#2A8067; --brand-ink:#FFFFFF; --brand-soft:#DCEFE8;
  --rec:#C0392B; --rec-soft:#FBE4E0; --warn:#9A6A00; --warn-soft:#FFF1CC; --ok:#1E7A4E; --ok-soft:#DDF3E6;
  --ayah:#F1EAD2; --shadow:0 2px 14px rgba(40,50,40,.10);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101914; --card:#18241D; --ink:#EAF1EC; --mute:#9AAAA0; --line:#2A3B31;
    --brand:#3FA583; --brand-ink:#08150F; --brand-soft:#173128;
    --rec:#E5604F; --rec-soft:#3A1E1A; --warn:#E6BC52; --warn-soft:#3A3014; --ok:#58C98C; --ok-soft:#173526;
    --ayah:#222B22; --shadow:0 2px 14px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#101914; --card:#18241D; --ink:#EAF1EC; --mute:#9AAAA0; --line:#2A3B31;
  --brand:#3FA583; --brand-ink:#08150F; --brand-soft:#173128;
  --rec:#E5604F; --rec-soft:#3A1E1A; --warn:#E6BC52; --warn-soft:#3A3014; --ok:#58C98C; --ok-soft:#173526;
  --ayah:#222B22; --shadow:0 2px 14px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Naskh Arabic","Amiri","Geeza Pro","Traditional Arabic","Segoe UI","Tahoma",system-ui,sans-serif;font-size:17px;line-height:1.6}
body{height:100dvh;overflow:hidden;padding:env(safe-area-inset-top) 8px calc(env(safe-area-inset-bottom) + 6px)}
.wrap{max-width:760px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;gap:6px;padding:6px 0 4px;flex:none}
.ibtn.fs{font-size:24px;font-weight:700;min-width:56px;min-height:56px;padding:0 10px}
header.top h1{font-size:16px;margin:0;flex:1;font-weight:700;min-width:0}
header.top h1 small{display:block;font-size:13px;color:var(--mute);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
button{font:inherit;color:inherit;cursor:pointer}
.ibtn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-height:44px;box-shadow:var(--shadow)}
.ibtn:focus-visible,.btn:focus-visible,.rec:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.progress{margin:2px 0 6px;flex:none}
.progress .bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.progress .bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .25s}
.progress .meta{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);margin-top:4px;gap:8px;flex-wrap:wrap}
.warnbar{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 8px 0;box-shadow:var(--shadow);flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 4px}
.cardmeta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--mute);margin-bottom:8px}
.chip{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12.5px;background:var(--brand-soft);color:var(--brand)}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.rec{background:var(--rec-soft);color:var(--rec)}
.uid{direction:ltr;unicode-bidi:isolate;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.line{font-size:var(--fs,40px);line-height:1.95;text-align:center;margin:8px 0;padding:4px 0;overflow-wrap:anywhere}
.ctx{background:var(--ayah);border-radius:14px;padding:8px 12px;margin:8px 0;font-size:16px;color:var(--mute);text-align:center}
.ctx b{display:block;font-size:12.5px;color:var(--mute);font-weight:600}
.ctx .a{font-size:20px;line-height:2;color:var(--ink);opacity:.8}
.takeinfo{min-height:28px;text-align:center;font-size:14px;color:var(--mute)}
.dock{flex:none;background:var(--card);padding:6px 0 6px;border-top:1px solid var(--line)}
.controls{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:4px}
.controls .btn{min-height:80px}
.btn{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 8px;min-height:68px;font-size:20px;font-weight:700}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn[disabled]{opacity:.4;cursor:default}
.rec{width:92px;height:92px;border-radius:50%;border:6px solid var(--rec-soft);background:var(--rec);color:#fff;font-size:15px;font-weight:700;display:grid;place-items:center;box-shadow:0 6px 18px rgba(192,57,43,.35)}
.rec svg{width:34px;height:34px;fill:currentColor}
.rec.on{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(192,57,43,.18)}}
@media (prefers-reduced-motion:reduce){.rec.on{animation:none}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px auto 0;max-width:340px;visibility:hidden}
.meter.on{visibility:visible}.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .06s}
.timer{text-align:center;font-variant-numeric:tabular-nums;font-size:22px;min-height:0;color:var(--rec);font-weight:700}
.toast{position:fixed;inset-inline:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);max-width:560px;margin:auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;z-index:50;display:none;text-align:center;font-size:15px}
.toast.on{display:block}
dialog{border:none;border-radius:20px;padding:0;max-width:min(94vw,640px);width:100%;background:var(--card);color:var(--ink);box-shadow:0 10px 50px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:18px 18px 20px;max-height:86dvh;overflow:auto}
.dlg h2{margin:0 0 10px;font-size:20px}
.dlg label{display:block;margin:12px 0 4px;font-weight:600;font-size:15px}
.dlg input[type=text],.dlg select{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:46px}
.dlg .hint{font-size:13px;color:var(--mute);margin:3px 0}
.dlg .chk{display:flex;gap:10px;align-items:center;margin:12px 0}
.dlg .chk input{width:22px;height:22px}
.dlg .acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.dlg .acts .btn{flex:1;min-width:130px}
.list{list-style:none;margin:8px 0 0;padding:0}
.list li{display:flex;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer;min-height:48px}
.list li.cur{background:var(--brand-soft);border-radius:10px}
.list .dot{width:12px;height:12px;border-radius:50%;background:var(--line);flex:none}
.list .dot.ok{background:var(--ok)} .list .dot.pend{background:var(--warn)}
.list .t{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .sh{font-weight:700;background:var(--bg);color:var(--mute);cursor:default;font-size:13px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.filters button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 14px;min-height:36px}
.filters button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.bigprog{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0}.bigprog i{display:block;height:100%;width:0;background:var(--brand)}
.sig{text-align:center;color:var(--mute);font-size:12.5px;margin-top:22px}
.home{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:20px 16px 28px;display:none}
.home.on{display:block}
.home h2{margin:4px 0 4px;font-size:24px}.home p{margin:0 0 16px;color:var(--mute)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:640px;margin:0 auto}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:18px 8px;min-height:170px;font:inherit}
.cat:active{transform:scale(.97)}.cat .ic{font-size:52px;line-height:1}.cat b{font-size:19px}.cat small{color:var(--mute)}
.cat .pb{width:80%;height:8px;border-radius:9px;background:var(--line);overflow:hidden}.cat .pb i{display:block;height:100%;background:var(--brand)}
.cat.full{grid-column:1/-1;min-height:0;flex-direction:row;justify-content:center;padding:12px}.cat.full .ic{font-size:30px}
.cat.fin{border-color:var(--brand);background:var(--brand-soft)}
.homeacts{max-width:640px;margin:14px auto 0;display:flex;gap:8px;justify-content:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>تسجيل أثر <small id="who">المتحدث: —</small></h1>
    <button class="ibtn fs" id="bFm" aria-label="تصغير الخط">أ−</button>
    <button class="ibtn fs" id="bFp" aria-label="تكبير الخط">أ+</button>
    <button class="ibtn" id="bHome" aria-label="الأقسام">الأقسام</button>
    <button class="ibtn" id="bList" aria-label="الفهرس">الفهرس</button>
    <button class="ibtn" id="bSet" aria-label="الإعدادات">الإعدادات</button>
  </header>

  <div class="progress" aria-live="polite">
    <div class="bar"><i id="pbar"></i></div>
    <div class="meta"><span id="pTxt">—</span><span id="pSes">—</span></div>
  </div>
  <div id="warn" class="warnbar" hidden></div>

  <section class="card" id="card" aria-live="polite">
    <div class="scroll" id="scroll">
    <div class="cardmeta" id="cmeta"></div>
    <div class="ctx" id="cbefore" hidden></div>
    <div class="line" id="ltext" lang="ar"></div>
    <div class="ctx" id="cafter" hidden></div>
    <div class="takeinfo" id="tinfo"></div>
    </div>
    <div class="dock">
    <div class="timer" id="timer" aria-live="off"></div>
    <div class="meter" id="meter"><i></i></div>

    <div class="controls">
      <button class="btn" id="bPrev">‹ السابق</button>
      <button class="rec" id="bRec" aria-label="تسجيل"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg></button>
      <button class="btn" id="bNext">التالي ›</button>
    </div>
    <div class="row2">
      <button class="btn" id="bPlay" disabled>▶ استمع</button>
      <button class="btn" id="bRedo" disabled>↺ أعد التسجيل</button>
    </div>
    </div>
  </section>
</div>

<div class="home" id="home" role="dialog" aria-label="اختيار القسم"><div style="max-width:640px;margin:0 auto"><h2>اختر القسم الذي ستسجّله</h2><p id="homeWho">اضغط الأيقونة لتبدأ. يمكنك الرجوع من زر «الأقسام» في الأعلى.</p></div><div class="cats" id="cats"></div><div class="homeacts"><button class="btn" id="hSet">الإعدادات</button></div></div>
<div class="toast" id="toast" role="status"></div>

<dialog id="dSet"><div class="dlg">
  <h2>الإعدادات</h2>
  <label for="iSpeaker">اسم المتحدث (يظهر في الواجهة وفي ملف manifest)</label>
  <input type="text" id="iSpeaker" placeholder="مثال: الأستاذ عرفات" autocomplete="off">
  <label for="sVoice">الصوت (voice) — مجلد الملفات</label>
  <select id="sVoice"></select>
  <input type="text" id="iVoice" placeholder="human_reader" dir="ltr" style="margin-top:8px" hidden autocomplete="off" spellcheck="false">
  <div class="hint">لكل صوت تسجيلاته المنفصلة داخل هذا الجهاز. اسم المجلد: حروف إنجليزية صغيرة وأرقام و _ و - فقط.</div>
  <div class="chk"><input type="checkbox" id="cPend"><label for="cPend" style="margin:0;font-weight:500">إظهار الأسطر المعلَّقة (آيات مضمَّنة في كلام الراوي — لا تُسجَّل قبل اعتماد الإصلاح)</label></div>
  <div class="chk"><input type="checkbox" id="cAuto"><label for="cAuto" style="margin:0;font-weight:500">الانتقال تلقائيًا إلى السطر التالي بعد إيقاف التسجيل</label></div>
  <label for="sFmt">صيغة التصدير</label>
  <select id="sFmt"><option value="native">الأصلية للمتصفح (m4a أو webm) — أصغر حجمًا</option><option value="wav">WAV أحادي ٢٤ ك.هـ — يتوافق مع كل شيء (أكبر حجمًا)</option></select>
  <div class="hint">يمكن تحويل أي صيغة إلى mp3 لاحقًا بسكربت الرقعة (ffmpeg).</div>
  <label for="fTash">استيراد تشكيل كامل (JSON: {"المعرّف": "النص المشكَّل"})</label>
  <input type="file" id="fTash" accept="application/json,.json">
  <div class="hint" id="tashInfo"></div>
  <div class="acts">
    <button class="btn primary" id="sSave">حفظ</button>
    <button class="btn" id="sTheme">الوضع الليلي/النهاري</button>
    <button class="btn" id="sWipe" style="color:var(--rec)">مسح كل التسجيلات</button>
    <button class="btn" id="sClose">إغلاق</button>
  </div>
</div></dialog>

<dialog id="dList"><div class="dlg">
  <h2>الفهرس</h2>
  <div class="filters" id="filters">
    <button data-f="all" class="on">الكل</button><button data-f="todo">غير مسجَّل</button><button data-f="done">مسجَّل</button>
  </div>
  <div class="filters" id="kfilters"><button data-k="all" class="on">كل الأنواع</button><button data-k="B1_dhikr_dua">أذكار وأدعية</button><button data-k="B2_hadith_quote">أحاديث ومقتبسات</button><button data-k="B3_sacred_text">نصوص شرعية</button><button data-k="B4_mixed_ayah">نصوص بين الآيات</button></div>
  <ul class="list" id="ulist"></ul>
  <div class="acts"><button class="btn" id="bNextOpen">التالي غير المسجَّل</button><button class="btn primary" id="bExport">تصدير ZIP</button><button class="btn" id="lClose">إغلاق</button></div>
</div></dialog>

<dialog id="dExp"><div class="dlg">
  <h2>تصدير ZIP</h2>
  <div id="expSum" class="hint" style="font-size:15px"></div>
  <div class="bigprog" id="expBar" hidden><i></i></div>
  <div id="expMsg" class="hint"></div>
  <div class="acts">
    <button class="btn primary" id="eGo">إنشاء الملف</button>
    <button class="btn" id="eShare" hidden>مشاركة</button>
    <button class="btn" id="eClose">إغلاق</button>
  </div>
</div></dialog>

: «ما هذان اليومان؟» قالوا: كنّا نلعب فيهما في الجاهليّة.","kind":"B2_hadith_quote","lesson":"misc.ayyam","pos":30,"secs":14.79,"dens":0.04,"before":null,"after":null,"pending":false,"session":1},{"u":"src.ayy.eid.b","ids":["src.ayy.eid.b"],"text":"فقال ﷺ: «إنّ الله قد أبدلكم بهما خيرًا منهما: يوم الأضحى ويوم الفطر». وما سواهما من الأعياد فمن البدع. وأفضل الشهور: شهر رمضان. وأفضل الأيّام: يوم الجمعة.","disp":"فقال صلى الله عليه وسلم: «إنّ الله قد أبدلكم بهما خيرًا منهما: يوم الأضحى ويوم الفطر». وما سواهما من الأعياد فمن البدع. وأفضل الشهور: شهر رمضان. وأفضل الأيّام: يوم الجمعة.","kind":"B2_hadith_quote","lesson":"misc.ayyam","pos":30,"secs":14.68,"dens":0.03,"before":null,"after":null,"pending":false,"session":1},{"u":"src.taam.drink","ids":["src.taam.drink"],"text":"قال النبي ﷺ: «إذا شرب أحدُكم فلا يتنفّس في الإناء». وزجر ﷺ عن الشرب قائمًا. وكان ﷺ يتنفّس في الشراب ثلاثًا.","disp":"قال النبي صلى الله عليه وسلم: «إذا شرب أحدُكم فلا يتنفّس في الإناء». وزجر صلى الله عليه وسلم عن الشرب قائمًا. وكان صلى الله عليه وسلم يتنفّس في الشراب ثلاثًا.","kind":"B2_hadith_quote","lesson":"adab.taam","pos":31,"secs":13.46,"dens":0.07,"before":null,"after":null,"pending":false,"session":1},{"u":"src.aww.list","ids":["src.aww.list"],"text":"أوّل من آمن برسالته ﷺ: من الرجال أبو بكر الصدّيق، ومن النساء خديجة بنت خويلد، ومن الصبيان عليّ بن أبي طالب، ومن الموالي زيد بن حارثة، ومن الأرقّاء بلال الحبشيّ رضي الله عنهم وغيرهم.","disp":"أوّل من آمن برسالته صلى الله عليه وسلم: من الرجال أبو بكر الصدّيق، ومن النساء خديجة بنت خويلد، ومن الصبيان عليّ بن أبي طالب، ومن الموالي زيد بن حارثة، ومن الأرقّاء بلال الحبشيّ رضي الله عنهم وغيرهم.","kind":"B3_sacred_text","lesson":"seerah.awwalun","pos":32,"secs":17.13,"dens":0.04,"before":null,"after":null,"pending":false,"session":1},{"u":"src.man.list1","ids":["src.man.list1"],"text":"سبحان الله: التسبيح، وهو تنزيهه سُبْحَانَهُ وَتَعَالَى عن كل نقصٍ وعيبٍ وسوء. الحمد لله: هو الثناء على الله تَعَالَى، ووصفه بكل صفات الكمال.","disp":"سبحان الله: التسبيح، وهو تنزيهه سُبْحَانَهُ وَتَعَالَى عن كل نقصٍ وعيبٍ وسوء. الحمد لله: هو الثناء على الله تَعَالَى، ووصفه بكل صفات الكمال.","kind":"B3_sacred_text","lesson":"adhkar.maani","pos":33,"secs":11.24,"dens":0.14,"before":null,"after":null,"pending":false,"session":1},{"u":"src.man.list2","ids":["src.man.list2"],"text":"الله أكبر: أي إنّه سُبْحَانَهُ أكبر من كل شيء وأجلّ وأعظم وأعزّ من كل شيء. لا حول ولا قوّة إلا بالله: معناها لا تحوُّل للعبد من حالٍ إلى حال، ولا قوّة له على ذلك إلا بالله.","disp":"الله أكبر: أي إنّه سُبْحَانَهُ أكبر من كل شيء وأجلّ وأعظم وأعزّ من كل شيء. لا حول ولا قوّة إلا بالله: معناها لا تحوُّل للعبد من حالٍ إلى حال، ولا قوّة له على ذلك إلا بالله.","kind":"B3_sacred_text","lesson":"adhkar.maani","pos":33,"secs":13.57,"dens":0.11,"before":null,"after":null,"pending":false,"session":1},{"u":"src.asma.list","ids":["src.asma.list"],"text":"من أسماء الله تَعَالَى وصفاته: اللهُ، والربّ، والرحمن، والسميع، والبصير، والعليم، والرزّاق، والحيّ، والعظيم، والحكيم… إلى غير ذلك من الأسماء الحسنى والصفات العُلى.","disp":"من أسماء الله تَعَالَى وصفاته: اللهُ، والربّ، والرحمن، والسميع، والبصير، والعليم، والرزّاق، والحيّ، والعظيم، والحكيم… إلى غير ذلك من الأسماء الحسنى والصفات العُلى.","kind":"B3_sacred_text","lesson":"aqeedah.asma","pos":34,"secs":13.79,"dens":0.07,"before":null,"after":null,"pending":false,"session":1},{"u":"rev.mal.1","ids":["rev.mal.1"],"text":"خلقهم الله من نور. قال النبي صلى الله عليه وسلم: خُلقت الملائكة من نور.","disp":"خلقهم الله من نور. قال النبي صلى الله عليه وسلم: خُلقت الملائكة من نور.","kind":"B2_hadith_quote","lesson":"aqeedah.malaikah","pos":35,"secs":6.35,"dens":0.02,"before":null,"after":null,"pending":false,"session":1},{"u":"src.mal.ayah~1","ids":["src.mal.ayah"],"text":"الإيمان بالملائكة: وهي مخلوقاتٌ خلقها الله من نور، لعبادته وللانقياد التامّ لأمره. قال تَعَالَى:","disp":"الإيمان بالملائكة: وهي مخلوقاتٌ خلقها الله من نور، لعبادته وللانقياد التامّ لأمره. قال تَعَالَى:","kind":"B4_mixed_ayah","lesson":"aqeedah.malaikah","pos":35,"secs":8.57,"dens":0.07,"before":null,"after":{"ayah":"﴿بَلْ عِبَادٌ مُّكْرَمُونَ ٢٦ لَا يَسْبِقُونَهُ بِالْقَوْلِ وَهُم بِأَمْرِهِ يَعْمَلُونَ ٢٧﴾","ref":"الأنبياء: ٢٦–٢٧"},"pending":false,"session":1},{"u":"src.wal.ayah~1","ids":["src.wal.ayah","src.ras.ayat","src.mar.q","src.zal.dharrah","src.qad.ayah.s1","src.mur.ayah"],"text":"قال تعالى:","disp":"قال تعالى:","kind":"B4_mixed_ayah","lesson":"adab.walidayn","pos":36,"secs":1.24,"dens":0.0,"before":null,"after":{"multi":true},"pending":false,"session":1},{"u":"src.wal.hadith","ids":["src.wal.hadith"],"text":"جاء رجلٌ إلى النبي ﷺ يستأذنه في الجهاد، فقال: «ألكَ والدانِ؟» قال: نعم. قال: «فَفِيهِمَا فجاهِدْ».","disp":"جاء رجلٌ إلى النبي صلى الله عليه وسلم يستأذنه في الجهاد، فقال: «ألكَ والدانِ؟» قال: نعم. قال: «فَفِيهِمَا فجاهِدْ».","kind":"B2_hadith_quote","lesson":"adab.walidayn","pos":36,"secs":8.91,"dens":0.15,"before":null,"after":null,"pending":false,"session":1},{"u":"end.adab.tareeq","ids":["end.adab.tareeq"],"text":"تعلّمتَ اليوم: للطريق حقّ: غضّ البصر، وكفّ الأذى، وردّ السلام، والأمر بالمعروف، وإماطة الأذى صدقة.","disp":"تعلّمتَ اليوم: للطريق حقّ: غضّ البصر، وكفّ الأذى، وردّ السلام، والأمر بالمعروف، وإماطة الأذى صدقة.","kind":"B2_hadith_quote","lesson":"adab.tareeq","pos":37,"secs":8.24,"dens":0.08,"before":null,"after":null,"pending":false,"session":1},{"u":"src.tar.hadith","ids":["src.tar.hadith"],"text":"قال النبي ﷺ: «فأعطوا الطريقَ حقَّها». قالوا: وما حقّ الطريق؟ قال: «غضّ البصر، وكفّ الأذى، وردّ السلام، وأمرٌ بالمعروف، ونهيٌ عن المنكر».","disp":"قال النبي صلى الله عليه وسلم: «فأعطوا الطريقَ حقَّها». قالوا: وما حقّ الطريق؟ قال: «غضّ البصر، وكفّ الأذى، وردّ السلام، وأمرٌ بالمعروف، ونهيٌ عن المنكر».","kind":"B2_hadith_quote","lesson":"adab.tareeq","pos":37,"secs":12.13,"dens":0.1,"before":null,"after":null,"pending":false,"session":1},{"u":"src.tar.sadaqa","ids":["src.tar.sadaqa"],"text":"وفي الحديث: «ويُميطُ الأذى عن الطريق صدقة».","disp":"وفي الحديث: «ويُميطُ الأذى عن الطريق صدقة».","kind":"B2_hadith_quote","lesso 02,"dens":0.04,"before":null,"after":null,"pending":false,"session":1},{"u":"src.jar.hadith","ids":["src.jar.hadith"],"text":"قال رسول الله ﷺ: «يا أبا ذر: إذا طبختَ مرقةً فأكثِر ماءَها وتعاهَدْ جيرانَك».","disp":"قال رسول الله صلى الله عليه وسلم: «يا أبا ذر: إذا طبختَ مرقةً فأكثِر ماءَها وتعاهَدْ جيرانَك».","kind":"B2_hadith_quote","lesson":"adab.jar","pos":39,"secs":7.68,"dens":0.14,"before":null,"after":null,"pending":false,"session":1},{"u":"src.jar.warn","ids":["src.jar.warn"],"text":"وقال النبي ﷺ: «من كان يؤمن بالله واليوم الآخر فلا يؤذي جارَه».","disp":"وقال النبي صلى الله عليه وسلم: «من كان يؤمن بالله واليوم الآخر فلا يؤذي جارَه».","kind":"B2_hadith_quote","lesson":"adab.jar","pos":39,"secs":7.02,"dens":0.02,"before":null,"after":null,"pending":false,"session":1},{"u":"tad.adab.jar","ids":["tad.adab.jar"],"text":"قال النبي ﷺ: من كان يؤمن بالله واليوم الآخر فلا يؤذي جاره.","disp":"قال النبي صلى الله عليه وسلم: من كان يؤمن بالله واليوم الآخر فلا يؤذي جاره.","kind":"B2_hadith_quote","lesson":"adab.jar","pos":39,"secs":6.91,"dens":0.0,"before":null,"after":null,"pending":false,"session":1},{"u":"src.taj.ayah~1","ids":["src.taj.ayah"],"text":"التجسّس: هو الكشف والبحث عن عورات الناس وما يسترونه. ومن صوره المحرّمة: الاطّلاع على عورات الناس في البيوت، واستماع المرء إلى حديث قومٍ بدون علمهم. قال تَعَالَى:","disp":"التجسّس: هو الكشف والبحث عن عورات الناس وما يسترونه. ومن صوره المحرّمة: الاطّلاع على عورات الناس في البيوت، واستماع المرء إلى حديث قومٍ بدون علمهم. قال تَعَالَى:","kind":"B4_mixed_ayah","lesson":"akhlaq.tajassus","pos":40,"secs":13.91,"dens":0.06,"before":null,"after":{"ayah":"﴿وَلَا تَجَسَّسُوا﴾","ref":"الحجرات: ١٢"},"pending":false,"session":1},{"u":"src.sidq.hadith","ids":["src.sidq.hadith"],"text":"قال النبي ﷺ: «إنَّ الصِّدقَ يَهْدي إلى البِرِّ، وإنَّ البِرَّ يَهْدي إلى الجنَّةِ، وإنَّ الرَّجلَ لَيَصْدُقُ حتَّى يكونَ صِدِّيقًا».","disp":"قال النبي صلى الله عليه وسلم: «إنَّ الصِّدقَ يَهْدي إلى البِرِّ، وإنَّ البِرَّ يَهْدي إلى الجنَّةِ، وإنَّ الرَّجلَ لَيَصْدُقُ حتَّى يكونَ صِدِّيقًا».","kind":"B2_hadith_quote","lesson":"akhlaq.sidq","pos":41,"secs":9.79,"dens":0.53,"before":null,"after":null,"pending":false,"session":1},{"u":"end.akhlaq.ghish","ids":["end.akhlaq.ghish"],"text":"تعلّمتَ اليوم: الغشّ ومنه إخفاء عيب السلعة، وقال النبي صلى الله عليه وسلم: من غشّ فليس منّي.","disp":"تعلّمتَ اليوم: الغشّ ومنه إخفاء عيب السلعة، وقال النبي صلى الله عليه وسلم: من غشّ فليس منّي.","kind":"B2_hadith_quote","lesson":"akhlaq.ghish","pos":42,"secs":7.79,"dens":0.07,"before":null,"after":null,"pending":false,"session":1},{"u":"st.ghi.4","ids":["st.ghi.4"],"text":"قال: أفلا جعلتَه فوق الطعام كي يراه الناس؟ من غشّ فليس منّي.","disp":"قال: أفلا جعلتَه فوق الطعام كي يراه الناس؟ من غشّ فليس منّي.","kind":"B2_hadith_quote","lesson":"akhlaq.ghish","pos":42,"secs":5.13,"dens":0.07,"before":null,"after":null,"pending":false,"session":1},{"u":"src.ghi.hadith","ids":["src.ghi.hadith"],"text":"عن أبي هريرة رضي الله عنه، أنّ رسول الله ﷺ مرّ على صُبرة طعام، فأدخل يده فيها، فنالت أصابعه بللًا، فقال: «ما هذا يا صاحب الطعام؟» قال: أصابته السماء يا رسول الله. قال: «أفلا جعلتَه فوق الطعام كي يراه الناس؟ من غشّ فليس منّي».","disp":"عن أبي هريرة رضي الله عنه، أنّ رسول الله صلى الله عليه وسلم مرّ على صُبرة طعام، فأدخل يده فيها، فنالت أصابعه بللًا، فقال: «ما هذا يا صاحب الطعام؟» قال: أصابته السماء يا رسول الله. قال: «أفلا جعلتَه فوق الطعام كي يراه الناس؟ من غشّ فليس منّي».","kind":"B2_hadith_quote","lesson":"akhlaq.ghish","pos":42,"secs":19.68,"dens":0.04,"before":null,"after":null,"pending":false,"session":1},{"u":"src.kib.def","ids":["src.kib.def"],"text":"التواضع: أن لا يرى الإنسان نفسه على الناس، فلا يستحقر الناس ولا يرفض الحقّ.","disp":"التواضع: أن لا يرى الإنسان نفسه على الناس، فلا يستحقر الناس ولا يرفض الحقّ.","kind":"B3_sacred_text","lesson":"akhlaq.kibr","pos":43,"secs":6.79,"dens":0.02,"before":null,"after":null,"pending":false,"session":1},{"u":"src.kib.q","ids":["src.kib.q"],"text":"قال رسول الله ﷺ: «لا يدخل الجنّة من كان في قلبه مثقال ذرّةٍ من كِبر». فقال رجل: إنّ الرجل يحبّ أن يكون ثوبه حسنًا ونعله حسنة؟ قال: «إنّ الله جميلٌ يحبّ الجمال، الكِبر: بَطَرُ الحقّ وغَمْطُ الناس».","disp":"قال رسول الله صلى الله عليه وسلم: «لا يدخل الجنّة من كان في قلبه مثقال ذرّةٍ من كِبر». فقال رجل: إنّ الرجل يحبّ أن يكون ثوبه حسنًا ونعله حسنة؟ قال: «إنّ الله جميلٌ يحبّ الجمال، الكِبر: بَطَرُ الحقّ وغَمْطُ الناس».","kind":"B2_hadith_quote","lesson":"akhlaq.kibr","pos":43,"secs":16.35,"dens":0.14,"before":null,"after":null,"pending":false,"session":1},{"u":"src.haya.ghayb~1","ids":["src.haya.ghayb","src.mur.ghayb"],"text":"لا يعلم الغيب إلا الله وحده. قال تَعَالَى:","disp":"لا يعلم الغيب إلا الله وحده. قال تَعَالَى:","kind":"B4_mixed_ayah","lesson":"akhlaq.haya","pos":44,"secs":3.68,"dens":0.1,"before":null,"after":{"ayah":"﴿قُل لَّا يَعْلَمُ مَن فِي السَّمَاوَاتِ وَالْأَرْضِ الْغَيْبَ إِلَّا اللَّهُ﴾","ref":"النمل: ٦٥"},"pending":false,"session":1},{"u":"end.adhkar.mubtala","ids":["end.adhkar.mubtala"],"text":"تعلّمتَ اليوم: إذا رأيتَ مبتلًى قلتَ الحمد لله الذي عافاني ممّا ابتلاك به وفضّلني على كثيرٍ ممّن خلق تفضيلًا، وتقولها في نفسك.","disp":"تعلّمتَ اليوم: إذا رأيتَ مبتلًى قلتَ الحمد لله الذي عافاني ممّا ابتلاك به وفضّلني على كثيرٍ ممّن خلق تفضيلًا، وتقولها في نفسك.","kind":"B2_hadith_quote","lesson":"adhkar.mubtala","pos":45,"secs":10.57,"dens":0.11,"before":null,"after":null,"pending":false,"session":1},{"u":"src.mub.dua","ids":["src.mub.dua"],"text":"الدعاء إذا رأيت مبتلًى: «الحمد لله الذي عافاني ممّا ابتلاك به، وفضّلني على كثيرٍ ممّن خلق تفضيلًا».","disp":"الدعاء إذا رأيت مبتلًى: «الحمد لله الذي عافاني ممّا ابتلاك به، وفضّلني على كثيرٍ ممّن خلق تفضيلًا».","kind":"B2_hadith_quote","lesson":"adhkar.mubtala","pos":45,"secs":8.35,"dens":0.08,"before":null,"after":null,"pending":false,"session":2},{"u":"src.tw.def~1","ids":["src.tw.def"],"text":"التوكّل على الله تَعَالَى: هو الاعتماد على الله تَعَالَى في جلب المنافع ودفع المضارّ، مع الأخذ بالأسباب. قال تَعَالَى:","disp":"التوكّل على الله تَعَالَى: هو الاعتماد على الله تَعَالَى في جلب المنافع ودفع المضارّ، مع الأخذ بالأسباب. قال تَعَالَى:","kind":"B4_mixed_ayah","lesson":"aqeedah.tawakkul","pos":46,"secs":9.79,"dens":0.13,"before":null,"after":{"ayah":"﴿وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ﴾","ref":"الطلاق: ٣"},"pending":false,"session":2},{"u":"end.hadith.kanz","ids":["end.hadith.kanz"],"text":"تعلّمتَ اليوم: لا حول ولا قوّة إلا بالله كنزٌ من كنوز الجنّة، وفيها تبرّؤ العبد من حوله وقوّته، واعتماده على الله وحده.","disp":"تعلّمتَ اليوم: لا حول ولا قوّة إلا بالله كنزٌ من كنوز الجنّة، وفيها تبرّؤ العبد من حوله وقوّته، واعتماده على الله وحده.","kind":"B2_hadith_quote","lesson":"hadith.kanz","pos":47,"secs":10.02,"dens":0.08,"before":null,"after":null,"pending":false,"session":2},{"u":"src.kanz.hadith","ids":["src.kanz.hadith"],"text":"عن أبي موسى رضي الله عنه قال: قال رسول الله ﷺ: «لا حولَ ولا قوّةَ إلا بالله كنزٌ من كنوز الجنّة».","disp":"عن أبي موسى رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «لا حولَ ولا قوّةَ إلا بالله كنزٌ من كنوز الجنّة».","kind":"B2_hadith_quote","lesson":"hadith.kanz","pos":47,"secs":9.35,"dens":0.08,"before":null,"after":null,"pending":false,"session":2},{"u":"end.hadith.qalb","ids":["end.hadith.qalb"],"text":"تعلّمتَ اليوم: في الجسد مضغة إذا صلحت صلح الجسد كلّه، وإذا فسدت فسد الجسد كلّه، ألا وهي القلب.","disp":"تعلّمتَ اليوم: في الجسد مضغة إذا صلحت صلح الجسد كلّه، وإذا فسدت فسد الجسد كلّه، ألا وهي القلب.","kind":"B2_hadith_quote","lesson":"hadith.qalb","pos":48,"secs":8.02,"dens":0.06,"before":null,"after":null,"pending":false,"session":2},{"u":"src.qal.hadith","ids":["src.qal.hadith"],"text":"عن النعمان بن بشير رضي الله عنهما قال: سمعت رسول الله ﷺ يقول: «ألا وإنّ في الجسد مضغةً إذا صلحت صلح الجسد كلّه، وإذا فسدت فسد الجسد كلّه، ألا وهي القلب».","disp":"عن النعمان بن بشير رضي الله عنهما قال: سمعت رسول الله صلى الله عليه وسلم يقول: «ألا وإنّ في الجسد مضغةً إذا صلحت صلح الجسد كلّه، وإذا فسدت فسد الجسد كلّه، ألا وهي القلب».","kind":"B2_hadith_quote","lesson":"hadith.qalb","pos":48,"secs":14.35,"dens":0.04,"before":null,"after":null,"pending":false,"session":2},{"u":"src.tawb.ayah~1","ids":["src.tawb.ayah"],"text":"التوبة: هي الرجوع عن معصية الله تَعَالَى إلى طاعته. قال تَعَالَى:","disp":"التوبة: هي الرجوع عن معصية الله تَعَالَى إلى طاعته. قال تَعَالَى:","kind":"B4_mixed_ayah","lesson":"akhlaq.tawbah","pos":49,"secs":5.46,"dens":0.13,"before":null,"after":{"ayah":"﴿وَإِنِّي لَغَفَّارٌ لِّمَن تَابَ وَآمَنَ وَعَمِلَ صَالِحًا ثُمَّ اهْتَدَىٰ﴾","ref":"طه: ٨٢"},"pending":false,"session":2},{"u":"src.tawb.ayah~2","ids":["src.tawb.ayah"],"text":"وأستغفر الله: أي أطلب المغفرة من الله","disp":"وأستغفر الله: أي أطلب المغفرة من الله","kind":"B4_mixed_ayah","lesson":"akhlaq.tawbah","pos":49,"secs":3.68,"dens":0.0,"before":{"ayah":"﴿وَإِنِّي لَغَفَّارٌ لِّمَن تَابَ وَآمَنَ وَعَمِلَ صَالِحًا ثُمَّ اهْتَدَىٰ﴾","ref":"طه: ٨٢"},"after":null,"pending":false,"session":2},{"u":"src.ihs.list","ids":["src.ihs.list"],"text":"ضدّ الإحسان الإساءة، ومن ذلك: ترك الإخلاص في عبادة الله تَعَالَى، وعقوق الوالدين، وقطع الأرحام، وسوء الجوار، وترك الإحسان إلى الفقراء والمساكين، وغير ذلك من سيّئ الأقوال والأعمال.","disp":"ضدّ الإحسان الإساءة، ومن ذلك: ترك الإخلاص في عبادة الله تَعَالَى، وعقوق الوالدين، وقطع الأرحام، وسوء الجوار، وترك الإحسان إلى الفقراء والمساكين، وغير ذلك من سيّئ الأقوال والأعمال.","kind":"B3_sacred_text","lesson":"akhlaq.ihsan","pos":50,"secs":15.79,"dens":0.04,"before":null,"after":null,"pending":false,"session":2},{"u":"src.tym.how.a~1","ids":["src.tym.how.a"],"text":"التيمّم: هو استعمال التراب وغيره من صعيد الأرض، عند فقد الماء أو تعذّر استعماله. قال تعالى:","disp":"التيمّم: هو استعمال التراب وغيره من صعيد الأرض، عند فقد الماء أو تعذّر استعماله. قال تعالى:","kind":"B4_mixed_ayah","lesson":"ibadah.tayammum","pos":51,"secs":8.13,"dens":0.03,"before":null,"after":{"ayah":"﴿فَلَمْ تَجِدُوا مَاءً فَتَيَمَّمُوا صَعِيدًا طَيِّبًا فَامْسَحُوا بِوُجُوهِكُمْ وَأَيْدِيكُمْ﴾","ref":"النساء: ٤٣"},"pending":false,"session":2},{"u":"src.tym.how.b","ids":["src.tym.how.b"],"text":"وصفته: بضرب التراب ضربةً واحدة بباطن الكفّين، ومسح الوجه وظاهر الكفّين مرّةً واحدة.","disp":"وصفته: بضرب التراب ضربةً واحدة بباطن الكفّين، ومسح الوجه وظاهر الكفّين مرّةً واحدة.","kind":"B3_sacred_text","lesson":"ibadah.tayammum","pos":51,"secs":7.35,"dens":0.08,"before":null,"after":null,"pending":false,"session":2},{"u":"src.ahk.five.a","ids":["src.ahk.five.a"],"text":"الأحكام التكليفية خمسة: الواجب — يُثاب فاعله ويُعاقب تاركه. المستحبّ — يُثاب فاعله ولا يُعاقب تاركه، ويسمّى السنّة والمندوب.","disp":"الأحكام التكليفية خمسة: الواجب — يُثاب فاعله ويُعاقب تاركه. المستحبّ — يُثاب فاعله ولا يُعاقب تاركه، ويسمّى السنّة والمندوب.","kind":"B3_sacred_text","lesson":"misc.ahkam","pos":52,"secs":10.68,"dens":0.08,"before":null,"after":null,"pending":false,"session":2},{"u":"src.ahk.five.b","ids":["src.ahk.five.b"],"text":"المحرّم — يُثاب تاركه ويُعاقب فاعله. المكروه — يُثاب تاركه ولا يُعاقب فاعله. المباح — لا يُثاب تاركه ولا يُعاقب فاعله، ويسمّى الجائز والحلال.","disp":"المحرّم — يُثاب تاركه ويُعاقب فاعله. المكروه — يُثاب تاركه ولا يُعاقب فاعله. المباح — لا يُثاب تاركه ولا يُعاقب فاعله، ويسمّى الجائز والحلال.","kind":"B3_sacred_text","lesson":"misc.ahkam","pos":52,"secs":11.79,"dens":0.08,"before":null,"after":null,"pending":false,"session":2},{"u":"src.ark2.tama","ids":["src.ark2.tama"],"text":"والطمأنينة: وهي السكون في كل ركنٍ فعلي. لقوله ﷺ: «ثم اسجد حتى تطمئنّ ساجدًا، ثم ارفع حتى تطمئنّ جالسًا».","disp":"والطمأنينة: وهي السكون في كل ركنٍ فعلي. لقوله صلى الله عليه وسلم: «ثم اسجد حتى تطمئنّ ساجدًا، ثم ارفع حتى تطمئنّ جالسًا».","kind":"B2_hadith_quote","lesson":"ibadah.arkanSalat","pos":53,"secs":10.13,"dens":0.07,"before":null,"after":null,"pending":false,"session":2},{"u":"src.tash.full.a","ids":["src.tash.full.a"],"text":"«التحيّاتُ لله والصلواتُ والطيّبات، السلامُ عليك أيّها النبيُّ ورحمةُ الله وبركاتُه، السلامُ علينا وعلى عباد الله الصالحين، أشهدُ أن لا إله إلا الله، وأشهدُ أنّ محمدًا عبدُه ورسولُه»،","disp":"«التحيّاتُ لله والصلواتُ والطيّبات، السلامُ عليك أيّها النبيُّ ورحمةُ الله وبركاتُه، السلامُ علينا وعلى عباد الله الصالحين، أشهدُ أن لا إله إلا الله، وأشهدُ أنّ محمدًا عبدُه ورسولُه»،","kind":"B2_hadith_quote","lesson":"ibadah.tashahhud","pos":54,"secs":15.02,"dens":0.13,"before":null,"after":null,"pending":false,"session":2},{"u":"src.tash.full.b","ids":["src.tash.full.b"],"text":"ثم يُصلّي على النبي ﷺ، ثم يقول: «أعوذ بالله من عذاب جهنّم، ومن عذاب القبر، ومن فتنة المحيا والممات، ومن فتنة المسيح الدجّال»، ثم يدعو ربّه بما أحبّ من خيري الدنيا والآخرة.","disp":"ثم يُصلّي على النبي صلى الله عليه وسلم، ثم يقول: «أعوذ بالله من عذاب جهنّم، ومن عذاب القبر، ومن فتنة المحيا والممات، ومن فتنة المسيح الدجّال»، ثم يدعو ربّه بما أحبّ من خيري الدنيا والآخرة.","kind":"B2_hadith_quote","lesson":"ibadah.tashahhud","pos":54,"secs":15.79,"dens":0.05,"before":null,"after":null,"pending":false,"session":2},{"u":"src.raw.fadl","ids":["src.raw.fadl"],"text":"السنن الرواتب: هي ثنتا عشرة ركعة في اليوم والليلة، من صلّاها بُني له بيتٌ في الجنّة. والعمرة: التعبّد لله تَعَالَى بالطواف بالبيت والسعي بين الصفا والمروة، وأركانها: الإحرام، والطواف، والسعي.","disp":"السنن الرواتب: هي ثنتا عشرة ركعة في اليوم والليلة، من صلّاها بُني له بيتٌ في الجنّة. والعمرة: التعبّد لله تَعَالَى بالطواف بالبيت والسعي بين الصفا والمروة، وأركانها: الإحرام، والطواف، والسعي.","kind":"B3_sacred_text","lesson":"ibadah.rawatib","pos":55,"secs":16.46,"dens":0.06,"before":null,"after":null,"pending":false,"session":2},{"u":"src.zak.ayah~1","ids":["src.zak.ayah"],"text":"الزكاة: حقٌّ واجب في مالٍ خاصّ لطائفةٍ مخصوصة في وقتٍ مخصوص، وهي ركنٌ من أركان الإسلام. قال تَعَالَى:","disp":"الزكاة: حقٌّ واجب في مالٍ خاصّ لطائفةٍ مخصوصة في وقتٍ مخصوص، وهي ركنٌ من أركان الإسلام. قال تَعَالَى:","kind":"B4_mixed_ayah","lesson":"ibadah.zakat","pos":56,"secs":8.13,"dens":0.14,"before":null,"after":{"ayah":"﴿وَآتُوا الزَّكَاةَ﴾","ref":"البقرة: ٤٣"},"pending":false,"session":2},{"u":"src.zak.ayah~2","ids":["src.zak.ayah"],"text":"والصدقة المستحبّة: التصدّق بأيّ شيء في وجوه الخير في أيّ وقت. قال تَعَالَى:","disp":"والصدقة المستحبّة: التصدّق بأيّ شيء في وجوه الخير في أيّ وقت. قال تَعَالَى:","kind":"B4_mixed_ayah","lesson":"ibadah.zakat","pos":56,"secs":6.24,"dens":0.13,"before":{"ayah":"﴿وَآتُوا الزَّكَاةَ﴾","ref":"البقرة: ٤٣"},"after":{"ayah":"﴿وَأَنفِقُوا فِي سَبِيلِ اللَّهِ﴾","ref":"البقرة: ١٩٥"},"pending":false,"session":2},{"u":"src.sawm.sunan","ids":["src.sawm.sunan"],"text":"من سنن الصيام: تعجيل الفطر، والسحور وتأخيره، والزيادة في أعمال الخير والعبادة، وقول الصائم إذا شُتم: «إنّي صائم»، والدعاء عند الفطر، والفطر على رطبٍ أو تمر فإن لم يجد فعلى ماء.","disp":"من سنن الصيام: تعجيل الفطر، والسحور وتأخيره، والزيادة في أعمال الخير والعبادة، وقول الصائم إذا شُتم: «إنّي صائم»، والدعاء عند الفطر، والفطر على رطبٍ أو تمر فإن لم يجد فعلى ماء.","kind":"B2_hadith_quote","lesson":"ibadah.sawm","pos":57,"secs":15.13,"dens":0.02,"before":null,"after":null,"pending":false,"session":2},{"u":"src.sawm.fadl","ids":["src.sawm.fadl"],"text":"عن أبي سعيد الخدري رضي الله عنه قال: قال رسول الله ﷺ: «ما من عبدٍ يصوم يومًا في سبيل الله، إلا باعد الله بذلك اليوم وجهه عن النار سبعين خريفًا». ومعنى «سبعين خريفًا» أي: سبعين سنة.","disp":"عن أبي سعيد الخدري رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «ما من عبدٍ يصوم يومًا في سبيل الله، إلا باعد الله بذلك اليوم وجهه عن النار سبعين خريفًا». ومعنى «سبعين خريفًا» أي: سبعين سنة.","kind":"B2_hadith_quote","lesson":"ibadah.sawm","pos":57,"secs":16.46,"dens":0.03,"before":null,"after":null,"pending":false,"session":2},{"u":"src.feel.full","ids":["src.feel.full"],"text":"سورة الفيل: أراد أصحاب الفيل هدم الكعبة، فجعل الله تدبيرهم في ضياع، وأرسل عليهم طيرًا جماعاتٍ ترميهم بحجارةٍ من طينٍ متحجّر، فجعلهم كورق زرعٍ أكلته الدوابّ وداسته.","disp":"سورة الفيل: أراد أصحاب الفيل هدم الكعبة، فجعل الله تدبيرهم في ضياع، وأرسل عليهم طيرًا جماعاتٍ ترميهم بحجارةٍ من طينٍ متحجّر، فجعلهم كورق زرعٍ أكلته الدوابّ وداسته.","kind":"B3_sacred_text","lesson":"quran.feel","pos":58,"secs":14.24,"dens":0.06,"before":null,"after":null,"pending":false,"session":2},{"u":"src.yat.full.s1","ids":["src.yat.full.s1"],"text":"وُلد ﷺ في عام الفيل، في يوم الإثنين من شهر ربيع الأوّل، في مكّة. تُوفّي أبوه في المدينة وهو حملٌ في بطن أمّه. ومن مرضعاته حليمة السعديّة.","disp":"وُلد صلى الله عليه وسلم في عام الفيل، في يوم الإثنين من شهر ربيع الأوّل، في مكّة. تُوفّي أبوه في المدينة وهو حملٌ في بطن أمّه. ومن مرضعاته حليمة السعديّة.","kind":"B3_sacred_text","lesson":"seerah.yateem","pos":59,"secs":12.79,"dens":0.08,"before":null,"after":null,"pending":false,"session":2},{"u":"src.yat.full.s2","ids":["src.yat.full.s2"],"text":"توفّيت أمّه وهو ابن ست سنين، وكفله جدّه عبد المطلب. ثم توفّي جدّه وهو ابن ثمان سنين، وكفله عمّه أبو طالب.","disp":"توفّيت أمّه وهو ابن ست سنين، وكفله جدّه عبد المطلب. ثم توفّي جدّه وهو ابن ثمان سنين، وكفله عمّه أبو طالب.","kind":"B3_sacred_text","lesson":"seerah.yateem","pos":59,"secs":8.68,"dens":0.08,"before":null,"after":null,"pending":false,"session":2},{"u":"src.wahy.iqra~1","ids":["src.wahy.iqra"],"text":"أوّل ما نزل عليه من القرآن قوله تَعَالَى:","disp":"أوّل ما نزل عليه من القرآن قوله تَعَالَى:","kind":"B4_mixed_ayah","lesson":"seerah.wahy","pos":60,"secs":3.57,"dens":0.14,"before":null,"after":{"ayah":"﴿اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ ١ خَلَقَ الْإِنسَانَ مِنْ عَلَقٍ ٢ اقْرَأْ وَرَبُّكَ الْأَكْرَمُ ٣ الَّذِي عَلَّمَ بِالْقَلَمِ ٤ عَلَّمَ الْإِنسَانَ مَا لَمْ يَعْلَمْ ٥﴾","ref":"العلق: ١–٥"},"pending":false,"session":2},{"u":"src.hij.full.s1","ids":["src.hij.full.s1"],"text":"بقي ﷺ في مكّة يدعو ثلاث عشرة سنة، وكان يدعو أهل الطائف ويعرض نفسه في المواسم ومجامع الناس، حتى جاء أهل المدينة من الأنصار فآمنوا به وبايعوه على نصرته.","disp":"بقي صلى الله عليه وسلم في مكّة يدعو ثلاث عشرة سنة، وكان يدعو أهل الطائف ويعرض نفسه في المواسم ومجامع الناس، حتى جاء أهل المدينة من الأنصار فآمنوا به وبايعوه على نصرته.","kind":"B3_sacred_text","lesson":"seerah.hijrah","pos":61,"secs":15.02,"dens":0.01,"before":null,"after":null,"pending":false,"session":2},{"u":"src.hij.full.s2","ids":["src.hij.full.s2"],"text":"ثم هاجر من مكّة إلى المدينة، وبقي فيها عشر سنين، وفُرض عليه فيها الزكاة والصيام والحجّ والجهاد والأذان وغيرها من شرائع الإسلام.","disp":"ثم هاجر من مكّة إلى المدينة، وبقي فيها عشر سنين، وفُرض عليه فيها الزكاة والصيام والحجّ والجهاد والأذان وغيرها من شرائع الإسلام.","kind":"B3_sacred_text","lesson":"seerah.hijrah","pos":61,"secs":11.46,"dens":0.03,"before":null,"after":null,"pending":false,"session":2},{"u":"src.ras.sunna","ids":["src.ras.sunna"],"text":"الأدب مع الرسول ﷺ: طاعته فيما أمر، وتصديقه فيما أخبر، وعدم معصيته، ولا يُعبد الله إلا بما شرع وهو الاقتداء بالسنّة وترك البدعة.","disp":"الأدب مع الرسول صلى الله عليه وسلم: طاعته فيما أمر، وتصديقه فيما أخبر، وعدم معصيته، ولا يُعبد الله إلا بما شرع وهو الاقتداء بالسنّة وترك البدعة.","kind":"B3_sacred_text","lesson":"adab.rasul","pos":62,"secs":12.79,"dens":0.02,"before":null,"after":null,"pending":false,"session":2},{"u":"src.ras.ayat~2","ids":["src.ras.ayat","src.izz.ayah"],"text":"وقال سبحانه:","disp":"وقال سبحانه:","kind":"B4_mixed_ayah","lesson":"adab.rasul","pos":62,"secs":1.46,"dens":0.0,"before":{"multi":true},"after":{"multi":true},"pending":false,"session":2}],"entries":{"end.adhkar.istiqadh":{"parts":[{"u":"end.adhkar.istiqadh"}],"ok":true},"src.ist.three":{"parts":[{"u":"src.ist.three"}],"ok":true},"say.ist.1":{"parts":[{"u":"say.ist.1"}],"ok":true},"say.ist.2":{"parts":[{"u":"say.ist.2"}],"ok":true},"say.ist.3":{"parts":[{"u":"say.ist.3"}],"ok":true},"say.ist.4":{"parts":[{"u":"say.ist.4"}],"ok":true},"end.adhkar.sabah":{"parts":[{"u":"end.adhkar.sabah"}],"ok":true},"src.sab.wudu":{"parts":[{"u":"src.sab.wudu"}],"ok":true},"src.sab.out":{"parts":[{"u":"src.sab.out"}],"ok":true},"say.sab.1":{"parts":[{"u":"say.ist.4"}],"ok":true},"say.sab.2":{"parts":[{"u":"say.sab.2"}],"ok":true},"say.sab.3":{"parts":[{"u":"say.sab.3"}],"ok":true},"end.adhkar.thawb":{"parts":[{"u":"end.adhkar.thawb"}],"ok":true},"rev.thw.1":{"parts":[{"u":"rev.thw.1"}],"ok":true},"rev.thw.2":{"parts":[{"u":"rev.thw.2"}],"ok":true},"rev.thw.3":{"parts":[{"u":"rev.thw <script>
"use strict";
/* ══════════ البيانات المضمَّنة ══════════ */
const Q = JSON.parse(document.getElementById("queue").textContent);
const ALL = Q.units;                         /* وحدات التسجيل بترتيب المسار */
const ENTRIES = Q.entries;                   /* id → {parts:[{u}|{url:[…]}], ok} */
const HASHES = Q.hashes;                     /* id → pack_key للنص عند البناء (لكشف تغيّر النص) */
const TASH0 = Q.tashkeel || {};              /* تشكيل كامل مقترح (وحدة → نص) */
const $ = id => document.getElementById(id);
const nf = new Intl.NumberFormat("ar-EG");
const num = n => nf.format(n);

/* ══════════ تخزين آمن: IndexedDB مع احتياطي في الذاكرة ══════════ */
const DB = (() => {
  let db = null, mem = { takes: new Map(), partial: new Map(), meta: new Map() }, usingMem = false;
  const open = () => new Promise(res => {
    try {
      const rq = indexedDB.open("athar-record-v1-p2", 1);
      rq.onupgradeneeded = () => { const d = rq.result; ["takes", "partial", "meta"].forEach(s => d.createObjectStore(s)); };
      rq.onsuccess = () => { db = rq.result; res(true); };
      rq.onerror = rq.onblocked = () => { usingMem = true; res(false); };
    } catch (e) { usingMem = true; res(false); }
  });
  const tx = (s, mode, fn) => new Promise((res, rej) => {
    if (usingMem || !db) { try { res(fn(null)); } catch (e) { rej(e); } return; }
    try {
      const t = db.transaction(s, mode), st = t.objectStore(s); let out;
      const r = fn(st); if (r && "onsuccess" in r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = t.onabort = () => rej(t.error || new Error("idb"));
    } catch (e) { rej(e); }
  });
  return {
    open, get mem() { return usingMem; },
    put: (s, k, v) => usingMem ? (mem[s].set(k, v), Promise.resolve()) : tx(s, "readwrite", st => st.put(v, k)),
    get: (s, k) => usingMem ? Promise.resolve(mem[s].get(k)) : tx(s, "readonly", st => st.get(k)),
    del: (s, k) => usingMem ? (mem[s].delete(k), Promise.resolve()) : tx(s, "readwrite", st => st.delete(k)),
    keys: s => usingMem ? Promise.resolve([...mem[s].keys()]) : tx(s, "readonly", st => st.getAllKeys()),
    clear: s => usingMem ? (mem[s].clear(), Promise.resolve()) : tx(s, "readwrite", st => st.clear())
  };
})();

/* ══════════ الحالة ══════════ */
const PRESETS = [["human_reader", "human_reader — القارئ (افتراضي)"], ["human_reader2", "human_reader2 — قارئ ثانٍ"], ["human_parent", "human_parent — الوالد/الوالدة"], ["human_teacher", "human_teacher — المعلّم"], ["__custom", "مخصَّص…"]];
const S = {
  speaker: "", voice: Q.voice_default || "human_reader", showPending: false, auto: false, fmt: "native", idx: 0, theme: "",
  fs: 1, takes: new Map(),      /* u → {mime, dur, bytes, ts, rec?} للصوت الحالي */
  tash: {},              /* وحدة → نص مشكَّل مستورد */
  recording: false, busy: false, kf: "all"
};
const view = () => ALL.filter(u => (S.showPending || !u.pending) && (!S.kf || S.kf === "all" || u.kind === S.kf));
const cur = () => view()[Math.min(S.idx, view().length - 1)];
const key = u => S.voice + "|" + u;
const validVoice = v => /^[a-z0-9][a-z0-9_-]{0,40}$/.test(v);

let toastT = 0;
function toast(msg, ms = 2600) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), ms); }
function fmtDur(s) { s = Math.max(0, s || 0); return (s < 10 ? s.toFixed(1) : Math.round(s)) + "ث"; }
function tfmt(ms) { const s = Math.floor(ms / 1000), m = Math.floor(s / 60); return String(m).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }

/* ══════════ حفظ/تحميل الإعدادات ══════════ */
async function saveMeta() {
  try { await DB.put("meta", "state", { speaker: S.speaker, voice: S.voice, showPending: S.showPending, auto: S.auto, fmt: S.fmt, idx: S.idx, kf: S.kf, theme: S.theme, tash: S.tash }); } catch (e) {}
}
async function loadMeta() {
  try {
    const m = await DB.get("meta", "state");
    if (m) { for (const k of ["speaker", "voice", "showPending", "auto", "fmt", "idx", "kf", "theme", "tash"]) if (m[k] !== undefined) S[k] = m[k]; }
  } catch (e) {}
  if (!validVoice(S.voice)) S.voice = "human_reader";
  applyTheme();
}
function applyTheme() { if (S.theme) document.documentElement.setAttribute("data-theme", S.theme); else document.documentElement.removeAttribute("data-theme"); }

async function loadTakes() {
  S.takes = new Map();
  try {
    const ks = await DB.keys("takes");
    for (const k of ks) {
      if (!String(k).startsWith(S.voice + "|")) continue;
      const t = await DB.get("takes", k);
      if (t && t.blob) S.takes.set(String(k).slice(S.voice.length + 1), { mime: t.mime, dur: t.dur, bytes: t.blob.size, ts: t.ts, rec: !!t.recovered });
    }
  } catch (e) {}
}
/* استرجاع تسجيل لم يكتمل إيقافه (إغلاق مفاجئ) */
async function recoverPartials() {
  let n = 0;
  try {
    const ks = await DB.keys("partial");
    for (const k of ks) {
      const p = await DB.get("partial", k);
      const [voice, u] = [String(k).split("|")[0], String(k).split("|").slice(1).join("|")];
      if (!p || !p.chunks || !p.chunks.length) { await DB.del("partial", k); continue; }
      const had = await DB.get("takes", k);
      if (!had) {
        const blob = new Blob(p.chunks, { type: p.mime });
        if (blob.size > 2000) { await DB.put("takes", k, { blob, mime: p.mime, dur: p.dur || 0, ts: Date.now(), recovered: true }); n++; }
      }
      await DB.del("partial", k);
    }
  } catch (e) {}
  return n;
}

/* ══════════ العرض ══════════ */
function textOf(u) { return S.tash[u.u] || TASH0[u.u] || u.disp; }
function tashBadge(u) {
  if (S.tash[u.u]) return ["تشكيل مستورَد", "ok"];
  if (TASH0[u.u]) return ["تشكيل كامل مقترح — راجعه", "ok"];
  if (u.dens >= 0.7) return ["مشكَّل", "ok"];
  return ["تشكيل جزئي — تثبّت قبل القراءة", "warn"];
}
function ctxHtml(c, dir) {
  if (!c) return "";
  if (c.multi) return "<b>" + (dir === "b" ? "قبل هذا المقطع" : "بعد هذا المقطع") + "</b>تُتلى آية من الحصري (تختلف باختلاف السطر) — اسكت قليلًا ثم تابع";
  return "<b>" + (dir === "b" ? "قبل هذا المقطع تُتلى (بصوت الحصري)" : "بعد هذا المقطع تُتلى (بصوت الحصري)") + (c.ref ? " — " + c.ref : "") + "</b><span class=\"a\">" + c.ayah.replace(/</g, "&lt;") + "</span>";
}
function render() {
  const V = view(); if (!V.length) return;
  S.idx = Math.max(0, Math.min(S.idx, V.length - 1));
  const u = V[S.idx], tk = S.takes.get(u.u);
  $("who").textContent = "المتحدث: " + (S.speaker || "— (حدّده من الإعدادات)") + " · voice: " + S.voice;
  $("ltext").textContent = textOf(u);
  $("scroll").scrollTop = 0;
  const tb = tashBadge(u);
  $("cmeta").innerHTML =
    "<span class=\"chip\">" + (u.pending ? "معلّق" : "الجلسة " + num(u.session) + " من " + num(Q.sessions)) + "</span>" +
    "<span class=\"chip " + (tk ? "ok" : "") + "\">" + (tk ? "مسجَّل ✓" : "بلا تسجيل") + "</span>" +
    "<span class=\"chip " + tb[1] + "\">" + tb[0] + "</span>" +
    (u.ids.length > 1 ? "<span class=\"chip\">مشترك بين " + num(u.ids.length) + " أسطر</span>" : "") +
    "<span>" + num(S.idx + 1) + " / " + num(V.length) + "</span>" +
    "<span class=\"uid\" id=\"uid\">" + u.u + "</span>" + (u.lesson ? "<span class=\"uid\">" + u.lesson + "</span>" : "");
  const b = $("cbefore"), a = $("cafter");
  b.hidden = !u.before; a.hidden = !u.after; b.innerHTML = ctxHtml(u.before, "b"); a.innerHTML = ctxHtml(u.after, "a");

  if (!validVoice(v)) { toast("اسم الصوت غير صالح: حروف إنجليزية صغيرة وأرقام و _ و - فقط"); return; }
  const changed = v !== S.voice;
  S.speaker = $("iSpeaker").value.trim(); S.showPending = $("cPend").checked; S.auto = $("cAuto").checked; S.fmt = $("sFmt").value; S.voice = v;
  if (changed) { await loadTakes(); S.idx = 0; }
  await saveMeta(); $("dSet").close(); render(); toast("حُفظت الإعدادات");
}

/* ══════════ ربط الأحداث ══════════ */
function bind() {
  $("bRec").onclick = () => S.recording ? stopRec(false) : startRec();
  $("bPrev").onclick = () => go(-1); $("bNext").onclick = () => go(1);
  $("bPlay").onclick = playTake;
  $("bRedo").onclick = () => { if (S.recording) stopRec(true); else startRec(); };
  $("bNextOpen").onclick = () => { $("dList").close(); nextOpen(); };
  $("bFp").onclick = () => setFs(S.fs + 1); $("bFm").onclick = () => setFs(S.fs - 1);
  $("bExport").onclick = openExport; $("eGo").onclick = doExport; $("eClose").onclick = () => $("dExp").close();
  $("bSet").onclick = openSettings; $("sClose").onclick = () => $("dSet").close(); $("sSave").onclick = saveSettings;
  $("sVoice").onchange = () => { $("iVoice").hidden = $("sVoice").value !== "__custom"; };
  $("sTheme").onclick = () => { S.theme = S.theme === "dark" ? "light" : "dark"; applyTheme(); saveMeta(); };
  $("sWipe").onclick = async () => {
    if (!confirm("سيُمسح كل ما سجَّلته في هذا الجهاز لهذا الصوت. هل أنت متأكد؟")) return;
    const ks = await DB.keys("takes"); for (const k of ks) if (String(k).startsWith(S.voice + "|")) await DB.del("takes", k);
    S.takes = new Map(); S.idx = 0; await saveMeta(); $("dSet").close(); render(); toast("مُسحت التسجيلات");
  };
  $("fTash").onchange = async ev => {
    const f = ev.target.files[0]; if (!f) return;
    try { const j = JSON.parse(await f.text()); const o = {}; let c = 0;
      for (const [k, v] of Object.entries(j)) { if (k[0] === "_" || typeof v !== "string") continue; o[k] = v; c++; }
      S.tash = Object.assign(S.tash, o); await saveMeta(); $("tashInfo").textContent = "استُورد " + num(c) + " سطرًا"; render();
    } catch (e) { $("tashInfo").textContent = "ملف غير صالح"; }
  };
  $("bList").onclick = () => { $("dList").showModal(); buildList(); const c = $("ulist").querySelector(".cur"); if (c) c.scrollIntoView({ block: "center" }); };
  $("lClose").onclick = () => $("dList").close();
  $("ulist").onclick = ev => { const li = ev.target.closest("li[data-i]"); if (li) { $("dList").close(); jump(+li.dataset.i); } };
  const syncK = () => [...$("kfilters").children].forEach(x => x.classList.toggle("on", x.dataset.k === (S.kf || "all")));
  $("kfilters").onclick = ev => { const b = ev.target.closest("button"); if (!b || S.recording) return; S.kf = b.dataset.k; if (!view().length) S.kf = "all"; S.idx = 0; syncK(); saveMeta(); render(); };
  window.__syncK = syncK;
  $("filters").onclick = ev => { const b = ev.target.closest("button"); if (!b) return; filt = b.dataset.f; [...$("filters").children].forEach(x => x.classList.toggle("on", x === b)); buildList(); };
  document.addEventListener("keydown", ev => {
    if (document.querySelector("dialog[open]") || /INPUT|SELECT|TEXTAREA/.test((ev.target || {}).tagName || "")) return;
    if (ev.code === "Space") { ev.preventDefault(); $("bRec").click(); }
    else if (ev.code === "ArrowLeft") go(1); else if (ev.code === "ArrowRight") go(-1);
    else if (ev.key === "p" || ev.key === "P") playTake();
  });
  window.addEventListener("beforeunload", () => { if (S.recording) { try { R.mr.requestData(); } catch (e) {} } });
  document.addEventListener("visibilitychange", () => { if (document.hidden && S.recording) toast("تنبيه: التسجيل مستمر؛ لا تغلق الصفحة", 3000); });
}

const CATS = [
  { k: "B1_dhikr_dua", ic: "🤲", n: "أذكار وأدعية" },
  { k: "B2_hadith_quote", ic: "📜", n: "أحاديث ومقتبسات" },
  { k: "B3_sacred_text", ic: "📖", n: "نصوص شرعية" },
  { k: "B4_mixed_ayah", ic: "🕌", n: "نصوص بين الآيات" },
  { k: "B5_pending_embedded_ayah", ic: "📗", n: "شروح فيها ألفاظ قرآنية" },
  { k: "all", ic: "🗂️", n: "كل الأقسام معًا", full: true }
];
function buildHome() {
  const box = $("cats"); let h = "";
  CATS.forEach(c => {
    const us = ALL.filter(u => !u.pending && (c.k === "all" || u.kind === c.k)), d = us.filter(u => S.takes.has(u.u)).length;
    const pct = us.length ? Math.round(d * 100 / us.length) : 0;
    h += "<button class=\"cat" + (c.full ? " full" : "") + (d && d === us.length ? " fin" : "") + "\" data-k=\"" + c.k + "\"><span class=\"ic\">" + c.ic + "</span><b>" + c.n + "</b><small>" + num(d) + " من " + num(us.length) + (d === us.length && d ? " ✓" : "") + "</small>" + (c.full ? "" : "<span class=\"pb\"><i style=\"width:" + pct + "%\"></i></span>") + "</button>";
  });
  box.innerHTML = h;
  $("homeWho").textContent = (S.speaker ? "المتحدث: " + S.speaker + " — " : "") + "اضغط الأيقونة لتبدأ. يمكنك الرجوع من زر «الأقسام» في الأعلى.";
}
function showHome() { if (S.recording) return; buildHome(); $("home").classList.add("on"); $("home").scrollTop = 0; }
function pickCat(k) {
  S.kf = k; const V = view(); let i = V.findIndex(u => !S.takes.has(u.u)); S.idx = i < 0 ? 0 : i;
  if (window.__syncK) window.__syncK(); saveMeta(); $("home").classList.remove("on"); render();
}
(async function init() {
  await DB.open();
  await loadMeta();
  const rec = await recoverPartials();
  await loadTakes();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  bind();
  let fl = 1; try { const v = parseInt(localStorage.getItem("athar.rec.fs"), 10); if (v >= 0 && v <= 4) fl = v; } catch (e) {}
  setFs(fl);
  if (S.idx >= view().length) S.idx = 0;
  if (window.__syncK) window.__syncK();
  $("cats").onclick = ev => { const b = ev.target.closest(".cat"); if (b) pickCat(b.dataset.k); };
  $("bHome").onclick = showHome; $("hSet").onclick = () => { $("home").classList.remove("on"); openSettings(); };
  render(); showHome();
  if (rec) toast("استُعيد " + num(rec) + " تسجيلًا انقطع قبل اكتماله", 4500);
  window.__rec = { S, ALL, ENTRIES, view, cur, exportSummary, DB, key, jump, get lastZip() { return lastZip; } };
})();
</script>
