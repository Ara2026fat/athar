<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2A8067">
<title>تسجيل أثر — القارئ — كل المقاطع</title>
<style>
:root{
  --bg:#FDF7E8; --card:#FFFFFF; --ink:#1F2A24; --mute:#6B766F; --line:#E4DCC6;
  --brand:#2A8067; --brand-ink:#FFFFFF; --brand-soft:#DCEFE8;
  --rec:#C0392B; --rec-soft:#FBE4E0; --warn:#9A6A00; --warn-soft:#FFF1CC; --ok:#1E7A4E; --ok-soft:#DDF3E6;
  --ayah:#F1EAD2; --shadow:0 2px 14px rgba(40,50,40,.10);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101914; --card:#18241D; --ink:#EAF1EC; --mute:#9AAAA0; --line:#2A3B31;
    --brand:#3FA583; --brand-ink:#08150F; --brand-soft:#173128;
    --rec:#E5604F; --rec-soft:#3A1E1A; --warn:#E6BC52; --warn-soft:#3A3014; --ok:#58C98C; --ok-soft:#173526;
    --ayah:#222B22; --shadow:0 2px 14px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#101914; --card:#18241D; --ink:#EAF1EC; --mute:#9AAAA0; --line:#2A3B31;
  --brand:#3FA583; --brand-ink:#08150F; --brand-soft:#173128;
  --rec:#E5604F; --rec-soft:#3A1E1A; --warn:#E6BC52; --warn-soft:#3A3014; --ok:#58C98C; --ok-soft:#173526;
  --ayah:#222B22; --shadow:0 2px 14px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Naskh Arabic","Amiri","Geeza Pro","Traditional Arabic","Segoe UI","Tahoma",system-ui,sans-serif;font-size:17px;line-height:1.6}
body{height:100dvh;overflow:hidden;padding:env(safe-area-inset-top) 8px calc(env(safe-area-inset-bottom) + 6px)}
.wrap{max-width:760px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;gap:6px;padding:6px 0 4px;flex:none}
.ibtn.fs{font-size:24px;font-weight:700;min-width:56px;min-height:56px;padding:0 10px}
header.top h1{font-size:16px;margin:0;flex:1;font-weight:700;min-width:0}
header.top h1 small{display:block;font-size:13px;color:var(--mute);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
button{font:inherit;color:inherit;cursor:pointer}
.ibtn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-height:44px;box-shadow:var(--shadow)}
.ibtn:focus-visible,.btn:focus-visible,.rec:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.progress{margin:2px 0 6px;flex:none}
.progress .bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.progress .bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .25s}
.progress .meta{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);margin-top:4px;gap:8px;flex-wrap:wrap}
.warnbar{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 8px 0;box-shadow:var(--shadow);flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 4px}
.cardmeta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--mute);margin-bottom:8px}
.chip{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12.5px;background:var(--brand-soft);color:var(--brand)}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.rec{background:var(--rec-soft);color:var(--rec)}
.uid{direction:ltr;unicode-bidi:isolate;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.line{font-size:var(--fs,40px);line-height:1.95;text-align:center;margin:8px 0;padding:4px 0;overflow-wrap:anywhere}
.ctx{background:var(--ayah);border-radius:14px;padding:8px 12px;margin:8px 0;font-size:16px;color:var(--mute);text-align:center}
.ctx b{display:block;font-size:12.5px;color:var(--mute);font-weight:600}
.ctx .a{font-size:20px;line-height:2;color:var(--ink);opacity:.8}
.takeinfo{min-height:28px;text-align:center;font-size:14px;color:var(--mute)}
.dock{flex:none;background:var(--card);padding:6px 0 6px;border-top:1px solid var(--line)}
.controls{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:4px}
.controls .btn{min-height:80px}
.btn{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 8px;min-height:68px;font-size:20px;font-weight:700}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn[disabled]{opacity:.4;cursor:default}
.rec{width:92px;height:92px;border-radius:50%;border:6px solid var(--rec-soft);background:var(--rec);color:#fff;font-size:15px;font-weight:700;display:grid;place-items:center;box-shadow:0 6px 18px rgba(192,57,43,.35)}
.rec svg{width:34px;height:34px;fill:currentColor}
.rec.on{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(192,57,43,.18)}}
@media (prefers-reduced-motion:reduce){.rec.on{animation:none}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px auto 0;max-width:340px;visibility:hidden}
.meter.on{visibility:visible}.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .06s}
.timer{text-align:center;font-variant-numeric:tabular-nums;font-size:22px;min-height:0;color:var(--rec);font-weight:700}
.toast{position:fixed;inset-inline:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);max-width:560px;margin:auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;z-index:50;display:none;text-align:center;font-size:15px}
.toast.on{display:block}
dialog{border:none;border-radius:20px;padding:0;max-width:min(94vw,640px);width:100%;background:var(--card);color:var(--ink);box-shadow:0 10px 50px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:18px 18px 20px;max-height:86dvh;overflow:auto}
.dlg h2{margin:0 0 10px;font-size:20px}
.dlg label{display:block;margin:12px 0 4px;font-weight:600;font-size:15px}
.dlg input[type=text],.dlg select{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:46px}
.dlg .hint{font-size:13px;color:var(--mute);margin:3px 0}
.dlg .chk{display:flex;gap:10px;align-items:center;margin:12px 0}
.dlg .chk input{width:22px;height:22px}
.dlg .acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.dlg .acts .btn{flex:1;min-width:130px}
.list{list-style:none;margin:8px 0 0;padding:0}
.list li{display:flex;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer;min-height:48px}
.list li.cur{background:var(--brand-soft);border-radius:10px}
.list .dot{width:12px;height:12px;border-radius:50%;background:var(--line);flex:none}
.list .dot.ok{background:var(--ok)} .list .dot.pend{background:var(--warn)}
.list .t{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .sh{font-weight:700;background:var(--bg);color:var(--mute);cursor:default;font-size:13px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.filters button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 14px;min-height:36px}
.filters button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.bigprog{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0}.bigprog i{display:block;height:100%;width:0;background:var(--brand)}
.sig{text-align:center;color:var(--mute);font-size:12.5px;margin-top:22px}
.home{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:20px 16px 28px;display:none}
.home.on{display:block}
.home h2{margin:4px 0 4px;font-size:24px}.home p{margin:0 0 16px;color:var(--mute)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:640px;margin:0 auto}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:18px 8px;min-height:170px;font:inherit}
.cat:active{transform:scale(.97)}.cat .ic{font-size:52px;line-height:1}.cat b{font-size:19px}.cat small{color:var(--mute)}
.cat .pb{width:80%;height:8px;border-radius:9px;background:var(--line);overflow:hidden}.cat .pb i{display:block;height:100%;background:var(--brand)}
.cat.full{grid-column:1/-1;min-height:0;flex-direction:row;justify-content:center;padding:12px}.cat.full .ic{font-size:30px}
.cat.fin{border-color:var(--brand);background:var(--brand-soft)}
.homeacts{max-width:640px;margin:14px auto 0;display:flex;gap:8px;justify-content:center}
#bHome,#kfilters,#home,#tinfo,.cardmeta .uid,.cardmeta .chip:nth-child(3),.hint{display:none!important}.line{line-height:1.75!important;margin:4px 0!important}.controls .btn{min-height:46px!important;font-size:15px!important}.rec{width:58px!important;height:58px!important;border-width:4px!important}.rec svg{width:22px!important;height:22px!important}.row2{grid-template-columns:1fr 1fr 1fr!important;gap:6px!important;margin-top:6px!important}.row2 .btn{min-height:40px!important;font-size:13px!important;padding:4px 6px!important}.dock{padding:4px 0!important}.timer{font-size:13px!important}.controls .btn{min-height:32px!important;font-size:12px!important;padding:2px 6px!important}.rec{width:40px!important;height:40px!important;border-width:3px!important}.rec svg{width:15px!important;height:15px!important}.controls .btn{min-height:28px!important;font-size:11px!important;padding:0 4px!important}.rec{width:34px!important;height:34px!important;border-width:2px!important;box-shadow:none!important}.rec svg{width:13px!important;height:13px!important}.row2 .btn{min-height:30px!important;font-size:11px!important}.cardmeta,.progress,#timer,#meter{display:none!important}.card{padding:4px 4px 0!important}</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>تسجيل أثر <small id="who">المتحدث: —</small></h1>
    <button class="ibtn fs" id="bFm" aria-label="تصغير الخط">أ−</button>
    <button class="ibtn fs" id="bFp" aria-label="تكبير الخط">أ+</button>
    <button class="ibtn" id="bHome" aria-label="الأقسام">الأقسام</button>
    <button class="ibtn" id="bList" aria-label="الفهرس">الفهرس</button>
    <button class="ibtn" id="bSet" aria-label="الإعدادات">الإعدادات</button>
  </header>

  <div class="progress" aria-live="polite">
    <div class="bar"><i id="pbar"></i></div>
    <div class="meta"><span id="pTxt">—</span><span id="pSes">—</span></div>
  </div>
  <div id="warn" class="warnbar" hidden></div>

  <section class="card" id="card" aria-live="polite">
    <div class="scroll" id="scroll">
    <div class="cardmeta" id="cmeta"></div>
    <div class="ctx" id="cbefore" hidden></div>
    <div class="line" id="ltext" lang="ar"></div>
    <div class="ctx" id="cafter" hidden></div>
    <div class="takeinfo" id="tinfo"></div>
    </div>
    <div class="dock">
    <div class="timer" id="timer" aria-live="off"></div>
    <div class="meter" id="meter"><i></i></div>

    <div class="controls">
      <button class="btn" id="bPrev">‹ السابق</button>
      <button class="rec" id="bRec" aria-label="تسجيل"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg></button>
      <button class="btn" id="bNext">التالي ›</button>
    </div>
    <div class="row2">
      <button class="btn" id="bPlay" disabled>▶ استمع</button>
      <button class="btn" id="bRedo" disabled>↺ أعد التسجيل</button>
      <button class="btn" id="bSkip">⊘ استبعد المقطع</button>
    </div>
    </div>
  </section>
</div>

<div class="home" id="home" role="dialog" aria-label="اختيار القسم"><div style="max-width:640px;margin:0 auto"><h2>اختر القسم الذي ستسجّله</h2><p id="homeWho">اضغط الأيقونة لتبدأ. يمكنك الرجوع من زر «الأقسام» في الأعلى.</p></div><div class="cats" id="cats"></div><div class="homeacts"><button class="btn" id="hSet">الإعدادات</button></div></div>
<div class="toast" id="toast" role="status"></div>

<dialog id="dSet"><div class="dlg">
  <h2>الإعدادات</h2>
  <label for="iSpeaker">اسم المتحدث (يظهر في الواجهة وفي ملف manifest)</label>
  <input type="text" id="iSpeaker" placeholder="مثال: الأستاذ عرفات" autocomplete="off">
  <label for="sVoice">الصوت (voice) — مجلد الملفات</label>
  <select id="sVoice"></select>
  <input type="text" id="iVoice" placeholder="human_reader" dir="ltr" style="margin-top:8px" hidden autocomplete="off" spellcheck="false">
  <div class="hint">لكل صوت تسجيلاته المنفصلة داخل هذا الجهاز. اسم المجلد: حروف إنجليزية صغيرة وأرقام و _ و - فقط.</div>
  <div class="chk"><input type="checkbox" id="cPend"><label for="cPend" style="margin:0;font-weight:500">إظهار الأسطر المعلَّقة (آيات مضمَّنة في كلام الراوي — لا تُسجَّل قبل اعتماد الإصلاح)</label></div>
  <div class="chk"><input type="checkbox" id="cAuto"><label for="cAuto" style="margin:0;font-weight:500">الانتقال تلقائيًا إلى السطر التالي بعد إيقاف التسجيل</label></div>
  <label for="sFmt">صيغة التصدير</label>
  <select id="sFmt"><option value="native">الأصلية للمتصفح (m4a أو webm) — أصغر حجمًا</option><option value="wav">WAV أحادي ٢٤ ك.هـ — يتوافق مع كل شيء (أكبر حجمًا)</option></select>
  <div class="hint">يمكن تحويل أي صيغة إلى mp3 لاحقًا بسكربت الرقعة (ffmpeg).</div>
  <label for="fTash">استيراد تشكيل كامل (JSON: {"المعرّف": "النص المشكَّل"})</label>
  <input type="file" id="fTash" accept="application/json,.json">
  <div class="hint" id="tashInfo"></div>
  <div class="acts">
    <button class="btn primary" id="sSave">حفظ</button>
    <button class="btn" id="sTheme">الوضع الليلي/النهاري</button>
    <button class="btn" id="sWipe" style="color:var(--rec)">مسح كل التسجيلات</button>
    <button class="btn" id="sClose">إغلاق</button>
  </div>
</div></dialog>

<dialog id="dList"><div class="dlg">
  <h2>الفهرس</h2>
  <div class="filters" id="filters">
    <button data-f="all" class="on">الكل</button><button data-f="todo">غير مسجَّل</button><button data-f="done">مسجَّل</button>
  </div>
  <div class="filters" id="kfilters"><button data-k="all" class="on">كل الأنواع</button><button data-k="B1_dhikr_dua">أذكار وأدعية</button><button data-k="B2_hadith_quote">أحاديث ومقتبسات</button><button data-k="B3_sacred_text">نصوص شرعية</button><button data-k="B4_mixed_ayah">نصوص بين الآيات</button></div>
  <ul class="list" id="ulist"></ul>
  <div class="acts"><button class="btn" id="bNextOpen">التالي غير المسجَّل</button><button class="btn primary" id="bExport">تصدير ZIP</button><button class="btn" id="lClose">إغلاق</button></div>
</div></dialog>

<dialog id="dExp"><div class="dlg">
  <h2>تصدير ZIP</h2>
  <div id="expSum" class="hint" style="font-size:15px"></div>
  <div class="bigprog" id="expBar" hidden><i></i></div>
  <div id="expMsg" class="hint"></div>
  <div class="acts">
    <button class="btn primary" id="eGo">إنشاء الملف</button>
    <button class="btn" id="eShare" hidden>مشاركة</button>
    <button class="btn" id="eClose">إغلاق</button>
  </div>
</div></dialog>

<script id="queue" type="application/json">{"voice_default":"human_reader","sessions":4,"units":[{"u":"src.rabbi.proof","ids":["src.rabbi.proof"],"text":"والدليل قوله تعالى: ﴿الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ﴾","disp":"والدليل قوله تعالى: ﴿الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ﴾","kind":"B4_mixed_ayah","lesson":"src","pos":0,"secs":6.6,"dens":0.9,"before":null,"after":null,"pending":false,"session":1,"ctx":"الدرس: على التلّة\nالهدف: سنعرف مَن ربّنا، وكيف يدلّنا عليه كلُّ ما حولنا.\n\nقبله: من يُذهب الليل ويأتي بالنهار؟ ربّي، وهو المدبّر لجميع ما في الكون.\nقبله: ربّي اللهُ الذي ربّاني وربّى جميع العالمين بنعمته، وهو معبودي ليس لي معبود سواه، وهو الخالق، المالك، الرازق، المدبّر لجميع ما في الكون.\n◀ هذا السطر الذي ستسجّله ▶\nبعده: كلُّ هذا من ربّي.\nبعده: وأنت، بمَ تحمده على كل هذا؟"},{"u":"src.wal.ayah","ids":["src.wal.ayah"],"text":"قال تعالى: ﴿وَقَضَىٰ رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا إِمَّا يَبْلُغَنَّ عِندَكَ الْكِبَرَ أَحَدُهُمَا أَوْ كِلَاهُمَا فَلَا تَقُل لَّهُمَا أُفٍّ وَلَا تَنْهَرْهُمَا وَقُل لَّهُمَا قَوْلًا كَرِيمًا﴾","disp":"قال تعالى: ﴿وَقَضَىٰ رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا إِمَّا يَبْلُغَنَّ عِندَكَ الْكِبَرَ أَحَدُهُمَا أَوْ كِلَاهُمَا فَلَا تَقُل لَّهُمَا أُفٍّ وَلَا تَنْهَرْهُمَا وَقُل لَّهُمَا قَوْلًا كَرِيمًا﴾","kind":"B4_mixed_ayah","lesson":"src","pos":1,"secs":19.2,"dens":0.9,"before":null,"after":null,"pending":false,"session":1,"ctx":"الدرس: أبي وأمّي\nالهدف: سنتعلّم كيف نتأدّب مع أبينا وأمّنا في كل يوم.\n\nقبله: أستأذن قبل الدخول على أبي وأمّي وهما في الغرفة.\nقبله: أبتسم في وجه الوالدين ولا أعبس، وأُقبّل يدهما ورأسهما.\n◀ هذا السطر الذي ستسجّله ▶\nبعده: جاء رجلٌ إلى النبي ﷺ يستأذنه في الجهاد، فقال: «ألكَ والدانِ؟» قال: نعم. قال: «فَفِيهِمَا فجاهِدْ».\nبعده: ماذا تقول؟"},{"u":"src.aman.ayah","ids":["src.aman.ayah"],"text":"قال تَعَالَى في ذِكر صفات المفلحين: ﴿وَالَّذِينَ هُمْ لِأَمَانَاتِهِمْ وَعَهْدِهِمْ رَاعُونَ﴾","disp":"قال تَعَالَى في ذِكر صفات المفلحين 13,"secs":13.1,"dens":0.9,"before":null,"after":null,"pending":false,"session":2,"ctx":"الدرس: جناحان\nالهدف: سنعرف الخوف والرجاء، ولماذا نحتاجهما معًا.\n\nقبله: الخوف: هو الخشية من الله ومن عقابه.\nقبله: الخوف: هو الخشية من الله ومن عقابه. والرجاء: هو الطمع في ثواب الله ومغفرته ورحمته. قال تَعَالَى: ﴿أُولَٰئِكَ الَّذِينَ يَدْعُونَ يَبْتَغُونَ إِلَىٰ رَبِّهِمُ الْوَسِيلَةَ أَيُّهُمْ أَقْرَبُ وَيَرْجُونَ رَحْمَتَهُ وَيَخَافُونَ عَذَابَهُ﴾\n◀ هذا السطر الذي ستسجّله ▶\nبعده: ماذا تقول له؟\nبعده: الله غفور رحيم، ولا يُقنَّط أحدٌ من رحمته."},{"u":"src.zal.dharrah","ids":["src.zal.dharrah"],"text":"قال تَعَالَى: ﴿فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ ٧ وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ ٨﴾","disp":"قال تَعَالَى: ﴿فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ ٧ وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ ٨﴾","kind":"B4_mixed_ayah","lesson":"src","pos":14,"secs":12.7,"dens":0.9,"before":null,"after":null,"pending":false,"session":2,"ctx":"الدرس: مثقال ذرّة\nالهدف: سنقرأ سورة الزلزلة، ونعرف أنّ أصغر عملٍ محفوظ.\n\nقبله: وقال الإنسان متحيّرًا: ما شأن الأرض تتحرّك وتضطرب؟\nقبله: في ذلك اليوم العظيم تخبر الأرض بما عُمل عليها من خيرٍ وشرّ.\n◀ هذا السطر الذي ستسجّله ▶\nبعده: وماذا تفعل الآن؟\nبعده: ومثقال الذرّة أصغر منها، وهو محفوظ."},{"u":"src.zak.ayah","ids":["src.zak.ayah"],"text":"الزكاة: حقٌّ واجب في مالٍ خاصّ لطائفةٍ مخصوصة في وقتٍ مخصوص، وهي ركنٌ من أركان الإسلام. قال تَعَالَى: ﴿وَأَقِيمُوا الصَّلَوٰةَ وَءَاتُوا الزَّكَوٰةَ وَارْكَعُوا مَعَ الرَّٰكِعِينَ﴾. والصدقة المستحبّة: التصدّق بأيّ شيء في وجوه الخير في أيّ وقت. قال تَعَالَى: ﴿وَأَنفِقُوا فِى سَبِيلِ اللَّهِ وَلَا تُلْقُوا بِأَيْدِيكُمْ إِلَى التَّهْلُكَةِ وَأَحْسِنُوٓا إِنَّ اللَّهَ يُحِبُّ الْمُحْسِنِينَ﴾","disp":"الزكاة: حقٌّ واجب في مالٍ خاصّ لطائفةٍ مخصوصة في وقتٍ مخصوص، وهي ركنٌ من أركان الإسلام. قال تَعَالَى: ﴿وَأَقِيمُوا الصَّلَوٰةَ وَءَاتُوا الزَّكَوٰةَ وَارْكَعُوا مَعَ الرَّٰكِعِينَ﴾. والصدقة المستحبّة: التصدّق بأيّ شيء في وجوه الخير في أيّ وقت. قال تَعَالَى: ﴿وَأَنفِقُوا فِى سَبِيلِ اللَّهِ وَلَا تُلْقُوا بِأَيْدِيكُمْ إِلَى التَّهْلُكَةِ وَأَحْسِنُوٓا إِنَّ اللَّهَ يُحِبُّ الْمُحْسِنِينَ﴾","kind":"B4_mixed_ayah","lesson":"src","pos":15,"secs":25.9,"dens":0.9,"before":null,"after":null,"pending":false,"session":2,"ctx":"الدرس: حقٌّ في المال\nالهدف: سنعرف ما الزكاة، وما الفرق بينها وبين الصدقة.\n\nقبله: حقٌّ واجب في مالٍ خاصّ، لطائفةٍ مخصوصة، في وقتٍ مخصوص. وهي ركنٌ من أركان الإسلام، تُؤخذ من الغنيّ وتُعطى الفقير.\nقبله: هي غير الزكاة: التصدّق بأيّ شيء في وجوه الخير، في أيّ وقت.\n◀ هذا السطر الذي ستسجّله ▶\nبعده: ماذا تفعل؟\nبعده: والصدقة تكون بأيّ شيء، ولو قلّ."},{"u":"src.khu.ayah","ids":["src.khu.ayah"],"text":"الخشوع في الصلاة: هو حضور القلب وسكون الجوارح فيها. قال تَعَالَى: ﴿قَدْ أَفْلَحَ الْمُؤْمِنُونَ ١ الَّذِينَ هُمْ فِي صَلَاتِهِمْ خَاشِعُونَ ٢﴾","disp":"الخشوع في الصلاة: هو حضور القلب وسكون الجوارح فيها. قال تَعَالَى: ﴿قَدْ أَفْلَحَ الْمُؤْمِنُونَ ١ الَّذِينَ هُمْ فِي صَلَاتِهِمْ خَاشِعُونَ ٢﴾","kind":"B4_mixed_ayah","lesson":"src","pos":16,"secs":15.8,"dens":0.9,"before":null,"after":null,"pending":false,"session":2,"ctx":"الدرس: قلبٌ حاضر\nالهدف: سنعرف ما الخشوع في الصلاة، وفضل صلاة الجماعة.\n\nقبله: جسدُك يُصلّي… فأين قلبك؟\n◀ هذا السطر الذي ستسجّله ▶\nبعده: ماذا تصنع؟\nبعده: والخشوع حضور القلب، لا حركة الجسد وحدها."},{"u":"src.tawb.ayah","ids":["src.tawb.ayah"],"text":"التوبة: هي الرجوع عن معصية الله تَعَالَى إلى طاعته. قال تَعَالَى: ﴿وَإِنِّي لَغَفَّارٌ لِّمَن تَابَ وَآمَنَ وَعَمِلَ صَالِحًا ثُمَّ اهْتَدَىٰ﴾. وأستغفر الله: أي أطلب المغفرة من الله.","disp":"التوبة: هي الرجوع عن معصية الله تَعَالَى إلى طاعته. قال تَعَالَى: ﴿وَإِنِّي لَغَفَّارٌ لِّمَن تَابَ وَآمَنَ وَعَمِلَ صَالِحًا ثُمَّ اهْتَدَىٰ﴾. وأستغفر الله: أي أطلب المغفرة من الله.","kind":"B4_mixed_ayah","lesson":"src","pos":17,"secs":20.2,"dens":0.9,"before":null,"after":null,"pending":false,"session":2,"ctx":"الدرس: بابٌ لا يُغلق\nالهدف: سنعرف ما التوبة، وما معنى أستغفر الله.\n\nقبله: التوبة: هي الرجوع عن معصية الله تعالى إلى طاعته.\nقبله: معناها: أطلب المغفرة من الله.\n◀ هذا السطر الذي ستسجّله ▶\nبعده: ماذا تفعل؟\nبعده: والله يقول: وإنّي لغفّارٌ لمن تاب. فعُد كلّما عدت."},{"u":"src.nim.ayah","ids":["src.nim.ayah"],"text":"من نعم الله عليك: نعمة الإسلام وأنّك لستَ من أهل الكفر، ونعمة السنّة وأنّك لستَ من أهل البدع، ونعمة الصحّة والعافية من السمع والبصر والمشي وغيرها، ونعمة الطعام والشراب والملبس. قال تَعَالَى: ﴿وَإِن تَعُدُّوا نِعْمَةَ اللَّهِ لَا تُحْصُوهَآ إِنَّ اللَّهَ لَغَفُورٌۭ رَّحِيمٌۭ﴾","disp":"من نعم الله عليك: نعمة الإسلام وأنّك لستَ من أهل الكفر، ونعمة السنّة وأنّك لستَ من أهل البدع، ونعمة الصحّة والعافية من السمع والبصر والمشي وغيرها، ونعمة الطعام والشراب والملبس. قال تَعَالَى: ﴿وَإِن تَعُدُّوا نِعْمَةَ اللَّهِ لَا تُحْصُوهَآ إِنَّ اللَّهَ لَغَفُورٌۭ رَّحِيمٌۭ﴾","kind":"B4_mixed_ayah","lesson":"src","pos":18,"secs":26.7,"dens":0.9,"before":null,"after":null,"pending":false,"session":2,"ctx":"الدرس: لا تُعدّ\nالهدف: سنعدّ بعض نعم الله علينا، ونعرف كيف نشكرها.\n\nقبله: نعمة الصحّة والعافية: من السمع والبصر والمشي وغيرها.\nقبله: نعمة الطعام والشراب والملبس. ونعمه علينا كثيرة لا تُعدّ ولا تُحصى.\n◀ هذا السطر الذي ستسجّله ▶\nبعده: الواجب في النعم: شكرها، وذلك بالثناء على الله وحمده باللسان، وأنّه له الفضل وحده، واستعمال هذه النعم بما يرضي الله تَعَالَى لا بمعصيته. قال تَعَالَى: ﴿فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ﴾\nبعده: وكيف تشكرها؟"},{"u":"src.nim.shukr","ids":["src.nim.shukr"],"text":"الواجب في النعم: شكرها، وذلك بالثناء على الله وحمده باللسان، وأنّه له الفضل وحده، واستعمال هذه النعم بما يرضي الله تَعَالَى لا بمعصيته. قال تَعَالَى: ﴿فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ﴾","disp":"الواجب في النعم: شكرها، وذلك بالثناء على الله وحمده باللسان، وأنّه له الفضل وحده، واستعمال هذه النعم بما يرضي الله تَعَالَى لا بمعصيته. قال تَعَالَى: ﴿فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ﴾","kind":"B4_mixed_ayah","lesson":"src","pos":19,"secs":23.6,"dens":0.9,"before":null,"after":null,"pending":false,"session":2,"ctx":"الدرس: لا تُعدّ\nالهدف: سنعدّ بعض نعم الله علينا، ونعرف كيف نشكرها.\n\nقبله: نعمة الطعام والشراب والملبس. ونعمه علينا كثيرة لا تُعدّ ولا تُحصى.\nقبله: من نعم الله عليك: نعمة الإسلام وأنّك لستَ من أهل الكفر، ونعمة السنّة وأنّك لستَ من أهل البدع، ونعمة الصحّة والعافية من السمع والبصر والمشي وغيرها، ونعمة الطعام والشراب والملبس. قال تَعَالَى: ﴿وَإِن تَعُدُّوا نِعْمَةَ اللَّهِ لَا تُحْصُوهَا﴾\n◀ هذا السطر الذي ستسجّله ▶\nبعده: وكيف تشكرها؟\nبعده: الشكر ثناءٌ باللسان، واستعمالٌ للنعمة فيما يرضيه."},{"u":"src.dua.ayah","ids":["src.dua.ayah"],"text":"الدعاء هو من أعظم الطاعات وأجلّ القربات. قال تَعَالَى: ﴿وَقَالَ رَبُّكُمُ ادْعُونِىٓ أَسْتَجِبْ لَكُمْ إِنَّ الَّذِينَ يَسْتَكْبِرُونَ عَنْ عِبَادَتِى سَيَدْخُلُونَ جَهَنَّمَ دَاخِرِينَ﴾. وقال النبي ﷺ: «الدعاءُ هو العبادة».","disp":"الدعاء هو من أعظم الطاعات وأجلّ القربات. قال تَعَالَى: ﴿وَقَالَ رَبُّكُمُ ادْعُونِىٓ أَسْتَجِبْ لَكُمْ إِنَّ الَّذِينَ يَسْتَكْبِرُونَ عَنْ عِبَادَتِى سَيَدْخُلُونَ جَهَنَّمَ دَاخِرِينَ﴾. وقال النبي صلى الله عليه وسلم: «الدعاءُ هو العبادة».","kind":"B4_mixed_ayah","lesson":"src","pos":20,"secs":15.4,"dens":0.9,"before":null,"after":null,"pending":false,"session":2,"ctx":"الدرس: أعظم الطاعات\nالهدف: سنعرف أهمّية الدعاء، وأنّه عبادة.\n\nقبله: تريد شيئًا؟ لك بابٌ مفتوح\n◀ هذا السطر الذي ستسجّله ▶\nبعده: ثلاثة أوقاتٍ يُرجى فيها الدعاء. المسها.\nبعده: تدعو بين الأذان والإقامة، فإنّ الدعاء لا يُردّ."},{"u":"src.ras.ayah","ids":["src.ras.ayah"],"text":"الأدب مع الرسول ﷺ: طاعته فيما أمر، وتصديقه فيما أخبر، وعدم معصيته، ولا يُعبد الله إلا بما شرع وهو الاقتداء بالسنّة وترك البدعة. قال تَعَالَى: ﴿مَّن يُطِعِ الرَّسُولَ فَقَدْ أَطَاعَ اللَّهَ وَمَن تَوَلَّىٰ فَمَآ أَرْسَلْنَٰكَ عَلَيْهِمْ حَفِيظًۭا﴾. وقال سبحانه: ﴿وَمَا يَنطِقُ عَنِ الْهَوَىٰ ٣ إِنْ هُوَ إِلَّا وَحْيٌ يُوحَىٰ ٤﴾","disp":"الأدب مع الرسول صلى الله عليه وسلم: طاعته فيما أمر، وتصديقه فيما أخبر، وعدم معصيته، ولا يُعبد الله إلا بما شرع وهو الاقتداء بالسنّة وترك البدعة. قال تَعَالَى: ﴿مَّن يُطِعِ الرَّسُولَ فَقَدْ أَطَاعَ اللَّهَ وَمَن تَوَلَّىٰ فَمَآ أَرْسَلْنَٰكَ عَلَيْهِمْ حَفِيظًۭا﴾. وقال سبحانه: ﴿وَمَا يَنطِقُ عَنِ الْهَوَىٰ ٣ إِنْ هُوَ إِلَّا وَحْيٌ يُوحَىٰ ٤﴾","kind":"B4_mixed_ayah","lesson":"src","pos":21,"secs":30.0,"dens":0.9,"before":null,"after":null,"pending":false,"session":2,"ctx":null},{"u":"src.bay.asl","ids":["src.bay.asl"],"text":"الأصل في كل البيوع والمعاملات أنها حلال، إلا بعض الأنواع ممّا حرّم الله تَعَالَى. قال تَعَالَى: ﴿الَّذِينَ يَأْكُلُونَ الرِّبَوٰا لَا يَقُومُونَ إِلَّا كَمَا يَقُومُ الَّذِى يَتَخَبَّطُهُ الشَّيْطَٰنُ مِنَ الْمَسِّ ذَٰلِكَ بِأَنَّهُمْ قَالُوٓا إِنَّمَا الْبَيْعُ مِثْلُ الرِّبَوٰا وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَوٰا فَمَن جَآءَهُۥ مَوْعِظَةٌۭ مِّن رَّبِّهِۦ فَانتَهَىٰ فَلَهُۥ مَا سَلَفَ وَأَمْرُهُۥٓ إِلَى اللَّهِ وَمَنْ عَادَ فَأُولَٰٓئِكَ أَصْحَٰبُ النَّارِ هُمْ فِيهَا خَٰلِدُونَ﴾","disp":"الأصل في كل البيوع والمعاملات أنها حلال، إلا بعض الأنواع ممّا حرّم الله تَعَالَى. قال تَعَالَى: ﴿الَّذِينَ يَأْكُلُونَ الرِّبَوٰا لَا يَقُومُونَ إِلَّا كَمَا يَقُومُ الَّذِى يَتَخَبَّطُهُ الشَّيْطَٰنُ مِنَ الْمَسِّ ذَٰلِكَ بِأَنَّهُمْ قَالُوٓا إِنَّمَا الْبَيْعُ مِثْلُ الرِّبَوٰا وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَوٰا فَمَن جَآءَهُۥ مَوْعِظَةٌۭ مِّن رَّبِّهِۦ فَانتَهَىٰ فَلَهُۥ مَا سَلَفَ وَأَمْرُهُۥٓ إِلَى اللَّهِ وَمَنْ عَادَ فَأُولَٰٓئِكَ أَصْحَٰبُ النَّارِ هُمْ فِيهَا خَٰلِدُونَ﴾","kind":"B4_mixed_ayah","lesson":"src","pos":22,"secs":16.0,"dens":0.9,"before":null,"after":null,"pending":false,"session":3,"ctx":"الدرس: حين أبيع وأشتري\nالهدف: سنعرف أنّ الأصل في البيع الحِلّ، وما الذي حُرّم منه.\n\nقبله: حين تبيع أو تشتري… ما الذي يجوز؟\n◀ هذا السطر الذي ستسجّله ▶\nبعده: ثلاثةٌ حُرّمت من المعاملات. اكتشفها.\nبعده: الغشّ، ومنه: إخفاء عيب السلعة. قال النبي صلى الله عليه وسلم: من غشّ فليس منّي."},{"u":"src.wahy.iqra","ids":["src.wahy.iqra"],"text":"أوّل ما نزل عليه من القرآن قوله تَعَالَى: ﴿اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ ١ خَلَقَ الْإِنسَانَ مِنْ عَلَقٍ ٢ اقْرَأْ وَرَبُّكَ الْأَكْرَمُ ٣ الَّذِي عَلَّمَ بِالْقَلَمِ ٤ عَلَّمَ الْإِنسَانَ مَا لَمْ يَعْلَمْ ٥﴾","disp":"أوّل ما نزل عليه من القرآن قوله تَعَالَى: ﴿اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ ١ خَلَقَ الْإِنسَانَ مِنْ عَلَقٍ ٢ اقْرَأْ وَرَبُّكَ الْأَكْرَمُ ٣ الَّذِي عَلَّمَ بِالْقَلَمِ ٤ عَلَّمَ الْإِنسَانَ مَا لَمْ يَعْلَمْ ٥﴾","kind":"B4_mixed_ayah","lesson":"src","pos":23,"secs":24.3,"dens":0.9,"before":null,"after":null,"pending":false,"session":3,"ctx":"الدرس: في الغار\nالهدف: سنعرف كيف بدأ الوحي، وما أوّل ما نزل من القرآن.\n\nقبله: أيّ ليلةٍ تغيّرت فيها الدنيا؟\n◀ هذا السطر الذي ستسجّله ▶\nبعده: وماذا يعني ذلك لك؟\nبعده: ولو شاء لبدأها بغيرها. فاختيارُ اقرأ أوّلًا ليس صدفة."},{"u":"src.aad.three","ids":["src.aad.three"],"text":"أعداء الإنسان: النفس الأمّارة بالسوء، قال سُبْحَانَهُ: ﴿وَمَآ أُبَرِّئُ نَفْسِىٓ إِنَّ النَّفْسَ لَأَمَّارَةٌۢ بِالسُّوٓءِ إِلَّا مَا رَحِمَ رَبِّىٓ إِنَّ رَبِّى غَفُورٌۭ رَّحِيمٌۭ﴾. والشيطان، قال تَعَالَى: ﴿يَٰٓأَيُّهَا النَّاسُ كُلُوا مِمَّا فِى الْأَرْضِ حَلَٰلًۭا طَيِّبًۭا وَلَا تَتَّبِعُوا خُطُوَٰتِ الشَّيْطَٰنِ إِنَّهُۥ لَكُمْ عَدُوٌّۭ مُّبِينٌ﴾. وأصحاب السوء، قال تَعَالَى: ﴿الْأَخِلَّاءُ يَوْمَئِذٍ بَعْضُهُمْ لِبَعْضٍ عَدُوٌّ إِلَّا الْمُتَّقِينَ﴾","disp":"أعداء الإنسان: النفس الأمّارة بالسوء، قال سُبْحَانَهُ: ﴿وَمَآ أُبَرِّئُ نَفْسِىٓ إِنَّ النَّفْسَ لَأَمَّارَةٌۢ بِالسُّوٓءِ إِلَّا مَا رَحِمَ رَبِّىٓ إِنَّ رَبِّى غَفُورٌۭ رَّحِيمٌۭ﴾. والشيطان، قال تَعَالَى: ﴿يَٰٓأَيُّهَا النَّاسُ كُلُوا مِمَّا فِى الْأَرْضِ حَلَٰلًۭا طَيِّبًۭا وَلَا تَتَّبِعُوا خُطُوَٰتِ الشَّيْطَٰنِ إِنَّهُۥ لَكُمْ عَدُوٌّۭ مُّبِينٌ﴾. وأصحاب السوء، قال تَعَالَى: ﴿الْأَخِلَّاءُ يَوْمَئِذٍ بَعْضُهُمْ لِبَعْضٍ عَدُوٌّ إِلَّا الْمُتَّقِينَ﴾","kind":"B4_mixed_ayah","lesson":"src","pos":24,"secs":33.4,"dens":0.9,"before":null,"after":null,"pending":false,"session":3,"ctx":null},{"u":"src.taq.ayah","ids":["src.taq.ayah"],"text":"التقوى: هي فعل الطاعات وترك المعاصي. قال تعالى: ﴿الشَّهْرُ الْحَرَامُ بِالشَّهْرِ الْحَرَامِ وَالْحُرُمَٰتُ قِصَاصٌۭ فَمَنِ اعْتَدَىٰ عَلَيْكُمْ فَاعْتَدُوا عَلَيْهِ بِمِثْلِ مَا اعْتَدَىٰ عَلَيْكُمْ وَاتَّقُوا اللَّهَ وَاعْلَمُوٓا أَنَّ اللَّهَ مَعَ الْمُتَّقِينَ﴾","disp":"التقوى: هي فعل الطاعات وترك المعاصي. قال تعالى: ﴿الشَّهْرُ الْحَرَامُ بِالشَّهْرِ الْحَرَامِ وَالْحُرُمَٰتُ قِصَاصٌۭ فَمَنِ اعْتَدَىٰ عَلَيْكُمْ فَاعْتَدُوا عَلَيْهِ بِمِثْلِ مَا اعْتَدَىٰ عَلَيْكُمْ وَاتَّقُوا اللَّهَ وَاعْلَمُوٓا أَنَّ اللَّهَ مَعَ الْمُتَّقِينَ﴾","kind":"B4_mixed_ayah","lesson":"src","pos":25,"secs":12.6,"dens":0.9,"before":null,"after":null,"pending":false,"session":3,"ctx":"الدرس: كلمتان فقط\nالهدف: سنعرف ما التقوى، وما أفضل يومٍ وليلةٍ في العام.\n\nقبله: فعل الطاعات: صلاةٌ وصدقةٌ وبرٌّ وذكر.\nقبله: وترك المعاصي: كذبٌ وغيبةٌ وأذًى وتضييعُ صلاة.\n◀ هذا السطر الذي ستسجّله ▶\nبعده: وأفضل يومٍ وليلةٍ في عامك.\nبعده: يوم عرفة."},{"u":"src.ghb.ayah","ids":["src.ghb.ayah"],"text":"الغيبة: هي ذكر المسلم أخاك بما يكره وهو غائب. قال تَعَالَى: ﴿يَٰٓأَيُّهَا الَّذِينَ ءَامَنُوا اجْتَنِبُوا كَثِيرًۭا مِّنَ الظَّنِّ إِنَّ بَعْضَ الظَّنِّ إِثْمٌۭ وَلَا تَجَسَّسُوا وَلَا يَغْتَب بَّعْضُكُم بَعْضًا أَيُحِبُّ أَحَدُكُمْ أَن يَأْكُلَ لَحْمَ أَخِيهِ مَيْتًۭا فَكَرِهْتُمُوهُ وَاتَّقُوا اللَّهَ إِنَّ اللَّهَ تَوَّابٌۭ رَّحِيمٌۭ﴾","disp":"الغيبة: هي ذكر المسلم أخاك بما يكره وهو غائب. قال تَعَالَى: ﴿يَٰٓأَيُّهَا الَّذِينَ ءَامَنُوا اجْتَنِبُوا كَثِيرًۭا مِّنَ الظَّنِّ إِنَّ بَعْضَ الظَّنِّ إِثْمٌۭ وَلَا تَجَسَّسُوا وَلَا يَغْتَب بَّعْضُكُم بَعْضًا أَيُحِبُّ أَحَدُكُمْ أَن يَأْكُلَ لَحْمَ أَخِيهِ مَيْتًۭا فَكَرِهْتُمُوهُ وَاتَّقُوا اللَّهَ إِنَّ اللَّهَ تَوَّابٌۭ رَّحِيمٌۭ﴾","kind":"B4_mixed_ayah","lesson":"src","pos":26,"secs":24.7,"dens":0.9,"before":null,"after":null,"pending":false,"session":3,"ctx":"الدرس: خلف ظهره\nالهدف: سنعرف ما الغيبة وما النميمة، والفرق بينهما.\n\nقبله: هي ذكر أخيك المسلم بما يكره وهو غائب.\nقبله: هي نقل الأحاديث بين الناس للإفساد بينهم. قال صلى الله عليه وسلم: لا يدخل الجنّة نمّام.\n◀ هذا السطر الذي ستسجّله ▶\nبعده: ماذا تقول؟\nبعده: والغيبة أن تذكره بما يكره، صدَقتَ أو كذبت."},{"u":"src.kas.ayah","ids":["src.kas.ayah"],"text":"الكسل: هو التثاقل عن فعل الخير وما يجب على الإنسان فعله، ومن ذلك التكاسل في فعل الواجبات. قال الله تَعَالَى: ﴿إِنَّ الْمُنَافِقِينَ يُخَادِعُونَ اللَّهَ وَهُوَ خَادِعُهُمْ وَإِذَا قَامُوا إِلَى الصَّلَاةِ قَامُوا كُسَالَىٰ يُرَاءُونَ النَّاسَ وَلَا يَذْكُرُونَ اللَّهَ إِلَّا قَلِيلًا﴾","disp":"الكسل: هو التثاقل عن فعل الخير وما يجب على الإنسان فعله، ومن ذلك التكاسل في فعل الواجبات. قال الله تَعَالَى: ﴿إِنَّ الْمُنَافِقِينَ يُخَادِعُونَ اللَّهَ وَهُوَ خَادِعُهُمْ وَإِذَا قَامُوا إِلَى الصَّلَاةِ قَامُوا كُسَالَىٰ يُرَاءُونَ النَّاسَ وَلَا يَذْكُرُونَ اللَّهَ إِلَّا قَلِيلًا﴾","kind":"B4_mixed_ayah","lesson":"src","pos":27,"secs":31.7,"dens":0.9,"before":null,"after":null,"pending":false,"session":3,"ctx":null},{"u":"src.taj.ayah","ids":["src.taj.ayah"],"text":"التجسّس: هو الكشف والبحث عن عورات الناس وما يسترونه. ومن صوره المحرّمة: الاطّلاع على عورات الناس في البيوت، واستماع المرء إلى حديث قومٍ بدون علمهم. قال تَعَالَى: ﴿يَٰٓأَيُّهَا الَّذِينَ ءَامَنُوا اجْتَنِبُوا كَثِيرًۭا مِّنَ الظَّنِّ إِنَّ بَعْضَ الظَّنِّ إِثْمٌۭ وَلَا تَجَسَّسُوا وَلَا يَغْتَب بَّعْضُكُم بَعْضًا أَيُحِبُّ أَحَدُكُمْ أَن يَأْكُلَ لَحْمَ أَخِيهِ مَيْتًۭا فَكَرِهْتُمُوهُ وَاتَّقُوا اللَّهَ إِنَّ اللَّهَ تَوَّابٌۭ رَّحِيمٌۭ﴾","disp":"التجسّس: هو الكشف والبحث عن عورات الناس وما يسترونه. ومن صوره المحرّمة: الاطّلاع على عورات الناس في البيوت، واستماع المرء إلى حديث قومٍ بدون علمهم. قال تَعَالَى: ﴿يَٰٓأَيُّهَا الَّذِينَ ءَامَنُوا اجْتَنِبُوا كَثِيرًۭا مِّنَ الظَّنِّ إِنَّ بَعْضَ الظَّنِّ إِثْمٌۭ وَلَا تَجَسَّسُوا وَلَا يَغْتَب بَّعْضُكُم بَعْضًا أَيُحِبُّ أَحَدُكُمْ أَن يَأْكُلَ لَحْمَ أَخِيهِ مَيْتًۭا فَكَرِهْتُمُوهُ وَاتَّقُوا اللَّهَ إِنَّ اللَّهَ تَوَّابٌۭ رَّحِيمٌۭ﴾","kind":"B4_mixed_ayah","lesson":"src","pos":28,"secs":20.1,"dens":0.9,"before":null,"after":null,"pending":false,"session":3,"ctx":"الدرس: ما ستره الناس\nالهدف: سنعرف ما التجسّس، وصورتين منه محرّمتين.\n\nقبله: الاطّلاع على عورات الناس في البيوت.\nقبله: استماع المرء إلى حديث قومٍ بدون علمهم.\n◀ هذا السطر الذي ستسجّله ▶\nبعده: ماذا تفعل؟\nبعده: واستماع المرء إلى حديث قومٍ بدون علمهم من التجسّس المحرّم."},{"u":"src.tw3.ayah","ids":["src.tw3.ayah"],"text":"خلقنا الله لعبادته وحده لا شريك له، ولم يخلقنا عبثًا أو للهو واللعب، أو يتركنا سدًى وهملًا. قال تَعَالَى: ﴿وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ﴾. وأعظم واجبٍ علينا: توحيد الله تَعَالَى. قال تعالى: ﴿وَمَآ أُمِرُوٓا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ حُنَفَآءَ وَيُقِيمُوا الصَّلَوٰةَ وَيُؤْتُوا الزَّكَوٰةَ وَذَٰلِكَ دِينُ الْقَيِّمَةِ﴾","disp":"خلقنا الله لعبادته وحده لا شريك له، ولم يخلقنا عبثًا أو للهو واللعب، أو يتركنا سدًى وهملًا. قال تَعَالَى: ﴿وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ﴾. وأعظم واجبٍ علينا: توحيد الله تَعَالَى. قال تعالى: ﴿وَمَآ أُمِرُوٓا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ حُنَفَآءَ وَيُقِيمُوا الصَّلَوٰةَ وَيُؤْتُوا الزَّكَوٰةَ وَذَٰلِكَ دِينُ الْقَيِّمَةِ﴾","kind":"B4_mixed_ayah","lesson":"src","pos":29,"secs":32.9,"dens":0.9,"before":null,"after":null,"pending":false,"session":3,"ctx":null},{"u":"src.shk.ayah","ids":["src.shk.ayah"],"text":"أعظم ذنب: الشرك بالله تَعَالَى. قال تَعَالَى: ﴿إِنَّ اللَّهَ لَا يَغْفِرُ أَن يُشْرَكَ بِهِ وَيَغْفِرُ مَا دُونَ ذَٰلِكَ لِمَن يَشَاءُ ۚ وَمَن يُشْرِكْ بِاللَّهِ فَقَدِ افْتَرَىٰ إِثْمًا عَظِيمًا﴾. والشرك: هو أن يجعل الإنسان لله نِدًّا في عبادته أو ربوبيّته أو أسمائه وصفاته.","disp":"أعظم ذنب: الشرك بالله تَعَالَى. قال تَعَالَى: ﴿إِنَّ اللَّهَ لَا يَغْفِرُ أَن يُشْرَكَ بِهِ وَيَغْفِرُ مَا دُونَ ذَٰلِكَ لِمَن يَشَاءُ ۚ وَمَن يُشْرِكْ بِاللَّهِ فَقَدِ افْتَرَىٰ إِثْمًا عَظِيمًا﴾. والشرك: هو أن يجعل الإنسان لله نِدًّا في عبادته أو ربوبيّته أو أسمائه وصفاته.","kind":"B4_mixed_ayah","lesson":"src","pos":30,"secs":30.6,"dens":0.9,"before":null,"after":null,"pending":false,"session":3,"ctx":"الدرس: أعظم ذنب\nالهدف: سنعرف ما أعظم ذنب، وما الشرك، وأنواعه.\n\nقبله: هل في الدنيا ذنبٌ أعظم من غيره؟\n◀ هذا السطر الذي ستسجّله ▶\nبعده: نوعان. المس لتعرف الفرق.\nبعده: صرف أيّ نوعٍ من أنواع العبادة لغير الله: كدعاء غير الله، أو السجود لغيره، أو الذبح لغير الله عزّ وجلّ."},{"u":"src.tym.how","ids":["src.tym.how"],"text":"التيمّم: هو استعمال التراب وغيره من صعيد الأرض، عند فقد الماء أو تعذّر استعماله. قال تعالى: ﴿يَٰٓأَيُّهَا الَّذِينَ ءَامَنُوا لَا تَقْرَبُوا الصَّلَوٰةَ وَأَنتُمْ سُكَٰرَىٰ حَتَّىٰ تَعْلَمُوا مَا تَقُولُونَ وَلَا جُنُبًا إِلَّا عَابِرِى سَبِيلٍ حَتَّىٰ تَغْتَسِلُوا وَإِن كُنتُم مَّرْضَىٰٓ أَوْ عَلَىٰ سَفَرٍ أَوْ جَآءَ أَحَدٌۭ مِّنكُم مِّنَ الْغَآئِطِ أَوْ لَٰمَسْتُمُ النِّسَآءَ فَلَمْ تَجِدُوا مَآءًۭ فَتَيَمَّمُوا صَعِيدًۭا طَيِّبًۭا فَامْسَحُوا بِوُجُوهِكُمْ وَأَيْدِيكُمْ إِنَّ اللَّهَ كَانَ عَفُوًّا غَفُورًا﴾. وصفته: بضرب التراب ضربةً واحدة بباطن الكفّين، ومسح الوجه وظاهر الكفّين مرّةً واحدة.","disp":"التيمّم: هو استعمال التراب وغيره من صعيد الأرض، عند فقد الماء أو تعذّر استعماله. قال تعالى: ﴿يَٰٓأَيُّهَا الَّذِينَ ءَامَنُوا لَا تَقْرَبُوا الصَّلَوٰةَ وَأَنتُمْ سُكَٰرَىٰ حَتَّىٰ تَعْلَمُوا مَا تَقُولُونَ وَلَا جُنُبًا إِلَّا عَابِرِى سَبِيلٍ حَتَّىٰ تَغْتَسِلُوا وَإِن كُنتُم مَّرْضَىٰٓ أَوْ عَلَىٰ سَفَرٍ أَوْ جَآءَ أَحَدٌۭ مِّنكُم مِّنَ الْغَآئِطِ أَوْ لَٰمَسْتُمُ النِّسَآءَ فَلَمْ تَجِدُوا مَآءًۭ فَتَيَمَّمُوا صَعِيدًۭا طَيِّبًۭا فَامْسَحُوا بِوُجُوهِكُمْ وَأَيْدِيكُمْ إِنَّ اللَّهَ كَانَ عَفُوًّا غَفُورًا﴾. وصفته: بضرب التراب ضربةً واحدة بباطن الكفّين، ومسح الوجه وظاهر الكفّين مرّةً واحدة.","kind":"B4_mixed_ayah","lesson":"src","pos":31,"secs":30.2,"dens":0.9,"before":null,"after":null,"pending":false,"session":3,"ctx":null},{"u":"src.sah.ayah","ids":["src.sah.ayah"],"text":"الصحابيّ: هو من لقي النبيَّ ﷺ مؤمنًا به، ومات على الإسلام. يجب أن نحبّهم ونقتديَ بهم، وهم خير الناس وأفضلهم بعد الأنبياء. قال تعالى: ﴿وَالسَّٰبِقُونَ الْأَوَّلُونَ مِنَ الْمُهَٰجِرِينَ وَالْأَنصَارِ وَالَّذِينَ اتَّبَعُوهُم بِإِحْسَٰنٍۢ رَّضِىَ اللَّهُ عَنْهُمْ وَرَضُوا عَنْهُ وَأَعَدَّ لَهُمْ جَنَّٰتٍۢ تَجْرِى تَحْتَهَا الْأَنْهَٰرُ خَٰلِدِينَ فِيهَآ أَبَدًۭا ذَٰلِكَ الْفَوْزُ الْعَظِيمُ﴾","disp":"الصحابيّ: هو من لقي النبيَّ صلى الله عليه وسلم مؤمنًا به، ومات على الإسلام. يجب أن نحبّهم ونقتديَ بهم، وهم خير الناس وأفضلهم بعد الأنبياء. قال تعالى: ﴿وَالسَّٰبِقُونَ الْأَوَّلُونَ مِنَ الْمُهَٰجِرِينَ وَالْأَنصَارِ وَالَّذِينَ اتَّبَعُوهُم بِإِحْسَٰنٍۢ رَّضِىَ اللَّهُ عَنْهُمْ وَرَضُوا عَنْهُ وَأَعَدَّ لَهُمْ جَنَّٰتٍۢ تَجْرِى تَحْتَهَا الْأَنْهَٰرُ خَٰلِدِينَ فِيهَآ أَبَدًۭا ذَٰلِكَ الْفَوْزُ الْعَظِيمُ﴾","kind":"B4_mixed_ayah","lesson":"src","pos":32,"secs":30.8,"dens":0.9,"before":null,"after":null,"pending":false,"session":3,"ctx":"الدرس: خيرُ من بعد الأنبياء\nالهدف: سنعرف من هم الصحابة، ومن أفضلهم، وما واجبنا نحوهم.\n\nقبله: عثمان بن عفّان\nقبله: عليّ بن أبي طالب\n◀ هذا السطر الذي ستسجّله ▶\nبعده: ماذا تقول؟\nبعده: نحبّهم ونقتدي بهم، وقد رضي الله عنهم ورضوا عنه."},{"u":"src.kht.ayah","ids":["src.kht.ayah"],"text":"خاتم الأنبياء والمرسلين: هو محمد ﷺ. قال تَعَالَى: ﴿مَّا كَانَ مُحَمَّدٌ أَبَآ أَحَدٍۢ مِّن رِّجَالِكُمْ وَلَٰكِن رَّسُولَ اللَّهِ وَخَاتَمَ النَّبِيِّۦنَ وَكَانَ اللَّهُ بِكُلِّ شَىْءٍ عَلِيمًۭا﴾. وقال ﷺ: «وأنا خاتم النبيّين لا نبيَّ بعدي».","disp":"خاتم الأنبياء والمرسلين: هو محمد صلى الله عليه وسلم. قال تَعَالَى: ﴿مَّا كَانَ مُحَمَّدٌ أَبَآ أَحَدٍۢ مِّن رِّجَالِكُمْ وَلَٰكِن رَّسُولَ اللَّهِ وَخَاتَمَ النَّبِيِّۦنَ وَكَانَ اللَّهُ بِكُلِّ شَىْءٍ عَلِيمًۭا﴾. وقال صلى الله عليه وسلم: «وأنا خاتم النبيّين لا نبيَّ بعدي».","kind":"B4_mixed_ayah","lesson":"src","pos":33,"secs":22.0,"dens":0.9,"before":null,"after":null,"pending":false,"session":4,"ctx":"الدرس: لا نبيّ بعده\nالهدف: سنعرف أنّه ﷺ خاتم الأنبياء، وما المعجزة.\n\nقبله: مَن آخرُ رسولٍ أُرسل؟\n◀ هذا السطر الذي ستسجّله ▶\nبعده: وما المعجزة؟ المس لتعرف.\nبعده: كل ما أعطاه الله لأنبيائه من خوارق العادات، للدلالة على صدقهم."},{"u":"src.izz.ayah","ids":["src.izz.ayah"],"text":"طريق العزّ والنصر للمسلمين: هو العمل بالإسلام، وترك المعاصي والذنوب. قال تعالى: ﴿يَا أَيُّهَا الَّذِينَ آمَنُوا إِن تَنصُرُوا اللَّهَ يَنصُرْكُمْ وَيُثَبِّتْ أَقْدَامَكُمْ﴾. وقال سبحانه: ﴿لَهُۥ مُعَقِّبَٰتٌۭ مِّنۢ بَيْنِ يَدَيْهِ وَمِنْ خَلْفِهِۦ يَحْفَظُونَهُۥ مِنْ أَمْرِ اللَّهِ إِنَّ اللَّهَ لَا يُغَيِّرُ مَا بِقَوْمٍ حَتَّىٰ يُغَيِّرُوا مَا بِأَنفُسِهِمْ وَإِذَآ أَرَادَ اللَّهُ بِقَوْمٍۢ سُوٓءًۭا فَلَا مَرَدَّ لَهُۥ وَمَا لَهُم مِّن دُونِهِۦ مِن وَالٍ﴾","disp":"طريق العزّ والنصر للمسلمين: هو العمل بالإسلام، وترك المعاصي والذنوب. قال تعالى: ﴿يَا أَيُّهَا الَّذِينَ آمَنُوا إِن تَنصُرُوا اللَّهَ يَنصُرْكُمْ وَيُثَبِّتْ أَقْدَامَكُمْ﴾. وقال سبحانه: ﴿لَهُۥ مُعَقِّبَٰتٌۭ مِّنۢ بَيْنِ يَدَيْهِ وَمِنْ خَلْفِهِۦ يَحْفَظُونَهُۥ مِنْ أَمْرِ اللَّهِ إِنَّ اللَّهَ لَا يُغَيِّرُ مَا بِقَوْمٍ حَتَّىٰ يُغَيِّرُوا مَا بِأَنفُسِهِمْ وَإِذَآ أَرَادَ اللَّهُ بِقَوْمٍۢ سُوٓءًۭا فَلَا مَرَدَّ لَهُۥ وَمَا لَهُم مِّن دُونِهِۦ مِن وَالٍ﴾","kind":"B4_mixed_ayah","lesson":"src","pos":34,"secs":29.7,"dens":0.9,"before":null,"after":null,"pending":false,"session":4,"ctx":"الدرس: طريق العزّ\nالهدف: سنعرف طريق العزّ والنصر للمسلمين.\n\nقبله: من يُصلح حال المسلمين؟\n◀ هذا السطر الذي ستسجّله ▶\nبعده: شطران للطريق. المسهما.\nبعده: العمل بالإسلام: صلاةٌ وصدقٌ وأمانةٌ وبرّ."},{"u":"src.ras.ayat","ids":["src.ras.ayat"],"text":"قال تَعَالَى: ﴿مَّن يُطِعِ الرَّسُولَ فَقَدْ أَطَاعَ اللَّهَ وَمَن تَوَلَّىٰ فَمَآ أَرْسَلْنَٰكَ عَلَيْهِمْ حَفِيظًۭا﴾. وقال سبحانه: ﴿وَمَا يَنطِقُ عَنِ الْهَوَىٰ ٣ إِنْ هُوَ إِلَّا وَحْيٌ يُوحَىٰ ٤﴾","disp":"قال تَعَالَى: ﴿مَّن يُطِعِ الرَّسُولَ فَقَدْ أَطَاعَ اللَّهَ وَمَن تَوَلَّىٰ فَمَآ أَرْسَلْنَٰكَ عَلَيْهِمْ حَفِيظًۭا﴾. وقال سبحانه: ﴿وَمَا يَنطِقُ عَنِ الْهَوَىٰ ٣ إِنْ هُوَ إِلَّا وَحْيٌ يُوحَىٰ ٤﴾","kind":"B4_mixed_ayah","lesson":"src","pos":35,"secs":15.8,"dens":0.9,"before":null,"after":null,"pending":false,"session":4,"ctx":"الدرس: أدبي معه ﷺ\nالهدف: سنعرف كيف يكون أدبنا مع رسول الله ﷺ.\n\nقبله: لا يُعبد الله إلا بما شرع، وهو الاقتداء بالسنّة وترك البدعة.\nقبله: الأدب مع الرسول ﷺ: طاعته فيما أمر، وتصديقه فيما أخبر، وعدم معصيته، ولا يُعبد الله إلا بما شرع وهو الاقتداء بالسنّة وترك البدعة.\n◀ هذا السطر الذي ستسجّله ▶\nبعده: ماذا تقول له؟\nبعده: ومن أدبنا معه صلى الله عليه وسلم: تصديقه فيما أخبر."},{"u":"src.kas.q","ids":["src.kas.q"],"text":"قال الله تَعَالَى: ﴿إِنَّ الْمُنَافِقِينَ يُخَادِعُونَ اللَّهَ وَهُوَ خَادِعُهُمْ وَإِذَا قَامُوا إِلَى الصَّلَاةِ قَامُوا كُسَالَىٰ يُرَاءُونَ النَّاسَ وَلَا يَذْكُرُونَ اللَّهَ إِلَّا قَلِيلًا﴾","disp":"قال الله تَعَالَى: ﴿إِنَّ الْمُنَافِقِينَ يُخَادِعُونَ اللَّهَ وَهُوَ خَادِعُهُمْ وَإِذَا قَامُوا إِلَى الصَّلَاةِ قَامُوا كُسَالَىٰ يُرَاءُونَ النَّاسَ وَلَا يَذْكُرُونَ اللَّهَ إِلَّا قَلِيلًا﴾","kind":"B4_mixed_ayah","lesson":"src","pos":36,"secs":21.7,"dens":0.9,"before":null,"after":null,"pending":false,"session":4,"ctx":"الدرس: ثقلٌ بلا سبب\nالهدف: سنعرف ما الكسل، ولماذا يُذمّ.\n\nقبله: ثقلٌ يشدّك عن الخير… ما هو؟\nقبله: الكسل: هو التثاقل عن فعل الخير وما يجب على الإنسان فعله، ومن ذلك التكاسل في فعل الواجبات.\n◀ هذا السطر الذي ستسجّله ▶\nبعده: وثلاثةٌ ينبغي تركها، وثلاثةٌ ينبغي فعلها.\nبعده: ينبغي للمؤمن ترك الكسل والخمول والقعود."},{"u":"src.mar.q","ids":["src.mar.q"],"text":"قال تَعَالَى: ﴿كُنتُمْ خَيْرَ أُمَّةٍ أُخْرِجَتْ لِلنَّاسِ تَأْمُرُونَ بِالْمَعْرُوفِ وَتَنْهَوْنَ عَنِ الْمُنكَرِ وَتُؤْمِنُونَ بِاللَّهِ وَلَوْ ءَامَنَ أَهْلُ الْكِتَٰبِ لَكَانَ خَيْرًۭا لَّهُم مِّنْهُمُ الْمُؤْمِنُونَ وَأَكْثَرُهُمُ الْفَٰسِقُونَ﴾","disp":"قال تَعَالَى: ﴿كُنتُمْ خَيْرَ أُمَّةٍ أُخْرِجَتْ لِلنَّاسِ تَأْمُرُونَ بِالْمَعْرُوفِ وَتَنْهَوْنَ عَنِ الْمُنكَرِ وَتُؤْمِنُونَ بِاللَّهِ وَلَوْ ءَامَنَ أَهْلُ الْكِتَٰبِ لَكَانَ خَيْرًۭا لَّهُم مِّنْهُمُ الْمُؤْمِنُونَ وَأَكْثَرُهُمُ الْفَٰسِقُونَ﴾","kind":"B4_mixed_ayah","lesson":"src","pos":37,"secs":15.4,"dens":0.9,"before":null,"after":null,"pending":false,"session":4,"ctx":"الدرس: كلمةٌ في وقتها\nالهدف: سنعرف ما المعروف وما المنكر، وكيف ننصح من نحبّ.\n\nقبله: والمنكر: هو النهي عن كل معصيةٍ لله عزّ وجلّ.\nقبله: المعروف: هو الأمر بكل طاعةٍ لله عزّ وجلّ. والمنكر: هو النهي عن كل معصيةٍ لله عزّ وجلّ.\n◀ هذا السطر الذي ستسجّله ▶\nبعده: ماذا تفعل؟\nبعده: نصحتَ، لكنّك فضحتَه. والنصيحة في السرّ أرجى أن تُقبل."},{"u":"src.qad.ayah.s1","ids":["src.qad.ayah.s1"],"text":"قال تَعَالَى: ﴿إِنَّا كُلَّ شَيْءٍ خَلَقْنَاهُ بِقَدَرٍ﴾","disp":"قال تَعَالَى: ﴿إِنَّا كُلَّ شَيْءٍ خَلَقْنَاهُ بِقَدَرٍ﴾","kind":"B4_mixed_ayah","lesson":"src","pos":38,"secs":6.2,"dens":0.9,"before":null,"after":null,"pending":false,"session":4,"ctx":"الدرس: ما كُتب لك\nالهدف: سنعرف معنى الإيمان بالقدر، ومراتبه الأربع.\n\nقبله: هل حدث لك شيءٌ لم تُرده يومًا؟\n◀ هذا السطر الذي ستسجّله ▶\nبعده: ماذا تقول في نفسك؟\nبعده: وما أصابك لم يكن ليُخطئك، وقد كُتب قبل أن تُخلق."},{"u":"src.tw3.ayah.s1","ids":["src.tw3.ayah.s1"],"text":"خلقنا الله لعبادته وحده لا شريك له، ولم يخلقنا عبثًا أو للهو واللعب، أو يتركنا سدًى وهملًا. قال تَعَالَى: ﴿وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ﴾.","disp":"خلقنا الله لعبادته وحده لا شريك له، ولم يخلقنا عبثًا أو للهو واللعب، أو يتركنا سدًى وهملًا. قال تَعَالَى: ﴿وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ﴾.","kind":"B4_mixed_ayah","lesson":"src","pos":39,"secs":18.2,"dens":0.9,"before":null,"after":null,"pending":false,"session":4,"ctx":"الدرس: لماذا خُلقتُ\nالهدف: سنعرف لماذا خلقنا الله، وما أعظم واجبٍ علينا، وأنواع التوحيد.\n\nقبله: ما أكبر سؤالٍ في حياتك؟\n◀ هذا السطر الذي ستسجّله ▶\nبعده: لماذا خلقك الله؟\nبعده: ولم يخلقنا عبثًا ولا للهو واللعب، ولا يتركنا سدًى وهملًا."},{"u":"src.tw3.ayah.s2","ids":["src.tw3.ayah.s2"],"text":"وأعظم واجبٍ علينا: توحيد الله تَعَالَى. قال تعالى: ﴿وَمَآ أُمِرُوٓا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ حُنَفَآءَ وَيُقِيمُوا الصَّلَوٰةَ وَيُؤْتُوا الزَّكَوٰةَ وَذَٰلِكَ دِينُ الْقَيِّمَةِ﴾","disp":"وأعظم واجبٍ علينا: توحيد الله تَعَالَى. قال تعالى: ﴿وَمَآ أُمِرُوٓا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ حُنَفَآءَ وَيُقِيمُوا الصَّلَوٰةَ وَيُؤْتُوا الزَّكَوٰةَ وَذَٰلِكَ دِينُ الْقَيِّمَةِ﴾","kind":"B4_mixed_ayah","lesson":"src","pos":40,"secs":14.6,"dens":0.9,"before":null,"after":null,"pending":false,"session":4,"ctx":"الدرس: لماذا خُلقتُ\nالهدف: سنعرف لماذا خلقنا الله، وما أعظم واجبٍ علينا، وأنواع التوحيد.\n\nقبله: ولم يخلقنا عبثًا ولا للهو واللعب، ولا يتركنا سدًى وهملًا.\nقبله: أحسنت، خلقنا الله لعبادته وحده.\n◀ هذا السطر الذي ستسجّله ▶\nبعده: والتوحيد ثلاثة أنواع. اجمعها.\nبعده: الإيمان بأنّ الله هو الخالق الرازق المالك المدبّر، وحده لا شريك له."},{"u":"src.tym.how.a","ids":["src.tym.how.a"],"text":"التيمّم: هو استعمال التراب وغيره من صعيد الأرض، عند فقد الماء أو تعذّر استعماله. قال تعالى: ﴿يَٰٓأَيُّهَا الَّذِينَ ءَامَنُوا لَا تَقْرَبُوا الصَّلَوٰةَ وَأَنتُمْ سُكَٰرَىٰ حَتَّىٰ تَعْلَمُوا مَا تَقُولُونَ وَلَا جُنُبًا إِلَّا عَابِرِى سَبِيلٍ حَتَّىٰ تَغْتَسِلُوا وَإِن كُنتُم مَّرْضَىٰٓ أَوْ عَلَىٰ سَفَرٍ أَوْ جَآءَ أَحَدٌۭ مِّنكُم مِّنَ الْغَآئِطِ أَوْ لَٰمَسْتُمُ النِّسَآءَ فَلَمْ تَجِدُوا مَآءًۭ فَتَيَمَّمُوا صَعِيدًۭا طَيِّبًۭا فَامْسَحُوا بِوُجُوهِكُمْ وَأَيْدِيكُمْ إِنَّ اللَّهَ كَانَ عَفُوًّا غَفُورًا﴾.","disp":"التيمّم: هو استعمال التراب وغيره من صعيد الأرض، عند فقد الماء أو تعذّر استعماله. قال تعالى: ﴿يَٰٓأَيُّهَا الَّذِينَ ءَامَنُوا لَا تَقْرَبُوا الصَّلَوٰةَ وَأَنتُمْ سُكَٰرَىٰ حَتَّىٰ تَعْلَمُوا مَا تَقُولُونَ وَلَا جُنُبًا إِلَّا عَابِرِى سَبِيلٍ حَتَّىٰ تَغْتَسِلُوا وَإِن كُنتُم مَّرْضَىٰٓ أَوْ عَلَىٰ سَفَرٍ أَوْ جَآءَ أَحَدٌۭ مِّنكُم مِّنَ الْغَآئِطِ أَوْ لَٰمَسْتُمُ النِّسَآءَ فَلَمْ تَجِدُوا مَآءًۭ فَتَيَمَّمُوا صَعِيدًۭا طَيِّبًۭا فَامْسَحُوا بِوُجُوهِكُمْ وَأَيْدِيكُمْ إِنَّ اللَّهَ كَانَ عَفُوًّا غَفُورًا﴾.","kind":"B4_mixed_ayah","lesson":"src","pos":41,"secs":20.9,"dens":0.9,"before":null,"after":null,"pending":false,"session":4,"ctx":"الدرس: حين لا أجد ماء\nالهدف: سنعرف ما التيمّم، وكيف نتيمّم، والمسح على الخفّين.\n\nقبله: وإن لم تجد ماءً… ماذا تصنع؟\n◀ هذا السطر الذي ستسجّله ▶\nبعده: وصفته: بضرب التراب ضربةً واحدة بباطن الكفّين، ومسح الوجه وظاهر الكفّين مرّةً واحدة.\nبعده: لا ماء أمامك. رتّب تيمّمك."},{"u":"src.aad.three.a","ids":["src.aad.three.a"],"text":"أعداء الإنسان: النفس الأمّارة بالسوء، قال سُبْحَانَهُ: ﴿وَمَآ أُبَرِّئُ نَفْسِىٓ إِنَّ النَّفْسَ لَأَمَّارَةٌۢ بِالسُّوٓءِ إِلَّا مَا رَحِمَ رَبِّىٓ إِنَّ رَبِّى غَفُورٌۭ رَّحِيمٌۭ﴾.","disp":"أعداء الإنسان: النفس الأمّارة بالسوء، قال سُبْحَانَهُ: ﴿وَمَآ أُبَرِّئُ نَفْسِىٓ إِنَّ النَّفْسَ لَأَمَّارَةٌۢ بِالسُّوٓءِ إِلَّا مَا رَحِمَ رَبِّىٓ إِنَّ رَبِّى غَفُورٌۭ رَّحِيمٌۭ﴾.","kind":"B4_mixed_ayah","lesson":"src","pos":42,"secs":10.8,"dens":0.9,"b <script>
"use strict";
/* ══════════ البيانات المضمَّنة ══════════ */
const Q = JSON.parse(document.getElementById("queue").textContent);
const ALL = Q.units;
const SKIPKEY = "athar.rec.skip.ayah";
(function(){ let k = []; try { k = JSON.parse(localStorage.getItem(SKIPKEY) || "[]"); } catch (e) {} const st = new Set(k); ALL.forEach(u => { if (st.has(u.u)) u.skip = true; }); })();
function saveSkip() { try { localStorage.setItem(SKIPKEY, JSON.stringify(ALL.filter(u => u.skip).map(u => u.u))); } catch (e) {} }                         /* وحدات التسجيل بترتيب المسار */
const ENTRIES = Q.entries;                   /* id → {parts:[{u}|{url:[…]}], ok} */
const HASHES = Q.hashes;                     /* id → pack_key للنص عند البناء (لكشف تغيّر النص) */
const TASH0 = Q.tashkeel || {};              /* تشكيل كامل مقترح (وحدة → نص) */
const $ = id => document.getElementById(id);
const nf = new Intl.NumberFormat("ar-EG");
const num = n => nf.format(n);

/* ══════════ تخزين آمن: IndexedDB مع احتياطي في الذاكرة ══════════ */
const DB = (() => {
  let db = null, mem = { takes: new Map(), partial: new Map(), meta: new Map() }, usingMem = false;
  const open = () => new Promise(res => {
    try {
      const rq = indexedDB.open("athar-record-v1-ayah", 1);
      rq.onupgradeneeded = () => { const d = rq.result; ["takes", "partial", "meta"].forEach(s => d.createObjectStore(s)); };
      rq.onsuccess = () => { db = rq.result; res(true); };
      rq.onerror = rq.onblocked = () => { usingMem = true; res(false); };
    } catch (e) { usingMem = true; res(false); }
  });
  const tx = (s, mode, fn) => new Promise((res, rej) => {
    if (usingMem || !db) { try { res(fn(null)); } catch (e) { rej(e); } return; }
    try {
      const t = db.transaction(s, mode), st = t.objectStore(s); let out;
      const r = fn(st); if (r && "onsuccess" in r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = t.onabort = () => rej(t.error || new Error("idb"));
    } catch (e) { rej(e); }
  });
  return {
    open, get mem() { return usingMem; },
    put: (s, k, v) => usingMem ? (mem[s].set(k, v), Promise.resolve()) : tx(s, "readwrite", st => st.put(v, k)),
    get: (s, k) => usingMem ? Promise.resolve(mem[s].get(k)) : tx(s, "readonly", st => st.get(k)),
    del: (s, k) => usingMem ? (mem[s].delete(k), Promise.resolve()) : tx(s, "readwrite", st => st.delete(k)),
    keys: s => usingMem ? Promise.resolve([...mem[s].keys()]) : tx(s, "readonly", st => st.getAllKeys()),
    clear: s => usingMem ? (mem[s].clear(), Promise.resolve()) : tx(s, "readwrite", st => st.clear())
  };
})();

/* ══════════ الحالة ══════════ */
const PRESETS = [["human_reader", "human_reader — القارئ (افتراضي)"], ["human_reader2", "human_reader2 — قارئ ثانٍ"], ["human_parent", "human_parent — الوالد/الوالدة"], ["human_teacher", "human_teacher — المعلّم"], ["__custom", "مخصَّص…"]];
const S = {
  speaker: "", voice: Q.voice_default || "human_reader", showPending: false, auto: false, fmt: "native", idx: 0, theme: "",
  fs: 1, takes: new Map(),      /* u → {mime, dur, bytes, ts, rec?} للصوت الحالي */
  tash: {},              /* وحدة → نص مشكَّل مستورد */
  recording: false, busy: false, kf: "all"
};
const view = () => ALL.filter(u => (S.showPending || (!u.pending && !u.skip)) && (!S.kf || S.kf === "all" || u.kind === S.kf));
const cur = () => view()[Math.min(S.idx, view().length - 1)];
const key = u => S.voice + "|" + u;

    const us = e.parts.filter(p => p.u).map(p => p.u);
    if (!us.some(has)) continue;
    if (us.every(has) && e.ok) ids.add(id); else inc.push(id);
  }
  return { done, ids, inc };
}
function sesPicker() {
  let h = "<label style=\"display:block;margin:6px 0\">ماذا تُصدِّر؟ <select id=\"expSes\" style=\"font:inherit;padding:6px\"><option value=\"0\">كل ما سُجِّل</option>";
  for (let i = 1; i <= Q.sessions; i++) h += "<option value=\"" + i + "\"" + (EXP_SES === i ? " selected" : "") + ">الجلسة " + num(i) + " فقط (" + num(sessionDone(i)) + "/" + num(sessionTotal(i)) + ")</option>";
  return h + "</select></label>";
}
function openExport() {
  const { done, ids, inc } = exportSummary();
  const bytes = done.reduce((a, u) => a + (S.takes.get(u.u).bytes || 0), 0);
  $("expSum").innerHTML = "الصوت: <b class=\"uid\">" + S.voice + "</b> · المتحدث: <b>" + (S.speaker || "—") + "</b><br>ملفات مسجَّلة: <b>" + num(done.length) + "</b> من " + num(ALL.filter(u => (!u.pending && !u.skip)).length) +
    "<br>أسطر مكتملة تُربط بالمحرّك: <b>" + num(ids.size) + "</b>" + (inc.length ? "<br>أسطر ناقصة (بعض مقاطعها لم تُسجَّل): " + num(inc.length) : "") +
    "<br>الحجم التقريبي: " + (bytes / 1048576).toFixed(1) + " م.ب" + (S.fmt === "wav" ? " (قبل التحويل إلى WAV)" : "") + (S.speaker ? "" : "<br><span class=\"chip warn\">لم تُدخل اسم المتحدث بعد</span>");
  $("expSum").insertAdjacentHTML("afterbegin", sesPicker());
  $("expSes").onchange = e => { EXP_SES = parseInt(e.target.value, 10) || 0; openExport(); };
  $("expMsg").textContent = ""; $("expBar").hidden = true; $("eShare").hidden = true; $("eGo").disabled = done.length === 0;
  if (!$("dExp").open) $("dExp").showModal();
}
async function doExport() {
  if (!validVoice(S.voice)) { $("expMsg").textContent = "اسم الصوت غير صالح."; return; }
  const { done, ids, inc } = exportSummary(); if (!done.length) return;
  $("eGo").disabled = true; $("expBar").hidden = false; const bar = $("expBar").firstElementChild;
  const files = [], man = { schema: "athar-record/1", tool: "record.html", created: new Date().toISOString(), speaker: S.speaker || "", voice: S.voice, audio_root: "audio/" + S.voice + "/", format: S.fmt, units: [], entries: {}, incomplete: inc, pending_excluded: ALL.filter(u => u.pending).length, text_hash: {} };
  man.skipped = ALL.filter(u => u.skip).map(u => ({ u: u.u, text: u.disp })); const fileOf = {}; let n = 0;
  try {
    for (const u of done) {
      const t = await DB.get("takes", key(u.u)); if (!t) continue;
      let data, mime = t.mime, dur = t.dur, ext = extOf(mime);
      if (S.fmt === "wav") { const w = await toWav(t.blob); data = w.u8; mime = "audio/wav"; ext = "wav"; dur = w.dur; }
      else data = new Uint8Array(await t.blob.arrayBuffer());
      const rel = S.voice + "/" + u.u + "." + ext;
      files.push({ name: "audio/" + rel, data });
      fileOf[u.u] = rel;
      man.units.push({ u: u.u, file: "audio/" + rel, mime, bytes: data.length, dur: Math.round(dur * 100) / 100, sha256: await sha256hex(data), ids: u.ids, text: u.disp, recorded_at: new Date(t.ts).toISOString(), recovered: !!t.recovered });
      bar.style.width = (100 * (++n) / done.length) + "%";
    }
    for (const id of ids) {
      const parts = ENTRIES[id].parts.map(p => p.u ? fileOf[p.u] : p.url).flat();
      man.entries[id] = { file: parts.length === 1 ? parts[0] : parts };
      man.text_hash[id] = HASHES[id];
    }
    const readme = "حزمة تسجيل بشري — أثر\r\nالمتحدث: " + (S.speaker || "") + "\r\nالصوت: " + S.voice + "\r\n\r\n" +
      "audio/" + S.voice + "/   ← الملفات الصوتية (اسم الملف = معرّف الوحدة)\r\nmanifest.json  ← يربط كل معرّف سطر بملفه (entries) وبمقاطع الحصري للأسطر المختلطة\r\n\r\n" +
      "التطبيق في المستودع: python3 apply_human_audio.py --repo <مسار athar> --zip هذا_الملف.zip [--to-mp3] [--apply]\r\n";
    const enc = new TextEncoder();
    files.push({ name: "manifest.json", data: enc.encode(JSON.stringify(man, null, 1)) });
    files.push({ name: "README.txt", data: enc.encode(readme) });
    const zip = zipBuild(files); lastZip = zip;
    const d = new Date(), p2 = x => String(x).padStart(2, "0");
    const fname = "athar-human-" + S.voice + (EXP_SES ? "-s" + EXP_SES : "") + "-" + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + "-" + p2(d.getHours()) + p2(d.getMinutes()) + ".zip";
    const a = document.createElement("a"); a.href = URL.createObjectURL(zip); a.download = fname; a.id = "dl"; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    $("expMsg").textContent = "تم إنشاء " + fname + " (" + (zip.size / 1048576).toFixed(1) + " م.ب) — " + num(done.length) + " ملفًا و" + num(ids.size) + " سطرًا مربوطًا.";
    window.__lastExport = { name: fname, size: zip.size, files: files.length };
    if (navigator.canShare && navigator.canShare({ files: [new File([zip], fname, { type: "application/zip" })] })) { $("eShare").hidden = false; $("eShare").onclick = () => navigator.share({ files: [new File([zip], fname, { type: "application/zip" })] }).catch(() => {}); }
  } catch (e) { $("expMsg").textContent = "تعذّر التصدير: " + (e && (e.message || e.name) || "خطأ"); }
  $("eGo").disabled = false;
}

/* ══════════ الإعدادات ══════════ */
function openSettings() {
  $("iSpeaker").value = S.speaker; $("cPend").checked = S.showPending; $("cAuto").checked = S.auto; $("sFmt").value = S.fmt;
  const sv = $("sVoice"); sv.innerHTML = PRESETS.map(p => "<option value=\"" + p[0] + "\">" + p[1] + "</option>").join("");
  const known = PRESETS.some(p => p[0] === S.voice && p[0] !== "__custom"); sv.value = known ? S.voice : "__custom";
  $("iVoice").hidden = known; $("iVoice").value = known ? "" : S.voice;
  $("tashInfo").textContent = Object.keys(S.tash).length ? "مستورَد: " + num(Object.keys(S.tash).length) + " سطرًا مشكَّلًا" : "";
  $("dSet").showModal();
}
async function saveSettings() {
  let v = $("sVoice").value === "__custom" ? $("iVoice").value.trim() : $("sVoice").value;
  if (!validVoice(v)) { toast("اسم الصوت غير صالح: حروف إنجليزية صغيرة وأرقام و _ و - فقط"); return; }
  const changed = v !== S.voice;
  S.speaker = $("iSpeaker").value.trim(); S.showPending = $("cPend").checked; S.auto = $("cAuto").checked; S.fmt = $("sFmt").value; S.voice = v;
  if (changed) { await loadTakes(); S.idx = 0; }
  await saveMeta(); $("dSet").close(); render(); toast("حُفظت الإعدادات");
}

/* ══════════ ربط الأحداث ══════════ */
function bind() {
  $("bRec").onclick = () => S.recording ? stopRec(false) : startRec();
  $("bPrev").onclick = () => go(-1); $("bNext").onclick = () => go(1);
  $("bPlay").onclick = playTake;
  $("bSkip").onclick = () => { const u = view()[S.idx]; if (!u || S.recording) return; u.skip = !u.skip; saveSkip(); toast(u.skip ? "استُبعد — لن يُحسب ولن يمنع التصدير" : "أُعيد المقطع للقائمة"); render(); };
  $("bRedo").onclick = () => { if (S.recording) stopRec(true); else startRec(); };
  $("bNextOpen").onclick = () => { $("dList").close(); nextOpen(); };
  $("bFp").onclick = () => setFs(S.fs + 1); $("bFm").onclick = () => setFs(S.fs - 1);
  $("bExport").onclick = openExport; $("eGo").onclick = doExport; $("eClose").onclick = () => $("dExp").close();
  $("bSet").onclick = openSettings; $("sClose").onclick = () => $("dSet").close(); $("sSave").onclick = saveSettings;
  $("sVoice").onchange = () => { $("iVoice").hidden = $("sVoice").value !== "__custom"; };
  $("sTheme").onclick = () => { S.theme = S.theme === "dark" ? "light" : "dark"; applyTheme(); saveMeta(); };
  $("sWipe").onclick = async () => {
    if (!confirm("سيُمسح كل ما سجَّلته في هذا الجهاز لهذا الصوت. هل أنت متأكد؟")) return;
    const ks = await DB.keys("takes"); for (const k of ks) if (String(k).startsWith(S.voice + "|")) await DB.del("takes", k);
    S.takes = new Map(); S.idx = 0; await saveMeta(); $("dSet").close(); render(); toast("مُسحت التسجيلات");
  };
  $("fTash").onchange = async ev => {
    const f = ev.target.files[0]; if (!f) return;
    try { const j = JSON.parse(await f.text()); const o = {}; let c = 0;
      for (const [k, v] of Object.entries(j)) { if (k[0] === "_" || typeof v !== "string") continue; o[k] = v; c++; }
      S.tash = Object.assign(S.tash, o); await saveMeta(); $("tashInfo").textContent = "استُورد " + num(c) + " سطرًا"; render();
    } catch (e) { $("tashInfo").textContent = "ملف غير صالح"; }
  };
  $("bList").onclick = () => { $("dList").showModal(); buildList(); const c = $("ulist").querySelector(".cur"); if (c) c.scrollIntoView({ block: "center" }); };
  $("lClose").onclick = () => $("dList").close();
  $("ulist").onclick = ev => { const li = ev.target.closest("li[data-i]"); if (li) { $("dList").close(); jump(+li.dataset.i); } };
  const syncK = () => [...$("kfilters").children].forEach(x => x.classList.toggle("on", x.dataset.k === (S.kf || "all")));
  $("kfilters").onclick = ev => { const b = ev.target.closest("button"); if (!b || S.recording) return; S.kf = b.dataset.k; if (!view().length) S.kf = "all"; S.idx = 0; syncK(); saveMeta(); render(); };
  window.__syncK = syncK;
  $("filters").onclick = ev => { const b = ev.target.closest("button"); if (!b) return; filt = b.dataset.f; [...$("filters").children].forEach(x => x.classList.toggle("on", x === b)); buildList(); };
  document.addEventListener("keydown", ev => {
    if (document.querySelector("dialog[open]") || /INPUT|SELECT|TEXTAREA/.test((ev.target || {}).tagName || "")) return;
    if (ev.code === "Space") { ev.preventDefault(); $("bRec").click(); }
    else if (ev.code === "ArrowLeft") go(1); else if (ev.code === "ArrowRight") go(-1);
    else if (ev.key === "p" || ev.key === "P") playTake();
  });
  window.addEventListener("beforeunload", () => { if (S.recording) { try { R.mr.requestData(); } catch (e) {} } });
  document.addEventListener("visibilitychange", () => { if (document.hidden && S.recording) toast("تنبيه: التسجيل مستمر؛ لا تغلق الصفحة", 3000); });
}

const CATS = [
  { k: "B1_dhikr_dua", ic: "🤲", n: "أذكار وأدعية" },
  { k: "B2_hadith_quote", ic: "📜", n: "أحاديث ومقتبسات" },
  { k: "B3_sacred_text", ic: "📖", n: "نصوص شرعية" },
  { k: "B4_mixed_ayah", ic: "🕌", n: "نصوص بين الآيات" },
  { k: "B5_pending_embedded_ayah", ic: "📗", n: "شروح فيها ألفاظ قرآنية" },
  { k: "all", ic: "🗂️", n: "كل الأقسام معًا", full: true }
];
function buildHome() {
  const box = $("cats"); let h = "";
  CATS.forEach(c => {
    const us = ALL.filter(u => (!u.pending && !u.skip) && (c.k === "all" || u.kind === c.k)), d = us.filter(u => S.takes.has(u.u)).length;
    const pct = us.length ? Math.round(d * 100 / us.length) : 0;
    h += "<button class=\"cat" + (c.full ? " full" : "") + (d && d === us.length ? " fin" : "") + "\" data-k=\"" + c.k + "\"><span class=\"ic\">" + c.ic + "</span><b>" + c.n + "</b><small>" + num(d) + " من " + num(us.length) + (d === us.length && d ? " ✓" : "") + "</small>" + (c.full ? "" : "<span class=\"pb\"><i style=\"width:" + pct + "%\"></i></span>") + "</button>";
  });
  box.innerHTML = h;
  $("homeWho").textContent = (S.speaker ? "المتحدث: " + S.speaker + " — " : "") + "اضغط الأيقونة لتبدأ. يمكنك الرجوع من زر «الأقسام» في الأعلى.";
}
function showHome() { return; if (S.recording) return; buildHome(); $("home").classList.add("on"); $("home").scrollTop = 0; }
function pickCat(k) {
  S.kf = k; const V = view(); let i = V.findIndex(u => !S.takes.has(u.u)); S.idx = i < 0 ? 0 : i;
  if (window.__syncK) window.__syncK(); saveMeta(); $("home").classList.remove("on"); render();
}
(async function init() {
  await DB.open();
  await loadMeta();
  const rec = await recoverPartials();
  await loadTakes();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  bind();
  let fl = 1; try { const v = parseInt(localStorage.getItem("athar.rec.fs2"), 10); if (v >= 0 && v <= 4) fl = v; } catch (e) {}
  setFs(fl);
  if (S.idx >= view().length) S.idx = 0;
  if (window.__syncK) window.__syncK();
  $("cats").onclick = ev => { const b = ev.target.closest(".cat"); if (b) pickCat(b.dataset.k); };
  $("bHome").onclick = showHome; $("hSet").onclick = () => { $("home").classList.remove("on"); openSettings(); };
  render();
  if (rec) toast("استُعيد " + num(rec) + " تسجيلًا انقطع قبل اكتماله", 4500);
  window.__rec = { S, ALL, ENTRIES, view, cur, exportSummary, DB, key, jump, get lastZip() { return lastZip; } };
})();
