<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أثر — صوت كتاب الأصول الثلاثة</title>
<style>
:root{--g:#2A8067;--p:#FDF7E8;--ink:#1d2b26;--m:#6b7a73;--r:#b3382c;--line:#e3d9bd}
*{box-sizing:border-box}
body{margin:0;background:var(--p);color:var(--ink);font:18px/1.7 "Noto Naskh Arabic","Amiri",system-ui,sans-serif;padding:16px;max-width:720px;margin-inline:auto}
h1{color:var(--g);font-size:25px;margin:.2em 0 .4em}
ol{padding-inline-start:22px;margin:0 0 12px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0}
label{display:block;font-weight:700;margin:10px 0 4px}
input,select,button{font:inherit;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);width:100%}
button{background:var(--g);color:#fff;border:0;font-weight:700;cursor:pointer;min-height:48px}
button.s{background:#fff;color:var(--g);border:1px solid var(--g)}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 150px}
.bar{height:10px;background:#eee4c8;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--g)}
.sm{font-size:15px;color:var(--m)}.err{color:var(--r);font-weight:700}
.ln{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:8px 0}
.ln span{flex:1;font-size:16px}.ln button{width:auto;min-height:40px;padding:6px 12px}
.ok{color:var(--g)}
details summary{cursor:pointer;color:var(--m)}
</style></head><body>
<h1>صوت كتاب «الأصول الثلاثة»</h1>
<ol>
<li>الصق مفتاح ElevenLabs.</li>
<li>اضغط «عيّنة» واسمعها (٣ جمل).</li>
<li>إن أعجبك الصوت اضغط «ولّد الكل».</li>
<li>اضغط «نزّل الملف» وأرسله لي.</li>
</ol>
<div class="card">
<label for="k">مفتاح ElevenLabs</label>
<input id="k" type="password" dir="ltr" autocomplete="off" placeholder="sk_…">
<details><summary>إعدادات الصوت (الافتراضي هو صوت القاعدة النورانية)</summary>
<label for="vid">معرّف الصوت</label><input id="vid" dir="ltr" value="ctC3wK5bnR7WwqxOKFlC">
<label for="mo">النموذج</label><select id="mo"><option value="eleven_v3">eleven_v3</option><option value="eleven_multilingual_v2">eleven_multilingual_v2</option><option value="eleven_turbo_v2_5">eleven_turbo_v2_5</option></select>
<label for="st">الثبات</label><select id="st"><option value="1">١٫٠ ثابت (موصى به)</option><option value="0.5">٠٫٥ طبيعي</option><option value="0">٠٫٠ حر</option></select>
<label for="al">لفظ الجلالة</label><select id="al"><option value="1">ألف خنجرية (موصى به)</option><option value="0">الأصل</option><option value="2">فتحة صريحة</option><option value="3">كلمة قبلها</option><option value="4">ألف وصل</option></select>
<label for="rules">قواعد استبدال (سطر لكل قاعدة: كلمة=&gt;بديل)</label><textarea id="rules" rows="3" dir="rtl" style="width:100%;font:inherit;padding:10px;border-radius:12px;border:1px solid var(--line)">على الله=>عَلَى اللهِ
من الله=>مِنَ اللهِ
إلى الله=>إِلَى اللهِ
عند الله=>عِنْدَ اللهِ</textarea>
</details>
<div class="sm" id="est"></div>
</div>
<div class="row"><button id="smp">عيّنة (٣ جمل)</button><button id="all">ولّد الكل</button></div>
<div class="card"><div class="bar"><i id="pb"></i></div><div id="big" class="sm" style="margin-top:6px"></div><div id="msg" class="err"></div></div>
<div class="row"><button id="dl" class="s" disabled>نزّل الملف</button></div>
<div id="list" class="card"></div>
<script>
const LINES=["ما أجمل النهار! الشمس تُضيء الدنيا. مَن الذي خلق الشمس؟ الذي خلقها هو الله.", "الليل والنهار والشمس والقمر: كلّها علامات تدلّنا على الله.", "اضغط على النهار والليل", "هذا القمر، خلقه الله", "هذا النهار، خلقه الله", "هذه الشمس، خلقها الله", "هذا الليل، خلقه الله", "من ربّك؟", "ربّي الله", "هيا نبني أركان الإسلام الخمسة", "الشهادتان. أقول: لا إله إلا الله، محمد رسول الله", "الصلاة. أصلّي لله", "الزكاة. نُعطي الفقراء جزءًا من أموالنا", "صوم رمضان. نصوم في شهر رمضان", "الحجّ. نزور بيت الله الحرام في مكة", "بنينا أركان الإسلام الخمسة", "ما دينك؟", "ديني الإسلام", "من نبيّك؟", "نبيّي محمد ﷺ", "لمن الحمد والشكر؟", "نحمد الله لأنه ربّنا ورازقنا.", "كم إلهًا لنا؟", "الله وحده هو ربّنا ومعبودنا.", "ماذا أعطانا الله لنشكره؟", "نشكر الله بأن نستعمل سمعنا وبصرنا في الخير.", "لماذا خلقنا الله؟", "نعبد الله وحده، ونصلّي له ونطيعه.", "ديني الإسلام: أن أعبد الله وحده، وأسمع كلامه وأُطيعه.", "ماذا طلب الله من الناس؟", "ربّنا هو الذي خلقنا، فنعبده ونتّقيه.", "ما الدين عند الله؟", "نبيّي اسمه محمد بن عبد الله ﷺ، وُلد في مدينة مكة.", "ديننا الإسلام، نعبد الله وحده ونتّبع نبيّه ﷺ.", "لماذا أرسل الله محمدًا ﷺ؟", "كان النبي ﷺ رحيمًا بالناس والصغار.", "كيف وصف الله خُلُق نبيّنا ﷺ؟", "نتعلم من النبي ﷺ حسن الخلق.", "ماذا يفعل الله وملائكته على النبي ﷺ؟", "وأمرنا الله أن نصلّي عليه ونسلّم، فنقول: صلّى الله عليه وسلّم.", "كيف يكون حبّنا للنبي ﷺ؟", "من أحبّ النبي ﷺ اتّبع سنّته.", "وفي الليل يظهر القمر وتلمع النجوم. مَن الذي خلقها؟ هو الله.", "والله جعل الأرض لنا مكانًا نعيش عليه، والسماء فوقنا، وأنزل المطر فتخرج لنا الثمار.", "ربّي هو الله، الذي ربّاني ورعاني بنعمه.", "الإسلام له خمسة أركان، مثل خمسة أعمدة يقوم عليها البيت.", "اختاره الله رسولًا إلينا، ونزل عليه القرآن.", "ثم هاجر إلى المدينة، وبنى فيها مسجده.", "نحبّ نبيّنا ﷺ، ونصلّي عليه، ونقول: صلّى الله عليه وسلّم.", "تمّت الفوانيس الثلاثة، ما شاء الله، والحمد لله"];
const $=id=>document.getElementById(id);
const L=LINES.map(t=>({text:t,blob:null,sent:null,bytes:null}));
function vNorm(t){return String(t).replace(/[ً-ٰٟـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/[!؟?.,،:؛]+/g," ").replace(/\s+/g," ").replace(/^ | $/g,"")}
function vHash(t){const n=vNorm(t);let x=5381;for(let i=0;i<n.length;i++)x=(((x<<5)+x)^n.charCodeAt(i))>>>0;return x.toString(16)}
const D="[\\u064B-\\u065F\\u0670]*",LET="\\u0621-\\u064A\\u0671";
const ALLAH=new RegExp("(^|[^"+LET+"\\u064B-\\u065F\\u0670])([وفبت]"+D+")?((?:ا|ٱ)"+D+")?(ل"+D+")(ل"+D+")(ه)("+D+")(م"+D+")?(?![" + LET + "])","g");
function allahVar(t,v){v=+v;if(!v)return t;return t.replace(ALLAH,(m,pre,px,al,l1,l2,h,hd,mim)=>{
 px=px||"";al=al||"";mim=mim||"";const bare=x=>x.replace(new RegExp(D,"g"),"");
 const hm=(hd||"").replace(/[ّٰ]/g,"")||"ُ";
 const core=(a,L1)=>a+L1+"لَّٰ"+"ه"+hm+mim;
 const A=bare(al),L=al?bare(l1):l1;
 if(v===1)return pre+px+core(A,L);
 if(v===2)return pre+px+core(!px&&al?"اَ":A,L);
 if(v===3)return pre+(!px&&al&&pre===""?"قَالَ ":"")+px+core(A,L);
 if(v===4)return pre+px+core(!px&&al?"ٱ":A,L);
 return m})}
function applyRules(t){for(const ln of $("rules").value.split(/\r?\n/)){const i=ln.indexOf("=>");if(i<1)continue;const a=ln.slice(0,i).trim(),b=ln.slice(i+2).trim();if(a&&b)t=t.split(a).join(b)}return t}
const sentOf=i=>allahVar(applyRules(L[i].text),$("al").value);
class Fatal extends Error{}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function tts(text){
 const k=$("k").value.trim(),v=$("vid").value.trim();
 if(!k||!v)throw new Fatal("الصق المفتاح أولًا");
 const body={text,model_id:$("mo").value,voice_settings:{stability:+$("st").value,similarity_boost:.8,style:0,use_speaker_boost:true}};
 for(let a=0;a<6;a++){
  let r;
  try{r=await fetch("https://api.elevenlabs.io/v1/text-to-speech/"+v+"?output_format=mp3_44100_128",{method:"POST",headers:{"xi-api-key":k,"Content-Type":"application/json",Accept:"audio/mpeg"},body:JSON.stringify(body)})}
  catch(e){if(a<3){await sleep(1500*(a+1));continue}throw e}
  if(r.ok)return r.blob();
  const tx=(await r.text()).slice(0,300);
  if(/quota/i.test(tx))throw new Fatal("نفد الرصيد. ما تم توليده محفوظ في الصفحة؛ زد الرصيد ثم اضغط «ولّد الكل».");
  if(r.status===401)throw new Fatal("المفتاح غير صالح.");
  if(r.status===429){await sleep(Math.min(30000,1500*2**a));continue}
  if(r.status>=500&&a<3){await sleep(2000);continue}
  throw new Error(r.status+" "+tx.slice(0,100));
 }
 throw new Error("ازدحام متكرر؛ أعد المحاولة بعد قليل");
}
const nAr=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
function est(){
 const tot=L.reduce((a,l,i)=>a+sentOf(i).length,0);
 $("est").textContent="عدد الجمل: "+nAr(L.length)+" · الحروف: نحو "+nAr(tot)+" (تُحسب من رصيدك)";
 const n=L.filter(l=>l.blob).length;
 $("big").textContent=nAr(n)+" / "+nAr(L.length);
 $("pb").style.width=(100*n/L.length)+"%";
 $("dl").disabled=n<L.length;
}
function row(i){
 let r=$("r"+i);
 if(!r){r=document.createElement("div");r.className="ln";r.id="r"+i;$("list").appendChild(r)}
 const l=L[i];
 r.innerHTML="";
 const s=document.createElement("span");s.textContent=(l.blob?"✓ ":"")+l.text;if(l.blob)s.className="ok";r.appendChild(s);
 if(l.blob){
  const p=document.createElement("button");p.className="s";p.textContent="▶";p.onclick=()=>{const a=new Audio(URL.createObjectURL(l.blob));a.play()};r.appendChild(p);
  const g=document.createElement("button");g.className="s";g.textContent="↻";g.title="إعادة توليد";g.onclick=async()=>{g.disabled=true;try{await gen(i)}catch(e){$("msg").textContent=e.message}row(i);est()};r.appendChild(g);
 }
}
async function gen(i){
 const sent=sentOf(i),blob=await tts(sent);
 L[i].blob=blob;L[i].sent=sent;L[i].bytes=new Uint8Array(await blob.arrayBuffer());
}
let busy=false;
async function run(idx,playFirst){
 if(busy)return;busy=true;$("smp").disabled=$("all").disabled=true;$("msg").textContent="";
 try{
  for(const i of idx){
   if(L[i].blob)continue;
   await gen(i);row(i);est();
  }
  if(playFirst&&playFirst.length){const a=new Audio(URL.createObjectURL(L[playFirst[0]].blob));a.play()}
 }catch(e){$("msg").textContent=e.message}
 busy=false;$("smp").disabled=$("all").disabled=false;est();
}
function pick3(){
 const a=L.findIndex(l=>/الله/.test(l.text));
 const out=[a>=0?a:0];
 for(let i=0;i<L.length&&out.length<3;i++){if(!out.includes(i)&&L[i].text.length>30)out.push(i)}
 return out;
}
$("al").onchange=est;$("rules").oninput=est;
$("smp").onclick=()=>run(pick3(),null);
$("all").onclick=()=>run(L.map((_,i)=>i),null);
["mo","st"].forEach(k=>$(k).onchange=()=>{
 // تغيير الإعداد: تُمسح الجمل المولَّدة ليُعاد توليدها بالإعداد الجديد
 if(L.some(l=>l.blob)&&confirm("تغيير هذا الإعداد يمسح ما وُلّد ليُعاد توليده. تابع؟")){L.forEach(l=>{l.blob=null;l.bytes=null});LINES.forEach((_,i)=>row(i))}
 est()});
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC_T[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function zipBuild(files){const enc=new TextEncoder(),parts=[],central=[];let off=0;const d=new Date(),dt=((d.getFullYear()-1980)<<9|(d.getMonth()+1)<<5|d.getDate())&0xFFFF,tm=(d.getHours()<<11|d.getMinutes()<<5|(d.getSeconds()>>1))&0xFFFF;
 for(const f of files){const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length,lh=new DataView(new ArrayBuffer(30));
  lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(10,tm,true);lh.setUint16(12,dt,true);lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);
  parts.push(lh.buffer,nm,f.data);
  const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
  central.push(ch.buffer,nm);off+=30+nm.length+sz}
 let csz=0;central.forEach(c=>csz+=c.byteLength!==undefined?c.byteLength:c.length);const e=new DataView(new ArrayBuffer(22));
 e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csz,true);e.setUint32(16,off,true);
 return new Blob([...parts,...central,e.buffer],{type:"application/zip"})}
$("dl").onclick=()=>{
 const chunks=[],e={},texts={};let off=0;
 L.forEach(l=>{const h=vHash(l.text);if(e[h])return;e[h]=[0,off,l.bytes.length];texts[h]=l.text;chunks.push(l.bytes);off+=l.bytes.length});
 const bin=new Uint8Array(off);let p=0;chunks.forEach(c=>{bin.set(c,p);p+=c.length});
 const meta={schema:"athar-usul-voice/1",created:new Date().toISOString(),voice:$("vid").value.trim(),model:$("mo").value,stability:+$("st").value,allah_variant:+$("al").value,e,texts};
 const z=zipBuild([{name:"sp_usul.bin",data:bin},{name:"usul-index.json",data:new TextEncoder().encode(JSON.stringify(meta))}]);
 const a=document.createElement("a");a.href=URL.createObjectURL(z);a.download="athar-usul-voice.zip";document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
};
LINES.forEach((_,i)=>row(i));est();
</script></body></html>
