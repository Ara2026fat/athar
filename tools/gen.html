<h1>توليد الأسطر المشكولة</h1>
<div class="note">تعمل الأداة في متصفحك فقط. المفتاح يبقى في ذاكرة الصفحة <b>ولا يُحفظ أبدًا</b>؛ أما النتائج والتعديلات والإعدادات فتُحفظ تلقائيًا على جهازك. الأسطر المولَّدة <b>اصطناعية</b> وتُوسَم <code>synthetic</code> في manifest.</div>
<div class="note warn">لا تُولَّد هنا آيات القرآن ولا الأسطر التي بداخلها آيات.</div>
<label for="k">مفتاح ElevenLabs (لا يُحفظ)</label><input id="k" type="password" autocomplete="off" dir="ltr" placeholder="sk_...">
<div class="row"><button id="bv">جلب الأصوات</button></div>
<label for="v">الصوت</label><select id="v"><option value="">— اجلب الأصوات أولًا —</option></select>

<label for="seed">بذرة seed (اختياري — تثبيت أقرب بين المحاولات، غير مضمون)</label><input id="seed" inputmode="numeric" dir="ltr" placeholder="مثال: 12345">

function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open("athar-gen",1);r.onupgradeneeded=()=>{r.result.createObjectStore("kv");r.result.createObjectStore("lines")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error("blocked"))}catch(e){rej(e)}})}

function zipBuild(files){const enc=new TextEncoder(),parts=[],central=[];let off=0;const d=new Date(),dt=((d.getFullYear()-1980)<<9|(d.getMonth()+1)<<5|d.getDate())&0xFFFF,tm=(d.getHours()<<11|d.getMinutes()<<5|(d.getSeconds()>>1))&0xFFFF;
 for(const f of files){const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length,lh=new DataView(new ArrayBuffer(30));
  lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(10,tm,true);lh.setUint16(12,dt,true);lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);
  parts.push(lh.buffer,nm,f.data);
  const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
  central.push(ch.buffer,nm);off+=30+nm.length+sz}
 let csz=0;central.forEach(c=>csz+=c.byteLength!==undefined?c.byteLength:c.length);const e=new DataView(new ArrayBuffer(22));
 e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csz,true);e.setUint32(16,off,true);
 return new Blob([...parts,...central,e.buffer],{type:"application/zip"})}
const sha=async u=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",u))].map(b=>b.toString(16).padStart(2,"0")).join("");
/* ── الدفعات ── */
const BATCHES=[];for(let i=0;i<DATA.units.length;i+=BATCH)BATCHES.push(DATA.units.slice(i,i+BATCH));
const NB=BATCHES.length, esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const apprAtt=u=>{const l=LN[u];return l.attempts.find(a=>a.id===l.approved)};
const isAppr=u=>!!apprAtt(u);
function build(){
 const root=$("batches");root.innerHTML="";
 BATCHES.forEach((bu,bi)=>{
  const d=document.createElement("details");d.className="batch";d.id="b"+bi;
  d.innerHTML=`<summary><span>الدفعة ${bi+1} من ${NB}</span><span class="cnt"></span></summary><div class="bd"><ul></ul><div class="bar"><i></i></div><div class="row"><button data-bg="${bi}">ولّد هذه الدفعة</button><button data-bz="${bi}" disabled>تنزيل ZIP هذه الدفعة</button></div></div>`;
  const ul=d.querySelector("ul");
  bu.forEach((u,ui)=>{const n=bi*BATCH+ui+1;const li=document.createElement("li");li.className="ln";li.dataset.u=u.u;
   li.innerHTML=`<div class="hd"><b>سطر ${n}</b><span class="badge"></span></div><textarea rows="2"></textarea><div class="m">${u.u} · ${u.ids.length} معرّف</div><div class="row"><button class="s" data-g="${u.u}">ولّد</button><button class="s bad" data-x="${u.u}">يحتاج إعادة ✖</button><button class="s" data-r="${u.u}">استعادة الأصل</button><button class="s" data-f="${u.u}">٥ صيغ للفظ الجلالة</button></div><div class="atts"></div><div class="trs"></div>`;
   li.querySelector("textarea").value=LN[u.u].text??u.text;
   li.querySelector("textarea").oninput=e=>{LN[u.u].text=e.target.value===u.text?null:e.target.value;li.classList.toggle("ed",LN[u.u].text!==null);saveLine(u.u)};
   ul.appendChild(li);EL[u.u]=li;updLine(u.u)});
  root.appendChild(d);updBatch(bi)});
 const first=BATCHES.findIndex(b=>!b.every(u=>isAppr(u.u)));(first<0?$("b0"):$("b"+first)).open=true;
 totals()}
function lineOf(u){return DATA.units.find(x=>x.u===u)}
function updLine(u){
 const l=LN[u],li=EL[u];if(!li)return;const a=apprAtt(u);
 const st=a?["appr","معتمد ✔"]:l.needFix?["fix","يحتاج إعادة ✖"]:l.attempts.length?["gen","مولَّد"]:["","لم يُولَّد"];
 const bd=li.querySelector(".badge");bd.className="badge "+st[0];bd.textContent=st[1];
 li.classList.toggle("approved",!!a);li.classList.toggle("fix",!a&&l.needFix);li.classList.toggle("ed",l.text!==null);
 li.querySelector("[data-g]").textContent=l.attempts.length?"ولّد مرة أخرى":"ولّد";
 li.querySelector("[data-x]").textContent=l.needFix?"✔ إزالة علامة الإعادة":"يحتاج إعادة ✖";
 const box=li.querySelector(".atts");box.innerHTML="";
 [...l.attempts].reverse().forEach((t,i)=>{const n=l.attempts.length-i,row=document.createElement("div");row.className="att"+(t.id===l.approved?" sel":"");
  row.innerHTML=`<span class="l">محاولة ${n} · ${t.model.replace("eleven_","")} · ث${t.stab}</span><button class="s" data-p="${t.id}">▶ استمع</button><button class="s ${t.id===l.approved?"ok":""}" data-a="${t.id}" data-u="${u}">${t.id===l.approved?"✔ معتمدة":"اعتمد هذه"}</button>`;box.appendChild(row)});
 const bi=Math.floor(DATA.units.findIndex(x=>x.u===u)/BATCH);updBatch(bi);totals()}
function updBatch(bi){const d=$("b"+bi);if(!d)return;const bu=BATCHES[bi],n=bu.filter(u=>isAppr(u.u)).length;
 d.querySelector(".cnt").textContent=`معتمد ${n}/${bu.length}`;d.classList.toggle("done",n===bu.length);d.querySelector("[data-bz]").disabled=n===0}
function totals(){const n=DATA.units.filter(u=>isAppr(u.u)).length;$("dlall").disabled=n===0;$("dlall").textContent=`تنزيل ZIP لكل المعتمد (${n}/${DATA.units.length})`}
/* ── API ── */
function sttg(){return +$("st").value}
async function tts(text){const k=$("k").value.trim(),v=$("vid").value.trim()||$("v").value;if(!k||!v)throw new Error("المفتاح والصوت مطلوبان");
 const body={text,model_id:$("mo").value,voice_settings:{stability:sttg(),similarity_boost:.8,style:0,use_speaker_boost:true}};
 const sd=$("seed").value.trim();if(/^\d+$/.test(sd))body.seed=Math.min(+sd,4294967295);
 const r=await fetch("https://api.elevenlabs.io/v1/text-to-speech/"+v+"?output_format=mp3_44100_128",{method:"POST",headers:{"xi-api-key":k,"Content-Type":"application/json",Accept:"audio/mpeg"},body:JSON.stringify(body)});
 if(!r.ok)throw new Error(r.status+" "+(await r.text()).slice(0,120));return r.blob()}
let seq=Date.now();
async function gen(u,count){const l=LN[u],d=lineOf(u),text=l.text??d.text,v=$("vid").value.trim()||$("v").value;
 for(let i=0;i<count;i++){const sent=prep(text),blob=await tts(sent);
  l.attempts.push({id:"a"+(++seq),blob,ts:Date.now(),sent,model:$("mo").value,voice:v,stab:sttg(),allah:+$("al").value,seed:$("seed").value.trim()||null,edited:l.text!==null});
  while(l.attempts.length>3){const k=l.attempts.findIndex(a=>a.id!==l.approved);l.attempts.splice(k,1)}
  l.needFix=false;saveLine(u);updLine(u)}}
async function genLine(u,btn){const c=$("auto3").checked?3:1;btn&&(btn.disabled=true);try{await gen(u,c)}catch(e){EL[u].classList.add("fix");msg(u+": "+e.message)}btn&&(btn.disabled=false)}
async function genBatch(bi,btn){btn.disabled=true;const bu=BATCHES[bi],bar=$("b"+bi).querySelector(".bar i");let n=0;bar.style.width="0";
 for(const u of bu){const l=LN[u.u];if(!l.attempts.length||l.needFix){try{await gen(u.u,$("auto3").checked?3:1)}catch(e){msg(u.u+": "+e.message);break}}bar.style.width=(100*++n/bu.length)+"%"}
 msg(`انتهت الدفعة ${bi+1}: استمع واعتمد لكل سطر.`);btn.disabled=false}
/* ── ZIP ── */
async function zipUnits(units,tag){const fo=$("fo").value.trim();if(!validVoice(fo))return msg("اسم المجلد غير صالح.");
 const files=[],man={schema:"athar-record/1",tool:"gen.html",created:new Date().toISOString(),speaker:"elevenlabs",synthetic:true,engine:"elevenlabs",voice:fo,audio_root:"audio/"+fo+"/",format:"mp3",approved_only:true,units:[],entries:{},incomplete:[],text_hash:{}};
 for(const u of units){const t=apprAtt(u.u);if(!t)continue;const data=new Uint8Array(await t.blob.arrayBuffer()),rel=fo+"/"+u.u+".mp3";
  files.push({name:"audio/"+rel,data});man.units.push({u:u.u,file:"audio/"+rel,mime:"audio/mpeg",bytes:data.length,sha256:await sha(data),ids:u.ids,text:u.text,eleven_voice_id:t.voice,model:t.model,stability:t.stab,seed:t.seed,allah_variant:t.allah,sent_text:t.sent,edited:t.edited,recorded_at:new Date(t.ts).toISOString(),synthetic:true,approved:true})}
 if(!files.length)return msg("لا يوجد سطر معتمد في هذه الدفعة.");
 const have=new Set(man.units.map(x=>x.u));
 for(const[id,en] of Object.entries(DATA.entries)){if(en.every(p=>have.has(p))){man.entries[id]={file:en.length===1?fo+"/"+en[0]+".mp3":en.map(p=>fo+"/"+p+".mp3")};man.text_hash[id]=DATA.hashes[id]}else if(en.some(p=>have.has(p)))man.incomplete.push(id)}
 const enc=new TextEncoder();files.push({name:"manifest.json",data:enc.encode(JSON.stringify(man,null,1))});
 files.push({name:"README.txt",data:enc.encode("حزمة صوت اصطناعي (ElevenLabs) — أثر — المعتمد فقط\r\nاسم الملف = معرّف الوحدة (نفس أسماء record.html).\r\nلا تُوسَم هذه الملفات بأنها بشرية (لا تستخدم --mark-human معها).\r\n")});
 const a=document.createElement("a");a.href=URL.createObjectURL(zipBuild(files));a.download="athar-ai-"+fo+"-"+tag+"-"+new Date().toISOString().slice(0,10)+".zip";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);msg("نُزّلت الحزمة: "+(files.length-2)+" ملفًا صوتيًا معتمدًا.")}
/* ── الأحداث ── */
function play(blob){if(curAudio)curAudio.pause();curAudio=new Audio(URL.createObjectURL(blob));curAudio.play()}
async function trial(u){const li=EL[u.u],box=li.querySelector(".trs"),base=li.querySelector("textarea").value;box.innerHTML="";const blobs={};
 for(let i=0;i<5;i++){const tx=allahVar(base,i),d=document.createElement("div");d.className="tr";d.dataset.v=i;
  d.innerHTML=`<div class="m">صيغة ${i+1}: ${["الأصل","ألف خنجرية","فتحة صريحة","كلمة قبلها","ألف وصل ٱ"][i]}</div><div class="tx"></div><div class="row"><button class="s" data-tpb disabled>▶ استمع</button><button class="s pick" data-c="${i}">✔ اعتمد هذه الصيغة</button></div>`;
  d.querySelector(".tx").textContent=tx;box.appendChild(d);
  try{const b=await tts(tx);d.querySelector("[data-tpb]").disabled=false;d.querySelector("[data-tpb]").onclick=()=>play(b)}catch(e){msg("تجربة: "+e.message);return}}
 msg("اسمع الصيغ الخمس ثم اضغط «اعتمد» على أفضلها.")}
document.body.addEventListener("click",async e=>{const t=e.target.closest("button");if(!t)return;const D=t.dataset;
 if(D.g)return genLine(D.g,t);
 if(D.bg)return genBatch(+D.bg,t);
 if(D.bz){const bi=+D.bz;return zipUnits(BATCHES[bi],"batch"+(bi+1))}
 if(D.p){for(const u in LN){const a=LN[u].attempts.find(x=>x.id===D.p);if(a)return play(a.blob)}}
 if(D.a){const l=LN[D.u];l.approved=l.approved===D.a?null:D.a;if(l.approved)l.needFix=false;saveLine(D.u);return updLine(D.u)}
 if(D.x){const l=LN[D.x];l.needFix=!l.needFix;if(l.needFix)l.approved=null;saveLine(D.x);return updLine(D.x)}
 if(D.r){const u=lineOf(D.r);EL[D.r].querySelector("textarea").value=u.text;LN[D.r].text=null;saveLine(D.r);return updLine(D.r)}
 if(D.f)return trial(lineOf(D.f));
 if(D.c!==undefined&&D.c!==""&&t.classList.contains("pick")){$("al").value=D.c;saveSet();document.querySelectorAll(".tr").forEach(el=>{const on=el.dataset.v===D.c;el.classList.toggle("sel",on);el.classList.toggle("dim",!on);const b=el.querySelector(".pick");if(b)b.textContent=on?"✔ معتمدة":"✔ اعتمد هذه الصيغة"});return msg("اختيرت الصيغة "+(+D.c+1)+" وستُطبَّق على كل الأسطر عند التوليد.")}
});
$("dlall").onclick=()=>zipUnits(DATA.units,"all");
$("go").onclick=async()=>{for(let i=0;i<NB;i++){await genBatch(i,$("b"+i).querySelector("[data-bg]"))}msg("انتهى توليد كل الدفعات.")};
$("clr").onclick=async()=>{if(!confirm("مسح كل المحفوظ (النتائج والتعديلات والإعدادات)؟"))return;
 if(DB){try{const tx=DB.transaction(["kv","lines"],"readwrite");tx.objectStore("kv").clear();tx.objectStore("lines").clear();await new Promise(r=>{tx.oncomplete=tx.onerror=tx.onabort=()=>r()})}catch(e){}}
 SET.forEach(k=>{const e=$(k);if(e.tagName==="SELECT")e.selectedIndex=0;else e.value=e.getAttribute("value")||""});$("vid").value="";$("auto3").checked=false;
 DATA.units.forEach(u=>LN[u.u]={text:null,attempts:[],approved:null,needFix:false});build();msg("مُسح المحفوظ.")};
$("bv").onclick=async()=>{const k=$("k").value.trim();if(!k)return msg("ألصق المفتاح أولًا.");msg("جارٍ جلب الأصوات…");
 try{const r=await fetch("https://api.elevenlabs.io/v1/voices",{headers:{"xi-api-key":k}});if(!r.ok)throw new Error(r.status);const j=await r.json();
  $("v").innerHTML=j.voices.map(v=>`<option value="${v.voice_id}">${v.name}${v.labels&&v.labels.accent?" — "+v.labels.accent:""}</option>`).join("");msg("وُجد "+j.voices.length+" صوتًا.")}catch(e){msg("تعذّر الجلب ("+e.message+"). ألصق معرّف الصوت مباشرة.")}};
[...SET,"v","auto3"].forEach(k=>$(k).addEventListener("change",saveSet));$("vid").addEventListener("input",saveSet);$("seed").addEventListener("input",saveSet);
/* ── الإقلاع: استرجاع المحفوظ ── */
(async()=>{DATA.units.forEach(u=>LN[u.u]={text:null,attempts:[],approved:null,needFix:false});
 try{DB=await idb();const s=(await getAll("kv")).settings;if(s){SET.forEach(k=>{if(s[k]!=null&&k!=="vid")$(k).value=s[k]});$("vid").value=s.vid||"";$("auto3").checked=!!s.auto3}
  const ls=await getAll("lines");for(const u in ls)if(LN[u])Object.assign(LN[u],ls[u])}catch(e){DB=null;msg("تعذّر الحفظ التلقائي في هذا المتصفح — لن يُحفظ شيء.")}
 build();window.__ready=true})();
</script></body></html>
