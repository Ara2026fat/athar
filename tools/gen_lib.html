<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أثر — توليد أصوات المكتبة</title>
<style>
:root{--g:#2A8067;--p:#FDF7E8;--ink:#1d2b26;--m:#6b7a73;--r:#b3382c;--line:#e3d9bd}
*{box-sizing:border-box}
body{margin:0;background:var(--p);color:var(--ink);font:18px/1.7 "Noto Naskh Arabic","Amiri",system-ui,sans-serif;padding:16px;max-width:720px;margin-inline:auto}
h1{color:var(--g);font-size:25px;margin:.2em 0 .4em}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0}
label{display:block;font-weight:700;margin:10px 0 4px}
input,select,button{font:inherit;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);width:100%}
button{background:var(--g);color:#fff;border:0;font-weight:700;cursor:pointer;min-height:48px;margin-top:8px}
button.s{background:#fff;color:var(--g);border:1px solid var(--g)}
button:disabled{opacity:.5}
.bar{height:12px;background:#eee4c8;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--g)}
.sm{font-size:15px;color:var(--m)}.err{color:var(--r);font-weight:700}
.big{font-size:22px;font-weight:700}
</style></head><body>

د سفينة","b":"sqnb"},{"t":"فوضع الألف دينار مع رسالة في خشبة، ورماها في البحر وقال: اللهم إني أستودعكها.","b":"sqnb"},{"t":"خرج المقرض ينظر هل جاءت سفينة بماله، فأخذ خشبة حطبًا لأهله فوجد فيها المال والرسالة","b":"sqnb"},{"t":"ثم جاء المقترض بألف دينار، وأخبره أنه لم يجد سفينة قبل ذلك","b":"sqnb"},{"t":"فقال المقرض: إن الله قد أدى عنك الذي بعثت في الخشبة، فانصرف بالألف راشدًا.","b":"sqnb"},{"t":"ماذا قال المقترض حين طلب منه الشهود والكفيل؟","b":"sqnb"},{"t":"قال: كفى بالله شهيدًا، وكفى بالله كفيلًا.","b":"sqnb"},{"t":"أين وضع الرجل الدنانير حين لم يجد سفينة؟","b":"sqnb"},{"t":"وضع المال والرسالة في خشبة ورماها في البحر، فوجدها المقرض.","b":"sqnb"},{"t":"حدّث النبي صلى الله عليه وسلم عن تاجر كان يعطي الناس مالًا أو بضاعة على أن يردوه لاحقًا","b":"sqnb"},{"t":"فإذا رأى مدينًا لا يقدر على السداد قال لفتيانه: تجاوزوا عنه.","b":"sqnb"},{"t":"وقال: لعل الله أن يتجاوز عنا","b":"sqnb"},{"t":"فتجاوز الله عنه.","b":"sqnb"},{"t":"ماذا قال التاجر لفتيانه حين رأى مدينًا لا يقدر على السداد؟","b":"sqnb"},{"t":"قال لفتيانه: تجاوزوا عنه، لعل الله أن يتجاوز عنا.","b":"sqnb"},{"t":"ماذا فعل الله بالتاجر؟","b":"sqnb"},{"t":"ذكر النبي صلى الله عليه وسلم رجلًا كان يمشي في طريق","b":"sqnb"},{"t":"فوجد على الطريق غصن شوك.","b":"sqnb"},{"t":"فأخّره عن الطريق","b":"sqnb"},{"t":"فشكر الله له فغفر له.","b":"sqnb"},{"t":"ماذا وجد الرجل على الطريق؟","b":"sqnb"},{"t":"وجد غصن شوك على الطريق فأخّره.","b":"sqnb"},{"t":"ماذا فعل الله لهذا الرجل؟","b":"sqnb"},{"t":"قال النبي صلى الله عليه وسلم إنه يقوم في الصلاة وهو يريد أن يطيل فيها","b":"sqnb"},{"t":"ثم يسمع بكاء صبي.","b":"sqnb"},{"t":"فيخفف صلاته","b":"sqnb"},{"t":"لأنه يكره أن يشق على أمه.","b":"sqnb"},{"t":"ماذا سمع النبي صلى الله عليه وسلم وهو في الصلاة؟","b":"sqnb"},{"t":"قال: فأسمع بكاء الصبي.","b":"sqnb"},{"t":"لماذا خفف النبي صلى الله عليه وسلم صلاته؟","b":"sqnb"},{"t":"قال: كراهية أن أشق على أمه.","b":"sqnb"},{"t":"كان أنس يمشي مع النبي صلى الله عليه وسلم","b":"sqnb"},{"t":"فأدركه أعرابي فجذبه جذبة شديدة.","b":"sqnb"},{"t":"ثم قال الأعراب ":"قال: فليطعمه مما يأكل.","b":"sqrh"},{"t":"كان محمود بن الربيع رضي الله عنه طفلًا عمره خمس سنين.","b":"sqrh"},{"t":"أخذ النبي صلى الله عليه وسلم ماءً من دلو في فمه، ثم رشّه في وجه محمود.","b":"sqrh"},{"t":"وقد حفظ محمود هذا الموقف من النبي صلى الله عليه وسلم.","b":"sqrh"},{"t":"كم كان عمر محمود؟","b":"sqrh"},{"t":"كان ابن خمس سنين.","b":"sqrh"},{"t":"من أين كان الماء؟","b":"sqrh"},{"t":"ورد أن المجة كانت من دلو.","b":"sqrh"},{"t":"مرّ أنس بن مالك رضي الله عنه على صبيان.","b":"sqrh"},{"t":"فسلّم عليهم.","b":"sqrh"},{"t":"وقال إن النبي صلى الله عليه وسلم كان يفعل ذلك.","b":"sqrh"},{"t":"على من سلّم أنس؟","b":"sqrh"},{"t":"مرّ على صبيان فسلّم عليهم.","b":"sqrh"},{"t":"من الذي كان يفعل ذلك؟","b":"sqrh"},{"t":"قال أنس: كان النبي صلى الله عليه وسلم يفعله.","b":"sqrh"},{"t":"ظن سعد رضي الله عنه أن له فضلًا على من هم أقل منه مالًا.","b":"sqrh"},{"t":"فقال له النبي صلى الله عليه وسلم: هل تُنصرون وتُرزقون إلا بضعفائكم؟","b":"sqrh"},{"t":"فالفقراء والضعفاء لهم قدر عظيم عند الله.","b":"sqrh"},{"t":"بمن تُرزقون كما قال النبي صلى الله عليه وسلم؟","b":"sqrh"},{"t":"قال: إلا بضعفائكم.","b":"sqrh"},{"t":"ماذا ظن سعد؟","b":"sqrh"},{"t":"ظن أن له فضلًا على من دونه.","b":"sqrh"},{"t":"كانت الأمَة من إماء أهل المدينة تأتي إلى النبي صلى الله عليه وسلم.","b":"sqrh"},{"t":"فتأخذ بيده صلى الله عليه وسلم.","b":"sqrh"},{"t":"وتذهب به حيث شاءت.","b":"sqrh"},{"t":"من كانت تأخذ بيد النبي صلى الله عليه وسلم؟","b":"sqrh"},{"t":"كانت الأمة من إماء المدينة تأخذ بيده.","b":"sqrh"},{"t":"هل كان النبي صلى الله عليه وسلم متكبرًا؟","b":"sqrh"},{"t":"كان يذهب معها حيث شاءت.","b":"sqrh"},{"t":"قالت عائشة رضي الله عنها عن النبي صلى الله عليه وسلم: ما ضرب شيئًا قط بيده.","b":"sqrh"},{"t":"ولا ضرب امرأة ولا خادمًا.","b":"sqrh"},{"t":"كان صلى الله عليه وسلم رفيقًا بمن يخدمونه، ولا ينتقم لنفسه.","b":"sqrh"},{"t":"من الذي لم يضربه النبي صلى الله عليه وسلم؟","b":"sqrh"},{"t":"قالت: ولا امرأة ولا خادمًا.","b":"sqrh"},{"t":"من روت هذا الحديث؟","b":"sqrh"},{"t":"قالت عائشة رضي الله عنها.","b":"sqrh"},{"t":"قال الن function vNorm(t){return String(t).replace(/[\u064B-\u065F\u0670\u0640]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/[!؟?.,،:؛]+/g," ").replace(/\s+/g," ").replace(/^ | $/g,"")}
function vHash(t){const n=vNorm(t);let x=5381;for(let i=0;i<n.length;i++)x=(((x<<5)+x)^n.charCodeAt(i))>>>0;return x.toString(16)}
UNITS.forEach(u=>u.h=vHash(u.t));
const nAr=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
class Fatal extends Error{}
let DB=null;const pq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const DONE=new Map(); /* h -> Uint8Array */
async function openDB(){DB=await new Promise((res,rej)=>{const r=indexedDB.open("athar-gen-lib",1);r.onupgradeneeded=()=>r.result.createObjectStore("c");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function loadAll(){const st=DB.transaction("c").objectStore("c");const ks=await pq(st.getAllKeys()),vs=await pq(st.getAll());ks.forEach((k,i)=>DONE.set(k,vs[i]))}
async function put(h,u8){await pq(DB.transaction("c","readwrite").objectStore("c").put(u8,h));DONE.set(h,u8)}
async function tts(text){
 const k=$("k").value.trim(),v=$("vid").value.trim();
 if(!k||!v)throw new Fatal("الصق المفتاح أولًا");
 const body={text,model_id:$("mo").value,voice_settings:{stability:+$("st").value,similarity_boost:.8,style:0,use_speaker_boost:true}};
 for(let a=0;a<6;a++){
  let r;
  try{r=await fetch("https://api.elevenlabs.io/v1/text-to-speech/"+v+"?output_format=mp3_22050_32",{method:"POST",headers:{"xi-api-key":k,"Content-Type":"application/json",Accept:"audio/mpeg"},body:JSON.stringify(body)})}
  catch(e){if(a<4){await sleep(1500*(a+1));continue}throw e}
  if(r.ok)return new Uint8Array(await r.arrayBuffer());
  const tx=(await r.text()).slice(0,300);
  if(/quota/i.test(tx))throw new Fatal("نفد الرصيد. ما تم توليده محفوظ؛ زد الرصيد ثم تابع.");
  if(r.status===401)throw new Fatal("المفتاح غير صالح.");
  if(r.status===429){await sleep(Math.min(30000,2000*2**a));continue}
  if(r.status>=500&&a<3){await sleep(2000);continue}
  throw new Error(r.status+" "+tx.slice(0,100));
 }
 throw new Error("ازدحام متكرر");
}
function est(){
 const total=UNITS.length,done=UNITS.filter(u=>DONE.has(u.h)).length;
 const left=UNITS.filter(u=>!DONE.has(u.h)).reduce((a,u)=>a+u.t.length,0);
 $("est").textContent="الجمل: "+nAr(total)+" · الحروف المتبقية: نحو "+nAr(left);
 $("big").textContent="تم "+nAr(done)+" من "+nAr(total);
 $("pb").style.width=(100*done/total)+"%";
}
let run=false,t0=0,n0=0;
async function worker(q){
 while(run&&q.length){const u=q.shift();
  try{const b=await tts(u.t);await put(u.h,b);est();
   const el=(Date.now()-t0)/1000,dn=DONE.size-n0;if(dn>5){const rem=UNITS.length-DONE.size;$("eta").textContent="المتبقي نحو "+nAr(Math.round(rem*el/dn/60/3))+" دقيقة"}
  }catch(e){if(e instanceof Fatal){$("msg").textContent=e.message;run=false;return}
   u.fail=(u.fail||0)+1;if(u.fail<3)q.push(u);else $("msg").textContent="تعذّر سطر: "+u.t.slice(0,40)+" — "+e.message}}
}
$("go").onclick=async()=>{
 if(run)return;$("msg").textContent="";run=true;t0=Date.now();n0=DONE.size;
 $("go").disabled=true;$("stop").disabled=false;
 const q=UNITS.filter(u=>!DONE.has(u.h));
 await Promise.all([worker(q),worker(q),worker(q)]);
 run=false;$("go").disabled=false;$("stop").disabled=true;est();buildParts();
 if(UNITS.every(u=>DONE.has(u.h)))$("msg").textContent="اكتمل التوليد ✔ نزّل الأجزاء.";
};
$("stop").onclick=()=>{run=false};
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC_T[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function zipBuild(files){const enc=new TextEncoder(),parts=[],central=[];let off=0;const d=new Date(),dt=((d.getFullYear()-1980)<<9|(d.getMonth()+1)<<5|d.getDate())&0xFFFF,tm=(d.getHours()<<11|d.getMinutes()<<5|(d.getSeconds()>>1))&0xFFFF;
 for(const f of files){const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length,lh=new DataView(new ArrayBuffer(30));
  lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(10,tm,true);lh.setUint16(12,dt,true);lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);
  parts.push(lh.buffer,nm,f.data);
  const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
  central.push(ch.buffer,nm);off+=30+nm.length+sz}
 let csz=0;central.forEach(c=>csz+=c.byteLength!==undefined?c.byteLength:c.length);const e=new DataView(new ArrayBuffer(22));
 e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csz,true);e.setUint32(16,off,true);
 return new Blob([...parts,...central,e.buffer],{type:"application/zip"})}
function buildParts(){
 /* تجميع حسب الكتاب ثم تقسيم لأجزاء ≤ 12 ميغابايت */
 const books={};UNITS.forEach(u=>{if(DONE.has(u.h))(books[u.b]=books[u.b]||[]).push(u)});
 const parts=[];let cur=[],sz=0;
 Object.keys(books).sort().forEach(b=>{const bs=books[b].reduce((a,u)=>a+DONE.get(u.h).length,0);if(sz+bs>12e6&&cur.length){parts.push(cur);cur=[];sz=0}cur.push(b);sz+=bs});
 if(cur.length)parts.push(cur);
 const box=$("parts");box.innerHTML="";
 parts.forEach((bk,i)=>{
  const b=document.createElement("button");b.className="s";
  b.textContent="جزء "+nAr(i+1)+" من "+nAr(parts.length)+" ("+nAr(bk.length)+" كتاب)";
  b.onclick=()=>{
   const files=[],idx={packs:[],e:{}};
   bk.forEach(k=>{
    const us=books[k],pn="sp_lb_"+k+".bin";let off=0;const chunks=[];
    us.forEach(u=>{const d=DONE.get(u.h);idx.e[u.h]=[idx.packs.length,off,d.length];chunks.push(d);off+=d.length});
    const all=new Uint8Array(off);let o=0;chunks.forEach(c=>{all.set(c,o);o+=c.length});
    files.push({name:pn,data:all});idx.packs.push(pn);
   });
   files.push({name:"index_add.json",data:new TextEncoder().encode(JSON.stringify(idx))});
   const a=document.createElement("a");a.href=URL.createObjectURL(zipBuild(files));a.download="athar-lib-voice-part"+(i+1)+"of"+parts.length+".zip";a.click();
  };
  box.appendChild(b);
 });
}
$("mkparts").onclick=buildParts;
(async()=>{await openDB();await loadAll();est();buildParts()})();
</script></body></html>
