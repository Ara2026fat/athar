<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2A8067">
<title>تسجيل أثر — القارئ — المرحلة 1 من 3</title>
<style>
:root{
  --bg:#FDF7E8; --card:#FFFFFF; --ink:#1F2A24; --mute:#6B766F; --line:#E4DCC6;
  --brand:#2A8067; --brand-ink:#FFFFFF; --brand-soft:#DCEFE8;
  --rec:#C0392B; --rec-soft:#FBE4E0; --warn:#9A6A00; --warn-soft:#FFF1CC; --ok:#1E7A4E; --ok-soft:#DDF3E6;
  --ayah:#F1EAD2; --shadow:0 2px 14px rgba(40,50,40,.10);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101914; --card:#18241D; --ink:#EAF1EC; --mute:#9AAAA0; --line:#2A3B31;
    --brand:#3FA583; --brand-ink:#08150F; --brand-soft:#173128;
    --rec:#E5604F; --rec-soft:#3A1E1A; --warn:#E6BC52; --warn-soft:#3A3014; --ok:#58C98C; --ok-soft:#173526;
    --ayah:#222B22; --shadow:0 2px 14px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#101914; --card:#18241D; --ink:#EAF1EC; --mute:#9AAAA0; --line:#2A3B31;
  --brand:#3FA583; --brand-ink:#08150F; --brand-soft:#173128;
  --rec:#E5604F; --rec-soft:#3A1E1A; --warn:#E6BC52; --warn-soft:#3A3014; --ok:#58C98C; --ok-soft:#173526;
  --ayah:#222B22; --shadow:0 2px 14px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Naskh Arabic","Amiri","Geeza Pro","Traditional Arabic","Segoe UI","Tahoma",system-ui,sans-serif;font-size:17px;line-height:1.6}
body{height:100dvh;overflow:hidden;padding:env(safe-area-inset-top) 8px calc(env(safe-area-inset-bottom) + 6px)}
.wrap{max-width:760px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;gap:6px;padding:6px 0 4px;flex:none}
.ibtn.fs{font-size:24px;font-weight:700;min-width:56px;min-height:56px;padding:0 10px}
header.top h1{font-size:16px;margin:0;flex:1;font-weight:700;min-width:0}
header.top h1 small{display:block;font-size:13px;color:var(--mute);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
button{font:inherit;color:inherit;cursor:pointer}
.ibtn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-height:44px;box-shadow:var(--shadow)}
.ibtn:focus-visible,.btn:focus-visible,.rec:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.progress{margin:2px 0 6px;flex:none}
.progress .bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.progress .bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .25s}
.progress .meta{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);margin-top:4px;gap:8px;flex-wrap:wrap}
.warnbar{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 8px 0;box-shadow:var(--shadow);flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 4px}
.cardmeta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--mute);margin-bottom:8px}
.chip{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12.5px;background:var(--brand-soft);color:var(--brand)}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.rec{background:var(--rec-soft);color:var(--rec)}
.uid{direction:ltr;unicode-bidi:isolate;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.line{font-size:var(--fs,40px);line-height:1.95;text-align:center;margin:8px 0;padding:4px 0;overflow-wrap:anywhere}
.ctx{background:var(--ayah);border-radius:14px;padding:8px 12px;margin:8px 0;font-size:16px;color:var(--mute);text-align:center}
.ctx b{display:block;font-size:12.5px;color:var(--mute);font-weight:600}
.ctx .a{font-size:20px;line-height:2;color:var(--ink);opacity:.8}
.takeinfo{min-height:28px;text-align:center;font-size:14px;color:var(--mute)}
.dock{flex:none;background:var(--card);padding:6px 0 6px;border-top:1px solid var(--line)}
.controls{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:4px}
.controls .btn{min-height:80px}
.btn{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 8px;min-height:68px;font-size:20px;font-weight:700}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn[disabled]{opacity:.4;cursor:default}
.rec{width:92px;height:92px;border-radius:50%;border:6px solid var(--rec-soft);background:var(--rec);color:#fff;font-size:15px;font-weight:700;display:grid;place-items:center;box-shadow:0 6px 18px rgba(192,57,43,.35)}
.rec svg{width:34px;height:34px;fill:currentColor}
.rec.on{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(192,57,43,.18)}}
@media (prefers-reduced-motion:reduce){.rec.on{animation:none}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px auto 0;max-width:340px;visibility:hidden}
.meter.on{visibility:visible}.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .06s}
.timer{text-align:center;font-variant-numeric:tabular-nums;font-size:22px;min-height:0;color:var(--rec);font-weight:700}
.toast{position:fixed;inset-inline:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);max-width:560px;margin:auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;z-index:50;display:none;text-align:center;font-size:15px}
.toast.on{display:block}
dialog{border:none;border-radius:20px;padding:0;max-width:min(94vw,640px);width:100%;background:var(--card);color:var(--ink);box-shadow:0 10px 50px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:18px 18px 20px;max-height:86dvh;overflow:auto}
.dlg h2{margin:0 0 10px;font-size:20px}
.dlg label{display:block;margin:12px 0 4px;font-weight:600;font-size:15px}
.dlg input[type=text],.dlg select{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:46px}
.dlg .hint{font-size:13px;color:var(--mute);margin:3px 0}
.dlg .chk{display:flex;gap:10px;align-items:center;margin:12px 0}
.dlg .chk input{width:22px;height:22px}
.dlg .acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.dlg .acts .btn{flex:1;min-width:130px}
.list{list-style:none;margin:8px 0 0;padding:0}
.list li{display:flex;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer;min-height:48px}
.list li.cur{background:var(--brand-soft);border-radius:10px}
.list .dot{width:12px;height:12px;border-radius:50%;background:var(--line);flex:none}
.list .dot.ok{background:var(--ok)} .list .dot.pend{background:var(--warn)}
.list .t{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .sh{font-weight:700;background:var(--bg);color:var(--mute);cursor:default;font-size:13px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.filters button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 14px;min-height:36px}
.filters button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.bigprog{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0}.bigprog i{display:block;height:100%;width:0;background:var(--brand)}
.sig{text-align:center;color:var(--mute);font-size:12.5px;margin-top:22px}
.home{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:20px 16px 28px;display:none}
.home.on{display:block}
.home h2{margin:4px 0 4px;font-size:24px}.home p{margin:0 0 16px;color:var(--mute)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:640px;margin:0 auto}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:18px 8px;min-height:170px;font:inherit}
.cat:active{transform:scale(.97)}.cat .ic{font-size:52px;line-height:1}.cat b{font-size:19px}.cat small{color:var(--mute)}
.cat .pb{width:80%;height:8px;border-radius:9px;background:var(--line);overflow:hidden}.cat .pb i{display:block;height:100%;background:var(--brand)}
.cat.full{grid-column:1/-1;min-height:0;flex-direction:row;justify-content:center;padding:12px}.cat.full .ic{font-size:30px}
.cat.fin{border-color:var(--brand);background:var(--brand-soft)}
.homeacts{max-width:640px;margin:14px auto 0;display:flex;gap:8px;justify-content:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>تسجيل أثر <small id="who">المتحدث: —</small></h1>
    <button class="ibtn fs" id="bFm" aria-label="تصغير الخط">أ−</button>
    <button class="ibtn fs" id="bFp" aria-label="تكبير الخط">أ+</button>
    <button class="ibtn" id="bHome" aria-label="الأقسام">الأقسام</button>
    <button class="ibtn" id="bList" aria-label="الفهرس">الفهرس</button>
    <button class="ibtn" id="bSet" aria-label="الإعدادات">الإعدادات</button>
  </header>

  <div class="progress" aria-live="polite">
    <div class="bar"><i id="pbar"></i></div>
    <div class="meta"><span id="pTxt">—</span><span id="pSes">—</span></div>
  </div>
  <div id="warn" class="warnbar" hidden></div>

  <section class="card" id="card" aria-live="polite">
    <div class="scroll" id="scroll">
    <div class="cardmeta" id="cmeta"></div>
    <div class="ctx" id="cbefore" hidden></div>
    <div class="line" id="ltext" lang="ar"></div>
    <div class="ctx" id="cafter" hidden></div>
    <div class="takeinfo" id="tinfo"></div>
    </div>
    <div class="dock">
    <div class="timer" id="timer" aria-live="off"></div>
    <div class="meter" id="meter"><i></i></div>

    <div class="controls">
      <button class="btn" id="bPrev">‹ السابق</button>
      <button class="rec" id="bRec" aria-label="تسجيل"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg></button>
      <button class="btn" id="bNext">التالي ›</button>
    </div>
    <div class="row2">
      <button class="btn" id="bPlay" disabled>▶ استمع</button>
      <button class="btn" id="bRedo" disabled>↺ أعد التسجيل</button>
    </div>
    </div>
  </section>
</div>

<div class="home" id="home" role="dialog" aria-label="اختيار القسم"><div style="max-width:640px;margin:0 auto"><h2>اختر القسم الذي ستسجّله</h2><p id="homeWho">اضغط الأيقونة لتبدأ. يمكنك الرجوع من زر «الأقسام» في الأعلى.</p></div><div class="cats" id="cats"></div><div class="homeacts"><button class="btn" id="hSet">الإعدادات</button></div></div>
<div class="toast" id="toast" role="status"></div>

<dialog id="dSet"><div class="dlg">
  <h2>الإعدادات</h2>
  <label for="iSpeaker">اسم المتحدث (يظهر في الواجهة وفي ملف manifest)</label>
  <input type="text" id="iSpeaker" placeholder="مثال: الأستاذ عرفات" autocomplete="off">
  <label for="sVoice">الصوت (voice) — مجلد الملفات</label>
  <select id="sVoice"></select>
  <input type="text" id="iVoice" placeholder="human_reader" dir="ltr" style="margin-top:8px" hidden autocomplete="off" spellcheck="false">
  <div class="hint">لكل صوت تسجيلاته المنفصلة داخل هذا الجهاز. اسم المجلد: حروف إنجليزية صغيرة وأرقام و _ و - فقط.</div>
  <div class="chk"><input type="checkbox" id="cPend"><label for="cPend" style="margin:0;font-weight:500">إظهار الأسطر المعلَّقة (آيات مضمَّنة في كلام الراوي — لا تُسجَّل قبل اعتماد الإصلاح)</label></div>
  <div class="chk"><input type="checkbox" id="cAuto"><label for="cAuto" style="margin:0;font-weight:500">الانتقال تلقائيًا إلى السطر التالي بعد إيقاف التسجيل</label></div>
  <label for="sFmt">صيغة التصدير</label>
  <select id="sFmt"><option value="native">الأصلية للمتصفح (m4a أو webm) — أصغر حجمًا</option><option value="wav">WAV أحادي ٢٤ ك.هـ — يتوافق مع كل شيء (أكبر حجمًا)</option></select>
  <div class="hint">يمكن تحويل أي صيغة إلى mp3 لاحقًا بسكربت الرقعة (ffmpeg).</div>
  <label for="fTash">استيراد تشكيل كامل (JSON: {"المعرّف": "النص المشكَّل"})</label>
  <input type="file" id="fTash" accept="application/json,.json">
  <div class="hint" id="tashInfo"></div>
  <div class="acts">
    <button class="btn primary" id="sSave">حفظ</button>
    <button class="btn" id="sTheme">الوضع الليلي/النهاري</button>
    <button class="btn" id="sWipe" style="color:var(--rec)">مسح كل التسجيلات</button>
    <button class="btn" id="sClose">إغلاق</button>
  </div>
</div></dialog>

<dialog id="dList"><div class="dlg">
  <h2>الفهرس</h2>
  <div class="filters" id="filters">
    <button data-f="all" class="on">الكل</button><button data-f="todo">غير مسجَّل</button><button data-f="done">مسجَّل</button>
  </div>
  <div class="filters" id="kfilters"><button data-k="all" class="on">كل الأنواع</button><button data-k="B1_dhikr_dua">أذكار وأدعية</button><button data-k="B2_hadith_quote">أحاديث ومقتبسات</button><button data-k="B3_sacred_text">نصوص شرعية</button><button data-k="B4_mixed_ayah">نصوص بين الآيات</button></div>
  <ul class="list" id="ulist"></ul>
  <div class="acts"><button class="btn" id="bNextOpen">التالي غير المسجَّل</button><button class="btn primary" id="bExport">تصدير ZIP</button><button class="btn" id="lClose">إغلاق</button></div>
</div></dialog>

<dialog id="dExp"><div class="dlg">
  <h2>تصدير ZIP</h2>
  <div id="expSum" class="hint" style="font-size:15px"></div>
  <div class="bigprog" id="expBar" hidden><i></i></div>
  <div id="expMsg" class="hint"></div>
  <div class="acts">
    <button class="btn primary" id="eGo">إنشاء الملف</button>
    <button class="btn" id="eShare" hidden>مشاركة</button>
    <button class="btn" id="eClose">إغلاق</button>
  </div>
</div></dialog>

s":["src.sab.wudu"],"text":"ما تقول قبل الوضوء: «بسم الله». والذكر بعد الفراغ منه: «أشهد أن لا إله إلا الله وحده لا شريك له، وأشهد أن محمدًا عبده ورسوله».","disp":"ما تقول قبل الوضوء: «بسم الله». والذكر بعد الفراغ منه: «أشهد أن لا إله إلا الله وحده لا شريك له، وأشهد أن محمدًا عبده ورسوله».","kind":"B2_hadith_quote","lesson":"adhkar.sabah","pos":1,"secs":10.57,"dens":0.01,"before":null,"after":null,"pending":false,"session":1},{"u":"src.sab.out","ids":["src.sab.out"],"text":"والذكر عند الخروج من المنزل: «بسم الله، توكّلت على الله، ولا حول ولا قوّة إلا بالله».","disp":"والذكر عند الخروج من المنزل: «بسم الله، توكّلت على الله، ولا حول ولا قوّة إلا بالله».","kind":"B2_hadith_quote","lesson":"adhkar.sabah","pos":1,"secs":7.24,"dens":0.03,"before":null,"after":null,"pending":false,"session":1},{"u":"end.adhkar.thawb","ids":["end.adhkar.thawb"],"text":"تعلّمتَ اليوم: إذا لبستَ ثوبك قلتَ الحمد لله الذي كساني هذا الثوب، وإذا خلعتَه قلتَ بسم الله، وإذا رأيتَ ثوبًا جديدًا على غيرك قلتَ تُبلِي ويُخلف الله.","disp":"تعلّمتَ اليوم: إذا لبستَ ثوبك قلتَ الحمد لله الذي كساني هذا الثوب، وإذا خلعتَه قلتَ بسم الله، وإذا رأيتَ ثوبًا جديدًا على غيرك قلتَ تُبلِي ويُخلف الله.","kind":"B2_hadith_quote","lesson":"adhkar.thawb","pos":2,"secs":12.35,"dens":0.12,"before":null,"after":null,"pending":false,"session":1},{"u":"src.thw.wear","ids":["src.thw.wear"],"text":"ما تقول إذا لبستَ ثوبك: «الحمد لله الذي كساني هذا الثوب ورزقنيه من غير حولٍ منّي ولا قوّة». وإذا خلعتَ الثوب: «بسم الله».","disp":"ما تقول إذا لبستَ ثوبك: «الحمد لله الذي كساني هذا الثوب ورزقنيه من غير حولٍ منّي ولا قوّة». وإذا خلعتَ الثوب: «بسم الله».","kind":"B2_hadith_quote","lesson":"adhkar.thawb","pos":2,"secs":9.91,"dens":0.06,"before":null,"after":null,"pending":false,"session":1},{"u":"src.thw.new","ids":["src.thw.new"],"text":"ودعاء لبس الثوب الجديد: «اللهم لك الحمد أنت كسوتنيه، أسألك خيره وخير ما صُنع له، وأعوذ بك من شرّه وشرّ ما صُنع له». وإذا رأيتَ ثوبًا جديدًا على غيرك تدعو له وتقول: «تُبلِي ويُخلف الله تَعَالَى».","disp":"ودعاء لبس الثوب الجديد: «اللهم لك الحمد أنت كسوتنيه، أسألك خيره وخير ما صُنع له، وأعوذ بك من شرّه وشرّ ما صُنع له». وإذا رأيتَ ثوبًا جديدًا على غيرك تدعو له وتقول: «تُبلِي ويُخلف الله تَعَالَى».","kind":"B2_hadith_quote","lesson":"adhkar.thawb","pos":2,"secs":15.46,"dens":0.1,"before":null,"after":null,"pending":false,"session":1},{"u":"src.bayt.out","ids":["src.bayt.out"],"text":"أخرج بقدمي اليسرى وأقول: «بسم الله، توكّلت على الله، لا حول ولا قوّة إلا بالله».","disp":"أخرج بقدمي اليسرى وأقول: «بسم الله، توكّلت على الله، لا حول ولا قوّة إلا بالله».","kind":"B2_hadith_quote","lesson":"adab.bayt","pos":3,"secs":6.79,"dens":0.03,"before":null,"after":null,"pending":false,"session":1},{"u":"src.bayt.in","ids":["src.bayt.in"],"text":"وأدخل البيت بقدمي اليمنى وأقول: «بسم الله ولجنا، وبسم الله خرجنا، وعلى ربّنا توكّلنا»، ثم أُسلّم على أهل البيت.","disp":"وأدخل البيت بقدمي اليمنى وأقول: «بسم الله ولجنا، وبسم الله خرجنا، وعلى ربّنا توكّلنا»، ثم أُسلّم على أهل البيت.","kind":"B2_hadith_quote","lesson":"adab.bayt","pos":3,"secs":9.46,"dens":0.05,"before":null,"after":null,"pending":false,"session":1},{"u":"src.salam.say","ids":["src.salam.say"],"text":"يقول المسلم: «السلام عليكم ورحمة الله وبركاته».","disp":"يقول المسلم: «السلام عليكم ورحمة الله وبركاته».","kind":"B2_hadith_quote","lesson":"adab.salam","pos":4,"secs":4.46,"dens":0.0,"before":null,"after":null,"pending":false,"session":1},{"u":"src.salam.reply","ids":["src.salam.reply"],"text":"ويردّ عليه أخوه: «وعليكم السلام ورحمة الله وبركاته».","disp":"ويردّ عليه أخوه: «وعليكم السلام ورحمة الله وبركاته».","kind":"B2_hadith_quote","lesson":"adab.salam","pos":4,"secs":4.79,"dens":0.03,"before":null,"after":null,"pending":false,"session":1},{"u":"src.food.basmala","ids":["src.food.basmala"],"text":"«بسم الله».","disp":"«بسم الله».","kind":"B2_hadith_quote","lesson":"adab.food","pos":5,"secs":1.13,"dens":0.0,"before":null,"after":null,"pending":false,"session":1},{"u":"src.food.forgot","ids":["src.food.forgot"],"text":"فإذا جزاك الله خيرًا.","disp":"تعلّمتَ اليوم: إذا سرّك أمر قلتَ الحمد لله الذي بنعمته تتمّ الصالحات، وإذا كرهتَ أمرًا قلتَ الحمد لله على كل حال، ولمن أحسن إليك: جزاك الله خيرًا.","kind":"B2_hadith_quote","lesson":"adhkar.hal","pos":7,"secs":12.13,"dens":0.08,"before":null,"after":null,"pending":false,"session":1},{"u":"rev.hal.1","ids":["rev.hal.1"],"text":"تقول: الحمد لله الذي بنعمته تتمّ الصالحات.","disp":"تقول: الحمد لله الذي بنعمته تتمّ الصالحات.","kind":"B2_hadith_quote","lesson":"adhkar.hal","pos":7,"secs":4.02,"dens":0.03,"before":null,"after":null,"pending":false,"session":1},{"u":"src.hal.three","ids":["src.hal.three"],"text":"ما تقول إذا حصل لك ما يسرّك: «الحمد لله الذي بنعمته تتمّ الصالحات». وما تقول إذا حصل ما تكرهه: «الحمد لله على كل حال». وما تقول لمن صنع إليك معروفًا: «جزاك الله خيرًا».","disp":"ما تقول إذا حصل لك ما يسرّك: «الحمد لله الذي بنعمته تتمّ الصالحات». وما تقول إذا حصل ما تكرهه: «الحمد لله على كل حال». وما تقول لمن صنع إليك معروفًا: «جزاك الله خيرًا».","kind":"B2_hadith_quote","lesson":"adhkar.hal","pos":7,"secs":13.68,"dens":0.03,"before":null,"after":null,"pending":false,"session":1},{"u":"src.sleep.dua","ids":["src.sleep.dua"],"text":"«باسمك اللهم أموت وأحيا».","disp":"«باسمك اللهم أموت وأحيا».","kind":"B2_hadith_quote","lesson":"adhkar.sleep","pos":8,"secs":2.46,"dens":0.0,"before":null,"after":null,"pending":false,"session":1},{"u":"end.hadith.harf","ids":["end.hadith.harf"],"text":"تعلّمتَ اليوم: من قرأ حرفًا من كتاب الله فله به حسنة، والحسنة بعشر أمثالها، ولا يقال ألم حرف، بل ألف حرف ولام حرف وميم حرف.","disp":"تعلّمتَ اليوم: من قرأ حرفًا من كتاب الله فله به حسنة، والحسنة بعشر أمثالها، ولا يقال ألم حرف، بل ألف حرف ولام حرف وميم حرف.","kind":"B2_hadith_quote","lesson":"hadith.harf","pos":9,"secs":10.46,"dens":0.03,"before":null,"after":null,"pending":false,"session":1},{"u":"src.harf.hadith","ids":["src.harf.hadith"],"text":"عن عبد الله بن مسعود رضي الله عنه، أنّ النبي ﷺ قال: «مَن قرأ حرفًا من كتاب الله فله به حسنة، والحسنة بعشر أمثالها، لا أقول: الم حرف، ولكن ألفٌ حرف، ولامٌ حرف، وميمٌ حرف».","disp":"عن عبد الله بن مسعود رضي الله عنه، أنّ النبي صلى الله عليه وسلم قال: «مَن قرأ حرفًا من كتاب الله فله به حسنة، والحسنة بعشر أمثالها، لا أقول: الم حرف، ولكن ألفٌ حرف، ولامٌ حرف، وميمٌ حرف».","kind":"B2_hadith_quote","lesson":"hadith.harf","pos":9,"secs":15.13,"dens":0.05,"before":null,"after":null,"pending":false,"session":1},{"u":"end.ibadah.dua","ids":["end.ibadah.dua"],"text":"تعلّمتَ اليوم: الدعاء من أعظم الطاعات وأجلّ القربات، وقال النبي صلى الله عليه وسلم: الدعاء هو العبادة.","disp":"تعلّمتَ اليوم: الدعاء من أعظم الطاعات وأجلّ القربات، وقال النبي صلى الله عليه وسلم: الدعاء هو العبادة.","kind":"B2_hadith_quote","lesson":"ibadah.dua","pos":10,"secs":9.13,"dens":0.04,"before":null,"after":null,"pending":false,"session":1},{"u":"src.dua.ayah~1","ids":["src.dua.ayah"],"text":"الدعاء هو من أعظم الطاعات وأجلّ القربات. قال تَعَالَى:","disp":"الدعاء هو من أعظم الطاعات وأجلّ القربات. قال تَعَالَى:","kind":"B4_mixed_ayah","lesson":"ibadah.dua","pos":10,"secs":4.79,"dens":0.1,"before":null,"after":{"ayah":"﴿وَقَالَ رَبُّكُمُ ادْعُونِي أَسْتَجِبْ لَكُمْ﴾","ref":"غافر: ٦٠"},"pending":false,"session":1},{"u":"src.dua.ayah~2","ids":["src.dua.ayah"],"text":"وقال النبي ﷺ: «الدعاءُ هو العبادة»","disp":"وقال النبي صلى الله عليه وسلم: «الدعاءُ هو العبادة»","kind":"B4_mixed_ayah","lesson":"ibadah.dua","pos":10,"secs":4.68,"dens":0.04,"before":{"ayah":"﴿وَقَالَ رَبُّكُمُ ادْعُونِي أَسْتَجِبْ لَكُمْ﴾","ref":"غافر: ٦٠"},"after":null,"pending":false,"session":1},{"u":"end.adhkar.fadl","ids":["end.adhkar.fadl"],"text":"تعلّمتَ اليوم: مثل الذي يذكر ربّه والذي لا يذكر ربّه مثل الحيّ والميّت، ومن فوائده أنّه يُرضي الرحمن ويطرد الشيطان ويحصّن من الشرور، وأفضل الذكر لا إله إلا الله.","disp":"تعلّمتَ اليوم: مثل الذي يذكر ربّه والذي لا يذكر ربّه مثل الحيّ والميّت، ومن فوائده أنّه يُرضي الرحمن ويطرد الشيطان ويحصّن من الشرور، وأفضل الذكر لا إله إلا الله.","kind":"B2_hadith_quote","lesson":"adhkar.fadl","pos":11,"secs":13.68,"dens":0.07,"before":null,"after":null,"pending":false,"session":1},{"u":"src.fad.mathal","ids":["src.fad.mathal"],"text":"قال النبي ﷺ: «مثلُ الذي يذكر ربَّه والذي لا يذكر ربَّه، مثلُ الحيِّ والميِّت». وهذا لأنّ قيمة حياة الإنسان بقدر ذكره لله تَعَالَى.","disp":"قال النبي صلى الله عليه وسلم: «مثلُ الذي يذكر ربَّه والذي لا يذكر ربَّه، مثلُ الحيِّ والميِّت». وهذا لأنّ قيمة حياة الإنسان بقدر ذكره لله تَعَالَى.","kind":"B2_hadith_quote","lesson":"adhkar.fadl","pos":11,"secs":11.68,"dens":0.16,"before":null,"after":null,"pending":false,"session":1},{"u":"src.fad.fawaid","ids":["src.fad.fawaid"],"text":"ومن فوائد الذكر: يُرضي الرحمن، ويطرد الشيطان، ويحصّن المسلم من الشرور، ويحصل به الأجر والثواب. وأفضل الذكر: «لا إله إلا الله».","disp":"ومن فوائد الذكر: يُرضي الرحمن، ويطرد الشيطان، ويحصّن المسلم من الشرور، ويحصل به الأجر والثواب. وأفضل الذكر: «لا إله إلا الله».","kind":"B2_hadith_quote","lesson":"adhkar.fadl","pos":11,"secs":10.91,"dens":0.02,"before":null,"after":null,"pending":false,"session":1},{"u":"src.wudu.merit","ids":["src.wudu.merit"],"text":"«إذا توضّأ العبد المسلم فغسل وجهه؛ خرج من وجهه كل خطيئةٍ نظر إليها بعينيه مع الماء… حتى يخرج نقيًّا من الذنوب».","disp":"«إذا توضّأ العبد المسلم فغسل وجهه؛ خرج من وجهه كل خطيئةٍ نظر إليها بعينيه مع الماء… حتى يخرج نقيًّا من الذنوب».","kind":"B2_hadith_quote","lesson":"ibadah.wudu","pos":12,"secs":9.46,"dens":0.05,"before":null,"after":null,"pending":false,"session":2},{"u":"src.wudu.fard","ids":["src.wudu.fard"],"text":"فرائض الوضوء: غسل الوجه ومنه المضمضة والاستنشاق، وغسل اليدين إلى المرفقين، ومسح الرأس ومنه الأذنين، وغسل الرجلين إلى الكعبين، والترتيب، والموالاة.","disp":"فرائض الوضوء: غسل الوجه ومنه المضمضة والاستنشاق، وغسل اليدين إلى المرفقين، ومسح الرأس ومنه الأذنين، وغسل الرجلين إلى الكعبين، والترتيب، والموالاة.","kind":"B3_sacred_text","lesson":"ibadah.wudu","pos":12,"secs":13.57,"dens":0.0,"before":null,"after":null,"pending":false,"session":2},{"u":"end.misc.fiqh","ids":["end.misc.fiqh"],"text":"تعلّمتَ اليوم: ثمرة التفقّه صحّة الأقوال والأعمال والاعتقادات، بما يُثمر السعادة في الدنيا والآخرة، ومن يُرد الله به خيرًا يُفقّهه في الدين.","disp":"تعلّمتَ اليوم: ثمرة التفقّه صحّة الأقوال والأعمال والاعتقادات، بما يُثمر السعادة في الدنيا والآخرة، ومن يُرد الله به خيرًا يُفقّهه في الدين.","kind":"B2_hadith_quote","lesson":"misc.fiqh","pos":13,"secs":12.13,"dens":0.08,"before":null,"after":null,"pending":false,"session":2},{"u":"src.fiq.hadith.a","ids":["src.fiq.hadith.a"],"text":"ثمرة التفقّه في الدين: صحّة الأقوال والأعمال والاعتقادات، بما يُثمر السعادة في الدنيا والآخرة.","disp":"ثمرة التفقّه في الدين: صحّة الأقوال والأعمال والاعتقادات، بما يُثمر السعادة في الدنيا والآخرة.","kind":"B3_sacred_text","lesson":"misc.fiqh","pos":13,"secs":8.68,"dens":0.04,"before":null,"after":null,"pending":false,"session":2},{"u":"src.fiq.hadith.b","ids":["src.fiq.hadith.b"],"text":"وفي الحديث عن معاوية بن أبي سفيان رضي الله عنهما قال: قال رسول الله ﷺ: «من يُرد الله به خيرًا يُفقّهه في الدين». يُفقّهه: أي يجعله عالمًا بالأحكام الشرعية.","disp":"وفي الحديث عن معاوية بن أبي سفيان رضي الله عنهما قال: قال رسول الله صلى الله عليه وسلم: «من يُرد الله به خيرًا يُفقّهه في الدين». يُفقّهه: أي يجعله عالمًا بالأحكام الشرعية.","kind":"B2_hadith_quote","lesson":"misc.fiqh","pos":13,"secs":14.46,"dens":0.06,"before":null,"after":null,"pending":false,"session":2},{"u":"out.fiq.later","ids":["out.fiq.later"],"text":"ومن يُرد الله به خيرًا يُفقّهه في الدين. فلا تؤجّل خيرًا أُريد بك.","disp":"ومن يُرد الله به خيرًا يُفقّهه في الدين. فلا تؤجّل خيرًا أُريد بك.","kind":"B2_hadith_quote","lesson":"misc.fiqh","pos":13,"secs":5.35,"dens":0.16,"before":null,"after":null,"pending":false,"session":2},{"u":"src.msj.two","ids":["src.msj.two"],"text":"دعاء دخول المسجد: «اللهم افتح لي أبواب رحمتك». ودعاء الخروج منه: «اللهم إنّي أسألك من فضلك».","disp":"دعاء دخول المسجد: «اللهم افتح لي أبواب رحمتك». ودعاء الخروج منه: «اللهم إنّي أسألك من فضلك».","kind":"B2_hadith_quote","lesson":"adhkar.masjid","pos":14,"secs":7.91,"dens":0.01,"before":null,"after":null,"pending":false,"session":2},{"u":"src.salat.five","ids":["src.salat.five"],"text":"خمس صلوات في اليوم والليلة: صلاة الفجر ركعتان، وصلاة الظهر أربع ركعات، وصلاة العصر أربع ركعات، وصلاة المغرب ثلاث ركعات، وصلاة العشاء أربع ركعات.","disp":"خمس صلوات في اليوم والليلة: صلاة الفجر ركعتان، وصلاة الظهر أربع ركعات، وصلاة العصر أربع ركعات، وصلاة المغرب ثلاث ركعات، وصلاة العشاء أربع ركعات.","kind":"B3_sacred_text","lesson":"ibadah.salat","pos":15,"secs":13.13,"dens":0.0,"before":null,"after":null,"pending":false,"session":2},{"u":"src.salat.shart","ids":["src.salat.shart"],"text":"ومن شروط الصلاة: الطهارة في رفع الحدث؛ لحديث: «لا يقبل الله صلاةَ أحدِكم إذا أحدثَ حتى يتوضّأ». ومنها دخول الوقت.","disp":"ومن شروط الصلاة: الطهارة في رفع الحدث؛ لحديث: «لا يقبل الله صلاةَ أحدِكم إذا أحدثَ حتى يتوضّأ». ومنها دخول الوقت.","kind":"B2_hadith_quote","lesson":"ibadah.salat","pos":15,"secs":9.57,"dens":0.05,"before":null,"after":null,"pending":false,"session":2},{"u":"src.fat.amin","ids":["src.fat.amin"],"text":"سُمّيت سورة الفاتحة لافتتاح كتاب الله بها. ويُسنّ أن يقول بعد قراءتها: «آمين» أي: استجب لنا.","disp":"سُمّيت سورة الفاتحة لافتتاح كتاب الله بها. ويُسنّ أن يقول بعد قراءتها: «آمين» أي: استجب لنا.","kind":"B2_hadith_quote","lesson":"quran.fatiha","pos":16,"secs":7.79,"dens":0.06,"before":null,"after":null,"pending":false,"session":2},{"u":"src.suj.seven.a","ids":["src.suj.seven.a"],"text":"ثم يسجد ويسجد على أعضائه السبعة: الجبهة والأنف، والكفّان، والركبتان، وأطراف القدمين. ويجافي عضديه عن جنبيه، ولا يبسط ذراعيه على الأرض، ويستقبل برؤوس أصابعه القبلة.","disp":"ثم يسجد ويسجد على أعضائه السبعة: الجبهة والأنف، والكفّان، والركبتان، وأطراف القدمين. ويجافي عضديه عن جنبيه، ولا يبسط ذراعيه على الأرض، ويستقبل برؤوس أصابعه القبلة.","kind":"B3_sacred_text","lesson":"ibadah.sujud","pos":17,"secs":14.79,"dens":0.01,"before":null,"after":null,"pending":false,"session":2},{"u":"src.suj.seven.b","ids":["src.suj.seven.b"],"text":"ويقول في سجوده: «سبحان ربّي الأعلى» ثلاث مرّات. ويقول بين السجدتين: «ربّ اغفر لي، وارحمني، واهدني، وارزقني، واجبرني، وعافني».","disp":"ويقول في سجوده: «سبحان ربّي الأعلى» ثلاث مرّات. ويقول بين السجدتين: «ربّ اغفر لي، وارحمني، واهدني، وارزقني، واجبرني، وعافني».","kind":"B2_hadith_quote","lesson":"ibadah.sujud","pos":17,"secs":10.46,"dens":0.03,"before":null,"after":null,"pending":false,"session":2},{"u":"src.sif.khalq","ids":["src.sif.khalq"],"text":"كان ﷺ وسطًا من الرجال، ليس بالقصير ولا بالطويل بل بين ذلك، وكان أبيض مشربًا بالحمرة، وكان كثيف اللحية، واسع العينين، عظيم الفم، طيّب الرائحة، وغير ذلك من خلقته الجميلة ﷺ.","disp":"كان صلى الله عليه وسلم وسطًا من الرجال، ليس بالقصير ولا بالطويل بل بين ذلك، وكان أبيض مشربًا بالحمرة، وكان كثيف اللحية، واسع العينين، عظيم الفم، طيّب الرائحة، وغير ذلك من خلقته الجميلة صلى الله عليه وسلم.","kind":"B3_sacred_text","lesson":"seerah.sifat","pos":18,"secs":17.79,"dens":0.02,"before":null,"after":null,"pending":false,"session":2},{"u":"src.sif.hubb","ids":["src.sif.hubb"],"text":"عن أنس رضي الله عنه قال: قال رسول الله ﷺ: «لا يؤمنُ أحدُكم حتى أكونَ أحبَّ إليه من والده، وولده، والناس أجمعين». ومن فوائده: يجب محبّة النبي ﷺ أكثر من كل الناس، وأنّ ذلك من كمال الإيمان.","disp":"عن أنس رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «لا يؤمنُ أحدُكم حتى أكونَ أحبَّ إليه من والده، وولده، والناس أجمعين». ومن فوائده: يجب محبّة النبي صلى الله عليه وسلم أكثر من كل الناس، وأنّ ذلك من كمال الإيمان.","kind":"B2_hadith_quote","lesson":"seerah.sifat","pos":18,"secs":18.24,"dens":0.05,"before":null,"after":null,"pending":false,"session":2},{"u":"end.adhkar.salatnabi","ids":["end.adhkar.salatnabi"],"text":"تعلّمتَ اليوم: معنى الصلاة عليه أن تدعو الله أن يُثني عليه في الملأ الأعلى، وصيغتها اللهم صلِّ على محمد وعلى آل محمد كما صلّيتَ على إبراهيم.","disp":"تعلّمتَ اليوم: معنى الصلاة عليه أن تدعو الله أن يُثني عليه في الملأ الأعلى، وصيغتها اللهم صلِّ على محمد وعلى آل محمد كما صلّيتَ على إبراهيم.","kind":"B2_hadith_quote","lesson":"adhkar.salatnabi","pos":19,"secs":12.02,"dens":0.07,"before":null,"after":null,"pending":false,"session":2},{"u":"src.sal.sigha","ids":["src.sal.sigha"],"text":"«اللهُمَّ صَلِّ عَلَىٰ مُحَمَّدٍ وَعَلَىٰ آلِ مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلَىٰ إِبْرَاهِيمَ وَعَلَىٰ آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ، اللهُمَّ بَارِكْ عَلَىٰ مُحَمَّدٍ وَعَلَىٰ آلِ مُحَمَّدٍ، كَمَا بَارَكْتَ عَلَىٰ إِبْرَاهِيمَ وَعَلَىٰ آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ».","disp":"«اللهُمَّ صَلِّ عَلَىٰ مُحَمَّدٍ وَعَلَىٰ آلِ مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلَىٰ إِبْرَاهِيمَ وَعَلَىٰ آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ، اللهُمَّ بَارِكْ عَلَىٰ مُحَمَّدٍ وَعَلَىٰ آلِ مُحَمَّدٍ، كَمَا بَارَكْتَ عَلَىٰ إِبْرَاهِيمَ وَعَلَىٰ آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ».","kind":"B2_hadith_quote","lesson":"adhkar.salatnabi","pos":19,"secs":15.13,"dens":0.88,"before":null,"after":null,"pending":false,"session":2},{"u":"src.jum.sunan","ids":["src.jum.sunan"],"text":"من سنن يوم الجمعة: الاغتسال، والتطيّب، ولبس أحسن الثياب، والتبكير إلى المسجد، والذهاب إليه ماشيًا، والإكثار من الصلاة على النبي ﷺ، وقراءة سورة الكهف، وتحرّي ساعة إجابة الدعاء.","disp":"من سنن يوم الجمعة: الاغتسال، والتطيّب، ولبس أحسن الثياب، والتبكير إلى المسجد، والذهاب إليه ماشيًا، والإكثار من الصلاة على النبي صلى الله عليه وسلم، وقراءة سورة الكهف، وتحرّي ساعة إجابة الدعاء.","kind":"B3_sacred_text","lesson":"ibadah.jumuah","pos":20,"secs":17.02,"dens":0.02,"before":null,"after":null,"pending":false,"session":2},{"u":"rev.jum.1","ids":["rev.jum.1"],"text":"قراءة سورة الكهف. قال صلى الله عليه وسلم: من قرأ سورة الكهف يوم الجمعة، أضاء له من النور ما بين الجمعتين.","disp":"قراءة سورة الكهف. قال صلى الله عليه وسلم: من قرأ سورة الكهف يوم الجمعة، أضاء له من النور ما بين الجمعتين.","kind":"B2_hadith_quote","lesson":"ibadah.jumuah","pos":20,"secs":9.35,"dens":0.0,"before":null,"after":null,"pending":false,"session":2},{"u":"src.qur.full","ids":["src.qur.full"],"text":"سورة قريش: لما كانوا يألفونه من الرحلة في الشتاء إلى اليمن والصيف إلى الشام آمنين، فليعبدوا الله ربّ هذا البيت الحرام وحده ولا يشركوا به أحدًا، الذي أطعمهم من جوع وآمنهم من خوف.","disp":"سورة قريش: لما كانوا يألفونه من الرحلة في الشتاء إلى اليمن والصيف إلى الشام آمنين، فليعبدوا الله ربّ هذا البيت الحرام وحده ولا يشركوا به أحدًا، الذي أطعمهم من جوع وآمنهم من خوف.","kind":"B3_sacred_text","lesson":"quran.quraysh","pos":21,"secs":15.79,"dens":0.01,"before":null,"after":null,"pending":false,"session":2},{"u":"src.ruk.ayah~1","ids":["src.ruk.ayah"],"text":"أقول: «بسم الله، الحمد لله»","disp":"أقول: «بسم الله، الحمد لله»","kind":"B4_mixed_ayah","lesson":"adab.rukub","pos":22,"secs":2.46,"dens":0.0,"before":null,"after":{"ayah":"﴿سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَٰذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ ١٣ وَإِنَّا إِلَىٰ رَبِّنَا لَمُنقَلِبُونَ ١٤﴾","ref":"الزخرف: ١٣–١٤"},"pending":false,"session":2},{"u":"src.rain.dua","ids":["src.rain.dua"],"text":"«اللهم صيّبًا نافعًا».","disp":"«اللهم صيّبًا نافعًا».","kind":"B2_hadith_quote","lesson":"adhkar.rain","pos":23,"secs":1.91,"dens":0.21,"before":null,"after":null,"pending":false,"session":2},{"u":"src.rain.after","ids":["src.rain.after"],"text":"«مُطرنا بفضل الله ورحمته».","disp":"«مُطرنا بفضل الله ورحمته».","kind":"B2_hadith_quote","lesson":"adhkar.rain","pos":23,"secs":2.46,"dens":0.05,"before":null,"after":null,"pending":false,"session":2},{"u":"end.hadith.hubb","ids":["end.hadith.hubb"],"text":"تعلّمتَ اليوم: لا يؤمن أحدكم حتى يحبّ لأخيه ما يحبّ لنفسه، وذلك من كمال الإيمان.","disp":"تعلّمتَ اليوم: لا يؤمن أحدكم حتى يحبّ لأخيه ما يحبّ لنفسه، وذلك من كمال الإيمان.","kind":"B2_hadith_quote","lesson":"hadith.hubb","pos":24,"secs":6.91,"dens":0.07,"before":null,"after":null,"pending":false,"session":2},{"u":"src.hubb.hadith","ids":["src.hubb.hadith"],"text":"عن أنس رضي الله عنه قال: قال رسول الله ﷺ: «لا يؤمنُ أحدُكم حتى يحبَّ لأخيه ما يحبُّ لنفسه».","disp":"عن أنس رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «لا يؤمنُ أحدُكم حتى يحبَّ لأخيه ما يحبُّ لنفسه».","kind":"B2_hadith_quote","lesson":"hadith.hubb","pos":24,"secs":8.79,"dens":0.1,"before":null,"after":null,"pending":false,"session":2},{"u":"src.has.hadith","ids":["src.has.hadith"],"text":"في الحديث: «إذا رأى أحدُكم من أخيه، أو من نفسه، أو من ماله ما يعجبه، فليدعُ له بالبركة، فإنّ العينَ حقّ».","disp":"في الحديث: «إذا رأى أحدُكم من أخيه، أو من نفسه، أو من ماله ما يعجبه، فليدعُ له بالبركة، فإنّ العينَ حقّ».","kind":"B2_hadith_quote","lesson":"akhlaq.hasad","pos":25,"secs":8.35,"dens":0.07,"before":null,"after":null,"pending":false,"session":2},{"u":"end.hadith.lisan","ids":["end.hadith.lisan"],"text":"تعلّمتَ اليوم: ليس المؤمن بالطعّان ولا اللعّان ولا الفاحش ولا البذيء، وفيه النهي عن كل كلامٍ باطلٍ وقبيح.","disp":"تعلّمتَ اليوم: ليس المؤمن بالطعّان ولا اللعّان ولا الفاحش ولا البذيء، وفيه النهي عن كل كلامٍ باطلٍ وقبيح.","kind":"B2_hadith_quote","lesson":"hadith.lisan","pos":26,"secs":9.13,"dens":0.08,"before":null,"after":null,"pending":false,"session":2},{"u":"src.lis.hadith","ids":["src.lis.hadith"],"text":"عن عبد الله بن مسعود رضي الله عنه قال: قال رسول الله ﷺ: «ليس المؤمنُ بالطعّان، ولا اللعّان، ولا الفاحش، ولا البذيء».","disp":"عن عبد الله بن مسعود رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «ليس المؤمنُ بالطعّان، ولا اللعّان، ولا الفاحش، ولا البذيء».","kind":"B2_hadith_quote","lesson":"hadith.lisan","pos":26,"secs":11.24,"dens":0.04,"before":null,"after":null,"pending":false,"session":2},{"u":"rev.ghb.2","ids":["rev.ghb.2"],"text":"هي نقل الأحاديث بين الناس للإفساد بينهم. قال صلى الله عليه وسلم: لا يدخل الجنّة نمّام.","disp":"هي نقل الأحاديث بين الناس للإفساد بينهم. قال صلى الله عليه وسلم: لا يدخل الجنّة نمّام.","kind":"B2_hadith_quote","lesson":"akhlaq.gheebah","pos":27,"secs":7.68,"dens":0.03,"before":null,"after":null,"pending":false,"session":2},{"u":"src.ghb.ayah~1","ids":["src.ghb.ayah"],"text":"الغيبة: هي ذكر المسلم أخاك بما يكره وهو غائب. قال تَعَالَى:","disp":"الغيبة: هي ذكر المسلم أخاك بما يكره وهو غائب. قال تَعَالَى:","kind":"B4_mixed_ayah","lesson":"akhlaq.gheebah","pos":27,"secs":5.13,"dens":0.07,"before":null,"after":{"ayah":"﴿وَلَا يَغْتَب بَّعْضُكُم بَعْضًا ۚ أَيُحِبُّ أَحَدُكُمْ أَن يَأْكُلَ لَحْمَ أَخِيهِ مَيْتًا فَكَرِهْتُمُوهُ ۚ وَاتَّقُوا اللَّهَ إِنَّ اللَّهَ تَوَّابٌ رَّحِيمٌ﴾","ref":"الحجرات: ١٢"},"pending":false,"session":2},{"u":"src.ghd.ilaj","ids":["src.ghd.ilaj"],"text":"علاج الغضب المذموم: الوضوء، والقعود إن كان قائمًا والاضطجاع إن كان قاعدًا، وأن يلتزم بوصيّة النبي ﷺ في ذلك: «لا تغضب»، وأن يضبط النفس عن الاندفاع عند الغضب، والاستعاذة بالله من الشيطان الرجيم، والسكوت.","disp":"علاج الغضب المذموم: الوضوء، والقعود إن كان قائمًا والاضطجاع إن كان قاعدًا، وأن يلتزم بوصيّة النبي صلى الله عليه وسلم في ذلك: «لا تغضب»، وأن يضبط النفس عن الاندفاع عند الغضب، والاستعاذة بالله من الشيطان الرجيم، والسكوت.","kind":"B2_hadith_quote","lesson":"akhlaq.ghadab","pos":28,"secs":19.13,"dens":0.02,"before":null,"after":null,"pending":false,"session":2}],"entries":{"end.adhkar.istiqadh":{"parts":[{"u":"end.adhkar.istiqadh"}],"ok":true},"src.ist.three":{"parts":[{"u":"src.ist.three"}],"ok":true},"say.ist.1":{"parts":[{"u":"say.ist.1"}],"ok":true},"say.ist.2":{"parts":[{"u":"say.ist.2"}],"ok":true},"say.ist.3":{"parts":[{"u":"say.ist.3"}],"ok":true},"say.ist.4":{"parts":[{"u":"say.ist.4"}],"ok":true},"end.adhkar.sabah":{"parts":[{"u":"end.adhkar.sabah"}],"ok":true},"src.sab.wudu":{"parts":[{"u":"src.sab.wudu"}],"ok":true},"src.sab.out":{"parts":[{"u":"src.sab.out"}],"ok":true},"say.sab.1":{"parts":[{"u":"say.ist.4"}],"ok":true},"say.sab.2":{"parts":[{"u":"say.sab.2"}],"ok":true},"say.sab.3":{"parts":[{"u":"say.sab.3"}],"ok":true},"end.adhkar.thawb":{"parts":[{"u":"end.adhkar.thawb"}],"ok":true},"rev.thw.1":{"parts":[{"u":"rev.thw.1"}],"ok":true},"rev.thw.2":{"parts":[{"u":"rev.thw.2"}],"ok":true},"rev.thw.3":{"parts":[{"u":"rev.thw.3"}],"ok":true},"rev.thw.4":{"parts":[{"u":"rev.thw.4"}],"ok":true},"src.thw.wear":{"parts":[{"u":"src.thw.wear"}],"ok":true},"src.thw.new":{"parts":[{"u":"src.thw.new"}],"ok":true},"out.thw.silent":{"parts":[{"u":"out.thw.silent"}],"ok":true},"src.bayt.out":{"parts":[{"u":"src.bayt.out"}],"ok":true <script>
"use strict";
/* ══════════ البيانات المضمَّنة ══════════ */
const Q = JSON.parse(document.getElementById("queue").textContent);
const ALL = Q.units;                         /* وحدات التسجيل بترتيب المسار */
const ENTRIES = Q.entries;                   /* id → {parts:[{u}|{url:[…]}], ok} */
const HASHES = Q.hashes;                     /* id → pack_key للنص عند البناء (لكشف تغيّر النص) */
const TASH0 = Q.tashkeel || {};              /* تشكيل كامل مقترح (وحدة → نص) */
const $ = id => document.getElementById(id);
const nf = new Intl.NumberFormat("ar-EG");
const num = n => nf.format(n);

/* ══════════ تخزين آمن: IndexedDB مع احتياطي في الذاكرة ══════════ */
const DB = (() => {
  let db = null, mem = { takes: new Map(), partial: new Map(), meta: new Map() }, usingMem = false;
  const open = () => new Promise(res => {
    try {
      const rq = indexedDB.open("athar-record-v1-p1", 1);
      rq.onupgradeneeded = () => { const d = rq.result; ["takes", "partial", "meta"].forEach(s => d.createObjectStore(s)); };
      rq.onsuccess = () => { db = rq.result; res(true); };
      rq.onerror = rq.onblocked = () => { usingMem = true; res(false); };
    } catch (e) { usingMem = true; res(false); }
  });
  const tx = (s, mode, fn) => new Promise((res, rej) => {
    if (usingMem || !db) { try { res(fn(null)); } catch (e) { rej(e); } return; }
    try {
      const t = db.transaction(s, mode), st = t.objectStore(s); let out;
      const r = fn(st); if (r && "onsuccess" in r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = t.onabort = () => rej(t.error || new Error("idb"));
    } catch (e) { rej(e); }
  });
  return {
    open, get mem() { return usingMem; },
    put: (s, k, v) => usingMem ? (mem[s].set(k, v), Promise.resolve()) : tx(s, "readwrite", st => st.put(v, k)),
    get: (s, k) => usingMem ? Promise.resolve(mem[s].get(k)) : tx(s, "readonly", st => st.get(k)),
    del: (s, k) => usingMem ? (mem[s].delete(k), Promise.resolve()) : tx(s, "readwrite", st => st.delete(k)),
    keys: s => usingMem ? Promise.resolve([...mem[s].keys()]) : tx(s, "readonly", st => st.getAllKeys()),
    clear: s => usingMem ? (mem[s].clear(), Promise.resolve()) : tx(s, "readwrite", st => st.clear())
  };
})();

/* ══════════ الحالة ══════════ */
const PRESETS = [["human_reader", "human_reader — القارئ (افتراضي)"], ["human_reader2", "human_reader2 — قارئ ثانٍ"], ["human_parent", "human_parent — الوالد/الوالدة"], ["human_teacher", "human_teacher — المعلّم"], ["__custom", "مخصَّص…"]];
const S = {
  speaker: "", voice: Q.voice_default || "human_reader", showPending: false, auto: false, fmt: "native", idx: 0, theme: "",
  fs: 1, takes: new Map(),      /* u → {mime, dur, bytes, ts, rec?} للصوت الحالي */
  tash: {},              /* وحدة → نص مشكَّل مستورد */
  recording: false, busy: false, kf: "all"
};
const view = () => ALL.filter(u => (S.showPending || !u.pending) && (!S.kf || S.kf === "all" || u.kind === S.kf));
const cur = () => view()[Math.min(S.idx, view().length - 1)];
const key = u => S.voice + "|" + u;
const validVoice = v => /^[a-z0-9][a-z0-9_-]{0,40}$/.test(v);

let toastT = 0;
function toast(msg, ms = 2600) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), ms); }
function fmtDur(s) { s = Math.max(0, s || 0); return (s < 10 ? s.toFixed(1) : Math.round(s)) + "ث"; }
function tfmt(ms) { const s = Math.floor(ms / 1000), m = Math.floor(s / 60); return String(m).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }

/* ══════════ حفظ/تحميل الإعدادات ══════════ */
async function saveMeta() {
  try { await DB.put("meta", "state", { speaker: S.speaker, voice: S.voice, showPending: S.showPending, auto: S.auto, fmt: S.fmt, idx: S.idx, kf: S.kf, theme: S.theme, tash: S.tash }); } catch (e) {}
}
async function loadMeta() {
  try {
    const m = await DB.get("meta", "state");
    if (m) { for (const k of ["speaker", "voice", "showPending", "auto", "fmt", "idx", "kf", "theme", "tash"]) if (m[k] !== undefined) S[k] = m[k]; }
  } catch (e) {}
  if (!validVoice(S.voice)) S.voice = "human_reader";
  applyTheme();
}
function applyTheme() { if (S.theme) document.documentElement.setAttribute("data-theme", S.theme); else document.documentElement.removeAttribute("data-theme"); }

async function loadTakes() {
  S.takes = new Map();
  try {
    const ks = await DB.keys("takes");
    for (const k of ks) {
      if (!String(k).startsWith(S.voice + "|")) continue;
      const t = await DB.get("takes", k);
      if (t && t.blob) S.takes.set(String(k).slice(S.voice.length + 1), { mime: t.mime, dur: t.dur, bytes: t.blob.size, ts: t.ts, rec: !!t.recovered });
    }
  } catch (e) {}
}
/* استرجاع تسجيل لم يكتمل إيقافه (إغلاق مفاجئ) */
async function recoverPartials() {
  let n = 0;
  try {
    const ks = await DB.keys("partial");
    for (const k of ks) {
      const p = await DB.get("partial", k);
      const [voice, u] = [String(k).split("|")[0], String(k).split("|").slice(1).join("|")];
      if (!p || !p.chunks || !p.chunks.length) { await DB.del("partial", k); continue; }
      const had = await DB.get("takes", k);
      if (!had) {
        const blob = new Blob(p.chunks, { type: p.mime });
        if (blob.size > 2000) { await DB.put("takes", k, { blob, mime: p.mime, dur: p.dur || 0, ts: Date.now(), recovered: true }); n++; }
      }
      await DB.del("partial", k);
    }
  } catch (e) {}
  return n;
}

/* ══════════ العرض ══════════ */
function textOf(u) { return S.tash[u.u] || TASH0[u.u] || u.disp; }
function tashBadge(u) {
  if (S.tash[u.u]) return ["تشكيل مستورَد", "ok"];
  if (TASH0[u.u]) return ["تشكيل كامل مقترح — راجعه", "ok"];
  if (u.dens >= 0.7) return ["مشكَّل", "ok"];
  return ["تشكيل جزئي — تثبّت قبل القراءة", "warn"];
}
function ctxHtml(c, dir) {
  if (!c) return "";
  if (c.multi) return "<b>" + (dir === "b" ? "قبل هذا المقطع" : "بعد هذا المقطع") + "</b>تُتلى آية من الحصري (تختلف باختلاف السطر) — اسكت قليلًا ثم تابع";
  return "<b>" + (dir === "b" ? "قبل هذا المقطع تُتلى (بصوت الحصري)" : "بعد هذا المقطع تُتلى (بصوت الحصري)") + (c.ref ? " — " + c.ref : "") + "</b><span class=\"a\">" + c.ayah.replace(/</g, "&lt;") + "</span>";
}
function render() {
  const V = view(); if (!V.length) return;
  S.idx = Math.max(0, Math.min(S.idx, V.length - 1));
  const u = V[S.idx], tk = S.takes.get(u.u);
  $("who").textContent = "المتحدث: " + (S.speaker || "— (حدّده من الإعدادات)") + " · voice: " + S.voice;
  $("ltext").textContent = textOf(u);
  $("scroll").scrollTop = 0;
  const tb = tashBadge(u);
  $("cmeta").innerHTML =
    "<span class=\"chip\">" + (u.pending ? "معلّق" : "الجلسة " + num(u.session) + " من " + num(Q.sessions)) + "</span>" +
    "<span class=\"chip " + (tk ? "ok" : "") + "\">" + (tk ? "مسجَّل ✓" : "بلا تسجيل") + "</span>" +
    "<span class=\"chip " + tb[1] + "\">" + tb[0] + "</span>" +
    (u.ids.length > 1 ? "<span class=\"chip\">مشترك بين " + num(u.ids.length) + " أسطر</span>" : "") +
    "<span>" + num(S.idx + 1) + " / " + num(V.length) + "</span>" +
    "<span class=\"uid\" id=\"uid\">" + u.u + "</span>" + (u.lesson ? "<span class=\"uid\">" + u.lesson + "</span>" : "");
  const b = $("cbefore"), a = $("cafter");
  b.hidden = !u.before; a.hidden = !u.after; b.innerHTML = ctxHtml(u.before, "b"); a.innerHTML = ctxHtml(u.after, "a");
  $("tinfo").textContent = S.recording ? "جارٍ التسجيل… اضغط المربع عند الانتهاء" : u.pending ? "هذا السطر معلّق: يحتوي لفظ آية بلا علامة ﴿﴾ — انتظر قرار المالك قبل تسجيله." : (tk ? "تسجيل محفوظ · " + fmtDur(tk.dur) + " · " + Math.round(tk.bytes / 1024) + " ك.ب" + (tk.rec ? " · (مُستعاد بعد انقطاع)" : "") + (tk.hint ? " · " + tk.hint : "") : "اضغط الزر الأحمر وابدأ القراءة بعد ثانية من الصمت");
  $("bPlay").disabled = !tk || S.recording; $("bRedo").disabled = S.recording ? false : !tk;
  $("bRedo").textContent = S.recording ? "✕ ألغِ التسجيل" : "↺ أعد التسجيل";
  $("bPrev").disabled = S.idx === 0 || S.recording; $("bNext").disabled = S.idx >= V.length - 1 || S.recording;

  $("bFp").onclick = () => setFs(S.fs + 1); $("bFm").onclick = () => setFs(S.fs - 1);
  $("bExport").onclick = openExport; $("eGo").onclick = doExport; $("eClose").onclick = () => $("dExp").close();
  $("bSet").onclick = openSettings; $("sClose").onclick = () => $("dSet").close(); $("sSave").onclick = saveSettings;
  $("sVoice").onchange = () => { $("iVoice").hidden = $("sVoice").value !== "__custom"; };
  $("sTheme").onclick = () => { S.theme = S.theme === "dark" ? "light" : "dark"; applyTheme(); saveMeta(); };
  $("sWipe").onclick = async () => {
    if (!confirm("سيُمسح كل ما سجَّلته في هذا الجهاز لهذا الصوت. هل أنت متأكد؟")) return;
    const ks = await DB.keys("takes"); for (const k of ks) if (String(k).startsWith(S.voice + "|")) await DB.del("takes", k);
    S.takes = new Map(); S.idx = 0; await saveMeta(); $("dSet").close(); render(); toast("مُسحت التسجيلات");
  };
  $("fTash").onchange = async ev => {
    const f = ev.target.files[0]; if (!f) return;
    try { const j = JSON.parse(await f.text()); const o = {}; let c = 0;
      for (const [k, v] of Object.entries(j)) { if (k[0] === "_" || typeof v !== "string") continue; o[k] = v; c++; }
      S.tash = Object.assign(S.tash, o); await saveMeta(); $("tashInfo").textContent = "استُورد " + num(c) + " سطرًا"; render();
    } catch (e) { $("tashInfo").textContent = "ملف غير صالح"; }
  };
  $("bList").onclick = () => { $("dList").showModal(); buildList(); const c = $("ulist").querySelector(".cur"); if (c) c.scrollIntoView({ block: "center" }); };
  $("lClose").onclick = () => $("dList").close();
  $("ulist").onclick = ev => { const li = ev.target.closest("li[data-i]"); if (li) { $("dList").close(); jump(+li.dataset.i); } };
  const syncK = () => [...$("kfilters").children].forEach(x => x.classList.toggle("on", x.dataset.k === (S.kf || "all")));
  $("kfilters").onclick = ev => { const b = ev.target.closest("button"); if (!b || S.recording) return; S.kf = b.dataset.k; if (!view().length) S.kf = "all"; S.idx = 0; syncK(); saveMeta(); render(); };
  window.__syncK = syncK;
  $("filters").onclick = ev => { const b = ev.target.closest("button"); if (!b) return; filt = b.dataset.f; [...$("filters").children].forEach(x => x.classList.toggle("on", x === b)); buildList(); };
  document.addEventListener("keydown", ev => {
    if (document.querySelector("dialog[open]") || /INPUT|SELECT|TEXTAREA/.test((ev.target || {}).tagName || "")) return;
    if (ev.code === "Space") { ev.preventDefault(); $("bRec").click(); }
    else if (ev.code === "ArrowLeft") go(1); else if (ev.code === "ArrowRight") go(-1);
    else if (ev.key === "p" || ev.key === "P") playTake();
  });
  window.addEventListener("beforeunload", () => { if (S.recording) { try { R.mr.requestData(); } catch (e) {} } });
  document.addEventListener("visibilitychange", () => { if (document.hidden && S.recording) toast("تنبيه: التسجيل مستمر؛ لا تغلق الصفحة", 3000); });
}

const CATS = [
  { k: "B1_dhikr_dua", ic: "🤲", n: "أذكار وأدعية" },
  { k: "B2_hadith_quote", ic: "📜", n: "أحاديث ومقتبسات" },
  { k: "B3_sacred_text", ic: "📖", n: "نصوص شرعية" },
  { k: "B4_mixed_ayah", ic: "🕌", n: "نصوص بين الآيات" },
  { k: "B5_pending_embedded_ayah", ic: "📗", n: "شروح فيها ألفاظ قرآنية" },
  { k: "all", ic: "🗂️", n: "كل الأقسام معًا", full: true }
];
function buildHome() {
  const box = $("cats"); let h = "";
  CATS.forEach(c => {
    const us = ALL.filter(u => !u.pending && (c.k === "all" || u.kind === c.k)), d = us.filter(u => S.takes.has(u.u)).length;
    const pct = us.length ? Math.round(d * 100 / us.length) : 0;
    h += "<button class=\"cat" + (c.full ? " full" : "") + (d && d === us.length ? " fin" : "") + "\" data-k=\"" + c.k + "\"><span class=\"ic\">" + c.ic + "</span><b>" + c.n + "</b><small>" + num(d) + " من " + num(us.length) + (d === us.length && d ? " ✓" : "") + "</small>" + (c.full ? "" : "<span class=\"pb\"><i style=\"width:" + pct + "%\"></i></span>") + "</button>";
  });
  box.innerHTML = h;
  $("homeWho").textContent = (S.speaker ? "المتحدث: " + S.speaker + " — " : "") + "اضغط الأيقونة لتبدأ. يمكنك الرجوع من زر «الأقسام» في الأعلى.";
}
function showHome() { if (S.recording) return; buildHome(); $("home").classList.add("on"); $("home").scrollTop = 0; }
function pickCat(k) {
  S.kf = k; const V = view(); let i = V.findIndex(u => !S.takes.has(u.u)); S.idx = i < 0 ? 0 : i;
  if (window.__syncK) window.__syncK(); saveMeta(); $("home").classList.remove("on"); render();
}
(async function init() {
  await DB.open();
  await loadMeta();
  const rec = await recoverPartials();
  await loadTakes();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  bind();
  let fl = 1; try { const v = parseInt(localStorage.getItem("athar.rec.fs"), 10); if (v >= 0 && v <= 4) fl = v; } catch (e) {}
  setFs(fl);
  if (S.idx >= view().length) S.idx = 0;
  if (window.__syncK) window.__syncK();
  $("cats").onclick = ev => { const b = ev.target.closest(".cat"); if (b) pickCat(b.dataset.k); };
  $("bHome").onclick = showHome; $("hSet").onclick = () => { $("home").classList.remove("on"); openSettings(); };
  render(); showHome();
  if (rec) toast("استُعيد " + num(rec) + " تسجيلًا انقطع قبل اكتماله", 4500);
  window.__rec = { S, ALL, ENTRIES, view, cur, exportSummary, DB, key, jump, get lastZip() { return lastZip; } };
})();
</script>
