<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2A8067">
<title>تسجيل أثر — القارئ</title>
<style>
:root{
  --bg:#FDF7E8; --card:#FFFFFF; --ink:#1F2A24; --mute:#6B766F; --line:#E4DCC6;
  --brand:#2A8067; --brand-ink:#FFFFFF; --brand-soft:#DCEFE8;
  --rec:#C0392B; --rec-soft:#FBE4E0; --warn:#9A6A00; --warn-soft:#FFF1CC; --ok:#1E7A4E; --ok-soft:#DDF3E6;
  --ayah:#F1EAD2; --shadow:0 2px 14px rgba(40,50,40,.10);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101914; --card:#18241D; --ink:#EAF1EC; --mute:#9AAAA0; --line:#2A3B31;
    --brand:#3FA583; --brand-ink:#08150F; --brand-soft:#173128;
    --rec:#E5604F; --rec-soft:#3A1E1A; --warn:#E6BC52; --warn-soft:#3A3014; --ok:#58C98C; --ok-soft:#173526;
    --ayah:#222B22; --shadow:0 2px 14px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#101914; --card:#18241D; --ink:#EAF1EC; --mute:#9AAAA0; --line:#2A3B31;
  --brand:#3FA583; --brand-ink:#08150F; --brand-soft:#173128;
  --rec:#E5604F; --rec-soft:#3A1E1A; --warn:#E6BC52; --warn-soft:#3A3014; --ok:#58C98C; --ok-soft:#173526;
  --ayah:#222B22; --shadow:0 2px 14px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Naskh Arabic","Amiri","Geeza Pro","Traditional Arabic","Segoe UI","Tahoma",system-ui,sans-serif;font-size:17px;line-height:1.6}
body{height:100dvh;overflow:hidden;padding:env(safe-area-inset-top) 8px calc(env(safe-area-inset-bottom) + 6px)}
.wrap{max-width:760px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;gap:6px;padding:6px 0 4px;flex:none}
.ibtn.fs{font-size:24px;font-weight:700;min-width:56px;min-height:56px;padding:0 10px}
header.top h1{font-size:16px;margin:0;flex:1;font-weight:700;min-width:0}
header.top h1 small{display:block;font-size:13px;color:var(--mute);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
button{font:inherit;color:inherit;cursor:pointer}
.ibtn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-height:44px;box-shadow:var(--shadow)}
.ibtn:focus-visible,.btn:focus-visible,.rec:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.progress{margin:2px 0 6px;flex:none}
.progress .bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.progress .bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .25s}
.progress .meta{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);margin-top:4px;gap:8px;flex-wrap:wrap}
.warnbar{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 8px 0;box-shadow:var(--shadow);flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 4px}
.cardmeta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--mute);margin-bottom:8px}
.chip{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12.5px;background:var(--brand-soft);color:var(--brand)}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.rec{background:var(--rec-soft);color:var(--rec)}
.uid{direction:ltr;unicode-bidi:isolate;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.line{font-size:var(--fs,40px);line-height:1.95;text-align:center;margin:8px 0;padding:4px 0;overflow-wrap:anywhere}
.ctx{background:var(--ayah);border-radius:14px;padding:8px 12px;margin:8px 0;font-size:16px;color:var(--mute);text-align:center}
.ctx b{display:block;font-size:12.5px;color:var(--mute);font-weight:600}
.ctx .a{font-size:20px;line-height:2;color:var(--ink);opacity:.8}
.takeinfo{min-height:28px;text-align:center;font-size:14px;color:var(--mute)}
.dock{flex:none;background:var(--card);padding:6px 0 6px;border-top:1px solid var(--line)}
.controls{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:4px}
.controls .btn{min-height:80px}
.btn{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 8px;min-height:68px;font-size:20px;font-weight:700}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn[disabled]{opacity:.4;cursor:default}
.rec{width:92px;height:92px;border-radius:50%;border:6px solid var(--rec-soft);background:var(--rec);color:#fff;font-size:15px;font-weight:700;display:grid;place-items:center;box-shadow:0 6px 18px rgba(192,57,43,.35)}
.rec svg{width:34px;height:34px;fill:currentColor}
.rec.on{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(192,57,43,.18)}}
@media (prefers-reduced-motion:reduce){.rec.on{animation:none}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px auto 0;max-width:340px;visibility:hidden}
.meter.on{visibility:visible}.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .06s}
.timer{text-align:center;font-variant-numeric:tabular-nums;font-size:22px;min-height:0;color:var(--rec);font-weight:700}
.toast{position:fixed;inset-inline:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);max-width:560px;margin:auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;z-index:50;display:none;text-align:center;font-size:15px}
.toast.on{display:block}
dialog{border:none;border-radius:20px;padding:0;max-width:min(94vw,640px);width:100%;background:var(--card);color:var(--ink);box-shadow:0 10px 50px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:18px 18px 20px;max-height:86dvh;overflow:auto}
.dlg h2{margin:0 0 10px;font-size:20px}
.dlg label{display:block;margin:12px 0 4px;font-weight:600;font-size:15px}
.dlg input[type=text],.dlg select{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:46px}
.dlg .hint{font-size:13px;color:var(--mute);margin:3px 0}
.dlg .chk{display:flex;gap:10px;align-items:center;margin:12px 0}
.dlg .chk input{width:22px;height:22px}
.dlg .acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.dlg .acts .btn{flex:1;min-width:130px}
.list{list-style:none;margin:8px 0 0;padding:0}
.list li{display:flex;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer;min-height:48px}
.list li.cur{background:var(--brand-soft);border-radius:10px}
.list .dot{width:12px;height:12px;border-radius:50%;background:var(--line);flex:none}
.list .dot.ok{background:var(--ok)} .list .dot.pend{background:var(--warn)}
.list .t{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .sh{font-weight:700;background:var(--bg);color:var(--mute);cursor:default;font-size:13px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.filters button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 14px;min-height:36px}
.filters button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.bigprog{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0}.bigprog i{display:block;height:100%;width:0;background:var(--brand)}
.sig{text-align:center;color:var(--mute);font-size:12.5px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>تسجيل أثر <small id="who">المتحدث: —</small></h1>
    <button class="ibtn fs" id="bFm" aria-label="تصغير الخط">أ−</button>
    <button class="ibtn fs" id="bFp" aria-label="تكبير الخط">أ+</button>
    <button class="ibtn" id="bList" aria-label="الفهرس">الفهرس</button>
    <button class="ibtn" id="bSet" aria-label="الإعدادات">الإعدادات</button>
  </header>

  <div class="progress" aria-live="polite">
    <div class="bar"><i id="pbar"></i></div>
    <div class="meta"><span id="pTxt">—</span><span id="pSes">—</span></div>
  </div>
  <div id="warn" class="warnbar" hidden></div>

  <section class="card" id="card" aria-live="polite">
    <div class="scroll" id="scroll">
    <div class="cardmeta" id="cmeta"></div>
    <div class="ctx" id="cbefore" hidden></div>
    <div class="line" id="ltext" lang="ar"></div>
    <div class="ctx" id="cafter" hidden></div>
    <div class="takeinfo" id="tinfo"></div>
    </div>
    <div class="dock">
    <div class="timer" id="timer" aria-live="off"></div>
    <div class="meter" id="meter"><i></i></div>

    <div class="controls">
      <button class="btn" id="bPrev">‹ السابق</button>
      <button class="rec" id="bRec" aria-label="تسجيل"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg></button>
      <button class="btn" id="bNext">التالي ›</button>
    </div>
    <div class="row2">
      <button class="btn" id="bPlay" disabled>▶ استمع</button>
      <button class="btn" id="bRedo" disabled>↺ أعد التسجيل</button>
    </div>
    </div>
  </section>
</div>

<div class="toast" id="toast" role="status"></div>

<dialog id="dSet"><div class="dlg">
  <h2>الإعدادات</h2>
  <label for="iSpeaker">اسم المتحدث (يظهر في الواجهة وفي ملف manifest)</label>
  <input type="text" id="iSpeaker" placeholder="مثال: الأستاذ عرفات" autocomplete="off">
  <label for="sVoice">الصوت (voice) — مجلد الملفات</label>
  <select id="sVoice"></select>
  <input type="text" id="iVoice" placeholder="human_reader" dir="ltr" style="margin-top:8px" hidden autocomplete="off" spellcheck="false">
  <div class="hint">لكل صوت تسجيلاته المنفصلة داخل هذا الجهاز. اسم المجلد: حروف إنجليزية صغيرة وأرقام و _ و - فقط.</div>
  <div class="chk"><input type="checkbox" id="cPend"><label for="cPend" style="margin:0;font-weight:500">إظهار الأسطر المعلَّقة (آيات مضمَّنة في كلام الراوي — لا تُسجَّل قبل اعتماد الإصلاح)</label></div>
  <div class="chk"><input type="checkbox" id="cAuto"><label for="cAuto" style="margin:0;font-weight:500">الانتقال تلقائيًا إلى السطر التالي بعد إيقاف التسجيل</label></div>
  <label for="sFmt">صيغة التصدير</label>
  <select id="sFmt"><option value="native">الأصلية للمتصفح (m4a أو webm) — أصغر حجمًا</option><option value="wav">WAV أحادي ٢٤ ك.هـ — يتوافق مع كل شيء (أكبر حجمًا)</option></select>
  <div class="hint">يمكن تحويل أي صيغة إلى mp3 لاحقًا بسكربت الرقعة (ffmpeg).</div>
  <label for="fTash">استيراد تشكيل كامل (JSON: {"المعرّف": "النص المشكَّل"})</label>
  <input type="file" id="fTash" accept="application/json,.json">
  <div class="hint" id="tashInfo"></div>
  <div class="acts">
    <button class="btn primary" id="sSave">حفظ</button>
    <button class="btn" id="sTheme">الوضع الليلي/النهاري</button>
    <button class="btn" id="sWipe" style="color:var(--rec)">مسح كل التسجيلات</button>
    <button class="btn" id="sClose">إغلاق</button>
  </div>
</div></dialog>

<dialog id="dList"><div class="dlg">
  <h2>الفهرس</h2>
  <div class="filters" id="filters">
    <button data-f="all" class="on">الكل</button><button data-f="todo">غير مسجَّل</button><button data-f="done">مسجَّل</button>
  </div>
  <div class="filters" id="kfilters"><button data-k="all" class="on">كل الأنواع</button><button data-k="B1_dhikr_dua">أذكار وأدعية</button><button data-k="B2_hadith_quote">أحاديث ومقتبسات</button><button data-k="B3_sacred_text">نصوص شرعية</button><button data-k="B4_mixed_ayah">نصوص بين الآيات</button></div>
  <ul class="list" id="ulist"></ul>
  <div class="acts"><button class="btn" id="bNextOpen">التالي غير المسجَّل</button><button class="btn primary" id="bExport">تصدير ZIP</button><button class="btn" id="lClose">إغلاق</button></div>
</div></dialog>

<dialog id="dExp"><div class="dlg">
  <h2>تصدير ZIP</h2>
  <div id="expSum" class="hint" style="font-size:15px"></div>
  <div class="bigprog" id="expBar" hidden><i></i></div>
  <div id="expMsg" class="hint"></div>
  <div class="acts">
    <button class="btn primary" id="eGo">إنشاء الملف</button>
    <button class="btn" id="eShare" hidden>مشاركة</button>
    <button class="btn" id="eClose">إغلاق</button>
  </div>
</div></dialog>

src.food.forgot","ids":["src.food.forgot"],"text":"فإذا نسيت في أوّله فقل: «بسم الله في أوّله وآخره».","disp":"فإذا نسيت في أوّله فقل: «بسم الله في أوّله وآخره».","kind":"B2_hadith_quote","lesson":"adab.food","pos":5,"secs":4.24,"dens":0.06,"before":null,"after":null,"pending":false,"session":1},{"u":"src.food.after","ids":["src.food.after"],"text":"«الحمد لله الذي أطعمني هذا، ورزقنيه، من غير حولٍ منّي ولا قوّة».","disp":"«الحمد لله الذي أطعمني هذا، ورزقنيه، من غير حولٍ منّي ولا قوّة».","kind":"B2_hadith_quote","lesson":"adab.food","pos":5,"secs":5.35,"dens":0.07,"before":null,"after":null,"pending":false,"session":1},{"u":"src.nim.ayah~1","ids":["src.nim.ayah"],"text":"من نعم الله عليك: نعمة الإسلام وأنّك لستَ من أهل الكفر، ونعمة السنّة وأنّك لستَ من أهل البدع، ونعمة الصحّة والعافية من السمع والبصر والمشي وغيرها، ونعمة الطعام والشراب والملبس. قال تَعَالَى:","disp":"من نعم الله عليك: نعمة الإسلام وأنّك لستَ من أهل الكفر، ونعمة السنّة وأنّك لستَ من أهل البدع، ونعمة الصحّة والعافية من السمع والبصر والمشي وغيرها، ونعمة الطعام والشراب والملبس. قال تَعَالَى:","kind":"B4_mixed_ayah","lesson":"aqeedah.niam","pos":6,"secs":16.35,"dens":0.06,"before":null,"after":{"ayah":"﴿وَإِن تَعُدُّوا نِعْمَةَ اللَّهِ لَا تُحْصُوهَا﴾","ref":"النحل: ١٨"},"pending":false,"session":1},{"u":"src.nim.shukr~1","ids":["src.nim.shukr"],"text":"الواجب في النعم: شكرها، وذلك بالثناء على الله وحمده باللسان، وأنّه له الفضل وحده، واستعمال هذه النعم بما يرضي الله تَعَالَى لا بمعصيته. قال تَعَالَى:","disp":"الواجب في النعم: شكرها، وذلك بالثناء على الله وحمده باللسان، وأنّه له الفضل وحده، واستعمال هذه النعم بما يرضي الله تَعَالَى لا بمعصيته. قال تَعَالَى:","kind":"B4_mixed_ayah","lesson":"aqeedah.niam","pos":6,"secs":12.79,"dens":0.06,"before":null,"after":{"ayah":"﴿فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ﴾","ref":"البقرة: ١٥٢"},"pending":false,"session":1},{"u":"end.adhkar.hal","ids":["end.adhkar.hal"],"text":"تعلّمتَ اليوم: إذا سرّك أمر قلتَ الحمد لله الذي بنعمته تتمّ الصالحات، وإذا كرهتَ أمرًا قلتَ الحمد لله على كل حال، ولمن أحسن إليك: جزاك الله خيرًا.","disp":"تعلّمتَ اليوم: إذا سرّك أمر قلتَ الحمد لله الذي بنعمته تتمّ الصالحات، وإذا كرهتَ أمرًا قلتَ الحمد لله على كل حال، ولمن أحسن إليك: جزاك الله خيرًا.","kind":"B2_hadith_quote","lesson":"adhkar.hal","pos":7,"secs":12.13,"dens":0.08,"before":null,"after":null,"pending":false,"session":1},{"u":"rev.hal.1","ids":["rev.hal.1"],"text":"تقول: الحمد لله الذي بنعمته تتمّ الصالحات.","disp":"تقول: الحمد لله الذي بنعمته تتمّ الصالحات.","kind":"B2_hadith_quote","lesson":"adhkar.hal","pos":7,"secs":4.02,"dens":0.03,"before":null,"after":null,"pending":false,"session":1},{"u":"src.hal.three","ids":["src.hal.three"],"text":"ما تقول إذا حصل لك ما يسرّك: «الحمد لله الذي بنعمته تتمّ الصالحات». وما تقول إذا حصل ما تكرهه: «الحمد لله على كل حال». وما تقول لمن صنع إليك معروفًا: «جزاك الله خيرًا».","disp":"ما تقول إذا حصل لك ما يسرّك: «الحمد لله الذي بنعمته تتمّ الصالحات». وما تقول إذا حصل ما تكرهه: «الحمد لله على كل حال». وما تقول لمن صنع إليك معروفًا: «جزاك الله خيرًا».","kind":"B2_hadith_quote","lesson":"adhkar.hal","pos":7,"secs":13.68,"dens":0.03,"before":null,"after":null,"pending":false,"session":1},{"u":"src.sleep.dua","ids":["src.sleep.dua"],"text":"«باسمك اللهم أموت وأحيا».","disp":"«باسمك اللهم أموت وأحيا».","kind":"B2_hadith_quote","lesson":"adhkar.sleep","pos":8,"secs":2.46,"dens":0.0,"before":null,"after":null,"pending":false,"session":1},{"u":"say.sleep.3","ids":["say.sleep.3"],"text":"باسمك اللهم أموت وأحيا","disp":"باسمك اللهم أموت وأحيا","kind":"B1_dhikr_dua","lesson":"adhkar.sleep","pos":8,"secs":2.46,"dens":0.0,"before":null,"after":null,"pending":false,"session":1},{"u":"end.hadith.harf","ids":["end.hadith.harf"],"text":"تعلّمتَ اليوم: من قرأ حرفًا من كتاب الله فله به حسنة، والحسنة بعشر أمثالها، ولا يقال ألم حرف، بل ألف حرف ولام حرف وميم حرف.","disp":"تعلّمتَ اليوم: من قرأ حرفًا من كتاب الله فله به حسنة، والحسنة بعشر أمثالها، ولا يقال ألم حرف، بل ألف حرف ولام حرف وميم حرف.","kind":"B2_hadith_quote","lesson":"hadith.harf","pos":9,"secs":10.46,"dens":0.03,"before":null,"after":null,"pending":false,"session":1},{"u":"src.harf.hadith","ids":["src.harf.hadith"],"text":"عن عبد الله بن مسعود رضي الله عنه، أنّ النبي ﷺ قال: «مَن قرأ حرفًا من كتاب الله فله به حسنة، والحسنة بعشر أمثالها، لا أقول: الم حرف، ولكن ألفٌ حرف، ولامٌ حرف، وميمٌ حرف».","disp":"عن عبد الله بن مسعود رضي الله عنه، أنّ النبي صلى الله عليه وسلم قال: «مَن قرأ حرفًا من كتاب الله فله به حسنة، والحسنة بعشر أمثالها، لا أقول: الم حرف، ولكن ألفٌ حرف، ولامٌ حرف، وميمٌ حرف».","kind":"B2_hadith_quote","lesson":"hadith.harf","pos":9,"secs":15.13,"dens":0.05,"before":null,"after":null,"pending":false,"session":1},{"u":"end.ibadah.dua","ids":["end.ibadah.dua"],"text":"تعلّمتَ اليوم: الدعاء من أعظم الطاعات وأجلّ القربات، وقال النبي صلى الله عليه وسلم: الدعاء هو العبادة.","disp":"تعلّمتَ اليوم: الدعاء من أعظم الطاعات وأجلّ القربات، وقال النبي صلى الله عليه وسلم: الدعاء هو العبادة.","kind":"B2_hadith_quote","lesson":"ibadah.dua","pos":10,"secs":9.13,"dens":0.04,"before":null,"after":null,"pending":false,"session":1},{"u":"src.dua.ayah~1","ids":["src.dua.ayah"],"text":"الدعاء هو من أعظم الطاعات وأجلّ القربات. قال تَعَالَى:","disp":"الدعاء هو من أعظم الطاعات وأجلّ القربات. قال تَعَالَى:","kind":"B4_mixed_ayah","lesson":"ibadah.dua","pos":10,"secs":4.79,"dens":0.1,"before":null,"after":{"ayah":"﴿وَقَالَ رَبُّكُمُ ادْعُونِي أَسْتَجِبْ لَكُمْ﴾","ref":"غافر: ٦٠"},"pending":false,"session":1},{"u":"src.dua.ayah~2","ids":["src.dua.ayah"],"text":"وقال النبي ﷺ: «الدعاءُ هو العبادة»","disp":"وقال النبي صلى الله عليه وسلم: «الدعاءُ هو العبادة»","kind":"B4_mixed_ayah","lesson":"ibadah.dua","pos":10,"secs":4.68,"dens":0.04,"before":{"ayah":"﴿وَقَالَ رَبُّكُمُ ادْعُونِي أَسْتَجِبْ لَكُمْ﴾","ref":"غافر: ٦٠"},"after":null,"pending":false,"session":1},{"u":"out.dua.silent","ids":["out.dua.silent"],"text":"وبابٌ مفتوحٌ أمامك لم تطرقه: ادعوني أستجب لكم.","disp":"وبابٌ مفتوحٌ أمامك لم تطرقه: ادعوني أستجب لكم.","kind":"B5_pending_embedded_ayah","lesson":"ibadah.dua","pos":10,"secs":4.24,"dens":0.06,"before":null,"after":null,"pending":true,"session":0},{"u":"end.adhkar.fadl","ids":["end.adhkar.fadl"],"text":"تعلّمتَ اليوم: مثل الذي يذكر ربّه والذي لا يذكر ربّه مثل الحيّ والميّت، ومن فوائده أنّه يُرضي الرحمن ويطرد الشيطان ويحصّن من الشرور، وأفضل الذكر لا إله إلا الله.","disp":"تعلّمتَ اليوم: مثل الذي يذكر ربّه والذي لا يذكر ربّه مثل الحيّ والميّت، ومن فوائده أنّه يُرضي الرحمن ويطرد الشيطان ويحصّن من الشرور، وأفضل الذكر لا إله إلا الله.","kind":"B2_hadith_quote","lesson":"adhkar.fadl","pos":11,"secs":13.68,"dens":0.07,"before":null,"after":null,"pending":false,"session":1},{"u":"src.fad.mathal","ids":["src.fad.mathal"],"text":"قال النبي ﷺ: «مثلُ الذي يذكر ربَّه والذي لا يذكر ربَّه، مثلُ الحيِّ والميِّت». وهذا لأنّ قيمة حياة الإنسان بقدر ذكره لله تَعَالَى.","disp":"قال النبي صلى الله عليه وسلم: «مثلُ الذي يذكر ربَّه والذي لا يذكر ربَّه، مثلُ الحيِّ والميِّت». وهذا لأنّ قيمة حياة الإنسان بقدر ذكره لله تَعَالَى.","kind":"B2_hadith_quote","lesson":"adhkar.fadl","pos":11,"secs":11.68,"dens":0.16,"before":null,"after":null,"pending":false,"session":1},{"u":"src.fad.fawaid","ids":["src.fad.fawaid"],"text":"ومن فوائد الذكر: يُرضي الرحمن، ويطرد الشيطان، ويحصّن المسلم من الشرور، ويحصل به الأجر والثواب. وأفضل الذكر: «لا إله إلا الله».","disp":"ومن فوائد الذكر: يُرضي الرحمن، ويطرد الشيطان، ويحصّن المسلم من الشرور، ويحصل به الأجر والثواب. وأفضل الذكر: «لا إله إلا الله».","kind":"B2_hadith_quote","lesson":"adhkar.fadl","pos":11,"secs":10.91,"dens":0.02,"before":null,"after":null,"pending":false,"session":1},{"u":"src.wudu.merit","ids":["src.wudu.merit"],"text":"«إذا توضّأ العبد المسلم فغسل وجهه؛ خرج من وجهه كل خطيئةٍ نظر إليها بعينيه مع الماء… حتى يخرج نقيًّا من الذنوب».","disp":"«إذا توضّأ العبد المسلم فغسل وجهه؛ خرج من وجهه كل خطيئةٍ نظر إليها بعينيه مع الماء… حتى يخرج نقيًّا من الذنوب».","kind":"B2_hadith_quote","lesson":"ibadah.wudu","pos":12,"secs":9.46,"dens":0.05,"before":null,"after":null,"pending":false,"session":2},{"u":"src.wudu.fard","ids":["src.wudu.fard"],"text":"فرائض الوضوء: غسل الوجه ومنه المضمضة والاستنشاق، وغسل اليدين إلى المرفقين، ومسح الرأس ومنه الأذنين، وغسل الرجلين إلى الكعبين، والترتيب، والموالاة.","disp":"فرائض الوضوء: غسل الوجه ومنه المضمضة والاستنشاق، وغسل اليدين إلى المرفقين، ومسح الرأس ومنه الأذنين، وغسل الرجلين إلى الكعبين، والترتيب، والموالاة.","kind":"B3_sacred_text","lesson":"ibadah.wudu","pos":12,"secs":13.57,"dens":0.0,"before":null,"after":null,"pending":false,"session":2},{"u":"end.misc.fiqh","ids":["end.misc.fiqh"],"text":"تعلّمتَ اليوم: ثمرة التفقّه صحّة الأقوال والأعمال والاعتقادات، بما يُثمر السعادة في الدنيا والآخرة، ومن يُرد الله به خيرًا يُفقّهه في الدين.","disp":"تعلّمتَ اليوم: ثمرة التفقّه صحّة الأقوال والأعمال والاعتقادات، بما يُثمر السعادة في الدنيا والآخرة، ومن يُرد الله به خيرًا يُفقّهه في الدين.","kind":"B2_hadith_quote","lesson":"misc.fiqh","pos":13,"secs":12.13,"dens":0.08,"before":null,"after":null,"pending":false,"session":2},{"u":"src.fiq.hadith.a","ids":["src.fiq.hadith.a"],"text":"ثمرة التفقّه في الدين: صحّة الأقوال والأعمال والاعتقادات، بما يُثمر السعادة في الدنيا والآخرة.","disp":"ثمرة التفقّه في الدين: صحّة الأقوال والأعمال والاعتقادات، بما يُثمر السعادة في الدنيا والآخرة.","kind":"B3_sacred_text","lesson":"misc.fiqh","pos":13,"secs":8.68,"dens":0.04,"before":null,"after":null,"pending":false,"session":2},{"u":"src.fiq.hadith.b","ids":["src.fiq.hadith.b"],"text":"وفي الحديث عن معاوية بن أبي سفيان رضي الله عنهما قال: قال رسول الله ﷺ: «من يُرد الله به خيرًا يُفقّهه في الدين». يُفقّهه: أي يجعله عالمًا بالأحكام الشرعية.","disp":"وفي الحديث عن معاوية بن أبي سفيان رضي الله عنهما قال: قال رسول الله صلى الله عليه وسلم: «من يُرد الله به خيرًا يُفقّهه في الدين». يُفقّهه: أي يجعله عالمًا بالأحكام الشرعية.","kind":"B2_hadith_quote","lesson":"misc.fiqh","pos":13,"secs":14.46,"dens":0.06,"before":null,"after":null,"pending":false,"session":2},{"u":"out.fiq.later","ids":["out.fiq.later"],"text":"ومن يُرد الله به خيرًا يُفقّهه في الدين. فلا تؤجّل خيرًا أُريد بك.","disp":"ومن يُرد الله به خيرًا يُفقّهه في الدين. فلا تؤجّل خيرًا أُريد بك.","kind":"B2_hadith_quote","lesson":"misc.fiqh","pos":13,"secs":5.35,"dens":0.16,"before":null,"after":null,"pending":false,"session":2},{"u":"src.msj.two","ids":["src.msj.two"],"text":"دعاء دخول المسجد: «اللهم افتح لي أبواب رحمتك». ودعاء الخروج منه: «اللهم إنّي أسألك من فضلك».","disp":"دعاء دخول المسجد: «اللهم افتح لي أبواب رحمتك». ودعاء الخروج منه: «اللهم إنّي أسألك من فضلك».","kind":"B2_hadith_quote","lesson":"adhkar.masjid","pos":14,"secs":7.91,"dens":0.01,"before":null,"after":null,"pending":false,"session":2},{"u":"src.salat.five","ids":["src.salat.five"],"text":"خمس صلوات في اليوم والليلة: صلاة الفجر ركعتان، وصلاة الظهر أربع ركعات، وصلاة العصر أربع ركعات، وصلاة المغرب ثلاث ركعات، وصلاة العشاء أربع ركعات.","disp":"خمس صلوات في اليوم والليلة: صلاة الفجر ركعتان، وصلاة الظهر أربع ركعات، وصلاة العصر أربع ركعات، وصلاة المغرب ثلاث ركعات، وصلاة العشاء أربع ركعات.","kind":"B3_sacred_text","lesson":"ibadah.salat","pos":15,"secs":13.13,"dens":0.0,"before":null,"after":null,"pending":false,"session":2},{"u":"src.salat.shart","ids":["src.salat.shart"],"text":"ومن شروط الصلاة: الطهارة في رفع الحدث؛ لحديث: «لا يقبل الله صلاةَ أحدِكم إذا أحدثَ حتى يتوضّأ». ومنها دخول الوقت.","disp":"ومن شروط الصلاة: الطهارة في رفع الحدث؛ لحديث: «لا يقبل الله صلاةَ أحدِكم إذا أحدثَ حتى يتوضّأ». ومنها دخول الوقت.","kind":"B2_hadith_quote","lesson":"ibadah.salat","pos":15,"secs":9.57,"dens":0.05,"before":null,"after":null,"pending":false,"session":2},{"u":"end.quran.fatiha","ids":["end.quran.fatiha"],"text":"تعلّمتَ اليوم: سُمّيت الفاتحة لافتتاح كتاب الله بها، والحمد لله ربّ العالمين أي جميع المحامد لله وحده، ومالك يوم الدين هو يوم القيامة.","disp":"تعلّمتَ اليوم: سُمّيت الفاتحة لافتتاح كتاب الله بها، والحمد لله ربّ العالمين أي جميع المحامد لله وحده، ومالك يوم الدين هو يوم القيامة.","kind":"B5_pending_embedded_ayah","lesson":"quran.fatiha","pos":16,"secs":11.79,"dens":0.05,"before":null,"after":null,"pending":true,"session":0},{"u":"src.fat.amin","ids":["src.fat.amin"],"text":"سُمّيت سورة الفاتحة لافتتاح كتاب الله بها. ويُسنّ أن يقول بعد قراءتها: «آمين» أي: استجب لنا.","disp":"سُمّيت سورة الفاتحة لافتتاح كتاب الله بها. ويُسنّ أن يقول بعد قراءتها: «آمين» أي: استجب لنا.","kind":"B2_hadith_quote","lesson":"quran.fatiha","pos":16,"secs":7.79,"dens":0.06,"before":null,"after":null,"pending":false,"session":2},{"u":"src.suj.seven.a","ids":["src.suj.seven.a"],"text":"ثم يسجد ويسجد على أعضائه السبعة: الجبهة والأنف، والكفّان، والركبتان، وأطراف القدمين. ويجافي عضديه عن جنبيه، ولا يبسط ذراعيه على الأرض، ويستقبل برؤوس أصابعه القبلة.","disp":"ثم يسجد ويسجد على أعضائه السبعة: الجبهة والأنف، والكفّان، والركبتان، وأطراف القدمين. ويجافي عضديه عن جنبيه، ولا يبسط ذراعيه على الأرض، ويستقبل برؤوس أصابعه القبلة.","kind":"B3_sacred_text","lesson":"ibadah.sujud","pos":17,"secs":14.79,"dens":0.01,"before":null,"after":null,"pending":false,"session":2},{"u":"src.suj.seven.b","ids":["src.suj.seven.b"],"text":"ويقول في سجوده: «سبحان ربّي الأعلى» ثلاث مرّات. ويقول بين السجدتين: «ربّ اغفر لي، وارحمني، واهدني، وارزقني، واجبرني، وعافني».","disp":"ويقول في سجوده: «سبحان ربّي الأعلى» ثلاث مرّات. ويقول بين السجدتين: «ربّ اغفر لي، وارحمني، واهدني، وارزقني، واجبرني، وعافني».","kind":"B2_hadith_quote","lesson":"ibadah.sujud","pos":17,"secs":10.46,"dens":0.03,"before":null,"after":null,"pending":false,"session":2},{"u":"say.suj.1","ids":["say.suj.1"],"text":"سبحان ربّي الأعلى","disp":"سبحان ربّي الأعلى","kind":"B1_dhikr_dua","lesson":"ibadah.sujud","pos":17,"secs":1.91,"dens":0.07,"before":null,"after":null,"pending":false,"session":2},{"u":"say.suj.2","ids":["say.suj.2"],"text":"الله أكبر، أرفع رأسي","disp":"الله أكبر، أرفع رأسي","kind":"B1_dhikr_dua","lesson":"ibadah.sujud","pos":17,"secs":2.13,"dens":0.0,"before":null,"after":null,"pending":false,"session":2},{"u":"say.suj.3","ids":["say.suj.3"],"text":"ربّ اغفر لي وارحمني واهدني","disp":"ربّ اغفر لي وارحمني واهدني","kind":"B1_dhikr_dua","lesson":"ibadah.sujud","pos":17,"secs":2.68,"dens":0.05,"before":null,"after":null,"pending":false,"session":2},{"u":"src.sif.khalq","ids":["src.sif.khalq"],"text":"كان ﷺ وسطًا من الرجال، ليس بالقصير ولا بالطويل بل بين ذلك، وكان أبيض مشربًا بالحمرة، وكان كثيف اللحية، واسع العينين، عظيم الفم، طيّب الرائحة، وغير ذلك من خلقته الجميلة ﷺ.","disp":"كان صلى الله عليه وسلم وسطًا من الرجال، ليس بالقصير ولا بالطويل بل بين ذلك، وكان أبيض مشربًا بالحمرة، وكان كثيف اللحية، واسع العينين، عظيم الفم، طيّب الرائحة، وغير ذلك من خلقته الجميلة صلى الله عليه وسلم.","kind":"B3_sacred_text","lesson":"seerah.sifat","pos":18,"secs":17.79,"dens":0.02,"before":null,"after":null,"pending":false,"session":2},{"u":"src.sif.hubb","ids":["src.sif.hubb"],"text":"عن أنس رضي الله عنه قال: قال رسول الله ﷺ: «لا يؤمنُ أحدُكم حتى أكونَ أحبَّ إليه من والده، وولده، والناس أجمعين». ومن فوائده: يجب محبّة النبي ﷺ أكثر من كل الناس، وأنّ ذلك من كمال الإيمان.","disp":"عن أنس رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «لا يؤمنُ أحدُكم حتى أكونَ أحبَّ إليه من والده، وولده، والناس أجمعين». ومن فوائده: يجب محبّة النبي صلى الله عليه وسلم أكثر من كل الناس، وأنّ ذلك من كمال الإيمان.","kind":"B2_hadith_quote","lesson":"seerah.sifat","pos":18,"secs":18.24,"dens":0.05,"before":null,"after":null,"pending":false,"session":2},{"u":"end.adhkar.salatnabi","ids":["end.adhkar.salatnabi"],"text":"تعلّمتَ اليوم: معنى الصلاة عليه أن تدعو الله أن يُثني عليه في الملأ الأعلى، وصيغتها اللهم صلِّ على محمد وعلى آل محمد كما صلّيتَ على إبراهيم.","disp":"تعلّمتَ اليوم: معنى الصلاة عليه أن تدعو الله أن يُثني عليه في الملأ الأعلى، وصيغتها اللهم صلِّ على محمد وعلى آل محمد كما صلّيتَ على إبراهيم.","kind":"B2_hadith_quote","lesson":"adhkar.salatnabi","pos":19,"secs":12.02,"dens":0.07,"before":null,"after":null,"pending":false,"session":2},{"u":"src.sal.sigha","ids":["src.sal.sigha"],"text":"«اللهُمَّ صَلِّ عَلَىٰ مُحَمَّدٍ وَعَلَىٰ آلِ مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلَىٰ إِبْرَاهِيمَ وَعَلَىٰ آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ، اللهُمَّ بَارِكْ عَلَىٰ مُحَمَّدٍ وَعَلَىٰ آلِ مُحَمَّدٍ، كَمَا بَارَكْتَ عَلَىٰ إِبْرَاهِيمَ وَعَلَىٰ آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ».","disp":"«اللهُمَّ صَلِّ عَلَىٰ مُحَمَّدٍ وَعَلَىٰ آلِ مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلَىٰ إِبْرَاهِيمَ وَعَلَىٰ آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ، اللهُمَّ بَارِكْ عَلَىٰ مُحَمَّدٍ وَعَلَىٰ آلِ مُحَمَّدٍ، كَمَا بَارَكْتَ عَلَىٰ إِبْرَاهِيمَ وَعَلَىٰ آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ».","kind":"B2_hadith_quote","lesson":"adhkar.salatnabi","pos":19,"secs":15.13,"dens":0.88,"before":null,"after":null,"pending":false,"session":2},{"u":"say.sal.1","ids":["say.sal.1"],"text":"اللهم صلِّ على محمد","disp":"اللهم صلِّ على محمد","kind":"B1_dhikr_dua","lesson":"adhkar.salatnabi","pos":19,"secs":1.91,"dens":0.14,"before":null,"after":null,"pending":false,"session":2},{"u":"src.jum.sunan","ids":["src.jum.sunan"],"text":"من سنن يوم الجمعة: الاغتسال، والتطيّب، ولبس أحسن الثياب، والتبكير إلى المسجد، والذهاب إليه ماشيًا، والإكثار من الصلاة على النبي ﷺ، وقراءة سورة الكهف، وتحرّي ساعة إجابة الدعاء.","disp":"من سنن يوم الجمعة: الاغتسال، والتطيّب، ولبس أحسن الثياب، والتبكير إلى المسجد، والذهاب إليه ماشيًا، والإكثار من الصلاة على النبي صلى الله عليه وسلم، وقراءة سورة الكهف، وتحرّي ساعة إجابة الدعاء.","kind":"B3_sacred_text","lesson":"ibadah.jumuah","pos":20,"secs":17.02,"dens":0.02,"before":null,"after":null,"pending":false,"session":2},{"u":"rev.jum.1","ids":["rev.jum.1"],"text":"قراءة سورة الكهف. قال صلى الله عليه وسلم: من قرأ سورة الكهف يوم الجمعة، أضاء له من النور ما بين الجمعتين.","disp":"قراءة سورة الكهف. قال صلى الله عليه وسلم: من قرأ سورة الكهف يوم الجمعة، أضاء له من النور ما بين الجمعتين.","kind":"B2_hadith_quote","lesson":"ibadah.jumuah","pos":20,"secs":9.35,"dens":0.0,"before":null,"after":null,"pending":false,"session":2},{"u":"end.quran.quraysh","ids":["end.quran.quraysh"],"text":"تعلّمتَ اليوم: كانت لقريش رحلتان، فليعبدوا ربّ هذا البيت وحده، الذي أطعمهم من جوع وآمنهم من خوف.","disp":"تعلّمتَ اليوم: كانت لقريش رحلتان، فليعبدوا ربّ هذا البيت وحده، الذي أطعمهم من جوع وآمنهم من خوف.","kind":"B5_pending_embedded_ayah","lesson":"quran.quraysh","pos":21,"secs":8.46,"dens":0.04,"before":null,"after":null,"pending":true,"session":0},{"u":"taf.qur.4","ids":["taf.qur.4"],"text":"الذي أطعمهم من جوع، وآمنهم من خوف، بما وضع في قلوب العرب من تعظيم الحرم وتعظيم سكّانه.","disp":"الذي أطعمهم من جوع، وآمنهم من خوف، بما وضع في قلوب العرب من تعظيم الحرم وتعظيم سكّانه.","kind":"B5_pending_embedded_ayah","lesson":"quran.quraysh","pos":21,"secs":7.68,"dens":0.02,"before":null,"after":null,"pending":true,"session":0},{"u":"src.qur.full","ids":["src.qur.full"],"text":"سورة قريش: لما كانوا يألفونه من الرحلة في الشتاء إلى اليمن والصيف إلى الشام آمنين، فليعبدوا الله ربّ هذا البيت الحرام وحده ولا يشركوا به أحدًا، الذي أطعمهم من جوع وآمنهم من خوف.","disp":"سورة قريش: لما كانوا يألفونه من الرحلة في الشتاء إلى اليمن والصيف إلى الشام آمنين، فليعبدوا الله ربّ هذا البيت الحرام وحده ولا يشركوا به أحدًا، الذي أطعمهم من جوع وآمنهم من خوف.","kind":"B3_sacred_text","lesson":"quran.quraysh","pos":21,"secs":15.79,"dens":0.01,"before":null,"after":null,"pending":false,"session":2},{"u":"end.adab.rukub","ids":["end.adab.rukub"],"text":"تعلّمتَ اليوم: تقول بسم الله، الحمد لله، ثم سبحان الذي سخّر لنا هذا، وإذا مررتَ بمسلمٍ ألقيتَ عليه السلام.","disp":"تعلّمتَ اليوم: تقول بسم الله، الحمد لله، ثم سبحان الذي سخّر لنا هذا، وإذا مررتَ بمسلمٍ ألقيتَ عليه السلام.","kind":"B5_pending_embedded_ayah","lesson":"adab.rukub","pos":22,"secs":8.91,"dens":0.08,"before":null,"after":null,"pending":true,"session":0},{"u":"src.ruk.ayah~1","ids":["src.ruk.ayah"],"text":"أقول: «بسم الله، الحمد لله»","disp":"أقول: «بسم الله، الحمد لله»","kind":"B4_mixed_ayah","lesson":"adab.rukub","pos":22,"secs":2.46,"dens":0.0,"before":null,"after":{"ayah":"﴿سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَٰذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ ١٣ وَإِنَّا إِلَىٰ رَبِّنَا لَمُنقَلِبُونَ ١٤﴾","ref":"الزخرف: ١٣–١٤"},"pending":false,"session":2},{"u":"say.ruk.2","ids":["say.ruk.2"],"text":"الحمد لله","disp":"الحمد لله","kind":"B1_dhikr_dua","lesson":"adab.rukub","pos":22,"secs":1.24,"dens":0.0,"before":null,"after":null,"pending":false,"session":2},{"u":"say.ruk.3","ids":["say.ruk.3"],"text":"سبحان الذي سخّر لنا هذا","disp":"سبحان الذي سخّر لنا هذا","kind":"B1_dhikr_dua","lesson":"adab.rukub","pos":22,"secs":2.35,"dens":0.06,"before":null,"after":null,"pending":false,"session":2},{"u":"src.rain.dua","ids":["src.rain.dua"],"text":"«اللهم صيّبًا نافعًا».","disp":"«اللهم صيّبًا نافعًا».","kind":"B2_hadith_quote","lesson":"adhkar.rain","pos":23,"secs":1.91,"dens":0.21,"before":null,"after":null,"pending":false,"session":2},{"u":"src.rain.after","ids":["src.rain.after"],"text":"«مُطرنا بفضل الله ورحمته».","disp":"«مُطرنا بفضل الله ورحمته».","kind":"B2_hadith_quote","lesson":"adhkar.rain","pos":23,"secs":2.46,"dens":0.05,"before":null,"after":null,"pending":false,"session":2},{"u":"end.hadith.hubb","ids":["end.hadith.hubb"],"text":"تعلّمتَ اليوم: لا يؤمن أحدكم حتى يحبّ لأخيه ما يحبّ لنفسه، وذلك من كمال الإيمان.","disp":"تعلّمتَ اليوم: لا يؤمن أحدكم حتى يحبّ لأخيه ما يحبّ لنفسه، وذلك من كمال الإيمان.","kind":"B2_hadith_quote","lesson":"hadith.hubb","pos":24,"secs":6.91,"dens":0.07,"before":null,"after":null,"pending":false,"session":2},{"u":"src.hubb.hadith","ids":["src.hubb.hadith"],"text":"عن أنس رضي الله عنه قال: قال رسول الله ﷺ: «لا يؤمنُ أحدُكم حتى يحبَّ لأخيه ما يحبُّ لنفسه».","disp":"عن أنس رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «لا يؤمنُ أحدُكم حتى يحبَّ لأخيه ما يحبُّ لنفسه».","kind":"B2_hadith_quote","lesson":"hadith.hubb","pos":24,"secs":8.79,"dens":0.1,"before":null,"after":null,"pending":false,"session":2},{"u":"src.has.hadith","ids":["src.has.hadith"],"text":"في الحديث: «إذا رأى أحدُكم من أخيه، أو من نفسه، أو من ماله ما يعجبه، فليدعُ له بالبركة، فإنّ العينَ حقّ».","disp":"في الحديث: «إذا رأى أحدُكم من أخيه، أو من نفسه، أو من ماله ما يعجبه، فليدعُ له بالبركة، فإنّ العينَ حقّ».","kind":"B2_hadith_quote","lesson":"akhlaq.hasad","pos":25,"secs":8.35,"dens":0.07,"before":null,"after":null,"pending":false,"session":2},{"u":"end.hadith.lisan","ids":["end.hadith.lisan"],"text":"تعلّمتَ اليوم: ليس المؤمن بالطعّان ولا اللعّان ولا الفاحش ولا البذيء، وفيه النهي عن كل كلامٍ باطلٍ وقبيح.","disp":"تعلّمتَ اليوم: ليس المؤمن بالطعّان ولا اللعّان ولا الفاحش ولا البذيء، وفيه النهي عن كل كلامٍ باطلٍ وقبيح.","kind":"B2_hadith_quote","lesson":"hadith.lisan","pos":26,"secs":9.13,"dens":0.08,"before":null,"after":null,"pending":false,"session":2},{"u":"src.lis.hadith","ids":["src.lis.hadith"],"text":"عن عبد الله بن مسعود رضي الله عنه قال: قال رسول الله ﷺ: «ليس المؤمنُ بالطعّان، ولا اللعّان، ولا الفاحش، ولا البذيء».","disp":"عن عبد الله بن مسعود رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «ليس المؤمنُ بالطعّان، ولا اللعّان، ولا الفاحش، ولا البذيء».","kind":"B2_hadith_quote","lesson":"hadith.lisan","pos":26,"secs":11.24,"dens":0.04,"before":null,"after":null,"pending":false,"session":2},{"u":"rev.ghb.2","ids":["rev.ghb.2"],"text":"هي نقل الأحاديث بين الناس للإفساد بينهم. قال صلى الله عليه وسلم: لا يدخل الجنّة نمّام.","disp":"هي نقل الأحاديث بين الناس للإفساد بينهم. قال صلى الله عليه وسلم: لا يدخل الجنّة نمّام.","kind":"B2_hadith_quote","lesson":"akhlaq.gheebah","pos":27,"secs":7.68,"dens":0.03,"before":null,"after":null,"pending":false,"session":2},{"u":"src.ghb.ayah~1","ids":["src.ghb.ayah"],"text":"الغيبة: هي ذكر المسلم أخاك بما يكره وهو غائب. قال تَعَالَى:","disp":"الغيبة: هي ذكر المسلم أخاك بما يكره وهو غائب. قال تَعَالَى:","kind":"B4_mixed_ayah","lesson":"akhlaq.gheebah","pos":27,"secs":5.13,"dens":0.07,"before":null,"after":{"ayah":"﴿وَلَا يَغْتَب بَّعْضُكُم بَعْضًا ۚ أَيُحِبُّ أَحَدُكُمْ أَن يَأْكُلَ لَحْمَ أَخِيهِ مَيْتًا فَكَرِهْتُمُوهُ ۚ وَاتَّقُوا اللَّهَ إِنَّ اللَّهَ تَوَّابٌ رَّحِيمٌ﴾","ref":"الحجرات: ١٢"},"pending":false,"session":2},{"u":"say.ghd.1","ids":["say.ghd.1"],"text":"أعوذ بالله من الشيطان الرجيم","disp":"أعوذ بالله من الشيطان الرجيم","kind":"B1_dhikr_dua","lesson":"akhlaq.ghadab","pos":28,"secs":3.02,"dens":0.0,"before":null,"after":null,"pending":false,"session":2},{"u":"src.ghd.ilaj","ids":["src.ghd.ilaj"],"text":"علاج الغضب المذموم: الوضوء، والقعود إن كان قائمًا والاضطجاع إن كان قاعدًا، وأن يلتزم بوصيّة النبي ﷺ في ذلك: «لا تغضب»، وأن يضبط النفس عن الاندفاع عند الغضب، والاستعاذة بالله من الشيطان الرجيم، والسكوت.","disp":"علاج الغضب المذموم: الوضوء، والقعود إن كان قائمًا والاضطجاع إن كان قاعدًا، وأن يلتزم بوصيّة النبي صلى الله عليه وسلم في ذلك: «لا تغضب»، وأن يضبط النفس عن الاندفاع عند الغضب، والاستعاذة بالله من الشيطان الرجيم، والسكوت.","kind":"B2_hadith_quote","lesson":"akhlaq.ghadab","pos":28,"secs":19.13,"dens":0.02,"before":null,"after":null,"pending":false,"session":2},{"u":"out.ghd.shout","ids":["out.ghd.shout"],"text":"وقال النبي صلى الله عليه وسلم لمن استوصاه: لا تغضب. فاسكت واقعد أوّلًا.","disp":"وقال النبي صلى الله عليه وسلم لمن استوصاه: لا تغضب. فاسكت واقعد أوّلًا.","kind":"B2_hadith_quote","lesson":"akhlaq.ghadab","pos":28,"secs":6.35,"dens":0.04,"before":null,"after":null,"pending":false,"session":3},{"u":"src.kas.def","ids":["src.kas.def"],"text":"الكسل: هو التثاقل عن فعل الخير وما يجب على الإنسان فعله، ومن ذلك التكاسل في فعل الواجبات.","disp":"الكسل: هو التثاقل عن فعل الخير وما يجب على الإنسان فعله، ومن ذلك التكاسل في فعل الواجبات.","kind":"B3_sacred_text","lesson":"akhlaq.kasal","pos":29,"secs":8.13,"dens":0.0,"before":null,"after":null,"pending":false,"session":3},{"u":"src.kas.q~1","ids":["src.kas.q"],"text":"قال الله تَعَالَى:","disp":"قال الله تَعَالَى:","kind":"B4_mixed_ayah","lesson":"akhlaq.kasal","pos":29,"secs":1.68,"dens":0.25,"before":null,"after":{"ayah":"﴿إِنَّ الْمُنَافِقِينَ يُخَادِعُونَ اللَّهَ وَهُوَ خَادِعُهُمْ وَإِذَا قَامُوا إِلَى الصَّلَاةِ قَامُوا كُسَالَىٰ يُرَاءُونَ النَّاسَ وَلَا يَذْكُرُونَ اللَّهَ إِلَّا قَلِيلًا﴾","ref":"النساء: ١٤٢"},"pending":false,"session":3},{"u":"rev.ayy.1","ids":["rev.ayy.1"],"text":"عيد الفطر وعيد الأضحى. قال النبي صلى الله عليه وسلم: إنّ الله قد أبدلكم بهما خيرًا منهما: يوم الأضحى ويوم الفطر.","disp":"عيد الفطر وعيد الأضحى. قال النبي صلى الله عليه وسلم: إنّ الله قد أبدلكم بهما خيرًا منهما: يوم الأضحى ويوم الفطر.","kind":"B2_hadith_quote","lesson":"misc.ayyam","pos":30,"secs":9.91,"dens":0.02,"before":null,"after":null,"pending":false,"session":3},{"u":"src.ayy.eid.a","ids":["src.ayy.eid.a"],"text":"أعياد المسلمين: عيد الفطر وعيد الأضحى. قَالَ رسول الله ﷺ لمّا قدم المدينة ولهم يومان يلعبون فيهما: «ما هذان اليومان؟» قالوا: كنّا نلعب فيهما في الجاهليّة.","disp":"أعياد المسلمين: عيد الفطر وعيد الأضحى. قَالَ رسول الله صلى الله عليه وسلم لمّا قدم المدينة ولهم يومان يلعبون فيهما: «ما هذان اليومان؟» قالوا: كنّا نلعب فيهما في الجاهليّة.","kind":"B2_hadith_quote","lesson":"misc.ayyam","pos":30,"secs":14.79,"dens":0.04,"before":null,"after":null,"pending":false,"session":3},{"u":"src.ayy.eid.b","ids":["src.ayy.eid.b"],"text":"فقال ﷺ: «إنّ الله قد أبدلكم بهما خيرًا منهما: يوم الأضحى ويوم الفطر». وما سواهما من الأعياد فمن البدع. وأفضل الشهور: شهر رمضان. وأفضل الأيّام: يوم الجمعة.","disp":"فقال صلى الله عليه وسلم: «إنّ الله قد أبدلكم بهما خيرًا منهما: يوم الأضحى ويوم الفطر». وما سواهما من الأعياد فمن البدع. وأفضل الشهور: شهر رمضان. وأفضل الأيّام: يوم الجمعة.","kind":"B2_hadith_quote","lesson":"misc.ayyam","pos":30,"secs":14.68,"dens":0.03,"before":null,"after":null,"pending":false,"session":3},{"u":"src.taam.drink","ids":["src.taam.drink"],"text":"قال النبي ﷺ: «إذا شرب أحدُكم فلا يتنفّس في الإناء». وزجر ﷺ عن الشرب قائمًا. وكان ﷺ يتنفّس في الشراب ثلاثًا.","disp":"قال النبي صلى الله عليه وسلم: «إذا شرب أحدُكم فلا يتنفّس في الإناء». وزجر صلى الله عليه وسلم عن الشرب قائمًا. وكان صلى الله عليه وسلم يتنفّس في الشراب ثلاثًا.","kind":"B2_hadith_quote","lesson":"adab.taam","pos":31,"secs":13.46,"dens":0.07,"before":null,"after":null,"pending":false,"session":3},{"u":"src.aww.list","ids":["src.aww.list"],"text":"أوّل من آمن برسالته ﷺ: من الرجال أبو بكر الصدّيق، ومن النساء خديجة بنت خويلد، ومن الصبيان عليّ بن أبي طالب، ومن الموالي زيد بن حارثة، ومن الأرقّاء بلال الحبشيّ رضي الله عنهم وغيرهم.","disp":"أوّل من آمن برسالته صلى الله عليه وسلم: من الرجال أبو بكر الصدّيق، ومن النساء خديجة بنت خويلد، ومن الصبيان عليّ بن أبي طالب، ومن الموالي زيد بن حارثة، ومن الأرقّاء بلال الحبشيّ رضي الله عنهم وغيرهم.","kind":"B3_sacred_text","lesson":"seerah.awwalun","pos":32,"secs":17.13,"dens":0.04,"before":null,"after":null,"pending":false,"session":3},{"u":"src.man.list1","ids":["src.man.list1"],"text":"سبحان الله: التسبيح، وهو تنزيهه سُبْحَانَهُ وَتَعَالَى عن كل نقصٍ وعيبٍ وسوء. الحمد لله: هو الثناء على الله تَعَالَى، ووصفه بكل صفات الكمال.","disp":"سبحان الله: التسبيح، وهو تنزيهه سُبْحَانَهُ وَتَعَالَى عن كل نقصٍ وعيبٍ وسوء. الحمد لله: هو الثناء على الله تَعَالَى، ووصفه بكل صفات الكمال.","kind":"B3_sacred_text","lesson":"adhkar.maani","pos":33,"secs":11.24,"dens":0.14,"before":null,"after":null,"pending":false,"session":3},{"u":"src.man.list2","ids":["src.man.list2"],"text":"الله أكبر: أي إنّه سُبْحَانَهُ أكبر من كل شيء وأجلّ وأعظم وأعزّ من كل شيء. لا حول ولا قوّة إلا بالله: معناها لا تحوُّل للعبد من حالٍ إلى حال، ولا قوّة له على ذلك إلا بالله.","disp":"الله أكبر: أي إنّه سُبْحَانَهُ أكبر من كل شيء وأجلّ وأعظم وأعزّ من كل شيء. لا حول ولا قوّة إلا بالله: معناها لا تحوُّل للعبد من حالٍ إلى حال، ولا قوّة له على ذلك إلا بالله.","kind":"B3_sacred_text","lesson":"adhkar.maani","pos":33,"secs":13.57,"dens":0.11,"before":null,"after":null,"pending":false,"session":3},{"u":"src.asma.list","ids":["src.asma.list"],"text":"من أسماء الله تَعَالَى وصفاته: اللهُ، والربّ، والرحمن، والسميع، والبصير، والعليم، والرزّاق، والحيّ، والعظيم، والحكيم… إلى غير ذلك من الأسماء الحسنى والصفات العُلى.","disp":"من أسماء الله تَعَالَى وصفاته: اللهُ، والربّ، والرحمن، والسميع، والبصير، والعليم، والرزّاق، والحيّ، والعظيم، والحكيم… إلى غير ذلك من الأسماء الحسنى والصفات العُلى.","kind":"B3_sacred_text","lesson":"aqeedah.asma","pos":34,"secs":13.79,"dens":0.07,"before":null,"after":null,"pending":false,"session":3},{"u":"rev.mal.1","ids":["rev.mal.1"],"text":"خلقهم الله من نور. قال النبي صلى الله عليه وسلم: خُلقت الملائكة من نور.","disp":"خلقهم الله من نور. قال النبي صلى الله عليه وسلم: خُلقت الملائكة من نور.","kind":"B2_hadith_quote","lesson":"aqeedah.malaikah","pos":35,"secs":6.35,"dens":0.02,"before":null,"after":null,"pending":false,"session":3},{"u":"src.mal.ayah~1","ids":["src.mal.ayah"],"text":"الإيمان بالملائكة: وهي مخلوقاتٌ خلقها الله من نور، لعبادته وللانقياد التامّ لأمره. قال تَعَالَى:","disp":"الإيمان بالملائكة: وهي مخلوقاتٌ خلقها الله من نور، لعبادته وللانقياد التامّ لأمره. قال تَعَالَى:","kind":"B4_mixed_ayah","lesson":"aqeedah.malaikah","pos":35,"secs":8.57,"dens":0.07,"before":null,"after":{"ayah":"﴿بَلْ عِبَادٌ مُّكْرَمُونَ ٢٦ لَا يَسْبِقُونَهُ بِالْقَوْلِ وَهُم بِأَمْرِهِ يَعْمَلُونَ ٢٧﴾","ref":"الأنبياء: ٢٦–٢٧"},"pending":false,"session":3},{"u":"src.wal.ayah~1","ids":["src.wal.ayah","src.ras.ayat","src.mar.q","src.zal.dharrah","src.qad.ayah.s1","src.mur.ayah"],"text":"قال تعالى:","disp":"قال تعالى:","kind":"B4_mixed_ayah","lesson":"adab.walidayn","pos":36,"secs":1.24,"dens":0.0,"before":null,"after":{"multi":true},"pending":false,"session":3},{"u":"src.wal.hadith","ids":["src.wal.hadith"],"text":"جاء رجلٌ إلى النبي ﷺ يستأذنه في الجهاد، فقال: «ألكَ والدانِ؟» قال: نعم. قال: «فَفِيهِمَا فجاهِدْ».","disp":"جاء رجلٌ إلى النبي صلى الله عليه وسلم يستأذنه في الجهاد، فقال: «ألكَ والدانِ؟» قال: نعم. قال: «فَفِيهِمَا فجاهِدْ».","kind":"B2_hadith_quote","lesson":"adab.walidayn","pos":36,"secs":8.91,"dens":0.15,"before":null,"after":null,"pending":false,"session":3},{"u":"end.adab.tareeq","ids":["end.adab.tareeq"],"text":"تعلّمتَ اليوم: للطريق حقّ: غضّ البصر، وكفّ الأذى، وردّ السلام، والأمر بالمعروف، وإماطة الأذى صدقة.","disp":"تعلّمتَ اليوم: للطريق حقّ: غضّ البصر، وكفّ الأذى، وردّ السلام، والأمر بالمعروف، وإماطة الأذى صدقة.","kind":"B2_hadith_quote","lesson":"adab.tareeq","pos":37,"secs":8.24,"dens":0.08,"before":null,"after":null,"pending":false,"session":3},{"u":"src.tar.hadith","ids":["src.tar.hadith"],"text":"قال النبي ﷺ: «فأعطوا الطريقَ حقَّها». قالوا: وما حقّ الطريق؟ قال: «غضّ البصر، وكفّ الأذى، وردّ السلام، وأمرٌ بالمعروف، ونهيٌ عن المنكر».","disp":"قال النبي صلى الله عليه وسلم: «فأعطوا الطريقَ حقَّها». قالوا: وما حقّ الطريق؟ قال: «غضّ البصر، وكفّ الأذى، وردّ السلام، وأمرٌ بالمعروف، ونهيٌ عن المنكر».","kind":"B2_hadith_quote","lesson":"adab.tareeq","pos":37,"secs":12.13,"dens":0.1,"before":null,"after":null,"pending":false,"session":3},{"u":"src.tar.sadaqa","ids":["src.tar.sadaqa"],"text":"وفي الحديث: «ويُميطُ الأذى عن الطريق صدقة».","disp":"وفي الحديث: «ويُميطُ الأذى عن الطريق صدقة».","kind":"B2_hadith_quote","lesson":"adab.tareeq","pos":37,"secs":3.79,"dens":0.06,"before":null,"after":null,"pending":false,"session":3},{"u":"end.adhkar.souq","ids":["end.adhkar.souq"],"text":"تعلّمتَ اليوم: دعاء السوق لا إله إلا الله وحده لا شريك له، ودعاء الريح اللهم إنّي أسألك خيرها وأعوذ بك من شرّها، وإذا تعثّر المركوب تقول بسم الله.","disp":"تعلّمتَ اليوم: دعاء السوق لا إله إلا الله وحده لا شريك له، ودعاء الريح اللهم إنّي أسألك خيرها وأعوذ بك من شرّها، وإذا تعثّر المركوب تقول بسم الله.","kind":"B2_hadith_quote","lesson":"adhkar.souq","pos":38,"secs":12.57,"dens":0.05,"before":null,"after":null,"pending":false,"session":3},{"u":"rev.souq.1b","ids":["rev.souq.1b"],"text":"تقول: لا إله إلا الله وحده لا شريك له، له الملك وله الحمد…","disp":"تقول: لا إله إلا الله وحده لا شريك له، له الملك وله الحمد…","kind":"B2_hadith_quote","lesson":"adhkar.souq","pos":38,"secs":5.13,"dens":0.0,"before":null,"after":null,"pending":false,"session":3},{"u":"rev.souq.2","ids":["rev.souq.2"],"text":"تقول: اللهم إنّي أسألك خيرها، وأعوذ بك من شرّها.","disp":"تقول: اللهم إنّي أسألك خيرها، وأعوذ بك من شرّها.","kind":"B2_hadith_quote","lesson":"adhkar.souq","pos":38,"secs":4.24,"dens":0.06,"before":null,"after":null,"pending":false,"session":3},{"u":"src.souq.dua","ids":["src.souq.dua"],"text":"دعاء دخول السوق: «لا إله إلا الله وحده لا شريك له، له الملك وله الحمد، يحيي ويميت، وهو حيٌّ لا يموت، بيده الخير، وهو على كل شيء قدير».","disp":"دعاء دخول السوق: «لا إله إلا الله وحده لا شريك له، له الملك وله الحمد، يحيي ويميت، وهو حيٌّ لا يموت، بيده الخير، وهو على كل شيء قدير».","kind":"B2_hadith_quote","lesson":"adhkar.souq","pos":38,"secs":11.02,"dens":0.02,"before":null,"after":null,"pending":false,"session":3},{"u":"src.souq.wind","ids":["src.souq.wind"],"text":"ودعاء الريح: «اللهم إنّي أسألك خيرها وأعوذ بك من شرّها». والدعاء إذا تعثّر المركوب: «بسم الله».","disp":"ودعاء الريح: «اللهم إنّي أسألك خيرها وأعوذ بك من شرّها». والدعاء إذا تعثّر المركوب: «بسم الله».","kind":"B2_hadith_quote","lesson":"adhkar.souq","pos":38,"secs":8.02,"dens":0.04,"before":null,"after":null,"pending":false,"session":3},{"u":"src.jar.hadith","ids":["src.jar.hadith"],"text":"قال رسول الله ﷺ: «يا أبا ذر: إذا طبختَ مرقةً فأكثِر ماءَها وتعاهَدْ جيرانَك».","disp":"قال رسول الله صلى الله عليه وسلم: «يا أبا ذر: إذا طبختَ مرقةً فأكثِر ماءَها وتعاهَدْ جيرانَك».","kind":"B2_hadith_quote","lesson":"adab.jar","pos":39,"secs":7.68,"dens":0.14,"before":null,"after":null,"pending":false,"session":3},{"u":"src.jar.warn","ids":["src.jar.warn"],"text":"وقال النبي ﷺ: «من كان يؤمن بالله واليوم الآخر فلا يؤذي جارَه».","disp":"وقال النبي صلى الله عليه وسلم: «من كان يؤمن بالله واليوم الآخر فلا يؤذي جارَه».","kind":"B2_hadith_quote","lesson":"adab.jar","pos":39,"secs":7.02,"dens":0.02,"before":null,"after":null,"pending":false,"session":3},{"u":"tad.adab.jar","ids":["tad.adab.jar"],"text":"قال النبي ﷺ: من كان يؤمن بالله واليوم الآخر فلا يؤذي جاره.","disp":"قال النبي صلى الله عليه وسلم: من كان يؤمن بالله واليوم الآخر فلا يؤذي جاره.","kind":"B2_hadith_quote","lesson":"adab.jar","pos":39,"secs":6.91,"dens":0.0,"before":null,"after":null,"pending":false,"session":3},{"u":"src.taj.ayah~1","ids":["src.taj.ayah"],"text":"التجسّس: هو الكشف والبحث عن عورات الناس وما يسترونه. ومن صوره المحرّمة: الاطّلاع على عورات الناس في البيوت، واستماع المرء إلى حديث قومٍ بدون علمهم. قال تَعَالَى:","disp":"التجسّس: هو الكشف والبحث عن عورات الناس وما يسترونه. ومن صوره المحرّمة: الاطّلاع على عورات الناس في البيوت، واستماع المرء إلى حديث قومٍ بدون علمهم. قال تَعَالَى:","kind":"B4_mixed_ayah","lesson":"akhlaq.tajassus","pos":40,"secs":13.91,"dens":0.06,"before":null,"after":{"ayah":"﴿وَلَا تَجَسَّسُوا﴾","ref":"الحجرات: ١٢"},"pending":false,"session":3},{"u":"src.sidq.hadith","ids":["src.sidq.hadith"],"text":"قال النبي ﷺ: «إنَّ الصِّدقَ يَهْدي إلى البِرِّ، وإنَّ البِرَّ يَهْدي إلى الجنَّةِ، وإنَّ الرَّجلَ لَيَصْدُقُ حتَّى يكونَ صِدِّيقًا».","disp":"قال النبي صلى الله عليه وسلم: «إنَّ الصِّدقَ يَهْدي إلى البِرِّ، وإنَّ البِرَّ يَهْدي إلى الجنَّةِ، وإنَّ الرَّجلَ لَيَصْدُقُ حتَّى يكونَ صِدِّيقًا».","kind":"B2_hadith_quote","lesson":"akhlaq.sidq","pos":41,"secs":9.79,"dens":0.53,"before":null,"after":null,"pending":false,"session":3},{"u":"end.akhlaq.ghish","ids":["end.akhlaq.ghish"],"text":"تعلّمتَ اليوم: الغشّ ومنه إخفاء عيب السلعة، وقال النبي صلى الله عليه وسلم: من غشّ فليس منّي.","disp":"تعلّمتَ اليوم: الغشّ ومنه إخفاء عيب السلعة، وقال النبي صلى الله عليه وسلم: من غشّ فليس منّي.","kind":"B2_hadith_quote","lesson":"akhlaq.ghish","pos":42,"secs":7.79,"dens":0.07,"before":null,"after":null,"pending":false,"session":3},{"u":"st.ghi.4","ids":["st.ghi.4"],"text":"قال: أفلا جعلتَه فوق الطعام كي يراه الناس؟ من غشّ فليس منّي.","disp":"قال: أفلا جعلتَه فوق الطعام كي يراه الناس؟ من غشّ فليس منّي.","kind":"B2_hadith_quote","lesson":"akhlaq.ghish","pos":42,"secs":5.13,"dens":0.07,"before":null,"after":null,"pending":false,"session":3},{"u":"src.ghi.hadith","ids":["src.ghi.hadith"],"text":"عن أبي هريرة رضي الله عنه، أنّ رسول الله ﷺ مرّ على صُبرة طعام، فأدخل يده فيها، فنالت أصابعه بللًا، فقال: «ما هذا يا صاحب الطعام؟» قال: أصابته السماء يا رسول الله. قال: «أفلا جعلتَه فوق الطعام كي يراه الناس؟ من غشّ فليس منّي».","disp":"عن أبي هريرة رضي الله عنه، أنّ رسول الله صلى الله عليه وسلم مرّ على صُبرة طعام، فأدخل يده فيها، فنالت أصابعه بللًا، فقال: «ما هذا يا صاحب الطعام؟» قال: أصابته السماء يا رسول الله. قال: «أفلا جعلتَه فوق الطعام كي يراه الناس؟ من غشّ فليس منّي».","kind":"B2_hadith_quote","lesson":"akhlaq.ghish","pos":42,"secs":19.68,"dens":0.04,"before":null,"after":null,"pending":false,"session":3},{"u":"src.kib.def","ids":["src.kib.def"],"text":"التواضع: أن لا يرى الإنسان نفسه على الناس، فلا يستحقر الناس ولا يرفض الحقّ.","disp":"التواضع: أن لا يرى الإنسان نفسه على الناس، فلا يستحقر الناس ولا يرفض الحقّ.","kind":"B3_sacred_text","lesson":"akhlaq.kibr","pos":43,"secs":6.79,"dens":0.02,"before":null,"after":null,"pending":false,"session":3},{"u":"src.kib.q","ids":["src.kib.q"],"text":"قال رسول الله ﷺ: «لا يدخل الجنّة من كان في قلبه مثقال ذرّةٍ من كِبر». فقال رجل: إنّ الرجل يحبّ أن يكون ثوبه حسنًا ونعله حسنة؟ قال: «إنّ الله جميلٌ يحبّ الجمال، الكِبر: بَطَرُ الحقّ وغَمْطُ الناس».","disp":"قال رسول الله صلى الله عليه وسلم: «لا يدخل الجنّة من كان في قلبه مثقال ذرّةٍ من كِبر». فقال رجل: إنّ الرجل يحبّ أن يكون ثوبه حسنًا ونعله حسنة؟ قال: «إنّ الله جميلٌ يحبّ الجمال، الكِبر: بَطَرُ الحقّ وغَمْطُ الناس».","kind":"B2_hadith_quote","lesson":"akhlaq.kibr","pos":43,"secs":16.35,"dens":0.14,"before":null,"after":null,"pending":false,"session":3},{"u":"src.haya.ghayb~1","ids":["src.haya.ghayb","src.mur.ghayb"],"text":"لا يعلم الغيب إلا الله وحده. قال تَعَالَى:","disp":"لا يعلم الغيب إلا الله وحده. قال تَعَالَى:","kind":"B4_mixed_ayah","lesson":"akhlaq.haya","pos":44,"secs":3.68,"dens":0.1,"before":null,"after":{"ayah":"﴿قُل لَّا يَعْلَمُ مَن فِي السَّمَاوَاتِ وَالْأَرْضِ الْغَيْبَ إِلَّا اللَّهُ﴾","ref":"النمل: ٦٥"},"pending":false,"session":3},{"u":"end.adhkar.mubtala","ids":["end.adhkar.mubtala"],"text":"تعلّمتَ اليوم: إذا رأيتَ مبتلًى قلتَ الحمد لله الذي عافاني ممّا ابتلاك به وفضّلني على كثيرٍ ممّن خلق تفضيلًا، وتقولها في نفسك.","disp":"تعلّمتَ اليوم: إذا رأيتَ مبتلًى قلتَ الحمد لله الذي عافاني ممّا ابتلاك به وفضّلني على كثيرٍ ممّن خلق تفضيلًا، وتقولها في نفسك.","kind":"B2_hadith_quote","lesson":"adhkar.mubtala","pos":45,"secs":10.57,"dens":0.11,"before":null,"after":null,"pending":false,"session":3},{"u":"src.mub.dua","ids":["src.mub.dua"],"text":"الدعاء إذا رأيت مبتلًى: «الحمد لله الذي عافاني ممّا ابتلاك به، وفضّلني على كثيرٍ ممّن خلق تفضيلًا».","disp":"الدعاء إذا رأيت مبتلًى: «الحمد لله الذي عافاني ممّا ابتلاك به، وفضّلني على كثيرٍ ممّن خلق تفضيلًا».","kind":"B2_hadith_quote","lesson":"adhkar.mubtala","pos":45,"secs":8.35,"dens":0.08,"before":null,"after":null,"pending":false,"session":4},{"u":"end.aqeedah.tawakkul","ids":["end.aqeedah.tawakkul"],"text":"تعلّمتَ اليوم: التوكّل هو الاعتماد على الله في جلب المنافع ودفع المضارّ مع الأخذ بالأسباب، ومن يتوكّل على الله فهو حسبه.","disp":"تعلّمتَ اليوم: التوكّل هو الاعتماد على الله في جلب المنافع ودفع المضارّ مع الأخذ بالأسباب، ومن يتوكّل على الله فهو حسبه.","kind":"B5_pending_embedded_ayah","lesson":"aqeedah.tawakkul","pos":46,"secs":10.57,"dens":0.05,"before":null,"after":null,"pending":true,"session":0},{"u":"src.tw.def~1","ids":["src.tw.def"],"text":"التوكّل على الله تَعَالَى: هو الاعتماد على الله تَعَالَى في جلب المنافع ودفع المضارّ، مع الأخذ بالأسباب. قال تَعَالَى:","disp":"التوكّل على الله تَعَالَى: هو الاعتماد على الله تَعَالَى في جلب المنافع ودفع المضارّ، مع الأخذ بالأسباب. قال تَعَالَى:","kind":"B4_mixed_ayah","lesson":"aqeedah.tawakkul","pos":46,"secs":9.79,"dens":0.13,"before":null,"after":{"ayah":"﴿وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ﴾","ref":"الطلاق: ٣"},"pending":false,"session":4},{"u":"end.hadith.kanz","ids":["end.hadith.kanz"],"text":"تعلّمتَ اليوم: لا حول ولا قوّة إلا بالله كنزٌ من كنوز الجنّة، وفيها تبرّؤ العبد من حوله وقوّته، واعتماده على الله وحده.","disp":"تعلّمتَ اليوم: لا حول ولا قوّة إلا بالله كنزٌ من كنوز الجنّة، وفيها تبرّؤ العبد من حوله وقوّته، واعتماده على الله وحده.","kind":"B2_hadith_quote","lesson":"hadith.kanz","pos":47,"secs":10.02,"dens":0.08,"before":null,"after":null,"pending":false,"session":4},{"u":"src.kanz.hadith","ids":["src.kanz.hadith"],"text":"عن أبي موسى رضي الله عنه قال: قال رسول الله ﷺ: «لا حولَ ولا قوّةَ إلا بالله كنزٌ من كنوز الجنّة».","disp":"عن أبي م  الله وبركاتُه، السلامُ علينا وعلى عباد الله الصالحين، أشهدُ أن لا إله إلا الله، وأشهدُ أنّ محمدًا عبدُه ورسولُه»،","kind":"B2_hadith_quote","lesson":"ibadah.tashahhud","pos":54,"secs":15.02,"dens":0.13,"before":null,"after":null,"pending":false,"session":4},{"u":"say.tash.1","ids":["say.tash.1"],"text":"التحيّات لله والصلوات والطيّبات","disp":"التحيّات لله والصلوات والطيّبات","kind":"B1_dhikr_dua","lesson":"ibadah.tashahhud","pos":54,"secs":3.24,"dens":0.08,"before":null,"after":null,"pending":false,"session":4},{"u":"say.tash.2","ids":["say.tash.2"],"text":"السلام عليك أيّها النبيّ ورحمة الله وبركاته","disp":"السلام عليك أيّها النبيّ ورحمة الله وبركاته","kind":"B1_dhikr_dua","lesson":"ibadah.tashahhud","pos":54,"secs":4.24,"dens":0.06,"before":null,"after":null,"pending":false,"session":4},{"u":"say.tash.3","ids":["say.tash.3"],"text":"السلام علينا وعلى عباد الله الصالحين","disp":"السلام علينا وعلى عباد الله الصالحين","kind":"B1_dhikr_dua","lesson":"ibadah.tashahhud","pos":54,"secs":3.79,"dens":0.0,"before":null,"after":null,"pending":false,"session":4},{"u":"say.tash.4","ids":["say.tash.4"],"text":"أشهد أن لا إله إلا الله، وأشهد أنّ محمدًا عبده ورسوله","disp":"أشهد أن لا إله إلا الله، وأشهد أنّ محمدًا عبده ورسوله","kind":"B1_dhikr_dua","lesson":"ibadah.tashahhud","pos":54,"secs":4.79,"dens":0.05,"before":null,"after":null,"pending":false,"session":4},{"u":"src.tash.full.b","ids":["src.tash.full.b"],"text":"ثم يُصلّي على النبي ﷺ، ثم يقول: «أعوذ بالله من عذاب جهنّم، ومن عذاب القبر، ومن فتنة المحيا والممات، ومن فتنة المسيح الدجّال»، ثم يدعو ربّه بما أحبّ من خيري الدنيا والآخرة.","disp":"ثم يُصلّي على النبي صلى الله عليه وسلم، ثم يقول: «أعوذ بالله من عذاب جهنّم، ومن عذاب القبر، ومن فتنة المحيا والممات، ومن فتنة المسيح الدجّال»، ثم يدعو ربّه بما أحبّ من خيري الدنيا والآخرة.","kind":"B2_hadith_quote","lesson":"ibadah.tashahhud","pos":54,"secs":15.79,"dens":0.05,"before":null,"after":null,"pending":false,"session":4},{"u":"rev.tash.1","ids":["rev.tash.1"],"text":"أعوذ بالله من عذاب جهنّم.","disp":"أعوذ بالله من عذاب جهنّم.","kind":"B1_dhikr_dua","lesson":"ibadah.tashahhud","pos":54,"secs":2.46,"dens":0.05,"before":null,"after":null,"pending":false,"session":4},{"u":"src.raw.fadl","ids":["src.raw.fadl"],"text":"السنن الرواتب: هي ثنتا عشرة ركعة في اليوم والليلة، من صلّاها بُني له بيتٌ في الجنّة. والعمرة: التعبّد لله تَعَالَى بالطواف بالبيت والسعي بين الصفا والمروة، وأركانها: الإحرام، والطواف، والسعي.","disp":"السنن الرواتب: هي ثنتا عشرة ركعة في اليوم والليلة، من صلّاها بُني له بيتٌ في الجنّة. والعمرة: التعبّد لله تَعَالَى بالطواف بالبيت والسعي بين الصفا والمروة، وأركانها: الإحرام، والطواف، والسعي.","kind":"B3_sacred_text","lesson":"ibadah.rawatib","pos":55,"secs":16.46,"dens":0.06,"before":null,"after":null,"pending":false,"session":4},{"u":"src.zak.ayah~1","ids":["src.zak.ayah"],"text":"الزكاة: حقٌّ واجب في مالٍ خاصّ لطائفةٍ مخصوصة في وقتٍ مخصوص، وهي ركنٌ من أركان الإسلام. قال تَعَالَى:","disp":"الزكاة: حقٌّ واجب في مالٍ خاصّ لطائفةٍ مخصوصة في وقتٍ مخصوص، وهي ركنٌ من أركان الإسلام. قال تَعَالَى:","kind":"B4_mixed_ayah","lesson":"ibadah.zakat","pos":56,"secs":8.13,"dens":0.14,"before":null,"after":{"ayah":"﴿وَآتُوا الزَّكَاةَ﴾","ref":"البقرة: ٤٣"},"pending":false,"session":4},{"u":"src.zak.ayah~2","ids":["src.zak.ayah"],"text":"والصدقة المستحبّة: التصدّق بأيّ شيء في وجوه الخير في أيّ وقت. قال تَعَالَى:","disp":"والصدقة المستحبّة: التصدّق بأيّ شيء في وجوه الخير في أيّ وقت. قال تَعَالَى:","kind":"B4_mixed_ayah","lesson":"ibadah.zakat","pos":56,"secs":6.24,"dens":0.13,"before":{"ayah":"﴿وَآتُوا الزَّكَاةَ﴾","ref":"البقرة: ٤٣"},"after":{"ayah":"﴿وَأَنفِقُوا فِي سَبِيلِ اللَّهِ﴾","ref":"البقرة: ١٩٥"},"pending":false,"session":4},{"u":"src.sawm.sunan","ids":["src.sawm.sunan"],"text":"من سنن الصيام: تعجيل الفطر، والسحور وتأخيره، والزيادة في أعمال الخير والعبادة، وقول الصائم إذا شُتم: «إنّي صائم»، والدعاء عند الفطر، والفطر على رطبٍ أو تمر فإن لم يجد فعلى ماء.","disp":"من سنن الصيام: تعجيل الفطر، والسحور وتأخيره، والزيادة في أعمال الخير والعبادة، وقول الصائم إذا شُتم: «إنّي صائم»، والدعاء عند الفطر، والفطر على رطبٍ أو تمر فإن لم يجد فعلى ماء.","kind":"B2_hadith_quote","lesson":"ibadah.sawm","pos":57,"secs":15.13,"dens":0.02,"before":null,"after":null,"pending":false,"session":4},{"u":"src.sawm.fadl","ids":["src.sawm.fadl"],"text":"عن أبي سعيد الخدري رضي الله عنه قال: قال رسول الله ﷺ: «ما من عبدٍ يصوم يومًا في سبيل الله، إلا باعد الله بذلك اليوم وجهه عن النار سبعين خريفًا». ومعنى «سبعين خريفًا» أي: سبعين سنة.","disp":"عن أبي سعيد الخدري رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «ما من عبدٍ يصوم يومًا في سبيل الله، إلا باعد الله بذلك اليوم وجهه عن النار سبعين خريفًا». ومعنى «سبعين خريفًا» أي: سبعين سنة.","kind":"B2_hadith_quote","lesson":"ibadah.sawm","pos":57,"secs":16.46,"dens":0.03,"before":null,"after":null,"pending":false,"session":4},{"u":"taf.feel.1","ids":["taf.feel.1"],"text":"ألم تعلم كيف فعل ربّك بأصحاب الفيل حين أرادوا هدم الكعبة؟","disp":"ألم تعلم كيف فعل ربّك بأصحاب الفيل حين أرادوا هدم الكعبة؟","kind":"B5_pending_embedded_ayah","lesson":"quran.feel","pos":58,"secs":5.35,"dens":0.02,"before":null,"after":null,"pending":true,"session":0},{"u":"src.feel.full","ids":["src.feel.full"],"text":"سورة الفيل: أراد أصحاب الفيل هدم الكعبة، فجعل الله تدبيرهم في ضياع، وأرسل عليهم طيرًا جماعاتٍ ترميهم بحجارةٍ من طينٍ متحجّر، فجعلهم كورق زرعٍ أكلته الدوابّ وداسته.","disp":"سورة الفيل: أراد أصحاب الفيل هدم الكعبة، فجعل الله تدبيرهم في ضياع، وأرسل عليهم طيرًا جماعاتٍ ترميهم بحجارةٍ من طينٍ متحجّر، فجعلهم كورق زرعٍ أكلته الدوابّ وداسته.","kind":"B3_sacred_text","lesson":"quran.feel","pos":58,"secs":14.24,"dens":0.06,"before":null,"after":null,"pending":false,"session":4},{"u":"src.yat.full.s1","ids":["src.yat.full.s1"],"text":"وُلد ﷺ في عام الفيل، في يوم الإثنين من شهر ربيع الأوّل، في مكّة. تُوفّي أبوه في المدينة وهو حملٌ في بطن أمّه. ومن مرضعاته حليمة السعديّة.","disp":"وُلد صلى الله عليه وسلم في عام الفيل، في يوم الإثنين من شهر ربيع الأوّل، في مكّة. تُوفّي أبوه في المدينة وهو حملٌ في بطن أمّه. ومن مرضعاته حليمة السعديّة.","kind":"B3_sacred_text","lesson":"seerah.yateem","pos":59,"secs":12.79,"dens":0.08,"before":null,"after":null,"pending":false,"session":4},{"u":"src.yat.full.s2","ids":["src.yat.full.s2"],"text":"توفّيت أمّه وهو ابن ست سنين، وكفله جدّه عبد المطلب. ثم توفّي جدّه وهو ابن ثمان سنين، وكفله عمّه أبو طالب.","disp":"توفّيت أمّه وهو ابن ست سنين، وكفله جدّه عبد المطلب. ثم توفّي جدّه وهو ابن ثمان سنين، وكفله عمّه أبو طالب.","kind":"B3_sacred_text","lesson":"seerah.yateem","pos":59,"secs":8.68,"dens":0.08,"before":null,"after":null,"pending":false,"session":4},{"u":"end.seerah.wahy","ids":["end.seerah.wahy"],"text":"تعلّمتَ اليوم: كان يتعبّد في غار حراء، وأوّل ما بدأ به الوحي الرؤيا الصادقة، ونزل عليه وعمره أربعون سنة، وأوّل ما نزل: اقرأ باسم ربّك الذي خلق.","disp":"تعلّمتَ اليوم: كان يتعبّد في غار حراء، وأوّل ما بدأ به الوحي الرؤيا الصادقة، ونزل عليه وعمره أربعون سنة، وأوّل ما نزل: اقرأ باسم ربّك الذي خلق.","kind":"B5_pending_embedded_ayah","lesson":"seerah.wahy","pos":60,"secs":12.02,"dens":0.06,"before":null,"after":null,"pending":true,"session":0},{"u":"st.wahy.4","ids":["st.wahy.4"],"text":"فكان أوّل ما نزل عليه: اقرأ باسم ربّك الذي خلق.","disp":"فكان أوّل ما نزل عليه: اقرأ باسم ربّك الذي خلق.","kind":"B5_pending_embedded_ayah","lesson":"seerah.wahy","pos":60,"secs":4.13,"dens":0.06,"before":null,"after":null,"pending":true,"session":0},{"u":"src.wahy.iqra~1","ids":["src.wahy.iqra"],"text":"أوّل ما نزل عليه من القرآن قوله تَعَالَى:","disp":"أوّل ما نزل عليه من القرآن قوله تَعَالَى:","kind":"B4_mixed_ayah","lesson":"seerah.wahy","pos":60,"secs":3.57,"dens":0.14,"before":null,"after":{"ayah":"﴿اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ ١ خَلَقَ الْإِنسَانَ مِنْ عَلَقٍ ٢ اقْرَأْ وَرَبُّكَ الْأَكْرَمُ ٣ الَّذِي عَلَّمَ بِالْقَلَمِ ٤ عَلَّمَ الْإِنسَانَ مَا لَمْ يَعْلَمْ ٥﴾","ref":"العلق: ١–٥"},"pending":false,"session":4},{"u":"src.hij.full.s1","ids":["src.hij.full.s1"],"text":"بقي ﷺ في مكّة يدعو ثلاث عشرة سنة، وكان يدعو أهل الطائف ويعرض نفسه في المواسم ومجامع الناس، حتى جاء أهل المدينة من الأنصار فآمنوا به وبايعوه على نصرته.","disp":"بقي صلى الله عليه وسلم في مكّة يدعو ثلاث عشرة سنة، وكان يدعو أهل الطائف ويعرض نفسه في المواسم ومجامع الناس، حتى جاء أهل المدينة من الأنصار فآمنوا به وبايعوه على نصرته.","kind":"B3_sacred_text","lesson":"seerah.hijrah","pos":61,"secs":15.02,"dens":0.01,"before":null,"after":null,"pending":false,"session":4},{"u":"src.hij.full.s2","ids":["src.hij.full.s2"],"text":"ثم هاجر من مكّة إلى المدينة، وبقي فيها عشر سنين، وفُرض عليه فيها الزكاة والصيام والحجّ والجهاد والأذان وغيرها من شرائع الإسلام.","disp":"ثم هاجر من مكّة إلى المدينة، وبقي فيها عشر سنين، وفُرض عليه فيها الزكاة والصيام والحجّ والجهاد والأذان وغيرها من شرائع الإسلام.","kind":"B3_sacred_text","lesson":"seerah.hijrah","pos":61,"secs":11.46,"dens":0.03,"before":null,"after":null,"pending":false,"session":4},{"u":"src.ras.sunna","ids":["src.ras.sunna"],"text":"الأدب مع الرسول ﷺ: طاعته فيما أمر، وتصديقه فيما أخبر، وعدم معصيته، ولا يُعبد الله إلا بما شرع وهو الاقتداء بالسنّة وترك البدعة.","disp":"الأدب مع الرسول صلى الله عليه وسلم: طاعته فيما أمر، وتصديقه فيما أخبر، وعدم معصيته، ولا يُعبد الله إلا بما شرع وهو الاقتداء بالسنّة وترك البدعة.","kind":"B3_sacred_text","lesson":"adab.rasul","pos":62,"secs":12.79,"dens":0.02,"before":null,"after":null,"pending":false,"session":4},{"u":"src.ras.ayat~2","ids":["src.ras.ayat","src.izz.ayah"],"text":"وقال سبحانه:","disp":"وقال سبحانه:","kind":"B4_mixed_ayah","lesson":"adab.rasul","pos":62,"secs":1.46,"dens":0.0,"before":{"multi":true},"after":{"multi":true},"pending":false,"session":4},{"u":"out.ras.trust","ids":["out.ras.trust"],"text":"أحسنت، فهو لا ينطق عن الهوى، إن هو إلا وحيٌ يوحى.","disp":"أحسنت، فهو لا ينطق عن الهوى، إن هو إلا وحيٌ يوحى.","kind":"B5_pending_embedded_ayah","lesson":"adab.rasul","pos":62,"secs":4.24,"dens":0.03,"before":null,"after":null,"pending":true,"session":0},{"u":"src.sah.ayah~1","ids":["src.sah.ayah"],"text":"الصحابيّ: هو من لقي النبيَّ ﷺ مؤمنًا به، ومات على الإسلام. يجب أن نحبّهم ونقتديَ بهم، وهم خير الناس وأفضلهم بعد الأنبياء. قال تعالى:","disp":"الصحابيّ: هو من لقي النبيَّ صلى الله عليه وسلم مؤمنًا به، ومات على الإسلام. يجب أن نحبّهم ونقتديَ بهم، وهم خير الناس وأفضلهم بعد الأنبياء. قال تعالى:","kind":"B4_mixed_ayah","lesson":"seerah.sahabah","pos":63,"secs":12.68,"dens":0.06,"before":null,"after":{"ayah":"﴿وَالسَّابِقُونَ الْأَوَّلُونَ مِنَ الْمُهَاجِرِينَ وَالْأَنصَارِ وَالَّذِينَ اتَّبَعُوهُم بِإِحْسَانٍ رَّضِيَ اللَّهُ عَنْهُمْ وَرَضُوا عَنْهُ﴾","ref":"التوبة: ١٠٠"},"pending":false,"session":5},{"u":"out.sah.silent.v2","ids":["out.sah.silent.v2"],"text":"نحبّهم ونقتدي بهم، وقد رضي الله عنهم ورضوا عنه.","disp":"نحبّهم ونقتدي بهم، وقد رضي الله عنهم ورضوا عنه.","kind":"B5_pending_embedded_ayah","lesson":"seerah.sahabah","pos":63,"secs":4.35,"dens":0.03,"before":null,"after":null,"pending":true,"session":0},{"u":"end.aqeedah.iman","ids":["end.aqeedah.iman"],"text":"تعلّمتَ اليوم: الإيمان يزيد بالطاعة وينقص بالمعصية، والمؤمنون إذا ذُكر الله وجلت قلوبهم وإذا تُليت عليهم آياته زادتهم إيمانًا.","disp":"تعلّمتَ اليوم: الإيمان يزيد بالطاعة وينقص بالمعصية، والمؤمنون إذا ذُكر الله وجلت قلوبهم وإذا تُليت عليهم آياته زادتهم إيمانًا.","kind":"B5_pending_embedded_ayah","lesson":"aqeedah.iman","pos":64,"secs":11.46,"dens":0.05,"before":null,"after":null,"pending":true,"session":0},{"u":"rev.im.3","ids":["rev.im.3"],"text":"والمؤمنون إذا ذُكر الله وجلت قلوبهم، وإذا تُليت عليهم آياته زادتهم إيمانًا.","disp":"والمؤمنون إذا ذُكر الله وجلت قلوبهم، وإذا تُليت عليهم آياته زادتهم إيمانًا.","kind":"B5_pending_embedded_ayah","lesson":"aqeedah.iman","pos":64,"secs":6.91,"dens":0.05,"before":null,"after":null,"pending":true,"session":0},{"u":"src.im.ayah~1","ids":["src.im.ayah"],"text":"الإيمان يزيد بالطاعة وينقص بالمعصية. قال تَعَالَى:","disp":"الإيمان يزيد بالطاعة وينقص بالمعصية. قال تَعَالَى:","kind":"B4_mixed_ayah","lesson":"aqeedah.iman","pos":64,"secs":4.68,"dens":0.08,"before":null,"after":{"ayah":"﴿إِنَّمَا الْمُؤْمِنُونَ الَّذِينَ إِذَا ذُكِرَ اللَّهُ وَجِلَتْ قُلُوبُهُمْ وَإِذَا تُلِيَتْ عَلَيْهِمْ آيَاتُهُ زَادَتْهُمْ إِيمَانًا وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَ﴾","ref":"الأنفال: ٢"},"pending":false,"session":5},{"u":"src.taq.ayah~1","ids":["src.taq.ayah"],"text":"التقوى: هي فعل الطاعات وترك المعاصي. قال تعالى:","disp":"التقوى: هي فعل الطاعات وترك المعاصي. قال تعالى:","kind":"B4_mixed_ayah","lesson":"misc.taqwa","pos":65,"secs":4.46,"dens":0.0,"before":null,"after":{"ayah":"﴿وَاتَّقُوا اللَّهَ وَاعْلَمُوا أَنَّ اللَّهَ مَعَ الْمُتَّقِينَ﴾","ref":"البقرة: ١٩٤"},"pending":false,"session":5},{"u":"src.niyyah.hadith","ids":["src.niyyah.hadith"],"text":"عن عمر بن الخطاب رضي الله عنه قال: سمعت رسول الله ﷺ يقول: «إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى…».","disp":"عن عمر بن الخطاب رضي الله عنه قال: سمعت رسول الله صلى الله عليه وسلم يقول: «إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى…».","kind":"B2_hadith_quote","lesson":"hadith.niyyah","pos":66,"secs":10.57,"dens":0.0,"before":null,"after":null,"pending":false,"session":5},{"u":"src.mar.def","ids":["src.mar.def"],"text":"المعروف: هو الأمر بكل طاعةٍ لله عزّ وجلّ. والمنكر: هو النهي عن كل معصيةٍ لله عزّ وجلّ.","disp":"المعروف: هو الأمر بكل طاعةٍ لله عزّ وجلّ. والمنكر: هو النهي عن كل معصيةٍ لله عزّ وجلّ.","kind":"B3_sacred_text","lesson":"akhlaq.maroof","pos":67,"secs":7.02,"dens":0.1,"before":null,"after":null,"pending":false,"session":5},{"u":"end.hadith.mayaneeh","ids":["end.hadith.mayaneeh"],"text":"تعلّمتَ اليوم: من حُسن إسلام المرء تركُه ما لا يعنيه، من أمور دين غيره ودنياه، وذلك من كمال الإسلام.","disp":"تعلّمتَ اليوم: من حُسن إسلام المرء تركُه ما لا يعنيه، من أمور دين غيره ودنياه، وذلك من كمال الإسلام.","kind":"B2_hadith_quote","lesson":"hadith.mayaneeh","pos":68,"secs":8.57,"dens":0.05,"before":null,"after":null,"pending":false,"session":5},{"u":"src.may.hadith","ids":["src.may.hadith"],"text":"عن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ: «من حُسنِ إسلامِ المرءِ: تركُه ما لا يعنيه».","disp":"عن أبي هريرة رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «من حُسنِ إسلامِ المرءِ: تركُه ما لا يعنيه».","kind":"B2_hadith_quote","lesson":"hadith.mayaneeh","pos":68,"secs":8.91,"dens":0.08,"before":null,"after":null,"pending":false,"session":5},{"u":"src.bay.asl~1","ids":["src.bay.asl"],"text":"الأصل في كل البيوع والمعاملات أنها حلال، إلا بعض الأنواع ممّا حرّم الله تَعَالَى. قال تَعَالَى:","disp":"الأصل في كل البيوع والمعاملات أنها حلال، إلا بعض الأنواع ممّا حرّم الله تَعَالَى. قال تَعَالَى:","kind":"B4_mixed_ayah","lesson":"misc.bay","pos":69,"secs":8.02,"dens":0.12,"before":null,"after":{"ayah":"﴿وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا﴾","ref":"البقرة: ٢٧٥"},"pending":false,"session":5},{"u":"rev.bay.1","ids":["rev.bay.1"],"text":"الغشّ، ومنه: إخفاء عيب السلعة. قال النبي صلى الله عليه وسلم: من غشّ فليس منّي.","disp":"الغشّ، ومنه: إخفاء عيب السلعة. قال النبي صلى الله عليه وسلم: من غشّ فليس منّي.","kind":"B2_hadith_quote","lesson":"misc.bay","pos":69,"secs":6.57,"dens":0.05,"before":null,"after":null,"pending":false,"session":5},{"u":"out.bay.riba","ids":["out.bay.riba"],"text":"وهذه الزيادة هي الربا المحرّم. وأحلّ الله البيع وحرّم الربا.","disp":"وهذه الزيادة هي الربا المحرّم. وأحلّ الله البيع وحرّم الربا.","kind":"B5_pending_embedded_ayah","lesson":"misc.bay","pos":69,"secs":5.46,"dens":0.07,"before":null,"after":null,"pending":true,"session":0},{"u":"end.ibadah.khushu","ids":["end.ibadah.khushu"],"text":"تعلّمتَ اليوم: الخشوع حضور القلب وسكون الجوارح، وصلاة الجماعة أفضل من صلاة الفذّ بسبعٍ وعشرين درجة.","disp":"تعلّمتَ اليوم: الخشوع حضور القلب وسكون الجوارح، وصلاة الجماعة أفضل من صلاة الفذّ بسبعٍ وعشرين درجة.","kind":"B2_hadith_quote","lesson":"ibadah.khushu","pos":70,"secs":8.91,"dens":0.05,"before":null,"after":null,"pending":false,"session":5},{"u":"src.khu.ayah~1","ids":["src.khu.ayah"],"text":"الخشوع في الصلاة: هو حضور القلب وسكون الجوارح فيها. قال تَعَالَى:","disp":"الخشوع في الصلاة: هو حضور القلب وسكون الجوارح فيها. قال تَعَالَى:","kind":"B4_mixed_ayah","lesson":"ibadah.khushu","pos":70,"secs":5.79,"dens":0.06,"before":null,"after":{"ayah":"﴿قَدْ أَفْلَحَ الْمُؤْمِنُونَ ١ الَّذِينَ هُمْ فِي صَلَاتِهِمْ خَاشِعُونَ ٢﴾","ref":"المؤمنون: ١–٢"},"pending":false,"session":5},{"u":"n.khu.jamaah","ids":["n.khu.jamaah"],"text":"وصلاة الجماعة أفضل من صلاة الفذّ بسبعٍ وعشرين درجة.","disp":"وصلاة الجماعة أفضل من صلاة الفذّ بسبعٍ وعشرين درجة.","kind":"B2_hadith_quote","lesson":"ibadah.khushu","pos":70,"secs":4.79,"dens":0.05,"before":null,"after":null,"pending":false,"session":5},{"u":"src.khu.jamaah","ids":["src.khu.jamaah"],"text":"عن عبد الله بن عمر رضي الله عنهما، أن رسول الله ﷺ قال: «صلاةُ الجماعةِ أفضلُ من صلاةِ الفذِّ بسبعٍ وعشرين درجة».","disp":"عن عبد الله بن عمر رضي الله عنهما، أن رسول الله صلى الله عليه وسلم قال: «صلاةُ الجماعةِ أفضلُ من صلاةِ الفذِّ بسبعٍ وعشرين درجة».","kind":"B2_hadith_quote","lesson":"ibadah.khushu","pos":70,"secs":10.68,"dens":0.09,"before":null,"after":null,"pending":false,"session":5},{"u":"rev.tark.3","ids":["rev.tark.3"],"text":"قال صلى الله عليه وسلم: من ترك ثلاث جُمَعٍ تهاونًا بها، طبع الله على قلبه.","disp":"قال صلى الله عليه وسلم: من ترك ثلاث جُمَعٍ تهاونًا بها، طبع الله على قلبه.","kind":"B2_hadith_quote","lesson":"ibadah.tark","pos":71,"secs":6.24,"dens":0.08,"before":null,"after":null,"pending":false,"session":5},{"u":"src.tark.hadith","ids":["src.tark.hadith"],"text":"لا يجوز التخلّف عن صلاة الجمعة إلا من عذرٍ شرعي. وجاء عن النبي ﷺ قوله: «من ترك ثلاث جُمَعٍ تهاونًا بها؛ طبع الله على قلبه».","disp":"لا يجوز التخلّف عن صلاة الجمعة إلا من عذرٍ شرعي. وجاء عن النبي صلى الله عليه وسلم قوله: «من ترك ثلاث جُمَعٍ تهاونًا بها؛ طبع الله على قلبه».","kind":"B2_hadith_quote","lesson":"ibadah.tark","pos":71,"secs":11.57,"dens":0.07,"before":null,"after":null,"pending":false,"session":5},{"u":"src.hajar.story","ids":["src.hajar.story"],"text":"أعادت قريش بناء الكعبة وله من العمر خمس وثلاثون سنة. وحَكَّموه لَمّا اختلفوا في من يضع الحجر الأسود، فوضعه في ثوب، وأمر كل قبيلة أن تأخذ بطرف من الثوب، وكانوا أربع قبائل، فلما رفعوه وضعه بيده عليه الصلاة والسلام.","disp":"أعادت قريش بناء الكعبة وله من العمر خمس وثلاثون سنة. وحَكَّموه لَمّا اختلفوا في من يضع الحجر الأسود، فوضعه في ثوب، وأمر كل قبيلة أن تأخذ بطرف من الثوب، وكانوا أربع قبائل، فلما رفعوه وضعه بيده عليه الصلاة والسلام.","kind":"B3_sacred_text","lesson":"seerah.hajar","pos":72,"secs":18.46,"dens":0.03,"before":null,"after":null,"pending":false,"session":5},{"u":"src.hajj.def","ids":["src.hajj.def"],"text":"الحجّ: هو التعبّد لله تَعَالَى بقصد بيته الحرام لأعمالٍ مخصوصة في وقتٍ مخصوص. وأركانه: الإحرام، والوقوف بعرفة، وطواف الإفاضة، والسعي بين الصفا والمروة.","disp":"الحجّ: هو التعبّد لله تَعَالَى بقصد بيته الحرام لأعمالٍ مخصوصة في وقتٍ مخصوص. وأركانه: الإحرام، والوقوف بعرفة، وطواف الإفاضة، والسعي بين الصفا والمروة.","kind":"B3_sacred_text","lesson":"ibadah.hajj","pos":73,"secs":13.13,"dens":0.06,"before":null,"after":null,"pending":false,"session":5},{"u":"src.hajj.hadith","ids":["src.hajj.hadith"],"text":"عن أبي هريرة رضي الله عنه قال: سمعت رسول الله ﷺ يقول: «من حجّ للهِ فلم يرفُثْ ولم يفسُقْ، رجع كيوم ولدته أمّه». أي: بغير ذنب.","disp":"عن أبي هريرة رضي الله عنه قال: سمعت رسول الله صلى الله عليه وسلم يقول: «من حجّ للهِ فلم يرفُثْ ولم يفسُقْ، رجع كيوم ولدته أمّه». أي: بغير ذنب.","kind":"B2_hadith_quote","lesson":"ibadah.hajj","pos":73,"secs":11.35,"dens":0.08,"before":null,"after":null,"pending":false,"session":5},{"u":"end.quran.asr","ids":["end.quran.asr"],"text":"تعلّمتَ اليوم: أقسم الله بالزمان، وكل إنسان في خسارة، إلا أربعة: آمنوا، وعملوا الصالحات، وتواصوا بالحقّ، وتواصوا بالصبر.","disp":"تعلّمتَ اليوم: أقسم الله بالزمان، وكل إنسان في خسارة، إلا أربعة: آمنوا، وعملوا الصالحات، وتواصوا بالحقّ، وتواصوا بالصبر.","kind":"B5_pending_embedded_ayah","lesson":"quran.asr","pos":74,"secs":10.57,"dens":0.03,"before":null,"after":null,"pending":true,"session":0},{"u":"src.asr.full","ids":["src.asr.full"],"text":"سورة العصر: أقسم سبحانه بالزمان، وأنّ كل الإنسان في نقصان وهلاك، إلا من آمن وعمل صالحًا، ومع ذلك دعوا إلى الحقّ وصبروا عليه، فهؤلاء هم الناجون من الخسارة.","disp":"سورة العصر: أقسم سبحانه بالزمان، وأنّ كل الإنسان في نقصان وهلاك، إلا من آمن وعمل صالحًا، ومع ذلك دعوا إلى الحقّ وصبروا عليه، فهؤلاء هم الناجون من الخسارة.","kind":"B3_sacred_text","lesson":"quran.asr","pos":74,"secs":13.46,"dens":0.03,"before":null,"after":null,"pending":false,"session":5},{"u":"end.quran.maoon","ids":["end.quran.maoon"],"text":"تعلّمتَ اليوم: المكذّب بالجزاء هو الذي يدفع اليتيم، ولا يحضّ على إطعام الفقير، فويلٌ للمصلّين الذين هم عن صلاتهم لاهون.","disp":"تعلّمتَ اليوم: المكذّب بالجزاء هو الذي يدفع اليتيم، ولا يحضّ على إطعام الفقير، فويلٌ للمصلّين الذين هم عن صلاتهم لاهون.","kind":"B5_pending_embedded_ayah","lesson":"quran.maoon","pos":75,"secs":10.35,"dens":0.07,"before":null,"after":null,"pending":true,"session":0},{"u":"taf.mao.5","ids":["taf.mao.5"],"text":"الذين هم عن صلاتهم لاهون، لا يبالون بها حتى ينقضي وقتها.","disp":"الذين هم عن صلاتهم لاهون، لا يبالون بها حتى ينقضي وقتها.","kind":"B5_pending_embedded_ayah","lesson":"quran.maoon","pos":75,"secs":5.24,"dens":0.0,"before":null,"after":null,"pending":true,"session":0},{"u":"src.mao.full","ids":["src.mao.full"],"text":"سورة الماعون: المكذّب بالجزاء هو الذي يدفع اليتيم بغلظة عن حاجته، ولا يحضّ نفسه ولا غيره على إطعام الفقير. فهلاكٌ وعذابٌ للمصلّين الذين هم عن صلاتهم لاهون، لا يبالون بها حتى ينقضي وقتها.","disp":"سورة الماعون: المكذّب بالجزاء هو الذي يدفع اليتيم بغلظة عن حاجته، ولا يحضّ نفسه ولا غيره على إطعام الفقير. فهلاكٌ وعذابٌ للمصلّين الذين هم عن صلاتهم لاهون، لا يبالون بها حتى ينقضي وقتها.","kind":"B3_sacred_text","lesson":"quran.maoon","pos":75,"secs":16.35,"dens":0.03,"before":null,"after":null,"pending":false,"session":5},{"u":"end.quran.zalzalah","ids":["end.quran.zalzalah"],"text":"تعلّمتَ اليوم: يوم القيامة تُزلزل الأرض وتخرج أثقالها وتُحدّث أخبارها، فمن يعمل مثقال ذرّةٍ خيرًا يره ومن يعمل مثقال ذرّةٍ شرًّا يره.","disp":"تعلّمتَ اليوم: يوم القيامة تُزلزل الأرض وتخرج أثقالها وتُحدّث أخبارها، فمن يعمل مثقال ذرّةٍ خيرًا يره ومن يعمل مثقال ذرّةٍ شرًّا يره.","kind":"B5_pendin ْ لِأَمَانَاتِهِمْ وَعَهْدِهِمْ رَاعُونَ﴾","ref":"المؤمنون: ٨"},"pending":false,"session":5},{"u":"src.aman.khiyanah","ids":["src.aman.khiyanah"],"text":"وضدُّ الأمانة الخيانة، وهي تضييع حقوق الله وحقوق الناس. قال النبي ﷺ: «آيةُ المنافقِ ثلاثٌ» وذكر منها: «وإذا اؤتُمِنَ خانَ».","disp":"وضدُّ الأمانة الخيانة، وهي تضييع حقوق الله وحقوق الناس. قال النبي صلى الله عليه وسلم: «آيةُ المنافقِ ثلاثٌ» وذكر منها: «وإذا اؤتُمِنَ خانَ».","kind":"B2_hadith_quote","lesson":"akhlaq.amanah","pos":78,"secs":11.46,"dens":0.11,"before":null,"after":null,"pending":false,"session":5},{"u":"end.misc.izzah","ids":["end.misc.izzah"],"text":"تعلّمتَ اليوم: طريق العزّ والنصر هو العمل بالإسلام وترك المعاصي والذنوب، وإنّ الله لا يُغيّر ما بقومٍ حتى يُغيّروا ما بأنفسهم.","disp":"تعلّمتَ اليوم: طريق العزّ والنصر هو العمل بالإسلام وترك المعاصي والذنوب، وإنّ الله لا يُغيّر ما بقومٍ حتى يُغيّروا ما بأنفسهم.","kind":"B5_pending_embedded_ayah","lesson":"misc.izzah","pos":79,"secs":10.79,"dens":0.1,"before":null,"after":null,"pending":true,"session":0},{"u":"src.izz.ayah~1","ids":["src.izz.ayah"],"text":"طريق العزّ والنصر للمسلمين: هو العمل بالإسلام، وترك المعاصي والذنوب. قال تعالى:","disp":"طريق العزّ والنصر للمسلمين: هو العمل بالإسلام، وترك المعاصي والذنوب. قال تعالى:","kind":"B4_mixed_ayah","lesson":"misc.izzah","pos":79,"secs":7.35,"dens":0.02,"before":null,"after":{"ayah":"﴿يَا أَيُّهَا الَّذِينَ آمَنُوا إِن تَنصُرُوا اللَّهَ يَنصُرْكُمْ وَيُثَبِّتْ أَقْدَامَكُمْ﴾","ref":"محمد: ٧"},"pending":false,"session":5},{"u":"src.sabr.hadith","ids":["src.sabr.hadith"],"text":"قال النبي ﷺ: «عَجَبًا لأمرِ المؤمنِ، إنَّ أمرَه كلَّه خيرٌ، وليس ذلك لأحدٍ إلا للمؤمنِ؛ إنْ أصابَتْه سَرَّاءُ شكرَ فكان خيرًا له، وإنْ أصابَتْه ضَرَّاءُ صبرَ فكان خيرًا له».","disp":"قال النبي صلى الله عليه وسلم: «عَجَبًا لأمرِ المؤمنِ، إنَّ أمرَه كلَّه خيرٌ، وليس ذلك لأحدٍ إلا للمؤمنِ؛ إنْ أصابَتْه سَرَّاءُ شكرَ فكان خيرًا له، وإنْ أصابَتْه ضَرَّاءُ صبرَ فكان خيرًا له».","kind":"B2_hadith_quote","lesson":"akhlaq.sabr","pos":80,"secs":
